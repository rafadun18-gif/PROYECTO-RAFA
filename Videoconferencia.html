<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Videoconferencia · GePeTo</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#05070b;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
textarea,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#app{
    min-height:100vh;
    padding-bottom:110px;
}

/* =========================
   CABECERA
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:8px;
    padding:10px;

    background:rgba(3,8,15,.96);
    border-bottom:1px solid #173b64;
    backdrop-filter:blur(10px);
}

header button{
    border:1px solid #2769a8;
    border-radius:12px;

    background:#071522;
    color:#fff;

    padding:10px 12px;
    font-size:13px;
    font-weight:700;
}

header button:active{
    transform:scale(.97);
}

#parar{
    border-color:#8b2525;
    background:#230b0b;
    color:#ff7777;
}

.titulo{
    flex:1;
    text-align:center;
    min-width:0;
}

.titulo strong{
    display:block;
    color:#55aaff;
    font-size:17px;
}

.titulo span{
    display:block;
    color:#9db6d0;
    font-size:11px;
    margin-top:2px;
}

/* =========================
   AVATAR / ESCENARIO
========================= */

.avatarBox{
    display:flex;
    justify-content:center;
    padding:18px 12px 8px;
    perspective:1000px;
}

/*
 * Contenedor que permite animar la cabeza
 * independientemente de la fotografía.
 */
.avatarStage{
    position:relative;

    width:min(230px,65vw);
    aspect-ratio:1/1;

    transform-style:preserve-3d;

    will-change:
        transform;
}

/* =========================
   FOTO DE GEPETO
========================= */

.avatar{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #1685ff;

    box-shadow:
        0 0 18px rgba(0,130,255,.55),
        0 0 55px rgba(0,80,255,.22);

    background:#07101c;

    transform-origin:50% 45%;

    will-change:
        transform,
        filter,
        box-shadow;

    /*
     * Movimiento general de cabeza.
     */
    animation:
        gepetoCabeza
        8.2s
        ease-in-out
        infinite;
}

/* =========================
   CABEZA MÁS NATURAL
========================= */

@keyframes gepetoCabeza{

    0%{
        transform:
            translate3d(0,0,0)
            rotate(0deg)
            scale(1);
        filter:
            brightness(1)
            saturate(1);
    }

    8%{
        transform:
            translate3d(-1px,-1px,0)
            rotate(-0.25deg)
            scale(1.004);
    }

    18%{
        transform:
            translate3d(-2px,0,0)
            rotate(-0.55deg)
            scale(1.008);
        filter:
            brightness(1.012)
            saturate(1.008);
    }

    29%{
        transform:
            translate3d(-1px,1px,0)
            rotate(-0.15deg)
            scale(1.003);
    }

    41%{
        transform:
            translate3d(1px,0,0)
            rotate(0.45deg)
            scale(1.009);
        filter:
            brightness(1.018)
            saturate(1.01);
    }

    53%{
        transform:
            translate3d(2px,-1px,0)
            rotate(0.65deg)
            scale(1.006);
    }

    66%{
        transform:
            translate3d(1px,1px,0)
            rotate(0.15deg)
            scale(1.003);
    }

    78%{
        transform:
            translate3d(-1px,0,0)
            rotate(-0.42deg)
            scale(1.008);
        filter:
            brightness(1.015)
            saturate(1.01);
    }

    90%{
        transform:
            translate3d(-1px,-1px,0)
            rotate(-0.18deg)
            scale(1.004);
    }

    100%{
        transform:
            translate3d(0,0,0)
            rotate(0deg)
            scale(1);
        filter:
            brightness(1)
            saturate(1);
    }
}

/* =========================
   RESPIRACIÓN
========================= */

.avatarStage{
    animation:
        gepetoRespiracion
        4.6s
        ease-in-out
        infinite;
}

@keyframes gepetoRespiracion{

    0%,100%{
        transform:
            translateY(0)
            scale(1);
    }

    25%{
        transform:
            translateY(-0.7px)
            scale(1.003);
    }

    50%{
        transform:
            translateY(-1.2px)
            scale(1.006);
    }

    75%{
        transform:
            translateY(-0.4px)
            scale(1.002);
    }
}

/* =========================
   CAPA FACIAL
========================= */

.caraAnimada{
    position:absolute;
    inset:0;

    pointer-events:none;

    z-index:5;

    border-radius:50%;

    overflow:hidden;
}

/*
 * Los elementos faciales son extremadamente sutiles.
 * Se utilizan como pequeños cambios de luz/sombra
 * para dar sensación de ojos, cejas y boca vivos
 * sin tapar la fotografía.
 */

.ojo{
    position:absolute;

    width:15%;
    height:4.5%;

    top:35%;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.42) 0%,
            rgba(120,190,255,.12) 42%,
            rgba(0,0,0,0) 75%
        );

    opacity:.16;

    filter:blur(.7px);

    transform-origin:center;
}

.ojo.izq{
    left:25%;
}

.ojo.der{
    right:25%;
}

.ojo{
    animation:
        mirada
        5.7s
        ease-in-out
        infinite;
}

@keyframes mirada{

    0%,100%{
        transform:
            translateX(0)
            scaleY(1);
    }

    17%{
        transform:
            translateX(1px)
            scaleY(.96);
    }

    33%{
        transform:
            translateX(2px)
            scaleY(1);
    }

    49%{
        transform:
            translateX(-1px)
            scaleY(.98);
    }

    66%{
        transform:
            translateX(-2px)
            scaleY(1);
    }

    83%{
        transform:
            translateX(0)
            scaleY(.97);
    }
}

/* =========================
   CEJAS
========================= */

.ceja{
    position:absolute;

    width:15%;
    height:2.2%;

    top:30.5%;

    border-radius:50%;

    background:
        rgba(120,190,255,.12);

    opacity:.13;

    filter:blur(1px);

    transform-origin:center;
}

.ceja.izq{
    left:25%;
}

.ceja.der{
    right:25%;
}

.ceja{
    animation:
        cejasNaturales
        6.3s
        ease-in-out
        infinite;
}

@keyframes cejasNaturales{

    0%,100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    20%{
        transform:
            translateY(-1px)
            rotate(-1deg);
    }

    42%{
        transform:
            translateY(0)
            rotate(.7deg);
    }

    62%{
        transform:
            translateY(1px)
            rotate(1deg);
    }

    82%{
        transform:
            translateY(-.5px)
            rotate(-.4deg);
    }
}

/* =========================
   BOCA
========================= */

.boca{
    position:absolute;

    left:38%;
    width:24%;

    top:61%;

    height:7%;

    border-radius:
        0 0 50% 50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(80,170,255,.22),
            rgba(0,0,0,0) 72%
        );

    opacity:.10;

    filter:blur(1.3px);

    transform-origin:center center;

    animation:
        bocaReposo
        4.8s
        ease-in-out
        infinite;
}

@keyframes bocaReposo{

    0%,100%{
        transform:
            scaleX(1)
            scaleY(1);
    }

    50%{
        transform:
            scaleX(1.015)
            scaleY(1.03);
    }
}

/* =========================
   PARPADEO
========================= */

.parpadeo{
    animation:
        parpadear
        .20s
        linear !important;
}

@keyframes parpadear{

    0%{
        filter:
            brightness(1)
            saturate(1);
    }

    25%{
        filter:
            brightness(.86)
            saturate(.95);
    }

    48%{
        filter:
            brightness(.60)
            saturate(.88);
    }

    65%{
        filter:
            brightness(.84)
            saturate(.94);
    }

    100%{
        filter:
            brightness(1)
            saturate(1);
    }
}

.parpadeoSuave{
    animation:
        parpadeoNatural
        .17s
        ease-in-out !important;
}

@keyframes parpadeoNatural{

    0%{
        filter:
            brightness(1)
            contrast(1);
    }

    38%{
        filter:
            brightness(.57)
            contrast(.95);
    }

    100%{
        filter:
            brightness(1)
            contrast(1);
    }
}

/* =========================
   HABLANDO
========================= */

.avatarStage.hablando{
    animation:
        gepetoHablandoCabeza
        1.8s
        ease-in-out
        infinite;
}

.avatarStage.hablando .avatar{
    animation:
        gepetoHabla
        1.15s
        ease-in-out
        infinite;
}

.avatarStage.hablando .boca{
    opacity:.24;

    animation:
        bocaHabla
        .32s
        ease-in-out
        infinite;
}

.avatarStage.hablando .ojo{
    opacity:.20;
}

@keyframes gepetoHablandoCabeza{

    0%,100%{
        transform:
            translate3d(0,0,0)
            rotate(0deg);
    }

    20%{
        transform:
            translate3d(-1px,-.5px,0)
            rotate(-.22deg);
    }

    42%{
        transform:
            translate3d(1px,0,0)
            rotate(.28deg);
    }

    64%{
        transform:
            translate3d(0,1px,0)
            rotate(-.12deg);
    }

    82%{
        transform:
            translate3d(-1px,0,0)
            rotate(.16deg);
    }
}

@keyframes gepetoHabla{

    0%,100%{
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    18%{
        transform:
            translate3d(-.7px,-.4px,0)
            scale(1.006);
    }

    36%{
        transform:
            translate3d(1px,0,0)
            scale(1.012);
    }

    53%{
        transform:
            translate3d(0,.6px,0)
            scale(1.004);
    }

    71%{
        transform:
            translate3d(-.8px,0,0)
            scale(1.009);
    }

    87%{
        transform:
            translate3d(.5px,-.5px,0)
            scale(1.005);
    }
}

@keyframes bocaHabla{

    0%,100%{
        transform:
            scaleX(1)
            scaleY(.85);
    }

    25%{
        transform:
            scaleX(1.08)
            scaleY(1.22);
    }

    50%{
        transform:
            scaleX(.92)
            scaleY(.72);
    }

    75%{
        transform:
            scaleX(1.12)
            scaleY(1.05);
    }
}

/* =========================
   LUZ AL HABLAR
========================= */

.avatarStage.hablando .avatar{
    box-shadow:
        0 0 20px rgba(0,140,255,.70),
        0 0 45px rgba(0,120,255,.42),
        0 0 75px rgba(0,80,255,.23);
}

/* =========================
   REDUCCIÓN DE MOVIMIENTO
========================= */

    .avatar,
    .avatarStage,
    .ojo,
    .ceja,
    .boca{
        animation:none !important;
    }

}

/* =========================
   MÓVIL
========================= */

@media(max-width:420px){
/* ============================================================
   ENVIAR MENSAJE A GEPETO
============================================================ */

async function enviarMensaje(){

    const texto =
        mensaje.value.trim();

    if(!texto){
        return;
    }

    await prepararAudio();

    añadirMensajeUsuario(texto);

    mensaje.value = "";

    mensaje.style.height =
        "46px";

    enviar.disabled = true;

    estado.textContent =
        "🔄 GePeTo está pensando...";


    const cargando =
        document.createElement("div");

    cargando.className =
        "mensajeSistema";

    cargando.textContent =
        "GePeTo está escribiendo...";

    chat.appendChild(cargando);

    desplazarChat();


    try{

        const respuesta =
            await fetch(
                WORKER,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        mensaje:texto,
                        prompt:texto,
                        message:texto
                    })
                }
            );


        const contenido =
            await respuesta.text();


        let data;

        try{

            data =
                JSON.parse(
                    contenido
                );

        }catch(_){

            data =
                contenido;
        }


        const respuestaTexto =
            extraerTextoRespuesta(
                data
            );


        if(!respuesta.ok){

            throw new Error(
                respuestaTexto ||
                "Error HTTP " +
                respuesta.status
            );
        }


        if(!respuestaTexto){

            throw new Error(
                "GePeTo no devolvió texto"
            );
        }


        cargando.remove();

        ultimaRespuesta =
            respuestaTexto;


        añadirMensajeGePeTo(
            respuestaTexto
        );


        estado.textContent =
            "🟢 GePeTo conectado";


        /*
         * La respuesta se manda automáticamente
         * a Piper.
         */
        hablarAutomaticamente(
            respuestaTexto
        );


    }catch(error){

        console.error(
            "Error GePeTo:",
            error
        );

        cargando.remove();


        const errorDiv =
            document.createElement("div");

        errorDiv.className =
            "mensajeSistema error";

        errorDiv.textContent =
            "❌ No se pudo obtener respuesta de GePeTo. " +
            (error.message || "");


        chat.appendChild(
            errorDiv
        );


        estado.textContent =
            "🔴 Error de conexión con GePeTo";

        desplazarChat();

    }finally{

        enviar.disabled = false;

        mensaje.focus();
    }
}


/* ============================================================
   BOTÓN ENVIAR
============================================================ */

enviar.onclick = () => {

    enviarMensaje();
};


/* ============================================================
   ENTER PARA ENVIAR
============================================================ */

mensaje.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            enviarMensaje();
        }
    }
);


/* ============================================================
   AUTOAJUSTE DEL CUADRO DE TEXTO
============================================================ */

mensaje.addEventListener(
    "input",
    () => {

        mensaje.style.height =
            "46px";

        mensaje.style.height =
            Math.min(
                mensaje.scrollHeight,
                120
            ) + "px";
    }
);


/* ============================================================
   RECONOCIMIENTO DE VOZ
============================================================ */

function iniciarReconocimiento(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        estado.textContent =
            "⚠️ El reconocimiento de voz no está disponible en este navegador.";

        return;
    }


    if(reconociendo){

        try{

            reconocimiento.stop();

        }catch(_){}

        return;
    }


    reconocimiento =
        new SpeechRecognition();

    reconocimiento.lang =
        "es-ES";

    reconocimiento.continuous =
        false;

    reconocimiento.interimResults =
        true;

    reconocimiento.maxAlternatives =
        1;


    reconociendo = true;

    microfono.classList.add(
        "activo"
    );

    microfono.textContent =
        "⏹️";

    estado.textContent =
        "🎤 Escuchando...";


    reconocimiento.onresult =
        (event) => {

            let resultado = "";

            for(
                let i =
                    event.resultIndex;
                i <
                    event.results.length;
                i++
            ){

                resultado +=
                    event.results[i][0].transcript;
            }

            mensaje.value =
                resultado.trim();

            mensaje.dispatchEvent(
                new Event("input")
            );
        };


    reconocimiento.onerror =
        (event) => {

            console.error(
                "Reconocimiento:",
                event.error
            );

            estado.textContent =
                "⚠️ No se pudo reconocer la voz";
        };


    reconocimiento.onend =
        () => {

            reconociendo =
                false;

            microfono.classList.remove(
                "activo"
            );

            microfono.textContent =
                "🎤";

            estado.textContent =
                "🟢 GePeTo conectado";
        };


    try{

        reconocimiento.start();

    }catch(error){

        console.error(error);

        reconociendo =
            false;

        microfono.classList.remove(
            "activo"
        );

        microfono.textContent =
            "🎤";
    }
}


/* ============================================================
   BOTÓN MICRÓFONO
============================================================ */

microfono.onclick = () => {

    prepararAudio();

    iniciarReconocimiento();
};


/* ============================================================
   MÚSICA
============================================================ */

selectorMusica.onchange =
    () => {

        const archivo =
            selectorMusica.files &&
            selectorMusica.files[0];

        if(!archivo){
            return;
        }


        if(musicaURL){

            try{

                URL.revokeObjectURL(
                    musicaURL
                );

            }catch(_){}

        }


        musicaURL =
            URL.createObjectURL(
                archivo
            );


        reproductorMusica.src =
            musicaURL;


        reproductorMusica.load();

        estado.textContent =
            "🎵 Música preparada";


        /*
         * Intentamos comenzar únicamente después
         * de la selección del usuario.
         */
        reproductorMusica.play()
            .catch(() => {

                estado.textContent =
                    "🎵 Pulsa ▶ para comenzar la música";
            });
    };


/* ============================================================
   PAUSA AUTOMÁTICA DE MÚSICA AL HABLAR
============================================================ */

let musicaEstabaSonando =
    false;


/* ============================================================
   GESTIÓN DE VOZ Y MÚSICA
============================================================ */

const reproduccionOriginal =
    reproducirWAV;


/*
 * No sustituimos la función original.
 * El control se hace mediante los eventos
 * del reproductor de música.
 */

reproductorMusica.addEventListener(
    "play",
    () => {

        musicaEstabaSonando =
            true;
    }
);

reproductorMusica.addEventListener(
    "pause",
    () => {

        musicaEstabaSonando =
            false;
    }
);


/* ============================================================
   LIMPIEZA AL SALIR
============================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        if(temporizadorParpadeo){

            clearTimeout(
                temporizadorParpadeo
            );
        }

        if(temporizadorMicroMovimiento){

            clearTimeout(
                temporizadorMicroMovimiento
            );
        }

        if(musicaURL){

            try{

                URL.revokeObjectURL(
                    musicaURL
                );

            }catch(_){}
        }

        if(audioURLActual){

            try{

                URL.revokeObjectURL(
                    audioURLActual
                );

            }catch(_){}
        }
    }
);


/* ============================================================
   INICIO
============================================================ */

iniciarVidaFacial();


/*
 * Primer movimiento aleatorio para que GePeTo
 * no empiece siempre exactamente igual.
 */

setTimeout(() => {

    programarParpadeo();

},1200);


estado.textContent =
    "🟢 GePeTo conectado";


console.log(
    "Videoconferencia GePeTo iniciada"
);

</script>
