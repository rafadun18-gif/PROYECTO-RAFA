<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Videoconferencia · GePeTo</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#05070b;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
textarea,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#app{
    min-height:100vh;
    padding-bottom:110px;
}

/* ============================================================
   CABECERA
============================================================ */

header{
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:8px;
    padding:10px;

    background:rgba(3,8,15,.97);
    border-bottom:1px solid #173b64;

    backdrop-filter:blur(10px);
}

header button{
    border:1px solid #2769a8;
    border-radius:12px;

    background:#071522;
    color:#fff;

    padding:10px 12px;

    font-size:13px;
    font-weight:700;
}

header button:active{
    transform:scale(.97);
}

#parar{
    border-color:#8b2525;
    background:#230b0b;
    color:#ff7777;
}

.titulo{
    flex:1;
    text-align:center;
    min-width:0;
}

.titulo strong{
    display:block;
    color:#55aaff;
    font-size:17px;
}

.titulo span{
    display:block;
    color:#9db6d0;
    font-size:11px;
    margin-top:2px;
}

/* ============================================================
   AVATAR
============================================================ */

.avatarBox{
    display:flex;
    justify-content:center;
    padding:18px 12px 8px;

    perspective:1000px;
}

.avatarStage{
    position:relative;

    width:min(260px,72vw);
    aspect-ratio:1/1;

    transform-style:preserve-3d;

    will-change:transform;

    animation:
        respiracion
        5s
        ease-in-out
        infinite;
}

/*
   FOTO CORRECTA
   GePeToFrontal.png
*/

.avatar{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #1685ff;

    background:#07101c;

    box-shadow:
        0 0 18px rgba(0,130,255,.60),
        0 0 55px rgba(0,80,255,.25);

    transform-origin:50% 45%;

    will-change:
        transform,
        filter;
}

/* ============================================================
   MOVIMIENTO MUY PEQUEÑO DE LA CABEZA
   La cara no depende solamente de este movimiento.
============================================================ */

@keyframes respiracion{

    0%,100%{
        transform:
            translate3d(0,0,0)
            rotate(0deg);
    }

    20%{
        transform:
            translate3d(-.5px,-.4px,0)
            rotate(-.10deg);
    }

    40%{
        transform:
            translate3d(.7px,-.7px,0)
            rotate(.12deg);
    }

    60%{
        transform:
            translate3d(1px,.3px,0)
            rotate(.18deg);
    }

    80%{
        transform:
            translate3d(-.7px,.2px,0)
            rotate(-.13deg);
    }
}

/* ============================================================
   CAPA DE RASGOS FACIALES
============================================================ */

.caraAnimada{
    position:absolute;
    inset:0;

    z-index:10;

    pointer-events:none;

    border-radius:50%;

    overflow:hidden;

    /*
       Variables controladas por JavaScript.
    */

    --miradaX:0px;
    --miradaY:0px;

    --cejaIzqY:0px;
    --cejaDerY:0px;

    --cejaIzqR:0deg;
    --cejaDerR:0deg;

    --bocaX:0px;
    --bocaY:0px;

    --bocaEscalaX:1;
    --bocaEscalaY:.75;

    --sonrisa:0;

    --parpado:1;
}

/* ============================================================
   OJOS
============================================================ */

.ojo{
    position:absolute;

    top:34.5%;

    width:17%;
    height:6%;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.52) 0%,
            rgba(110,190,255,.24) 35%,
            rgba(0,0,0,0) 75%
        );

    opacity:.28;

    filter:blur(.65px);

    transform:
        translate3d(
            var(--miradaX),
            var(--miradaY),
            0
        )
        scaleY(var(--parpado));

    transition:
        transform .10s ease-out,
        opacity .2s ease;
}

.ojo.izq{
    left:23%;
}

.ojo.der{
    right:23%;
}

/*
   Pequeño brillo de pupila.
*/

.ojo::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:27%;
    height:50%;

    transform:
        translate(
            -50%,
            -50%
        )
        translate(
            calc(var(--miradaX) * .45),
            calc(var(--miradaY) * .25)
        );

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.90) 0 15%,
            rgba(60,160,255,.42) 30%,
            rgba(0,0,0,.22) 60%,
            transparent 72%
        );

    opacity:.72;
}

/* ============================================================
   CEJAS
============================================================ */

.ceja{
    position:absolute;

    top:29.5%;

    width:18%;
    height:3%;

    border-radius:50%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(100,185,255,.28),
            transparent
        );

    opacity:.25;

    filter:blur(1px);

    transition:
        transform .22s ease-out;
}

.ceja.izq{
    left:22.5%;

    transform:
        translateY(var(--cejaIzqY))
        rotate(var(--cejaIzqR));
}

.ceja.der{
    right:22.5%;

    transform:
        translateY(var(--cejaDerY))
        rotate(var(--cejaDerR));
}

/* ============================================================
   MEJILLAS
============================================================ */

.mejilla{
    position:absolute;

    top:56%;

    width:20%;
    height:11%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(50,150,255,.22),
            rgba(50,150,255,.05) 48%,
            transparent 75%
        );

    opacity:.10;

    filter:blur(4px);

    transition:
        opacity .45s ease,
        transform .45s ease;
}

.mejilla.izq{
    left:15%;
}

.mejilla.der{
    right:15%;
}

/* ============================================================
   BOCA
============================================================ */

.boca{
    position:absolute;

    left:35%;

    top:59%;

    width:30%;
    height:9%;

    transform:
        translate(
            var(--bocaX),
            var(--bocaY)
        )
        scaleX(var(--bocaEscalaX))
        scaleY(var(--bocaEscalaY));

    transform-origin:center;

    border-radius:
        12% 12% 48% 48%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(10,10,15,.78) 0 35%,
            rgba(50,160,255,.22) 58%,
            transparent 78%
        );

    border:
        1px solid rgba(100,190,255,.18);

    opacity:.18;

    filter:blur(.7px);

    transition:
        transform .08s linear,
        border-radius .20s ease,
        opacity .25s ease;
}

/* ============================================================
   SONRISA
============================================================ */

.boca.sonrisa{
    border-radius:
        8% 8% 65% 65%;

    transform:
        translate(
            var(--bocaX),
            var(--bocaY)
        )
        scaleX(
            calc(var(--bocaEscalaX) * 1.08)
        )
        scaleY(
            calc(var(--bocaEscalaY) * .82)
        );

    opacity:.31;

    background:
        radial-gradient(
            ellipse at center,
            rgba(10,10,15,.72) 0 28%,
            rgba(50,170,255,.30) 48%,
            transparent 78%
        );
}

   SONRISA EXTERIOR

    top:61%;

    width:36%;
    height:12%;

    border-radius:
