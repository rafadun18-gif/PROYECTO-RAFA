<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Videoconferencia · GePeTo</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#020205;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    padding-bottom:125px;
    overflow-x:hidden;
}

/* =========================
   CABECERA
========================= */

header{
    position:sticky;
    top:0;
    z-index:100;

    min-height:58px;
    width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:9px 10px;

    background:rgba(3,7,15,.97);
    border-bottom:1px solid rgba(0,170,255,.35);
}

header button{
    border:1px solid #168cff;
    background:#071321;
    color:white;
    border-radius:12px;
    padding:10px 12px;
    font-size:12px;
    font-weight:bold;
}

.titulo{
    flex:1;
    text-align:center;
    margin:0 8px;
}

.titulo-principal{
    color:#00aaff;
    font-size:20px;
    font-weight:bold;
    letter-spacing:1px;
}

.estado{
    margin-top:3px;
    font-size:11px;
    color:#79d9ff;
}

.estado.ok{
    color:#38ff8b;
}

.estado.error{
    color:#ff6767;
}

/* =========================
   PRINCIPAL
========================= */

.principal{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:12px;
}

/* =========================
   PANEL
========================= */

.video-panel{
    width:100%;
    overflow:hidden;
    border-radius:20px;

    background:
    radial-gradient(
        circle at center,
        rgba(0,110,200,.12),
        transparent 60%
    ),
    #03050a;

    border:1px solid rgba(0,160,255,.35);

    box-shadow:
    0 0 25px rgba(0,150,255,.12);
}

/* =========================
   AVATAR
========================= */

.avatar-zona{
    position:relative;

    width:100%;
    height:min(72vh,680px);
    min-height:420px;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
    radial-gradient(
        ellipse at center,
        rgba(0,120,255,.12),
        transparent 70%
    );
}

#avatar{
    position:relative;
    z-index:2;

    display:block;

    width:auto;
    height:100%;
    max-width:100%;

    object-fit:contain;

    transform-origin:center center;

    filter:
    drop-shadow(
        0 0 16px rgba(0,150,255,.20)
    );

    animation:
    respiracion 5s ease-in-out infinite;
}

@keyframes respiracion{

    0%,100%{
        transform:
        translate3d(0,0,0)
        rotate(0deg);
    }

    25%{
        transform:
        translate3d(-1px,1px,0)
        rotate(-.15deg);
    }

    50%{
        transform:
        translate3d(1px,0,0)
        rotate(.15deg);
    }

    75%{
        transform:
        translate3d(-1px,1px,0)
        rotate(-.1deg);
    }
}

/* =========================
   INDICADOR
========================= */

.hablando-indicador{
    position:absolute;

    left:50%;
    bottom:16px;

    transform:translateX(-50%);

    z-index:20;

    padding:8px 14px;

    border-radius:30px;

    background:rgba(0,70,130,.60);

    border:1px solid rgba(0,190,255,.55);

    color:#9be5ff;

    font-size:12px;
    font-weight:bold;

    opacity:0;

    transition:opacity .2s;
}

.avatar-hablando .hablando-indicador{
    opacity:1;
}

/* =========================
   ANIMACIÓN DE HABLAR
========================= */

/*
   No ponemos dibujos sobre los ojos.

   Movemos muy ligeramente la propia imagen
   mientras GePeTo habla.
*/

.avatar-hablando #avatar{
    animation:
    movimientoHabla 1.8s ease-in-out infinite;
}

@keyframes movimientoHabla{

    0%,100%{
        transform:
        translateY(0)
        rotate(0deg);
    }

    20%{
        transform:
        translateY(-1px)
        rotate(-.25deg);
    }

    40%{
        transform:
        translateY(1px)
        rotate(.25deg);
    }

    60%{
        transform:
        translateY(-1px)
        rotate(.18deg);
    }

    80%{
        transform:
        translateY(1px)
        rotate(-.18deg);
    }
}

/* =========================
   CONTROLES
========================= */

.controles{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;

    padding:12px;

    background:rgba(0,0,0,.35);
}

.controles button{
    border:1px solid rgba(0,160,255,.45);

    background:#071321;

    color:white;

    border-radius:12px;

    padding:10px 13px;

    font-size:12px;
    font-weight:bold;
}

/* =========================
   CHAT
========================= */

.chat{
    padding:12px;
}

.chat-titulo{
    color:#00aaff;
    font-weight:bold;
    margin-bottom:8px;
}

#mensajes{
    width:100%;

    min-height:110px;
    max-height:320px;

    overflow-y:auto;

    padding:10px;

    border-radius:15px;

    background:rgba(0,0,0,.35);

    border:1px solid rgba(0,150,255,.20);
}

.mensaje{
    margin:7px 0;

    padding:10px 12px;

    border-radius:13px;

    font-size:14px;
    line-height:1.4;

    word-wrap:break-word;
}

.usuario{
    text-align:right;

    background:rgba(0,120,220,.20);

    border-right:3px solid #009dff;
}

.gepeto{
    background:rgba(0,180,255,.07);

    border-left:3px solid #00aaff;
}

.sistema{
    text-align:center;

    color:#9ba9b5;

    font-size:12px;
}

/* =========================
   MÚSICA
========================= */

.musica{
    margin:12px;

    padding:14px;

    border-radius:15px;

    background:rgba(0,0,0,.30);

    border:1px solid rgba(0,150,255,.22);
}

.musica h3{
    margin:0 0 10px;

    color:#00aaff;

    font-size:15px;
}

#archivoMusica{
    width:100%;
    color:white;
    font-size:12px;
}

#reproductor{
    width:100%;
    margin-top:10px;
}

/* =========================
   CHAT FIJO
========================= */

.chat-fijo{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:200;

    padding:
    9px
    9px
    calc(9px + env(safe-area-inset-bottom));

    background:rgba(3,6,12,.98);

    border-top:1px solid rgba(0,150,255,.35);

    box-shadow:
    0 -5px 25px rgba(0,0,0,.50);
}

.chat-fijo-contenido{
    width:100%;
    max-width:900px;

    margin:auto;

    display:flex;

    gap:7px;

    align-items:flex-end;
}

#entrada{
    flex:1;
    min-width:0;

    min-height:45px;
    max-height:110px;

    resize:none;

    padding:12px;

    border-radius:14px;

    border:1px solid rgba(0,150,255,.45);

    outline:none;

    background:#070c14;

    color:white;

    font-family:Arial,Helvetica,sans-serif;

    font-size:15px;
}

#entrada:focus{
    border-color:#00aaff;
}

#microfono{
    width:47px;
    height:45px;
    flex:0 0 47px;

    border-radius:13px;

    border:1px solid #168cff;

    background:#071321;

    color:white;

    font-size:20px;
}

#enviar{
    min-width:76px;
    height:45px;

    border-radius:13px;

    border:1px solid #008cff;

    background:#06335a;

    color:white;

    font-weight:bold;
}

/* =========================
   CARGANDO
========================= */

#cargando{
    position:fixed;
    inset:0;

    z-index:999;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:12px;

    background:#020205;

    transition:opacity .4s;
}

#cargando.oculto{
    opacity:0;
    pointer-events:none;
}

.cargando-icono{
    font-size:40px;

    animation:
    pulso 1.2s infinite;
}

@keyframes pulso{

    0%,100%{
        transform:scale(.9);
        opacity:.6;
    }

    50%{
        transform:scale(1.1);
        opacity:1;
    }
}

.cargando-texto{
    color:#79d9ff;
    font-size:13px;
}

/* =========================
   MÓVIL
========================= */

@media(max-width:600px){

    .titulo-principal{
        font-size:17px;
    }

    header button{
        padding:8px 9px;
        font-size:10px;
    }

    .avatar-zona{
        height:60vh;
        min-height:380px;
    }

    #entrada{
        font-size:14px;
    }

    #enviar{
        min-width:67px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<!-- =========================
     CARGANDO
========================= -->

<div id="cargando">

    <div class="cargando-icono">
        🤖
    </div>

    <div class="cargando-texto">
        Preparando a GePeTo...
    </div>

</div>

<!-- =========================
     CABECERA
========================= -->

<header>

    <button id="volver">
        ← BIBLIOTECA
    </button>

    <div class="titulo">

        <div class="titulo-principal">
            GEPETO
        </div>

        <div
            id="estado"
            class="estado"
        >
            PREPARANDO...
        </div>

    </div>

    <button id="parar">
        🔇 PARAR
    </button>

</header>

<!-- =========================
     PRINCIPAL
========================= -->

<main class="principal">

    <section class="video-panel">

        <div
            class="avatar-zona"
            id="avatarZona"
        >

            <img
                id="avatar"
                src="./GePeToFrontal.png"
                alt="GePeTo"
            >

            <div class="hablando-indicador">
                🔊 GEPETO HABLANDO
            </div>

        </div>

        <div class="controles">

            <button id="probarVoz">
                🔊 PROBAR VOZ
            </button>

            <button id="parpadear">
                👁 PARPADEO
            </button>

            <button id="animar">
                🙂 ANIMACIÓN
            </button>

        </div>

    </section>

    <!-- =====================
         CHAT
    ===================== -->

    <section class="chat">

        <div class="chat-titulo">
            💬 Conversación con GePeTo
        </div>

        <div id="mensajes">

            <div class="mensaje gepeto">
                Hola Rafa. Soy GePeTo. Estoy preparado para hablar contigo.
            </div>

        </div>

    </section>

    <!-- =====================
         MÚSICA
    ===================== -->

    <section class="musica">

        <h3>
            🎵 Música de GePeTo
        </h3>

        <input
            type="file"
            id="archivoMusica"
            accept="audio/*"
        >

        <audio
            id="reproductor"
            controls
        ></audio>

    </section>

</main>

<!-- =========================
     CHAT FIJO
========================= -->

<div class="chat-fijo">

    <div class="chat-fijo-contenido">

        <textarea
            id="entrada"
            rows="1"
            placeholder="Escribe a GePeTo..."
        ></textarea>

        <button
            id="microfono"
            title="Micrófono"
        >
            🎤
        </button>

        <button id="enviar">
            ENVIAR
        </button>

    </div>

</div>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const WORKER_URL =
"https://gepetto-rafa.rafadun18.workers.dev/preguntar";

/* =========================================================
   ELEMENTOS
========================================================= */

const avatar =
document.getElementById("avatar");

const avatarZona =
document.getElementById("avatarZona");

const estado =
document.getElementById("estado");

const mensajes =
document.getElementById("mensajes");

const entrada =
document.getElementById("entrada");

const enviar =
document.getElementById("enviar");

const microfono =
document.getElementById("microfono");

const probarVoz =
document.getElementById("probarVoz");

const parpadear =
document.getElementById("parpadear");

const animar =
document.getElementById("animar");

const parar =
document.getElementById("parar");

const volver =
document.getElementById("volver");

const archivoMusica =
document.getElementById("archivoMusica");

const reproductor =
document.getElementById("reproductor");

const cargando =
document.getElementById("cargando");

/* =========================================================
   VARIABLES
========================================================= */

let vozGePeTo = null;

let reconocimiento = null;

let intervaloAnimacion = null;

let hablando = false;

/* =========================================================
   INICIO
========================================================= */

window.addEventListener(
"load",
function(){

    setTimeout(
        function(){

            cargando.classList.add(
                "oculto"
            );

        },
        700
    );

    cargarVozGePeTo();

    prepararMicrofono();

    estado.textContent =
    "GEPETO · LISTO";

    estado.classList.add(
        "ok"
    );

});

/* =========================================================
   VOCES
========================================================= */

function cargarVozGePeTo(){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }

    const voces =
    speechSynthesis.getVoices();

    /*
       PRIMERA PRIORIDAD:
       Jorge Mejorado.
    */

    vozGePeTo =
    voces.find(
        function(v){

            const nombre =
            v.name.toLowerCase();

            return (
                nombre.includes("jorge") &&
                (
                    nombre.includes("mejorado") ||
                    v.lang.toLowerCase().startsWith("es")
                )
            );

        }
    );

    /*
       SEGUNDA PRIORIDAD:
       cualquier Jorge.
    */

    if(!vozGePeTo){

        vozGePeTo =
        voces.find(
            function(v){

                return v.name
                .toLowerCase()
                .includes("jorge");

            }
        );

    }

    /*
       TERCERA PRIORIDAD:
       voz española masculina.
    */

    if(!vozGePeTo){

        const nombresMasculinos = [

            "male",
            "mascul",
            "hombre",
            "diego",
            "pablo",
            "carlos",
            "miguel",
            "juan",
            "antonio",
            "fernando",
            "david",
            "luis",
            "manuel",
            "sergio"

        ];

        vozGePeTo =
        voces.find(
            function(v){

                const nombre =
                v.name.toLowerCase();

                const idioma =
                v.lang.toLowerCase();

                return (
                    idioma.startsWith("es") &&
                    nombresMasculinos.some(
                        function(nombreBuscado){

                            return nombre
                            .includes(
                                nombreBuscado
                            );

                        }
                    )
                );

            }
        );

    }

    /*
       CUARTA PRIORIDAD:
       cualquier voz española.
    */

    if(!vozGePeTo){

        vozGePeTo =
        voces.find(
            function(v){

                return v.lang
                .toLowerCase()
                .startsWith("es");

            }
        );

    }

    if(vozGePeTo){

        console.log(
            "GEPETO VOZ:",
            vozGePeTo.name,
            vozGePeTo.lang
        );

    }

}

/*
   iPhone puede cargar las voces después.
*/

if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
    function(){

        cargarVozGePeTo();

    };

}

/* =========================================================
   HABLAR
========================================================= */

function hablar(texto){

    if(!texto){
        return;
    }

    if(
        !("speechSynthesis" in window)
    ){

        agregarMensaje(
            "sistema",
            "Este navegador no permite síntesis de voz."
        );

        return;
    }

    speechSynthesis.cancel();

    cargarVozGePeTo();

    const voz =
    new SpeechSynthesisUtterance(
        texto
    );

    voz.lang =
    "es-ES";

    /*
       Jorge Mejorado seleccionado.
    */

    if(vozGePeTo){

        voz.voice =
        vozGePeTo;

    }

    /*
       Tono ligeramente grave.
       La voz real sigue siendo la instalada
       en el iPhone.
    */

    voz.pitch =
    0.75;

    voz.rate =
    0.90;

    voz.volume =
    1;

    voz.onstart =
    function(){

        comenzarHabla();

    };

    voz.onend =
    function(){

        terminarHabla();

    };

    voz.onerror =
    function(){

        terminarHabla();

    };

    speechSynthesis.speak(
        voz
    );

}

/* =========================================================
   ANIMACIÓN DURANTE VOZ
========================================================= */

function comenzarHabla(){

    hablando =
    true;

    avatarZona.classList.add(
        "avatar-hablando"
    );

}

function terminarHabla(){

    hablando =
    false;

    avatarZona.classList.remove(
        "avatar-hablando"
    );

}

/* =========================================================
   PARAR
========================================================= */

parar.addEventListener(
"click",
function(){

    if(
        "speechSynthesis" in window
    ){

        speechSynthesis.cancel();

    }

    terminarHabla();

    estado.textContent =
    "GEPETO · VOZ DETENIDA";

});

/* =========================================================
   PRUEBA VOZ
========================================================= */

probarVoz.addEventListener(
"click",
function(){

    hablar(
        "Hola Rafa. Soy GePeTo. Esta es mi voz masculina. Estoy preparado para hablar contigo."
    );

});

/* =========================================================
   PARPADEO
========================================================= */

/*
   Aquí NO dibujamos ojos encima de la foto.

   La prueba mueve ligeramente la propia imagen
   para comprobar el sistema sin poner elementos
   falsos sobre la cara.
*/

parpadear.addEventListener(
"click",
function(){

    avatar.style.filter =
    "drop-shadow(0 0 16px rgba(0,150,255,.45))";

    avatar.style.transform =
    "scale(.995)";

    setTimeout(
        function(){

            avatar.style.transform =
            "";

            avatar.style.filter =
            "drop-shadow(0 0 16px rgba(0,150,255,.20))";

        },
        150
    );

});

/* =========================================================
   ANIMACIÓN
========================================================= */

animar.addEventListener(
"click",
function(){

    if(
        hablando
    ){

        terminarHabla();

        return;

    }

    comenzarHabla();

    setTimeout(
        function(){

            terminarHabla();

        },
        3000
    );

});

/* =========================================================
   AGREGAR MENSAJE
========================================================= */

function agregarMensaje(
    tipo,
    texto
){

    const div =
    document.createElement(
        "div"
    );

    div.className =
    "mensaje " + tipo;

    div.textContent =
    texto;

    mensajes.appendChild(
        div
    );

    mensajes.scrollTop =
    mensajes.scrollHeight;

}

/* =========================================================
   EXTRAER RESPUESTA
========================================================= */

function extraerTexto(
    datos
){

    if(
        datos === null ||
        datos === undefined
    ){

        return "";

    }

    if(
        typeof datos === "string"
    ){

        return datos.trim();

    }

    const propiedades = [

        "respuesta",
        "response",
        "texto",
        "text",
        "answer",
        "mensaje",
        "message",
        "content",
        "output"

    ];

    for(
        const propiedad
        of propiedades
    ){

        if(
            typeof datos[propiedad]
            === "string"
        ){

            const texto =
            datos[propiedad].trim();

            if(texto){
                return texto;
            }

        }

    }

    if(
        datos.result &&
        typeof datos.result ===
        "object"
    ){

        const texto =
        extraerTexto(
            datos.result
        );

        if(texto){
            return texto;
        }

    }

    if(
        datos.response &&
        typeof datos.response ===
        "object"
    ){

        const texto =
        extraerTexto(
            datos.response
        );

        if(texto){
            return texto;
        }

    }

    if(
        Array.isArray(datos)
    ){

        for(
            const elemento
            of datos
        ){

            const texto =
            extraerTexto(
                elemento
            );

            if(texto){
                return texto;
            }

        }

    }

    return "";

}

/* =========================================================
   ENVIAR MENSAJE
========================================================= */

async function enviarMensaje(){

    const texto =
    entrada.value.trim();

    if(!texto){
        return;
    }

    agregarMensaje(
        "usuario",
        texto
    );

    entrada.value =
    "";

    entrada.style.height =
    "45px";

    enviar.disabled =
    true;

    enviar.textContent =
    "...";

    estado.textContent =
    "GEPETO · PENSANDO...";

    estado.classList.remove(
        "error"
    );

    try{

        const respuesta =
        await fetch(
            WORKER_URL,
            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    pregunta:texto,

                    mensaje:texto

                })

            }
        );

        if(!respuesta.ok){

            throw new Error(
                "HTTP " +
                respuesta.status
            );

        }

        const datos =
        await respuesta.json();

        const textoRespuesta =
        extraerTexto(
            datos
        );

        if(!textoRespuesta){

            throw new Error(
                "Workers AI no devolvió texto."
            );

        }

        agregarMensaje(
            "gepeto",
            textoRespuesta
        );

        estado.textContent =
        "GEPETO · CONECTADO";

        estado.classList.add(
            "ok"
        );

        hablar(
            textoRespuesta
        );

    }
    catch(error){

        console.error(
            error
        );

        agregarMensaje(
            "sistema",
            "No he podido conectar ahora mismo con GePeTo."
        );

        estado.textContent =
        "GEPETO · ERROR";

        estado.classList.remove(
            "ok"
        );

        estado.classList.add(
            "error"
        );

    }
    finally{

        enviar.disabled =
        false;

        enviar.textContent =
        "ENVIAR";

    }

}

/* =========================================================
   MICRÓFONO
========================================================= */

function prepararMicrofono(){

    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        microfono.addEventListener(
            "click",
            function(){

                agregarMensaje(
                    "sistema",
                    "Este navegador no permite reconocimiento de voz."
                );

            }
        );

        return;

    }

    reconocimiento =
    new SpeechRecognition();

    reconocimiento.lang =
    "es-ES";

    reconocimiento.continuous =
    false;

    reconocimiento.interimResults =
    false;

    reconocimiento.onstart =
    function(){

        microfono.textContent =
        "🔴";

        estado.textContent =
        "ESCUCHANDO...";

    };

    reconocimiento.onresult =
    function(event){

        const texto =
        event.results[0][0]
        .transcript;

        entrada.value =
        texto;

        entrada.dispatchEvent(
            new Event("input")
        );

    };

    reconocimiento.onerror =
    function(){

        microfono.textContent =
        "🎤";

        estado.textContent =
        "GEPETO · LISTO";

    };

    reconocimiento.onend =
    function(){

        microfono.textContent =
        "🎤";

    };

    microfono.addEventListener(
        "click",
        function(){

            try{

                reconocimiento.start();

            }
            catch(error){

                console.log(
                    error
                );

            }

        }
    );

}

archivoMusica.addEventListener(
"change",
function(event){

    const archivo =
    event.target.files[0];

    if(!archivo){
        return;
    }

    const url =
    URL.createObjectURL(
        archivo
    );

    reproductor.src =
    url;

    reproductor.play().catch(
        function(){}
    );

});
