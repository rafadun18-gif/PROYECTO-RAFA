<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Videoconferencia · GePeTo</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#05070b;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
textarea,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#app{
    min-height:100vh;
    padding-bottom:110px;
}

/* =========================
   CABECERA
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:8px;
    padding:10px;

    background:rgba(3,8,15,.96);
    border-bottom:1px solid #173b64;
    backdrop-filter:blur(10px);
}

header button{
    border:1px solid #2769a8;
    border-radius:12px;

    background:#071522;
    color:#fff;

    padding:10px 12px;
    font-size:13px;
    font-weight:700;
}

header button:active{
    transform:scale(.97);
}

#parar{
    border-color:#8b2525;
    background:#230b0b;
    color:#ff7777;
}

.titulo{
    flex:1;
    text-align:center;
    min-width:0;
}

.titulo strong{
    display:block;
    color:#55aaff;
    font-size:17px;
}

.titulo span{
    display:block;
    color:#9db6d0;
    font-size:11px;
    margin-top:2px;
}

/* =========================
   AVATAR
========================= */

.avatarBox{
    display:flex;
    justify-content:center;
    padding:18px 12px 8px;
}

.avatar{
    width:min(230px,65vw);
    aspect-ratio:1/1;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #1685ff;

    box-shadow:
        0 0 18px rgba(0,130,255,.55),
        0 0 55px rgba(0,80,255,.22);

    background:#07101c;
}

.estado{
    text-align:center;
    margin:2px 15px 15px;

    color:#62b6ff;
    font-size:13px;
    font-weight:600;
}

/* =========================
   CONTROLES
========================= */

.controles{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;

    padding:0 12px 14px;
}

.controles button{
    border:1px solid #225b8e;
    border-radius:12px;

    background:#081521;
    color:#fff;

    padding:10px 13px;
    font-size:13px;
}

.controles button:active{
    transform:scale(.97);
}

/* =========================
   PRUEBA DE VOZ
========================= */

.prueba{
    margin:0 12px 15px;
    padding:13px;

    border:1px solid #174c79;
    border-radius:15px;

    background:#07111b;
}

.pruebaTitulo{
    color:#72bdff;
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
}

#probarVoz{
    width:100%;

    border:1px solid #2583cf;
    border-radius:12px;

    padding:12px;

    background:#0a2439;
    color:#fff;

    font-size:15px;
    font-weight:700;
}

/* =========================
   MÚSICA
========================= */

.musica{
    margin:0 12px 15px;
    padding:13px;

    border:1px solid #21415e;
    border-radius:15px;

    background:#071018;
}

.musica h3{
    margin:0 0 10px;

    color:#8ccaff;
    font-size:14px;
}

#selectorMusica{
    width:100%;
    color:#d7e9fa;
    font-size:12px;
    margin-bottom:10px;
}

#reproductorMusica{
    width:100%;
    height:42px;
}

/* =========================
   CHAT
========================= */

#chat{
    display:flex;
    flex-direction:column;
    gap:10px;

    padding:8px 12px 20px;
}

.mensaje{
    width:100%;
    padding:12px 14px;

    border-radius:15px;

    line-height:1.45;
    font-size:15px;

    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.mensaje.usuario{
    align-self:flex-end;

    background:#10283c;
    border:1px solid #23547a;

    color:#fff;
}

.mensaje.gepeto{
    align-self:flex-start;

    background:#061d12;
    border:1px solid #18a85c;

    color:#7dffb2;
}

.mensajeSistema{
    color:#91a8ba;
    font-size:12px;
    text-align:center;
    padding:5px;
}

.mensajeCabecera{
    color:#50aaff;
    font-size:11px;
    font-weight:800;
    margin-bottom:5px;
    text-transform:uppercase;
}

.textoRespuesta{
    margin-bottom:9px;
}

.oir{
    display:inline-block;

    border:1px solid #1e9d5b;
    border-radius:10px;

    padding:8px 11px;

    background:#082b19;
    color:#9affc1;

    font-size:12px;
    font-weight:700;
}

.oir:active{
    transform:scale(.96);
}

.oir.leyendo{
    background:#12552d;
}

/* =========================
   BARRA INFERIOR
========================= */

.compositor{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    z-index:2000;

    display:flex;
    align-items:flex-end;
    gap:7px;

    padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));

    background:rgba(3,8,14,.97);
    border-top:1px solid #173b64;
    backdrop-filter:blur(12px);
}

#mensaje{
    flex:1;

    min-height:46px;
    max-height:120px;

    resize:none;

    border:1px solid #285274;
    border-radius:13px;

    background:#07121d;
    color:#fff;

    padding:12px;

    outline:none;

    font-size:15px;
}

#mensaje:focus{
    border-color:#328ed0;
}

#microfono,
#enviar{
    width:46px;
    height:46px;

    flex:none;

    border-radius:13px;
    border:1px solid #2a628e;

    background:#0a1d2d;
    color:#fff;

    font-size:20px;
}

#enviar{
    background:#083b23;
    border-color:#1b9856;
    font-size:17px;
}

#microfono.activo{
    background:#631515;
    border-color:#ff5555;
}

/* =========================
   INDICADORES
========================= */

.cargando{
    color:#70bfff;
    font-size:13px;
    padding:7px 0;
}

.error{
    color:#ff7373;
    font-size:13px;
    padding:7px 0;
}

.ok{
    color:#70ff9f;
    font-size:13px;
    padding:7px 0;
}

/* =========================
   ANIMACIONES
========================= */

.parpadeo{
    animation:parpadear .18s linear;
}

@keyframes parpadear{
    0%{filter:brightness(1)}
    50%{filter:brightness(.45)}
    100%{filter:brightness(1)}
}

.hablando{
    animation:hablando 1.2s infinite ease-in-out;
}

@keyframes hablando{
    0%,100%{
        box-shadow:
            0 0 18px rgba(0,130,255,.55),
            0 0 55px rgba(0,80,255,.22);
    }

    50%{
        box-shadow:
            0 0 30px rgba(0,160,255,.9),
            0 0 75px rgba(0,100,255,.45);
    }
}
</style>
</head>

<body>

<div id="app">

<header>
    <button id="biblioteca">← BIBLIOTECA</button>

    <div class="titulo">
        <strong>GePeTo</strong>
        <span>VIDEOCONFERENCIA</span>
    </div>

    <button id="parar">🛑 PARAR</button>
</header>


<section class="avatarBox">
    <img
        id="avatar"
        class="avatar"
        src="./GePeToFrontal.png"
        alt="GePeTo"
    >
</section>

<div id="estado" class="estado">
    🟢 GePeTo conectado
</div>


<div class="controles">
    <button id="parpadear">👁️ PARPADEAR</button>
</div>


<section class="prueba">

    <div class="pruebaTitulo">
        🔊 PRUEBA DE VOZ
    </div>

    <button id="probarVoz">
        🔊 PROBAR VOZ
    </button>

</section>


<section class="musica">

    <h3>🎵 Música de fondo</h3>

    <input
        id="selectorMusica"
        type="file"
        accept="audio/*"
    >

    <audio
        id="reproductorMusica"
        controls
        preload="metadata">
    </audio>

</section>


<div id="chat">

    <div class="mensajeSistema">
        GePeTo está preparado para hablar contigo.
    </div>

</div>

</div>


<div class="compositor">

    <textarea
        id="mensaje"
        placeholder="Escribe a GePeTo..."
        rows="1"></textarea>

    <button id="microfono" aria-label="Micrófono">
        🎤
    </button>

    <button id="enviar" aria-label="Enviar">
        ➤
    </button>

</div>


<script type="module">

/* ============================================================
   CONFIGURACIÓN
============================================================ */

const WORKER =
    "https://gepetto-rafa.rafadun18.workers.dev/preguntar";

const VOZ =
    "es_ES-davefx-medium";

const PIPER_URL =
    "https://cdn.jsdelivr.net/npm/@realtimex/piper-tts-web@1.1.1/+esm";


/* ============================================================
   ELEMENTOS
============================================================ */

const chat =
    document.getElementById("chat");

const mensaje =
    document.getElementById("mensaje");

const enviar =
    document.getElementById("enviar");

const microfono =
    document.getElementById("microfono");

const probarVoz =
    document.getElementById("probarVoz");

const parpadear =
    document.getElementById("parpadear");

const parar =
    document.getElementById("parar");

const biblioteca =
    document.getElementById("biblioteca");

const estado =
    document.getElementById("estado");

const avatar =
    document.getElementById("avatar");

const selectorMusica =
    document.getElementById("selectorMusica");

const reproductorMusica =
    document.getElementById("reproductorMusica");


/* ============================================================
   VARIABLES
============================================================ */

let piperModulo = null;
let piperCargando = null;
let sesionPiper = null;

let audioContext = null;
let fuenteActual = null;

let audioActual = null;
let audioURLActual = null;

let musicaURL = null;

let reconociendo = false;
let reconocimiento = null;

let ultimaRespuesta = "";

let colaVoz = [];
let reproduciendoVoz = false;


/* ============================================================
   ACTIVAR AUDIO DESDE EL PRIMER TOQUE
============================================================ */

async function prepararAudio(){

    try{

        if(!audioContext){

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;

            if(!AudioContextClass){

                console.warn(
                    "AudioContext no disponible"
                );

                return false;
            }

            audioContext =
                new AudioContextClass();
        }

        if(audioContext.state === "suspended"){

            await audioContext.resume();
        }

        return true;

    }catch(error){

        console.warn(
            "No se pudo activar AudioContext:",
            error
        );

        return false;
    }
}


/* ============================================================
   ACTIVAR AUDIO CON CUALQUIER TOQUE
============================================================ */

document.addEventListener(
    "touchend",
    () => {

        prepararAudio();

    },
    {
        passive:true
    }
);

document.addEventListener(
    "click",
    () => {

        prepararAudio();

    },
    {
        passive:true
    }
);


/* ============================================================
   PARPADEAR
============================================================ */

function hacerParpadear(){

    avatar.classList.remove("parpadeo");

    void avatar.offsetWidth;

    avatar.classList.add("parpadeo");
}

parpadear.onclick = () => {

    prepararAudio();

    hacerParpadear();
};


/* ============================================================
   NAVEGACIÓN
============================================================ */

biblioteca.onclick = () => {

    window.location.href =
        "./biblioteca.html";
};


/* ============================================================
   CARGAR PIPER
============================================================ */

async function cargarPiper(){

    if(piperModulo){

        return piperModulo;
    }

    if(piperCargando){

        return piperCargando;
    }

    piperCargando =
        import(PIPER_URL);

    try{

        piperModulo =
            await piperCargando;

        return piperModulo;

    }finally{

        piperCargando = null;
    }
}


/* ============================================================
   CREAR SESIÓN PIPER
============================================================ */

async function crearSesionPiper(){

    const modulo =
        await cargarPiper();

    const TtsSession =
        modulo.TtsSession;

    if(!TtsSession){

        throw new Error(
            "Piper no contiene TtsSession"
        );
    }

    sesionPiper =
        new TtsSession({

            voiceId: VOZ,

            allowLocalModels:true,

            fallbackStrategy:"auto",

            progress:(info) => {

                if(
                    info &&
                    info.loaded &&
                    info.total
                ){

                    const porcentaje =
                        Math.round(
                            (info.loaded /
                            info.total) * 100
                        );

                    estado.textContent =
                        "🔄 Preparando voz " +
                        porcentaje +
                        "%";
                }
            },

            logger:(...args) => {

                console.log(
                    "[PIPER]",
                    ...args
                );
            }

        });

    return sesionPiper;
}


/* ============================================================
   GENERAR WAV
============================================================ */

async function generarVoz(texto){

    if(!texto){

        throw new Error(
            "No hay texto para hablar"
        );
    }

    if(!sesionPiper){

        await crearSesionPiper();
    }

    try{

        const wav =
            await sesionPiper.predict(texto);

        if(!(wav instanceof Blob)){

            throw new Error(
                "Piper no devolvió un WAV válido"
            );
        }

        return wav;

    }catch(error){

        console.warn(
            "Piper falló. Se reiniciará la sesión.",
            error
        );

        sesionPiper = null;

        throw error;
    }
}


/* ============================================================
   REPRODUCIR WAV CON WEB AUDIO
============================================================ */

async function reproducirWAV(wav){

    const preparado =
        await prepararAudio();

    if(!preparado){

        throw new Error(
            "No se pudo activar el audio"
        );
    }

    if(!audioContext){

        throw new Error(
            "AudioContext no disponible"
        );
    }

    if(audioContext.state === "suspended"){

        await audioContext.resume();
    }


    /* Detener sonido anterior */

    try{

        if(fuenteActual){

            fuenteActual.stop();
        }

    }catch(_){}

    fuenteActual = null;


    /* Liberar URL anterior */

    if(audioURLActual){

        try{

            URL.revokeObjectURL(
                audioURLActual
            );

        }catch(_){}

        audioURLActual = null;
    }


    /* WAV → ArrayBuffer */

    const arrayBuffer =
        await wav.arrayBuffer();


    /* Decodificar */

    const audioBuffer =
        await audioContext.decodeAudioData(
            arrayBuffer.slice(0)
        );


    /* Crear fuente */

    const fuente =
        audioContext.createBufferSource();

    fuente.buffer =
        audioBuffer;

    fuente.connect(
        audioContext.destination
    );


    fuenteActual =
        fuente;


    fuente.onended = () => {

        if(fuenteActual === fuente){

            fuenteActual = null;
        }

        avatar.classList.remove(
            "hablando"
        );

        reproduciendoVoz = false;
    };


    avatar.classList.add(
        "hablando"
    );

    reproduciendoVoz = true;

    fuente.start(0);
}


/* ============================================================
   HABLAR
============================================================ */

async function hablarConPiper(texto){

    const wav =
        await generarVoz(texto);

    await reproducirWAV(wav);
}


/* ============================================================
   COLA DE VOZ
============================================================ */

async function procesarColaVoz(){

    if(reproduciendoVoz){

        return;
    }

    if(colaVoz.length === 0){

        return;
    }

    const texto =
        colaVoz.shift();

    try{

        await hablarConPiper(texto);

    }catch(error){

        console.error(
            "Error reproduciendo voz:",
            error
        );

        estado.textContent =
            "⚠️ Respuesta preparada · pulsa 🔊 OÍR";

    }
}


/* ============================================================
   AÑADIR VOZ A LA COLA
============================================================ */

function hablarAutomaticamente(texto){

    if(!texto){

        return;
    }

    colaVoz.push(texto);

    procesarColaVoz();
}


/* ============================================================
   BOTÓN PRUEBA DE VOZ
============================================================ */

probarVoz.onclick = async () => {

    probarVoz.disabled = true;

    estado.textContent =
        "🔄 Preparando voz de GePeTo...";

    try{

        await prepararAudio();

        const texto =
            "Hola Rafa. Soy GePeTo. La prueba de voz funciona correctamente.";

        await hablarConPiper(texto);

        estado.textContent =
            "🟢 Voz de GePeTo funcionando";

    }catch(error){

        console.error(error);

        estado.textContent =
            "❌ Error de voz: " +
            (error.message || error);

    }finally{

        probarVoz.disabled = false;
    }
};


/* ============================================================
   PARAR
============================================================ */

parar.onclick = () => {

    colaVoz = [];

    try{

        if(fuenteActual){

            fuenteActual.stop();
        }

    }catch(_){}

    fuenteActual = null;

    reproduciendoVoz = false;

    avatar.classList.remove(
        "hablando"
    );

    estado.textContent =
        "🟢 GePeTo conectado";
};


/* ============================================================
   RESPUESTA DEL WORKER
============================================================ */

function extraerTextoRespuesta(data){

    if(!data){

        return "";
    }


    if(typeof data === "string"){

        return data.trim();
    }


    const campos = [
        "respuesta",
        "response",
        "texto",
        "text",
        "answer",
        "content",
        "message"
    ];


    for(const campo of campos){

        if(
            typeof data[campo] ===
            "string"
        ){

            const texto =
                data[campo].trim();

            if(texto){

                return texto;
            }
        }
    }


    if(data.data){

        const resultado =
            extraerTextoRespuesta(
                data.data
            );

        if(resultado){

            return resultado;
        }
    }


    if(data.result){

        const resultado =
            extraerTextoRespuesta(
                data.result
            );

        if(resultado){

            return resultado;
        }
    }


    if(data.output){

        const resultado =
            extraerTextoRespuesta(
                data.output
            );

        if(resultado){

            return resultado;
        }
    }


    return "";
}


/* ============================================================
   MENSAJE DEL USUARIO
============================================================ */

function añadirMensajeUsuario(texto){

    const div =
        document.createElement("div");

    div.className =
        "mensaje usuario";

    div.textContent =
        texto;

    chat.appendChild(div);

    desplazarChat();
}


/* ============================================================
   MENSAJE DE GEPETO
============================================================ */

function añadirMensajeGePeTo(texto){

    const div =
        document.createElement("div");

    div.className =
        "mensaje gepeto";


    const cabecera =
        document.createElement("div");

    cabecera.className =
        "mensajeCabecera";

    cabecera.textContent =
        "GePeTo";


    const contenido =
        document.createElement("div");

    contenido.className =
        "textoRespuesta";

    contenido.textContent =
        texto;


    const boton =
        document.createElement("button");

    boton.className =
        "oir";

    boton.textContent =
        "🔊 OÍR";


    boton.onclick = async () => {

        try{

            boton.disabled = true;

            boton.classList.add(
                "leyendo"
            );

            boton.textContent =
                "🔊 HABLANDO...";

            await prepararAudio();

            await hablarConPiper(
                texto
            );

            boton.textContent =
                "🔊 OÍR";

        }catch(error){

            console.error(error);

            boton.textContent =
                "❌ REINTENTAR";

        }finally{

            boton.disabled = false;

            boton.classList.remove(
                "leyendo"
            );
        }
    };


    div.appendChild(cabecera);

    div.appendChild(contenido);

    div.appendChild(boton);

    chat.appendChild(div);

    desplazarChat();

    return div;
}


/* ============================================================
   DESPLAZAR CHAT
============================================================ */

function desplazarChat(){

    setTimeout(() => {

        window.scrollTo({

            top:
                document.body.scrollHeight,

            behavior:"smooth"

        });

    },50);
}


/* ============================================================
   ENVIAR MENSAJE
============================================================ */

async function enviarMensaje(){

    const texto =
        mensaje.value.trim();

    if(!texto){

        return;
    }


    /* ESTA ACCIÓN ES DEL USUARIO.
       Activamos el AudioContext AQUÍ. */

    await prepararAudio();


    añadirMensajeUsuario(texto);

    mensaje.value = "";

    mensaje.style.height =
        "46px";


    enviar.disabled = true;

    estado.textContent =
        "🔵 GePeTo está pensando...";


    const cargando =
        document.createElement("div");

    cargando.className =
        "mensajeSistema";

    cargando.textContent =
        "GePeTo está preparando su respuesta...";

    chat.appendChild(cargando);

    desplazarChat();


    try{

        const respuesta =
            await fetch(

                WORKER,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        mensaje:texto,

                        texto:texto,

                        pregunta:texto

                    })

                }

            );


        const contenido =
            await respuesta.text();


        let data;

        try{

            data =
                JSON.parse(
                    contenido
                );

        }catch(_){

            data =
                contenido;
        }


        if(!respuesta.ok){

            throw new Error(
                "Worker HTTP " +
                respuesta.status
            );
        }


        const respuestaTexto =
            extraerTextoRespuesta(
                data
            );


        if(!respuestaTexto){

            throw new Error(
                "Workers AI respondió pero no devolvió texto."
            );
        }


        ultimaRespuesta =
            respuestaTexto;


        cargando.remove();


        añadirMensajeGePeTo(
            respuestaTexto
        );


        estado.textContent =
            "🟢 GePeTo respondió";


        /*
         * IMPORTANTE:
         *
         * Intentamos hablar automáticamente
         * usando el AudioContext que ya fue
         * activado cuando Rafa pulsó ENVIAR.
         *
         * No usamos new Audio().play()
         * para la respuesta.
         */

        try{

            await hablarConPiper(
                respuestaTexto
            );

            estado.textContent =
                "🟢 GePeTo hablando";

        }catch(error){

            console.warn(
                "Reproducción automática bloqueada:",
                error
            );

            estado.textContent =
                "🟢 Respuesta lista · pulsa 🔊 OÍR";
        }


    }catch(error){

        console.error(error);

        cargando.remove();


        const errorDiv =
            document.createElement("div");

        errorDiv.className =
            "mensaje gepeto";


        const cabecera =
            document.createElement("div");

        cabecera.className =
            "mensajeCabecera";

        cabecera.textContent =
            "GePeTo";


        const textoError =
            document.createElement("div");

        textoError.className =
            "error";

        textoError.textContent =
            "❌ " +
            (
                error.message ||
                "No se pudo obtener respuesta."
            );


        errorDiv.appendChild(
            cabecera
        );

        errorDiv.appendChild(
            textoError
        );

        chat.appendChild(
            errorDiv
        );

        desplazarChat();


        estado.textContent =
            "🔴 Error de GePeTo";
    }


    enviar.disabled = false;

    mensaje.focus();
}


/* ============================================================
   BOTÓN ENVIAR
============================================================ */

enviar.onclick = () => {

    enviarMensaje();
};


/* ============================================================
   ENTER PARA ENVIAR
============================================================ */

mensaje.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            enviarMensaje();
        }
    }
);


/* ============================================================
   AUTOAJUSTAR TEXTAREA
============================================================ */

mensaje.addEventListener(
    "input",
    () => {

        mensaje.style.height =
            "auto";

        mensaje.style.height =
            Math.min(
                mensaje.scrollHeight,
                120
            ) + "px";
    }
);


/* ============================================================
   MICRÓFONO
============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    reconocimiento =
        new SpeechRecognition();

    reconocimiento.lang =
        "es-ES";

    reconocimiento.continuous =
        false;

    reconocimiento.interimResults =
        false;


    reconocimiento.onstart = () => {

        reconociendo = true;

        microfono.classList.add(
            "activo"
        );

        microfono.textContent =
            "⏹️";

        estado.textContent =
            "🎤 Escuchando...";
    };


    reconocimiento.onresult =
        (event) => {

            const texto =
                event.results[0][0].transcript;

            mensaje.value =
                texto;

            mensaje.dispatchEvent(
                new Event("input")
            );
        };


    reconocimiento.onerror =
        (event) => {

            console.warn(
                "Reconocimiento:",
                event.error
            );

            estado.textContent =
                "⚠️ No se pudo usar el micrófono";
        };


    reconocimiento.onend = () => {

        reconociendo = false;

        microfono.classList.remove(
            "activo"
        );

        microfono.textContent =
            "🎤";

        /*
         * IMPORTANTE:
         * Después del reconocimiento
         * hacemos que el usuario pulse
         * ENVIAR. Así conservamos una
         * interacción directa para el audio.
         */

        estado.textContent =
            "🟢 Voz reconocida · pulsa ENVIAR";
    };


    microfono.onclick = async () => {

        await prepararAudio();

        if(reconociendo){

            reconocimiento.stop();

            return;
        }

        try{

            reconocimiento.start();

        }catch(error){

            console.warn(error);
        }
    };

}else{

    microfono.style.display =
        "none";
}


/* ============================================================
   MÚSICA LOCAL
============================================================ */

selectorMusica.onchange =
    () => {

        const archivo =
            selectorMusica.files &&
            selectorMusica.files[0];

        if(!archivo){

            return;
        }


        if(musicaURL){

            try{

                URL.revokeObjectURL(
                    musicaURL
                );

            }catch(_){}
        }


        musicaURL =
            URL.createObjectURL(
                archivo
            );


        reproductorMusica.src =
            musicaURL;


        reproductorMusica.load();

        estado.textContent =
            "🎵 Música preparada · pulsa ▶️";
    };


/* ============================================================
   INICIO
============================================================ */

estado.textContent =
    "🟢 GePeTo conectado · toca la pantalla para activar audio";

</script>
