<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Videoconferencia · GePeTo</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#05070b;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

button{
    font-family:Arial,sans-serif;
    cursor:pointer;
}

#app{
    min-height:100vh;
    padding-bottom:110px;
}

/* =========================================================
   CABECERA
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:8px;
    padding:10px;

    background:rgba(3,8,15,.97);
    border-bottom:1px solid #173b64;
    backdrop-filter:blur(10px);
}

header button{
    border:1px solid #2769a8;
    border-radius:12px;
    background:#071522;
    color:#fff;
    padding:10px 12px;
    font-size:13px;
    font-weight:700;
}

header button:active{
    transform:scale(.97);
}

#parar{
    border-color:#8b2525;
    background:#230b0b;
    color:#ff7777;
}

.titulo{
    flex:1;
    min-width:0;
    text-align:center;
}

.titulo strong{
    display:block;
    color:#55aaff;
    font-size:18px;
}

.titulo span{
    display:block;
    color:#9db6d0;
    font-size:10px;
    margin-top:2px;
}

/* =========================================================
   AVATAR
========================================================= */

.avatarBox{
    display:flex;
    justify-content:center;
    padding:18px 12px 8px;
}

.avatarStage{
    position:relative;

    width:min(285px,82vw);
    aspect-ratio:781 / 1000;

    overflow:hidden;
    border-radius:24px;

    background:#07101c;
    border:3px solid #1685ff;

    box-shadow:
        0 0 22px rgba(0,130,255,.65),
        0 0 60px rgba(0,80,255,.28);

    animation:
        respiracion
        5s
        ease-in-out
        infinite;

    transform-origin:50% 45%;
}

@keyframes respiracion{

    0%,100%{
        transform:
            translate3d(0,0,0)
            rotate(0deg);
    }

    25%{
        transform:
            translate3d(-.35px,-.3px,0)
            rotate(-.06deg);
    }

    50%{
        transform:
            translate3d(.45px,-.45px,0)
            rotate(.07deg);
    }

    75%{
        transform:
            translate3d(.3px,.15px,0)
            rotate(.04deg);
    }
}

/* =========================================================
   FOTO REAL
========================================================= */

.avatar{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    display:block;

    user-select:none;
    -webkit-user-drag:none;

    transform-origin:50% 45%;
}

/* =========================================================
   CAPA FACIAL
========================================================= */

.caraAnimada{
    position:absolute;
    inset:0;

    z-index:20;
    pointer-events:none;
    overflow:hidden;

    --miradaX:0px;
    --miradaY:0px;

    --pupilaX:0px;
    --pupilaY:0px;

    --cejaIzqY:0px;
    --cejaDerY:0px;

    --bocaX:0px;
    --bocaY:0px;

    --bocaXScale:1;
    --bocaYScale:.70;

    --ojoEscala:1;
}

/* =========================================================
   OJOS
========================================================= */

.ojo{
    position:absolute;

    top:39.0%;

    width:10.5%;
    height:5.4%;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(150,220,255,.22) 0%,
            rgba(70,170,255,.09) 35%,
            transparent 72%
        );

    opacity:.78;

    transform:
        translate3d(
            var(--miradaX),
            var(--miradaY),
            0
        )
        scaleY(var(--ojoEscala));

    transition:
        transform .08s ease-out;
}

.ojo.izq{
    left:34.2%;
}

.ojo.der{
    left:55.2%;
}

/* =========================================================
   PUPILAS
========================================================= */

.ojo::after{
    content:"";
    position:absolute;

    left:50%;
    top:50%;

    width:34%;
    height:62%;

    transform:
        translate(-50%,-50%)
        translate(
            var(--pupilaX),
            var(--pupilaY)
        );

    border-radius:50%;

    background:
        radial-gradient(
            circle at 38% 32%,
            #fff 0 9%,
            #79caff 10% 24%,
            #17466c 30%,
            #03070c 65%,
            transparent 72%
        );

    box-shadow:
        0 0 3px rgba(70,190,255,.8);

    transition:
        transform .10s ease-out;
}

/* =========================================================
   PÁRPADOS
========================================================= */

.parpado{
    position:absolute;

    top:38.0%;

    width:12%;
    height:7%;

    border-radius:50%;

    background:
        linear-gradient(
            to bottom,
            rgba(8,14,22,.02),
            rgba(8,14,22,.32)
        );

    opacity:.15;

    transform:
        scaleY(
            calc(1 - var(--parpado,0))
        );

    transform-origin:center;

    transition:
        transform .07s ease-in;
}

.parpado.izq{
    left:33.5%;
}

.parpado.der{
    left:54.5%;
}

/* =========================================================
   CEJAS
========================================================= */

.ceja{
    position:absolute;

    top:38.3%;

    width:14.5%;
    height:2.4%;

    border-radius:50%;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(20,35,48,.42) 20%,
            rgba(15,27,39,.75) 50%,
            rgba(20,35,48,.42) 80%,
            transparent 100%
        );

    opacity:.58;
    filter:blur(.25px);

    transition:
        transform .18s ease-out;
}

.ceja.izq{
    left:32.4%;

    transform:
        translateY(var(--cejaIzqY))
        rotate(-6deg);
}

.ceja.der{
    left:54.1%;

    transform:
        translateY(var(--cejaDerY))
        rotate(6deg);
}

/* =========================================================
   MEJILLAS
========================================================= */

.mejilla{
    position:absolute;

    top:55.5%;

    width:16%;
    height:9%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(60,150,255,.20),
            rgba(60,150,255,.04) 48%,
            transparent 75%
        );

    opacity:.05;
    filter:blur(5px);

    transition:
        opacity .45s ease,
        transform .45s ease;
}

.mejilla.izq{
    left:19%;
}

.mejilla.der{
    left:65%;
}

/* =========================================================
   BOCA
========================================================= */

.boca{
    position:absolute;

    left:38%;
    top:59.7%;

    width:24%;
    height:7%;

    transform:
        translate(
            var(--bocaX),
            var(--bocaY)
        )
        scaleX(var(--bocaXScale))
        scaleY(var(--bocaYScale));

    transform-origin:center;

    border-radius:
        12% 12% 50% 50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(8,4,8,.72) 0 35%,
            rgba(80,20,30,.28) 50%,
            transparent 76%
        );

    border:
        1px solid
        rgba(255,130,150,.16);

    opacity:.48;

    transition:
        transform .075s linear,
        border-radius .16s ease,
        opacity .15s ease;
}

.hablando .boca{
    opacity:.66;

    background:
        radial-gradient(
            ellipse at center,
            rgba(3,3,7,.88) 0 40%,
            rgba(130,35,45,.42) 52%,
            transparent 76%
        );
}

/* =========================================================
   SONRISA
========================================================= */

.sonrisaLinea{
    position:absolute;

    left:36.5%;
    top:60.5%;

    width:27%;
    height:7%;

    border-bottom:
        2px solid
        rgba(255,150,170,.40);

    border-radius:
        0 0 55% 55%;

    opacity:0;

    transform:
        scaleX(.65);

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.caraAnimada.sonriendo
.sonrisaLinea{
    opacity:.72;

    transform:
        scaleX(1);
}

.caraAnimada.sonriendo
.boca{
    border-radius:
        4% 4% 70% 70%;

    transform:
        translate(
            var(--bocaX),
            var(--bocaY)
        )
        scaleX(
            calc(var(--bocaXScale) * 1.08)
        )
        scaleY(
            calc(var(--bocaYScale) * .72)
        );

    opacity:.65;
}

.caraAnimada.sonriendo
.mejilla{
    opacity:.32;

    transform:
        scale(1.12);
}

/* =========================================================
   PARPADEO
========================================================= */

.caraAnimada.parpadeando
.ojo{
    --ojoEscala:.08;
}

.caraAnimada.parpadeando
.parpado{
    opacity:.55;

    transform:
        scaleY(1.1);
}

/* =========================================================
   HABLANDO
========================================================= */

.avatarStage.hablando{
    animation:
        cabezaHablando
        3s
        ease-in-out
        infinite;
}

@keyframes cabezaHablando{

    0%,100%{
        transform:
            translate3d(0,0,0)
            rotate(0deg);
    }

    20%{
        transform:
            translate3d(-.55px,-.2px,0)
            rotate(-.10deg);
    }

    42%{
        transform:
            translate3d(.7px,.15px,0)
            rotate(.12deg);
    }

    65%{
        transform:
            translate3d(.5px,-.25px,0)
            rotate(.08deg);
    }

    84%{
        transform:
            translate3d(-.45px,.1px,0)
            rotate(-.09deg);
    }
}

/* =========================================================
   ESTADO
========================================================= */

.estado{
    text-align:center;

    margin:
        3px 15px 15px;

    color:#62b6ff;

    font-size:13px;
    font-weight:600;
}

/* =========================================================
   CONTROLES
========================================================= */

.controles{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;

    gap:8px;

    padding:
        0 12px 14px;
}

.controles button{
    border:1px solid #225b8e;

    border-radius:12px;

    background:#081521;
    color:#fff;

    padding:10px 13px;
    font-size:13px;
}

/* =========================================================
   VOZ
========================================================= */

.prueba{
    margin:
        0 12px 15px;

    padding:13px;

    border:1px solid #174c79;
    border-radius:15px;

    background:#07111b;
}

.pruebaTitulo{
    color:#72bdff;
    font-size:13px;

    font-weight:700;

    margin-bottom:8px;
}

#probarVoz{
    width:100%;

    border:1px solid #2583cf;
    border-radius:12px;

    padding:12px;

    background:#0a2439;
    color:#fff;

    font-size:15px;
    font-weight:700;
}

/* =========================================================
   MÚSICA
========================================================= */

.musica{
    margin:
        0 12px 15px;

    padding:13px;

    border:1px solid #21415e;
    border-radius:15px;

    background:#071018;
}

.musica h3{
    margin:
        0 0 10px;

    color:#8ccaff;
    font-size:14px;
}

#selectorMusica{
    width:100%;
    color:#d7e9fa;
    font-size:12px;

    margin-bottom:10px;
}

#reproductorMusica{
    width:100%;
}

/* =========================================================
   CHAT
========================================================= */

#chat{
    display:flex;
    flex-direction:column;

    gap:10px;

    padding:
        8px 12px 20px;
}

.mensaje{
    width:100%;

    padding:
        12px 14px;

    border-radius:15px;

    line-height:1.45;
    font-size:15px;

    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.mensaje.usuario{
    align-self:flex-end;

    background:#10283c;
    border:1px solid #23547a;
}

.mensaje.gepeto{
    align-self:flex-start;

    background:#061d12;

    border:1px solid #18a85c;

    color:#b5ffd0;
}

.cabeceraRespuesta{
    color:#50aaff;

    font-size:11px;
    font-weight:800;

    margin-bottom:6px;

    text-transform:uppercase;
}

.oir{
    display:inline-block;

    margin-top:9px;

    border:1px solid #1e9d5b;
    border-radius:10px;

    padding:
        8px 11px;

    background:#082b19;
    color:#9affc1;

    font-size:12px;
    font-weight:700;
}

.sistema{
    color:#91a8ba;

    font-size:12px;
    text-align:center;

    padding:5px;
}

.error{
    color:#ff7373;

    font-size:13px;
    text-align:center;

    padding:8px;
}

.cargando{
    color:#70bfff;

    font-size:13px;
    text-align:center;

    padding:7px;
}

/* =========================================================
   COMPOSITOR
========================================================= */

.compositor{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:2000;

    display:flex;
    align-items:flex-end;

    gap:7px;

    padding:
        8px 8px
        calc(8px + env(safe-area-inset-bottom));

    background:rgba(3,8,14,.97);

    border-top:1px solid #173b64;

    backdrop-filter:blur(12px);
}

#mensaje{
    flex:1;

    min-height:46px;
    max-height:120px;

    resize:none;

    border:1px solid #285274;
    border-radius:13px;

    background:#07121d;
    color:#fff;

    padding:12px;

    outline:none;
    font-size:15px;
}

#mensaje:focus{
    border-color:#328ed0;
}

#microfono,
#enviar{

    width:46px;
    height:46px;

    flex:none;

    border-radius:13px;

    border:1px solid #2a628e;

    background:#0a1d2d;
    color:#fff;

    font-size:20px;
}

#enviar{
    background:#083b23;
    border-color:#1b9856;
    font-size:17px;
}

#microfono.activo{
    background:#631515;
    border-color:#ff5555;
}

/* =========================================================
   MÓVIL
========================================================= */

@media(max-width:420px){

    .avatarStage{
        width:min(280px,82vw);
    }

    .mensaje{
        font-size:14px;
    }
}

/* =========================================================
   REDUCIR MOVIMIENTO
========================================================= */

@media(prefers-reduced-motion:reduce){

    .avatarStage{
        animation:none !important;
    }
}
</style>
</head>

<body>

<div id="app">

<header>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const WORKER =
"https://gepetto-rafa.rafadun18.workers.dev";

const PREGUNTAR_URL =
WORKER + "/preguntar";

const PIPER_URL =
WORKER + "/voz";

const VOZ_PIPER =
"es_ES-davefx-medium";

const VOCES_MASCULINAS_ANDROID = [

    "es-es-x-eed-local",
    "es-es-x-eef-local",
    "es-ES-x-eed-local",
    "es-ES-x-eef-local"

];

/* =========================================================
   ELEMENTOS
========================================================= */

const avatarStage =
document.getElementById(
    "avatarStage"
);

const caraAnimada =
document.getElementById(
    "caraAnimada"
);

const estado =
document.getElementById(
    "estado"
);

const chat =
document.getElementById(
    "chat"
);

const mensaje =
document.getElementById(
    "mensaje"
);

const enviar =
document.getElementById(
    "enviar"
);

const microfono =
document.getElementById(
    "microfono"
);

const parar =
document.getElementById(
    "parar"
);

const probarVoz =
document.getElementById(
    "probarVoz"
);

const parpadearBtn =
document.getElementById(
    "parpadearBtn"
);

const selectorMusica =
document.getElementById(
    "selectorMusica"
);

const reproductorMusica =
document.getElementById(
    "reproductorMusica"
);

/* =========================================================
   VARIABLES
========================================================= */

let reconocimiento = null;
let escuchando = false;
let hablando = false;

let audioActual = null;
let audioURL = null;

let bocaTimer = null;
let parpadeoTimer = null;
let miradaTimer = null;

let musicaPausada = false;
let vozMasculina = null;

/* =========================================================
   BUSCAR VOZ MASCULINA
========================================================= */

function buscarVozMasculina(){

    if(!window.speechSynthesis){
        return null;
    }

    const voces =
        window.speechSynthesis.getVoices();

    if(!voces || !voces.length){
        return null;
    }

    for(
        const nombre
        of VOCES_MASCULINAS_ANDROID
    ){

        const encontrada =
            voces.find(
                voz => {

                    const n =
                        (
                            voz.name ||
                            ""
                        ).toLowerCase();

                    const v =
                        (
                            voz.voiceURI ||
                            ""
                        ).toLowerCase();

                    return (
                        n ===
                        nombre.toLowerCase()
                    )
                    ||
                    v.includes(
                        nombre.toLowerCase()
                    );

                }
            );

        if(encontrada){
            return encontrada;
        }
    }

    const masculina =
        voces.find(
            voz => {

                const idioma =
                    (
                        voz.lang ||
                        ""
                    ).toLowerCase();

                const nombre =
                    (
                        voz.name ||
                        ""
                    ).toLowerCase();

                return (
                    idioma.startsWith("es")
                    &&
                    (
                        nombre.includes("male")
                        ||
                        nombre.includes("mascul")
                        ||
                        nombre.includes("hombre")
                        ||
                        nombre.includes("eed")
                        ||
                        nombre.includes("eef")
                    )
                );
            }
        );

    if(masculina){
        return masculina;
    }

    return null;
}

/* =========================================================
   CARGAR VOCES
========================================================= */

function cargarVoces(){

    vozMasculina =
        buscarVozMasculina();

}

if(window.speechSynthesis){

    window.speechSynthesis.onvoiceschanged =
        cargarVoces;

    cargarVoces();

    setTimeout(
        cargarVoces,
        500
    );

    setTimeout(
        cargarVoces,
        1500
    );
}

/* =========================================================
   CHAT
========================================================= */

function bajarChat(){

    setTimeout(
        () => {

            window.scrollTo({

                top:
                    document.body.scrollHeight,

                behavior:
                    "smooth"

            });

        },
        60
    );
}

function añadirUsuario(texto){

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "mensaje usuario";

    div.textContent =
        texto;

    chat.appendChild(div);

    bajarChat();
}

function añadirGePeTo(texto){

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "mensaje gepeto";

    const cabecera =
        document.createElement(
            "div"
        );

    cabecera.className =
        "cabeceraRespuesta";

    cabecera.textContent =
        "GePeTo";

    const cuerpo =
        document.createElement(
            "div"
        );

    cuerpo.textContent =
        texto;

    const boton =
        document.createElement(
            "button"
        );

    boton.type =
        "button";

    boton.className =
        "oir";

    boton.textContent =
        "🔊 OÍR";

    boton.onclick =
        () => {

            hablar(texto);

        };

    div.appendChild(
        cabecera
    );

    div.appendChild(
        cuerpo
    );

    div.appendChild(
        boton
    );

    chat.appendChild(
        div
    );

    bajarChat();
}

/* =========================================================
   EXTRAER RESPUESTA
========================================================= */

function extraerTexto(data){

    if(
        typeof data ===
        "string"
    ){

        return data.trim();

    }

    if(!data){
        return "";
    }

    const candidatos = [

        data.respuesta,
        data.response,
        data.texto,
        data.text,
        data.mensaje,
        data.message,
        data.answer,
        data.reply,
        data.content,
        data.output,

        data.result?.respuesta,
        data.result?.response,
        data.result?.texto,
        data.result?.text,
        data.result?.mensaje,
        data.result?.message,
        data.result?.answer,
        data.result?.reply,
        data.result?.content,
        data.result?.output

    ];

    for(
        const valor
        of candidatos
    ){

        if(
            typeof valor ===
            "string"
            &&
            valor.trim()
        ){

            return valor.trim();

        }
    }

    return "";
}

========================================================= */

function pararTodo(){

    if(audioActual){

        try{
            audioActual.pause();
        }catch(_){}

        audioActual =
            null;
    }

    if(audioURL){

        try{
            URL.revokeObjectURL(
                audioURL
            );
        }catch(_){}

        audioURL =
            null;
    }

    if(window.speechSynthesis){

        try{
            window.speechSynthesis.cancel();
        }catch(_){}

    }

    terminarHabla();
}

/* =========================================================
   PIPER
========================================================= */

async function reproducirPiper(texto){

    try{

        const controlador =
            new AbortController();

        const temporizador =
            setTimeout(
                () => {
                    controlador.abort();
                },
                15000
            );

        const respuesta =
            await fetch(
                PIPER_URL,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "audio/wav,audio/*,application/json"
                    },

                    body:
                        JSON.stringify({

                            texto:
                                texto,

                            text:
                                texto,

                            mensaje:
                                texto,

                            voice:
                                VOZ_PIPER,

                            voz:
                                VOZ_PIPER,

                            modelo:
                                VOZ_PIPER,

                            model:
                                VOZ_PIPER,

                            speaker:
                                0,

                            gender:
                                "male",

                            idioma:
                                "es-ES"

                        }),

                    signal:
                        controlador.signal

                }
            );

        clearTimeout(
            temporizador
        );

        if(!respuesta.ok){

            console.warn(
                "Piper HTTP:",
                respuesta.status
            );

            return false;
        }

        const tipo =
            (
                respuesta.headers.get(
                    "content-type"
                )
                ||
                ""
            ).toLowerCase();

        if(
            !tipo.includes(
                "audio"
            )
        ){

            console.warn(
                "Piper no devolvió audio."
            );

            return false;
        }

        const blob =
            await respuesta.blob();

        if(!blob || !blob.size){

            return false;
        }

        audioURL =
            URL.createObjectURL(
                blob
            );

        audioActual =
            new Audio(
                audioURL
            );

        audioActual.preload =
            "auto";

        audioActual.volume =
            1;

        audioActual.onplay =
            () => {

                empezarHabla();

            };

        audioActual.onended =
            () => {

                terminarHabla();

                if(
                    musicaPausada
                ){

                    reproductorMusica
                        .play()
                        .catch(
                            () => {}
                        );
                }

                musicaPausada =
                    false;

            };

        audioActual.onerror =
            () => {

                terminarHabla();

            };

        await audioActual.play();

        return true;

    }catch(error){

        console.warn(
            "Piper no disponible:",
            error
        );

        terminarHabla();

        return false;
    }
}

/* =========================================================
   VOZ DEL DISPOSITIVO
========================================================= */

function hablarAndroidMasculino(texto){

    return new Promise(
        resolve => {

            if(
                !window.speechSynthesis
            ){

                resolve(false);
                return;

            }

            try{

                window.speechSynthesis.cancel();

                const voces =
                    window.speechSynthesis.getVoices();

                if(
                    !voces ||
                    !voces.length
                ){

                    estado.textContent =
                        "🔄 Cargando voces del dispositivo...";

                    setTimeout(
                        () => {

                            hablarAndroidMasculino(
                                texto
                            ).then(
                                resolve
                            );

                        },
                        700
                    );

                    return;
                }

                let voz =
                    buscarVozMasculina();

                /*
                   Si existe una voz masculina española,
                   la utilizamos.
                */

                if(!voz){

                    voz =
                        voces.find(
                            v => {

                                const idioma =
                                    (
                                        v.lang ||
                                        ""
                                    ).toLowerCase();

                                const nombre =
                                    (
                                        v.name ||
                                        ""
                                    ).toLowerCase();

                                return (
                                    idioma.startsWith(
                                        "es"
                                    )
                                    &&
                                    (
                                        nombre.includes(
                                            "male"
                                        )
                                        ||
                                        nombre.includes(
                                            "mascul"
                                        )
                                        ||
                                        nombre.includes(
                                            "hombre"
                                        )
                                        ||
                                        nombre.includes(
                                            "eed"
                                        )
                                        ||
                                        nombre.includes(
                                            "eef"
                                        )
                                    )
                                );

                            }
                        );
                }

                /*
                   Último respaldo:
                   cualquier voz española.
                */

                if(!voz){

                    voz =
                        voces.find(
                            v => {

                                const idioma =
                                    (
                                        v.lang ||
                                        ""
                                    ).toLowerCase();

                                return idioma.startsWith(
                                    "es"
                                );

                            }
                        );
                }

                if(!voz){

                    estado.textContent =
                        "⚠️ No hay voz española disponible.";

                    resolve(false);
                    return;
                }

                vozMasculina =
                    voz;

                const utterance =
                    new SpeechSynthesisUtterance(
                        texto
                    );

                utterance.voice =
                    voz;

                utterance.lang =
                    voz.lang ||
                    "es-ES";

                utterance.rate =
                    .93;

                utterance.pitch =
                    .82;

                utterance.volume =
                    1;

                let terminado =
                    false;

                const finalizar =
                    ok => {

                        if(terminado){
                            return;
                        }

                        terminado =
                            true;

                        terminarHabla();

                        if(
                            musicaPausada
                        ){

                            reproductorMusica
                                .play()
                                .catch(
                                    () => {}
                                );

                            musicaPausada =
                                false;
                        }

                        resolve(ok);
                    };

                utterance.onstart =
                    () => {

                        empezarHabla();

                    };

                utterance.onend =
                    () => {

                        finalizar(true);

                    };

                utterance.onerror =
                    error => {

                        console.warn(
                            "SpeechSynthesis:",
                            error
                        );

                        finalizar(false);

                    };

                window.speechSynthesis.speak(
                    utterance
                );

                /*
                   Algunos navegadores móviles necesitan
                   reactivar speechSynthesis.
                */

                setTimeout(
                    () => {

                        try{

                            if(
                                !terminado &&
                                window.speechSynthesis.paused
                            ){

                                window.speechSynthesis.resume();

                            }

                        }catch(_){}

                    },
                    250
                );

            }catch(error){

                console.error(
                    "Voz del dispositivo:",
                    error
                );

                terminarHabla();

                resolve(false);
            }

        }
    );
}

/* =========================================================
   HABLAR
========================================================= */

async function hablar(texto){

    if(!texto){
        return;
    }

    pararTodo();

    if(
        reproductorMusica &&
        !reproductorMusica.paused
    ){

        musicaPausada =
            true;

        reproductorMusica.pause();
    }

    sonreir(1800);

    /*
       PRIMERO:
       Piper, voz masculina de GePeTo.
    */

    const piperOK =
        await reproducirPiper(
            texto
        );

    if(piperOK){
        return;
    }

    /*
       SEGUNDO:
       voz del dispositivo.
    */

    const androidOK =
        await hablarAndroidMasculino(
            texto
        );

    if(androidOK){
        return;
    }

    estado.textContent =
        "⚠️ No se pudo reproducir la voz de GePeTo.";

}

/* =========================================================
   ENVIAR
========================================================= */

async function enviarMensaje(){

    const texto =
        mensaje.value.trim();

    if(!texto){
        return;
    }

    pararTodo();

    añadirUsuario(
        texto
    );

    mensaje.value =
        "";

    mensaje.style.height =
        "46px";

    enviar.disabled =
        true;

    estado.textContent =
        "🔄 GePeTo está pensando...";

    const cargando =
        document.createElement(
            "div"
        );

    cargando.className =
        "cargando";

    cargando.textContent =
        "GePeTo está pensando...";

    chat.appendChild(
        cargando
    );

    bajarChat();

    try{

        const respuesta =
            await fetch(
                PREGUNTAR_URL,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json,text/plain,*/*"
                    },

                    body:
                        JSON.stringify({

                            mensaje:
                                texto,

                            prompt:
                                texto,

                            message:
                                texto

                        })

                }
            );

        const contenido =
            await respuesta.text();

        let data;

        try{

            data =
                JSON.parse(
                    contenido
                );

        }catch(_){

            data =
                contenido;

        }

        if(
            data &&
            typeof data ===
            "object" &&
            data.ok === false
        ){

            throw new Error(
                data.error ||
                data.message ||
                "El Worker rechazó la petición."
            );
        }

        if(!respuesta.ok){

            throw new Error(
                "HTTP " +
                respuesta.status
            );
        }

        const textoRespuesta =
            extraerTexto(
                data
            );

        if(!textoRespuesta){

            throw new Error(
                "GePeTo no devolvió texto."
            );
        }

        cargando.remove();

        añadirGePeTo(
            textoRespuesta
        );

        estado.textContent =
            "🟢 GePeTo preparado";

        sonreir(2300);

        await hablar(
            textoRespuesta
        );

    }catch(error){

        console.error(
            "GePeTo:",
            error
        );

        cargando.remove();

        const errorDiv =
            document.createElement(
                "div"
            );

        errorDiv.className =
            "error";

        errorDiv.textContent =
            "❌ No se pudo obtener respuesta de GePeTo. " +
            (
                error.message ||
                ""
            );

        chat.appendChild(
            errorDiv
        );

        estado.textContent =
            "🔴 Error de conexión con GePeTo";

        bajarChat();

    }finally{

        enviar.disabled =
            false;

        mensaje.focus();

    }
}

/* =========================================================

========================================================= */

function iniciarMicrofono(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        estado.textContent =
            "⚠️ Este navegador no admite reconocimiento de voz.";

        return;

    }

    if(escuchando){

        try{
            reconocimiento.stop();
        }catch(_){}

        return;

    }

    reconocimiento =
        new SpeechRecognition();

    reconocimiento.lang =
        "es-ES";

    reconocimiento.continuous =
        false;

    reconocimiento.interimResults =
        true;

    reconocimiento.maxAlternatives =
        1;

    escuchando =
        true;

    microfono.classList.add(
        "activo"
    );

    microfono.textContent =
        "⏹️";

    estado.textContent =
        "🎤 Escuchando...";

    reconocimiento.onresult =
        event => {

            let texto =
                "";

            for(
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ){

                texto +=
                    event.results[i][0]
                        .transcript;

            }

            mensaje.value =
                texto.trim();

            mensaje.dispatchEvent(
                new Event(
                    "input"
                )
            );

        };

    reconocimiento.onerror =
        event => {

            console.warn(
                "Micrófono:",
                event.error
            );

        };

    reconocimiento.onend =
        () => {

            escuchando =
                false;

            microfono.classList.remove(
                "activo"
            );

            microfono.textContent =
                "🎤";

            if(
                mensaje.value.trim()
            ){

                enviarMensaje();

            }else{

                estado.textContent =
                    "🟢 GePeTo preparado";

            }

        };

    try{

        reconocimiento.start();

    }catch(error){

        console.warn(
            error
        );

        escuchando =
            false;

        microfono.classList.remove(
            "activo"
        );

        microfono.textContent =
            "🎤";

    }
}

microfono.onclick =
    () => {

        iniciarMicrofono();

    };
