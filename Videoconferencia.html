<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Videoconferencia · GePeTo</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#020202;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:95px;
}

/* CABECERA */

.cabecera{
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px;
  background:#030303;
  border-bottom:2px solid #006eff;
  box-shadow:0 0 15px rgba(0,110,255,.6);
}

.cabecera button{
  border:1px solid white;
  border-radius:10px;
  padding:9px;
  background:#080808;
  color:white;
  font-weight:bold;
  font-size:11px;
}

.titulo{
  flex:1;
  text-align:center;
  font-weight:bold;
  font-size:14px;
}

.titulo span{
  color:#008cff;
}

/* CONTENEDOR */

.principal{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:9px;
}

/* VIDEO */

.video-panel{
  background:#05080c;
  border:2px solid #006eff;
  border-radius:20px;
  padding:8px;
  box-shadow:0 0 25px rgba(0,110,255,.45);
}

.estado{
  text-align:center;
  padding:9px;
  margin-bottom:8px;
  border-radius:10px;
  background:#080808;
  border:1px solid #164b80;
  color:#72b8ff;
  font-size:13px;
}

.estado.hablando{
  color:#00ff66;
  border-color:#00ff66;
  box-shadow:0 0 12px rgba(0,255,102,.4);
}

/* AVATAR */

.avatar-zona{
  position:relative;
  width:100%;
  aspect-ratio:16/11;
  overflow:hidden;
  border-radius:17px;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

#avatar{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  animation:respirar 5s ease-in-out infinite;
}

@keyframes respirar{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.008);
  }
}

.avatar-zona.hablando #avatar{
  animation:hablando 1.3s ease-in-out infinite;
}

@keyframes hablando{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.015);
  }
}

/* EFECTO HABLANDO */

.avatar-zona::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:17px;
  box-shadow:inset 0 0 35px rgba(0,110,255,.22);
}

.avatar-zona.hablando::after{
  box-shadow:inset 0 0 45px rgba(0,255,102,.18);
}

/* CONTROLES */

.controles{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:9px;
}

.controles button{
  border:1px solid #0077ff;
  border-radius:11px;
  background:#050505;
  color:white;
  padding:10px 13px;
  font-weight:bold;
}

.info-voz{
  margin-top:9px;
  padding:9px;
  text-align:center;
  border-radius:10px;
  background:#080808;
  border:1px solid #273d52;
  color:#9eb8d0;
  font-size:12px;
}

/* CHAT */

.chat{
  margin-top:10px;
  min-height:190px;
  max-height:400px;
  overflow-y:auto;
  padding:10px;
  border:2px solid #006eff;
  border-radius:17px;
  background:#050505;
}

.mensaje{
  max-width:88%;
  padding:10px 12px;
  margin:7px 0;
  border-radius:14px;
  font-size:15px;
  line-height:1.4;
  word-wrap:break-word;
}

.mensaje.rafa{
  margin-left:auto;
  background:#123b1f;
  border:1px solid #00ff66;
}

.mensaje.gepeto{
  margin-right:auto;
  background:#071a35;
  border:1px solid #0077ff;
}

/* MUSICA */

.musica{
  margin-top:10px;
  padding:12px;
  text-align:center;
  border:2px solid #006eff;
  border-radius:17px;
  background:#050505;
}

.musica h3{
  margin-top:0;
  color:#00ff66;
  font-size:16px;
}

#selectorMusica,
#reproductorMusica{
  width:100%;
}

#selectorMusica{
  color:white;
  margin-bottom:8px;
}

/* CHAT INFERIOR */

.chat-fijo{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:3000;
  padding:8px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.97);
  border-top:2px solid #006eff;
}

.chat-fila{
  display:flex;
  gap:6px;
  width:100%;
  max-width:900px;
  margin:auto;
  align-items:flex-end;
}

#entrada{
  flex:1;
  min-width:0;
  min-height:45px;
  max-height:100px;
  resize:none;
  padding:11px;
  border-radius:12px;
  border:1px solid #0077ff;
  background:#101010;
  color:white;
  font-size:16px;
}

.chat-fila button{
  min-width:45px;
  height:45px;
  border:none;
  border-radius:12px;
  font-weight:bold;
}

#microfono{
  background:#222;
  color:white;
  font-size:18px;
}

#enviar{
  background:#00ff66;
  color:#000;
  padding:0 14px;
}

/* CARGA */

#pantallaCarga{
  position:fixed;
  inset:0;
  z-index:5000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#020202;
  transition:opacity .5s;
}

.cajaCarga{
  width:90%;
  max-width:420px;
  padding:25px;
  border:2px solid #006eff;
  border-radius:20px;
  background:#080808;
  text-align:center;
  box-shadow:0 0 30px rgba(0,110,255,.5);
}

.cajaCarga h2{
  color:#00ff66;
}

#barra{
  width:100%;
  height:8px;
  margin-top:15px;
  background:#222;
  border-radius:20px;
  overflow:hidden;
}

#barraDentro{
  width:0;
  height:100%;
  background:#00ff66;
  transition:width .2s;
}

@media(max-width:600px){

  .principal{
    padding:7px;
  }

  .titulo{
    font-size:12px;
  }

  .cabecera button{
    font-size:10px;
    padding:8px;
  }

}
</style>
</head>

<body>

<!-- PANTALLA DE CARGA -->

<div id="pantallaCarga">

  <div class="cajaCarga">

    <h2>🤖 GE-PETO</h2>

    <p id="textoCarga">
      Preparando voz masculina...
    </p>

    <div id="barra">
      <div id="barraDentro"></div>
    </div>

  </div>

</div>


<!-- CABECERA -->

<header class="cabecera">

  <button id="biblioteca">
    ← BIBLIOTECA
  </button>

  <div class="titulo">
    VIDEOCONFERENCIA ·
    <span>GE-PETO</span>
  </div>

  <button id="parar">
    🛑 PARAR
  </button>

</header>


<main class="principal">

<!-- PANEL GE-PETO -->

<section class="video-panel">

  <div id="estado" class="estado">
    🔵 Preparando GePeTo...
  </div>

  <div id="avatarZona" class="avatar-zona">

    <img
      id="avatar"
      src="./GePeToFrontal.png"
      alt="GePeTo"
    >

  </div>


  <div class="controles">

    <button id="probarVoz">
      🔊 PROBAR VOZ
    </button>

    <button id="parpadear">
      👁️ PARPADEAR
    </button>

  </div>


  <div id="infoVoz" class="info-voz">
    Preparando voz masculina española...
  </div>

</section>


<!-- CHAT -->

<section id="chat" class="chat">

  <div class="mensaje gepeto">
    Hola Rafa. Soy GePeTo. Estoy preparando mi voz masculina para nuestra videoconferencia.
  </div>

</section>


<!-- MUSICA -->

<section class="musica">

  <h3>
    🎵 MÚSICA DE GE-PETO
  </h3>

  <input
    id="selectorMusica"
    type="file"
    accept="audio/*"
  >

  <audio
    id="reproductorMusica"
    controls>
  </audio>

</section>

</main>


<!-- CAJA DE CHAT -->

<div class="chat-fijo">

  <div class="chat-fila">

    <textarea
      id="entrada"
      rows="1"
      placeholder="Escribe a GePeTo..."
    ></textarea>

    <button id="microfono">
      🎤
    </button>

    <button id="enviar">
      ENVIAR
    </button>

  </div>

</div>


<script type="module">

/*
============================================================
GE-PETO · VIDEOCONFERENCIA
============================================================

Worker:
https://gepetto-rafa.rafadun18.workers.dev/preguntar

IMPORTANTE:
El audio se activa durante la interacción del usuario.
Esto evita que Safari/iPhone bloquee posteriormente
la reproducción de la respuesta.
============================================================
*/


/* ==========================================================
   PIPER TTS
========================================================== */

import * as tts
from "https://cdn.jsdelivr.net/npm/@realtimex/piper-tts-web/+esm";


/* ==========================================================
   CONFIGURACIÓN
========================================================== */

const VOZ = "es_ES-davefx-medium";

const WORKER =
"https://gepetto-rafa.rafadun18.workers.dev/preguntar";


/* ==========================================================
   ELEMENTOS
========================================================== */

const pantallaCarga =
document.getElementById("pantallaCarga");

const textoCarga =
document.getElementById("textoCarga");

const barraDentro =
document.getElementById("barraDentro");

const estado =
document.getElementById("estado");

const infoVoz =
document.getElementById("infoVoz");

const avatarZona =
document.getElementById("avatarZona");

const chat =
document.getElementById("chat");

const entrada =
document.getElementById("entrada");

const enviar =
document.getElementById("enviar");

const microfono =
document.getElementById("microfono");

const parar =
document.getElementById("parar");

const probarVoz =
document.getElementById("probarVoz");

const parpadear =
document.getElementById("parpadear");

const biblioteca =
document.getElementById("biblioteca");

const selectorMusica =
document.getElementById("selectorMusica");

const reproductorMusica =
document.getElementById("reproductorMusica");


/* ==========================================================
   VARIABLES DE AUDIO
========================================================== */

let vozPreparada = false;

let audioContext = null;

let audioSource = null;

let audioBuffer = null;


/* ==========================================================
   IR A BIBLIOTECA
========================================================== */

biblioteca.onclick = () => {

  window.location.href =
  "./biblioteca.html";

};


/* ==========================================================
   ESTADO GE-PETO
========================================================== */

function estadoGePeTo(texto, hablando=false){

  estado.textContent = texto;

  estado.classList.toggle(
    "hablando",
    hablando
  );

  avatarZona.classList.toggle(
    "hablando",
    hablando
  );

}


/* ==========================================================
   ACTIVAR AUDIO
========================================================== */

async function activarAudio(){

  try{

    if(!audioContext){

      const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

      if(!AudioContext){

        throw new Error(
          "AudioContext no disponible"
        );

      }

      audioContext =
      new AudioContext();

    }


    if(
      audioContext.state ===
      "suspended"
    ){

      await audioContext.resume();

    }


  }catch(error){

    console.error(
      "Error activando audio:",
      error
    );

    throw error;

  }

}


/* ==========================================================
   PREPARAR VOZ
========================================================== */

async function prepararVoz(){

  try{

    textoCarga.textContent =
    "Preparando voz masculina española...";


    await tts.download(
      VOZ,
      (progreso) => {

        if(
          progreso &&
          progreso.loaded &&
          progreso.total
        ){

          const porcentaje =
          Math.round(
            progreso.loaded /
            progreso.total *
            100
          );

          barraDentro.style.width =
          porcentaje + "%";

          textoCarga.textContent =
          "Preparando voz masculina: " +
          porcentaje +
          "%";

        }

      }
    );


    vozPreparada = true;

    barraDentro.style.width =
    "100%";

    textoCarga.textContent =
    "✅ Voz preparada";

    infoVoz.innerHTML =
    "🟢 Voz masculina española preparada · <b>" +
    VOZ +
    "</b>";

    estadoGePeTo(
      "🟢 GE-PETO CONECTADO"
    );


    setTimeout(() => {

      pantallaCarga.style.opacity =
      "0";

      setTimeout(() => {

        pantallaCarga.style.display =
        "none";

      },500);

    },700);


  }catch(error){

    console.error(
      "Error preparando Piper:",
      error
    );

    vozPreparada = false;

    textoCarga.textContent =
    "⚠️ Pulsa PROBAR VOZ";

    infoVoz.textContent =
    "Pulsa PROBAR VOZ para activar el motor.";

    pantallaCarga.style.opacity =
    "0";

    setTimeout(() => {

      pantallaCarga.style.display =
      "none";

    },500);

  }

}


/* ==========================================================
   PARPADEO
========================================================== */

function parpadearAhora(){

  avatarZona.style.opacity = "0.92";

  setTimeout(() => {

    avatarZona.style.opacity =
    "1";

  },150);

}


parpadear.onclick =
parpadearAhora;


/* ==========================================================
   PARPADEO AUTOMÁTICO
========================================================== */

function parpadeoAutomatico(){

  parpadearAhora();

  setTimeout(
    parpadeoAutomatico,
    3000 + Math.random() * 4000
  );

}

setTimeout(
  parpadeoAutomatico,
  3000
);


/* ==========================================================
   DETENER AUDIO
========================================================== */

function detenerVoz(){

  if(audioSource){

    try{

      audioSource.stop();

    }catch(error){}

    try{

      audioSource.disconnect();

    }catch(error){}

    audioSource = null;

  }


  avatarZona.classList.remove(
    "hablando"
  );

  estado.classList.remove(
    "hablando"
  );

}


/* ==========================================================
   HABLAR
========================================================== */

async function hablar(texto){

  if(!texto){
    return;
  }


  try{

    /*
    MUY IMPORTANTE:
    activarAudio() se llama antes de generar
    y reproducir el audio.
    */

    await activarAudio();


    if(!vozPreparada){

      infoVoz.textContent =
      "⏳ Activando voz...";

      await tts.download(
        VOZ
      );

      vozPreparada = true;

    }


    detenerVoz();


    estadoGePeTo(
      "🟢 GE-PETO HABLANDO",
      true
    );

    infoVoz.textContent =
    "🔊 GePeTo está hablando...";


    /*
    GENERAR AUDIO
    */

    const wav =
    await tts.predict({

      text: texto,

      voiceId: VOZ

    });


    /*
    Convertimos el WAV a ArrayBuffer.
    */

    const datos =
    await wav.arrayBuffer();


    /*
    Decodificamos con AudioContext.
    */

    await activarAudio();

    audioBuffer =
    await audioContext.decodeAudioData(
      datos.slice(0)
    );


    /*
    Creamos el reproductor.
    */

    audioSource =
    audioContext.createBufferSource();


    audioSource.buffer =
    audioBuffer;


    audioSource.connect(
      audioContext.destination
    );


    /*
    Cuando termina vuelve al estado normal.
    */

    audioSource.onended = () => {

      audioSource = null;

      estadoGePeTo(
        "🟢 GE-PETO CONECTADO"
      );

      infoVoz.innerHTML =
      "🟢 Voz masculina española preparada · <b>" +
      VOZ +
      "</b>";

    };


    /*
    REPRODUCCIÓN
    */

    audioSource.start(0);


  }catch(error){

    console.error(
      "ERROR DE VOZ:",
      error
    );

    detenerVoz();

    estadoGePeTo(
      "⚠️ Error reproduciendo voz"
    );

    infoVoz.textContent =
    "❌ " +
    (
      error.message ||
      "El navegador bloqueó el audio."
    );

  }

}


/* ==========================================================
   BOTÓN PROBAR VOZ
========================================================== */

probarVoz.onclick =
async () => {

  try{

    /*
    El usuario ha pulsado el botón.
    Este es el momento permitido por Safari
    para activar el AudioContext.
    */

    await activarAudio();


    await hablar(
      "Hola Rafa. Soy GePeTo. Esta es mi voz masculina en español. Ahora estamos conectados en nuestra videoconferencia."
    );


  }catch(error){

    console.error(error);

    infoVoz.textContent =
    "❌ Pulsa PROBAR VOZ otra vez para activar el audio.";

  }

};


/* ==========================================================
   BOTÓN PARAR
========================================================== */

parar.onclick = () => {

  detenerVoz();

  estadoGePeTo(
    "🔵 GePeTo en espera"
  );

  infoVoz.textContent =
  "Voz detenida.";

};


/* ==========================================================
   AÑADIR MENSAJE
========================================================== */

function añadirMensaje(
  texto,
  tipo
){

  const elemento =
  document.createElement("div");

  elemento.className =
  "mensaje " + tipo;

  elemento.textContent =
  texto;

  chat.appendChild(
    elemento
  );

  chat.scrollTop =
  chat.scrollHeight;

}


/* ==========================================================
   EXTRAER RESPUESTA DEL WORKER
========================================================== */

function extraerRespuesta(datos){

  if(!datos){
    return "";
  }


  if(
    typeof datos ===
    "string"
  ){

    return datos.trim();

  }


  const claves = [

    "respuesta",
    "response",
    "texto",
    "text",
    "answer",
    "content",
    "message"

  ];


  for(
    const clave of claves
  ){

    if(
      typeof datos[clave] ===
      "string" &&
      datos[clave].trim()
    ){

      return datos[clave].trim();

    }

  }


  /*
  Búsqueda adicional por si el Worker
  devuelve el texto dentro de otro objeto.
  */

  function buscar(
    objeto,
    nivel=0
  ){

    if(
      nivel > 6 ||
      !objeto ||
      typeof objeto !==
      "object"
    ){

      return "";

    }


    for(
      const clave of
      Object.keys(objeto)
    ){

      const valor =
      objeto[clave];


      if(
        typeof valor ===
        "string" &&
        valor.trim()
      ){

        const nombre =
        clave.toLowerCase();


        if(
          nombre.includes("text") ||
          nombre.includes("response") ||
          nombre.includes("respuesta") ||
          nombre.includes("content") ||
          nombre.includes("answer")
        ){

          return valor.trim();

        }

      }


      if(
        valor &&
        typeof valor ===
        "object"
      ){

        const resultado =
        buscar(
          valor,
          nivel + 1
        );

        if(resultado){
          return resultado;
        }

      }

    }


    return "";

  }


  return buscar(datos);

}


/* ==========================================================
   ENVIAR MENSAJE A GE-PETO
========================================================== */

async function enviarMensaje(){

  const texto =
  entrada.value.trim();


  if(!texto){
    return;
  }


  añadirMensaje(
    texto,
    "rafa"
  );


  entrada.value = "";


  estadoGePeTo(
    "🔵 GePeTo está pensando..."
  );


  enviar.disabled =
  true;


  /*
  ACTIVAMOS EL AUDIO EN EL CLICK DEL USUARIO
  ANTES DEL FETCH.

  Esto es especialmente importante en iPhone/Safari.
  */

  try{

    await activarAudio();

  }catch(error){

    console.warn(
      "Audio todavía no activado:",
      error
    );

  }


  try{

    const respuesta =
    await fetch(
      WORKER,
      {

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          mensaje:texto,

          texto:texto,

          pregunta:texto

        })

      }
    );


    if(!respuesta.ok){

      throw new Error(
        "HTTP " +
        respuesta.status
      );

    }


    const datos =
    await respuesta.json();


    console.log(
      "Respuesta GePeTo:",
      datos
    );


    const respuestaTexto =
    extraerRespuesta(
      datos
    );


    if(respuestaTexto){

      /*
      MOSTRAMOS LA RESPUESTA.
      */

      añadirMensaje(
        respuestaTexto,
        "gepeto"
      );


      /*
      Y LA HACEMOS HABLAR.
      */

      await hablar(
        respuestaTexto
      );


    }else{

      añadirMensaje(
        "GePeTo respondió, pero no recibí texto.",
        "gepeto"
      );

      estadoGePeTo(
        "⚠️ Respuesta sin texto"
      );

    }


  }catch(error){

    console.error(
      "Error GePeTo:",
      error
    );


    añadirMensaje(
      "No puedo conectar ahora mismo con GePeTo.",
      "gepeto"
    );


    estadoGePeTo(
      "❌ Error de conexión"
    );

  }finally{

    enviar.disabled =
    false;

    entrada.focus();

  }

}


/* ==========================================================
   BOTÓN ENVIAR
========================================================== */

enviar.onclick =
enviarMensaje;


/* ==========================================================
   ENTER PARA ENVIAR
========================================================== */

entrada.addEventListener(
  "keydown",
  (evento) => {

    if(
      evento.key ===
      "Enter" &&
      !evento.shiftKey
    ){

      evento.preventDefault();

      enviarMensaje();

    }

  }
);


/* ==========================================================
   RECONOCIMIENTO DE VOZ
========================================================== */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


let reconocimiento = null;


if(SpeechRecognition){

  reconocimiento =
  new SpeechRecognition();


  reconocimiento.lang =
  "es-ES";


  reconocimiento.continuous =
  false;


  reconocimiento.interimResults =
  false;


  reconocimiento.onstart =
  () => {

    microfono.textContent =
    "🔴";

    estadoGePeTo(
      "🎤 Escuchando..."
    );

  };


  reconocimiento.onresult =
  (evento) => {

    const resultado =
    evento.results[0][0].transcript;


    entrada.value =
    resultado;


    enviarMensaje();

  };


  reconocimiento.onerror =
  (error) => {

    console.log(
      "Error micrófono:",
      error
    );

    microfono.textContent =
    "🎤";

  };


  reconocimiento.onend =
  () => {

    microfono.textContent =
    "🎤";

  };


  microfono.onclick =
  () => {

    try{

      reconocimiento.start();

    }catch(error){

      console.log(error);

    }

  };


}else{

  microfono.onclick =
  () => {

    alert(
      "El reconocimiento de voz no está disponible en este navegador."
    );

  };

}


/* ==========================================================
   MUSICA
========================================================== */

selectorMusica.onchange =
() => {

  const archivo =
  selectorMusica.files[0];


  if(!archivo){
    return;
  }


  const url =
  URL.createObjectURL(
    archivo
  );


  reproductorMusica.src =
  url;


  reproductorMusica.play()
  .catch(() => {});

};


/* ==========================================================
   AYUDA PARA SAFARI / IPHONE
========================================================== */

document.addEventListener(
  "pointerdown",
  () => {

    if(
      audioContext &&
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume()
      .catch(() => {});

    }

  },
  {
    passive:true
  }
);


/* ==========================================================
   ARRANQUE
========================================================== */

prepararVoz();

</script>
