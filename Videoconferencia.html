<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,

             user-scalable=no"

<title>Videoconferencia · GePeTo</title>

<style>

/* ============================================================
   PROYECTO RAFA
   VIDEOCONFERENCIA GE-PETO
   ============================================================ */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #030303;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
    padding-bottom: 105px;
}

/* ============================================================
   CABECERA
   ============================================================ */

.cabecera {
    position: sticky;
    top: 0;
    z-index: 1000;

    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px 12px;

    background:
        linear-gradient(
            90deg,
            #001bff,
            #030303 50%,
            #001bff
        );

    border-bottom: 2px solid #004cff;

    box-shadow:
        0 0 15px #004cff;
}

.cabecera button {
    border: 1px solid #ffffff;
    border-radius: 12px;

    padding: 10px 12px;

    background: #080808;
    color: white;

    font-size: 13px;
    font-weight: bold;
}

.titulo {
    text-align: center;
    flex: 1;
    font-size: 17px;
    font-weight: bold;
}

.titulo span {
    color: #009dff;
}

/* ============================================================
   CONTENEDOR
   ============================================================ */

.principal {
    width: 100%;
    max-width: 900px;

    margin: auto;
    padding: 12px;
}

/* ============================================================
   PANEL DE VIDEO
   ============================================================ */

.video-panel {

    width: 100%;

    background:
        radial-gradient(
            circle at center,
            #102030 0%,
            #05080c 45%,
            #000000 100%
        );

    border: 2px solid #006eff;
    border-radius: 22px;

    box-shadow:
        0 0 25px rgba(0,110,255,0.55);

    padding: 10px;

    overflow: hidden;
}

/* ============================================================
   ESTADO
   ============================================================ */

.estado {
    width: 100%;

    margin-bottom: 8px;

    padding: 8px;

    text-align: center;

    border-radius: 10px;

    background: #080808;
    border: 1px solid #164b80;

    font-size: 13px;

    color: #7dbdff;
}

.estado.hablando {
    color: #00ff66;

    border-color: #00ff66;

    box-shadow:
        0 0 12px rgba(0,255,102,0.4);
}

/* ============================================================
   AVATAR
   ============================================================ */

.avatar-zona {

    position: relative;

    width: 100%;

    max-width: 700px;

    margin: auto;

    overflow: hidden;

    border-radius: 18px;

    background: #000;

    aspect-ratio: 16 / 11;

    display: flex;
    align-items: center;
    justify-content: center;
}

#avatar {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    transform-origin: center center;

    animation:
        respirar 5s ease-in-out infinite;
}

/* ============================================================
   MOVIMIENTO GENERAL
   ============================================================ */

@keyframes respirar {

    0% {
        transform:
            scale(1)
            translateY(0);
    }

    50% {
        transform:
            scale(1.008)
            translateY(-1px);
    }

    100% {
        transform:
            scale(1)
            translateY(0);
    }
}

/* ============================================================
   CUANDO GE-PETO HABLA
   ============================================================ */

.avatar-zona.hablando #avatar {

    animation:
        hablarCabeza 1.8s ease-in-out infinite;
}

@keyframes hablarCabeza {

    0% {
        transform:
            scale(1)
            translateY(0)
            rotate(0deg);
    }

    25% {
        transform:
            scale(1.012)
            translateY(-1px)
            rotate(-0.25deg);
    }

    50% {
        transform:
            scale(1.018)
            translateY(0)
            rotate(0.25deg);
    }

    75% {
        transform:
            scale(1.012)
            translateY(1px)
            rotate(-0.15deg);
    }

    100% {
        transform:
            scale(1)
            translateY(0)
            rotate(0deg);
    }
}

/* ============================================================
   LUZ DE VIDEO
   ============================================================ */

.avatar-zona::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    border-radius: 18px;

    box-shadow:
        inset 0 0 35px rgba(0,110,255,0.25);

    transition: 0.3s;
}

.avatar-zona.hablando::after {

    box-shadow:
        inset 0 0 45px rgba(0,255,102,0.20),
        0 0 20px rgba(0,255,102,0.15);
}

/* ============================================================
   CARA ANIMADA
   ============================================================ */

.cara {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 5;

    transition: opacity 0.2s;
}

/* ============================================================
   OJOS
   ============================================================ */

.ojo {

    position: absolute;

    width: 5.5%;
    height: 3.8%;

    min-width: 16px;
    min-height: 9px;

    background: rgba(0,0,0,0);

    border-radius: 50%;

    overflow: hidden;

    transform-origin: center;

    opacity: 0;
}

/*
   Posiciones aproximadas.
   Se hacen invisibles si la fotografía
   no coincide exactamente con estos puntos.
*/

.ojo.izquierdo {
    left: 38%;
    top: 38%;
}

.ojo.derecho {
    left: 56%;
    top: 38%;
}

/* ============================================================
   PARPADEO
   ============================================================ */

.parpadeando .ojo {

    animation:
        parpadeo 0.18s ease-in-out;
}

@keyframes parpadeo {

    0% {
        transform: scaleY(1);
    }

    45% {
        transform: scaleY(0.05);
    }

    100% {
        transform: scaleY(1);
    }
}

/* ============================================================
   CEJAS
   ============================================================ */

.ceja {

    position: absolute;

    width: 8%;
    height: 1.2%;

    min-height: 4px;

    background: rgba(20,20,20,0);

    border-radius: 100%;

    transform-origin: center;

    opacity: 0;
}

.ceja.izquierda {

    left: 36.5%;
    top: 33%;
}

.ceja.derecha {

    left: 55%;
    top: 33%;
}

.avatar-zona.hablando .ceja {

    animation:
        cejasHablar 1.2s ease-in-out infinite;
}

@keyframes cejasHablar {

    0% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-1px)
            rotate(-1deg);
    }

    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }
}

/* ============================================================
   BOCA
   ============================================================ */

.boca {

    position: absolute;

    left: 42.5%;
    top: 56%;

    width: 15%;
    height: 5%;

    min-width: 35px;
    min-height: 12px;

    opacity: 0;
}

/*
   No se pinta sobre la fotografía por defecto.
   Se usa principalmente como señal de animación.
*/

.boca::before {

    content: "";

    position: absolute;

    left: 15%;
    top: 35%;

    width: 70%;
    height: 30%;

    background: rgba(255,0,80,0);

    border-radius: 50%;

    transform-origin: center;
}

.avatar-zona.hablando .boca {

    opacity: 1;
}

.avatar-zona.hablando .boca::before {

    animation:
        bocaHablar 0.24s ease-in-out infinite alternate;
}

@keyframes bocaHablar {

    0% {
        transform:
            scaleX(0.75)
            scaleY(0.35);
    }

    35% {
        transform:
            scaleX(1)
            scaleY(0.85);
    }

    70% {
        transform:
            scaleX(0.85)
            scaleY(0.45);
    }

    100% {
        transform:
            scaleX(1.05)
            scaleY(1);
    }
}

/* ============================================================
   CONTROLES
   ============================================================ */

.controles {

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 10px;
}

.controles button {

    border: 1px solid #0077ff;

    border-radius: 12px;

    background: #050505;

    color: white;

    padding: 10px 14px;

    font-size: 13px;
    font-weight: bold;
}

.controles button:active {

    transform: scale(0.96);
}

/* ============================================================
   CHAT
   ============================================================ */

.chat {

    margin-top: 12px;

    padding: 10px;

    background: #050505;

    border: 2px solid #006eff;

    border-radius: 18px;

    min-height: 200px;

    max-height: 420px;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;
}

.mensaje {

    width: fit-content;

    max-width: 88%;

    padding: 10px 12px;

    margin: 7px 0;

    border-radius: 14px;

    line-height: 1.4;

    font-size: 15px;

}

.mensaje.rafa {

    color: white;
}

.mensaje.gepeto {

    margin-right: auto;

    background: #071a35;

    border: 1px solid #0077ff;

    color: white;
}

/* ============================================================
   INFORMACIÓN DE VOZ
   ============================================================ */

.info-voz {

    margin-top: 10px;

    padding: 10px;

    border-radius: 12px;

    background: #0b0b0b;

    border: 1px solid #26384c;

    text-align: center;

    font-size: 12px;

    color: #9eb8d0;
}

/* ============================================================
   MÚSICA
   ============================================================ */

.musica {

    margin-top: 12px;

    padding: 12px;

    border: 2px solid #006eff;

    border-radius: 18px;

    background: #050505;

    text-align: center;
}

.musica h3 {

    margin-top: 0;

    color: #00ff66;

    font-size: 16px;
}

#selectorMusica {

    width: 100%;

    margin: 8px 0;

    color: white;
}

#reproductorMusica {

    width: 100%;
}

/* ============================================================
   CHAT FIJO INFERIOR
   ============================================================ */

.chat-fijo {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 2000;

    padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));

    background:
        rgba(0,0,0,0.96);

    border-top: 2px solid #006eff;

    box-shadow:
        0 -5px 20px rgba(0,0,0,0.8);
}

.chat-fila {

    width: 100%;

    max-width: 900px;

    margin: auto;

    display: flex;

    align-items: flex-end;

    gap: 6px;
}

#entrada {

    flex: 1;

    min-width: 0;

    min-height: 45px;
    max-height: 100px;

    resize: none;

    border-radius: 12px;

    border: 1px solid #0077ff;

    background: #101010;

    color: white;

    padding: 11px;

    font-size: 16px;

    outline: none;
}

#entrada:focus {

    border-color: #00ff66;

    box-shadow:
        0 0 8px rgba(0,255,102,0.3);
}

.chat-fila button {

    height: 45px;

    min-width: 45px;

    border: none;

    border-radius: 12px;

    font-size: 18px;

    font-weight: bold;
}

#microfono {

    background: #222;
    color: white;
}

#enviar {

    background: #00ff66;
    color: black;

    padding: 0 15px;
}

/* ============================================================
   CARGANDO
   ============================================================ */

.cargando-pantalla {

    position: fixed;

    inset: 0;

    z-index: 5000;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #020202;

    transition: opacity 0.5s;
}

.cargando-caja {

    width: 90%;
    max-width: 400px;

    padding: 25px;

    border: 2px solid #006eff;

    border-radius: 20px;

    background: #080808;

    text-align: center;

    box-shadow:
        0 0 30px rgba(0,110,255,0.4);
}

.cargando-caja h2 {

    color: #00ff66;
}

.barra {

    width: 100%;

    height: 8px;

    margin-top: 15px;

    background: #222;

    border-radius: 20px;

    overflow: hidden;
}

.barra-interior {

    width: 0%;

    height: 100%;

    background: #00ff66;

    transition: width 0.2s;
}

/* ============================================================
   MÓVIL
   ============================================================ */

@media (max-width: 600px) {

    .principal {
        padding: 8px;
    }

    .video-panel {
        padding: 7px;
    }

    .cabecera {
        padding: 8px;
    }

    .titulo {
        font-size: 14px;
    }

    .cabecera button {
        font-size: 11px;
        padding: 8px;
    }

    .chat {
        min-height: 170px;
    }
}

</style>
</head>

<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->

<script type="module">

/* ============================================================
   PIPER TTS
   ============================================================ */

import * as tts from
"https://cdn.jsdelivr.net/npm/@realtimex/piper-tts-web/+esm";


/* ============================================================
   CONFIGURACIÓN
   ============================================================ */

const VOZ = "es_ES-davefx-medium";

const WORKER =
"https://gepetto-rafa.rafadun18.workers.dev/preguntar";


/* ============================================================
   ELEMENTOS
   ============================================================ */

const pantallaCarga =
document.getElementById("pantallaCarga");

const textoCarga =
document.getElementById("textoCarga");

const barraCarga =
document.getElementById("barraCarga");

const estado =
document.getElementById("estado");

const infoVoz =
document.getElementById("infoVoz");

const avatarZona =
document.getElementById("avatarZona");

const avatar =
document.getElementById("avatar");

const cara =
document.getElementById("cara");

const chat =
document.getElementById("chat");

const entrada =
document.getElementById("entrada");

const enviar =
document.getElementById("enviar");

const microfono =
document.getElementById("microfono");

const parar =
document.getElementById("parar");

const biblioteca =
document.getElementById("biblioteca");

const probarVoz =
document.getElementById("probarVoz");

const parpadear =
document.getElementById("parpadear");

const selectorMusica =
document.getElementById("selectorMusica");

const reproductorMusica =
document.getElementById("reproductorMusica");


/* ============================================================
   VARIABLES
   ============================================================ */

let motorPreparado = false;

let hablando = false;

let reconocimiento = null;

let urlAudioActual = null;


/* ============================================================
   BIBLIOTECA
   ============================================================ */

biblioteca.addEventListener(
    "click",
    () => {

        window.location.href =
        "./biblioteca.html";

    }
);


/* ============================================================
   ESTADO
   ============================================================ */

function cambiarEstado(
    texto,
    hablandoEstado = false
) {

    estado.textContent = texto;

    if (hablandoEstado) {

        estado.classList.add(
            "hablando"
        );

        avatarZona.classList.add(
            "hablando"
        );

    } else {

        estado.classList.remove(
            "hablando"
        );

        avatarZona.classList.remove(
            "hablando"
        );

    }

}


/* ============================================================
   CARGAR PIPER AUTOMÁTICAMENTE
   ============================================================ */

async function prepararVoz() {

    try {

        textoCarga.textContent =
        "Preparando voz masculina española...";

        barraCarga.style.width =
        "20%";


        infoVoz.textContent =
        "⏳ Descargando/preparando voz masculina de GePeTo...";


        cambiarEstado(
            "🟡 Preparando voz de GePeTo..."
        );


        await tts.download(
            VOZ,
            (progreso) => {

                try {

                    if (
                        progreso &&
                        progreso.loaded &&
                        progreso.total
                    ) {

                        const porcentaje =
                        Math.round(
                            progreso.loaded /
                            progreso.total *
                            100
                        );

                        barraCarga.style.width =
                        Math.max(
                            20,
                            porcentaje
                        ) + "%";

                        textoCarga.textContent =
                        "Preparando voz masculina: " +
                        porcentaje +
                        "%";

                    }

                } catch (e) {

                    console.log(
                        "Progreso:",
                        e
                    );

                }

            }
        );


        motorPreparado = true;


        barraCarga.style.width =
        "100%";


        textoCarga.textContent =
        "✅ GePeTo está preparado.";


        infoVoz.innerHTML =
        "🟢 Voz activa: " +
        "<b>es_ES-davefx-medium</b>" +
        " · masculina · español de España";


        cambiarEstado(
            "🟢 GE-PETO CONECTADO"
        );


        /*
         Ocultamos la pantalla
         */

        setTimeout(
            () => {

                pantallaCarga.style.opacity =
                "0";

                setTimeout(
                    () => {

                        pantallaCarga.style.display =
                        "none";

                    },
                    500
                );

            },
            500
        );

    }

    catch (error) {

        console.error(
            "Error Piper:",
            error
        );


        infoVoz.textContent =
        "❌ No se pudo preparar la voz.";


        textoCarga.textContent =
        "❌ Error preparando la voz.";


        estado.textContent =
        "⚠️ Error con la voz";


        pantallaCarga.style.opacity =
        "0";


        setTimeout(
            () => {

                pantallaCarga.style.display =
                "none";

            },
            500
        );

    }

}


/* ============================================================
   PARPADEO
   ============================================================ */

function hacerParpadeo() {

    cara.classList.remove(
        "parpadeando"
    );

    void cara.offsetWidth;

    cara.classList.add(
        "parpadeando"
    );

}


parpadear.addEventListener(
    "click",
    hacerParpadeo
);


/* ============================================================
   PARPADEO AUTOMÁTICO
   ============================================================ */

function parpadeoAutomatico() {

    hacerParpadeo();

    const siguiente =
    2500 +
    Math.random() * 4500;

    setTimeout(
        parpadeoAutomatico,
        siguiente
    );

}

setTimeout(
    parpadeoAutomatico,
    2500
);


/* ============================================================
   HABLAR CON PIPER
   ============================================================ */

async function hablar(texto) {

    if (!texto) {
        return;
    }


    /*
     Si todavía no terminó
     de cargar, esperamos.
    */

    if (!motorPreparado) {

        cambiarEstado(
            "🟡 Esperando a que cargue la voz..."
        );

        return;

    }


    try {

        hablando = true;


        cambiarEstado(
            "🟢 GE-PETO HABLANDO",
            true
        );


        /*
         Generamos el audio
         */

        const wav =
        await tts.predict({

            text: texto,

            voiceId: VOZ

        });


        /*
         Creamos URL
         */

        if (urlAudioActual) {

            URL.revokeObjectURL(
                urlAudioActual
            );

        }


        urlAudioActual =
        URL.createObjectURL(
            wav
        );


        /*
         Creamos reproductor
         */

        const audio =
        new Audio(
            urlAudioActual
        );


        audio.volume = 1;


        /*
         Intentamos comenzar.
         */

        await audio.play();


        /*
         Cuando termina
         */

        audio.onended = () => {

            hablando = false;

            cambiarEstado(
                "🟢 GE-PETO CONECTADO"
            );

        };


        /*
         Si hay error de reproducción
         */

        audio.onerror = () => {

            hablando = false;

            cambiarEstado(
                "🟢 GE-PETO PREPARADO"
            );

        };


    }

    catch (error) {

        console.error(
            "Error hablando:",
            error
        );


        hablando = false;


        cambiarEstado(
            "⚠️ No se pudo reproducir la voz"
        );

    }

}

/* ============================================================
   AÑADIR MENSAJE
   ============================================================ */

function añadirMensaje(
    texto,
    tipo
) {

    const div =
    document.createElement(
        "div"
    );


    div.className =
    "mensaje " +
    tipo;


    div.textContent =
    texto;


    chat.appendChild(
        div
    );


    chat.scrollTop =
    chat.scrollHeight;

}


/* ============================================================
   EXTRAER TEXTO DEL WORKER
   ============================================================ */

function extraerRespuesta(
    datos
) {

    if (!datos) {
        return "";
    }


    if (
        typeof datos ===
        "string"
    ) {

        return datos;

    }


    const posibles = [

        datos.respuesta,

        datos.response,

        datos.texto,

        datos.text,

        datos.answer,

        datos.content,

        datos.message,

        datos.result?.response,

        datos.result?.respuesta,

        datos.result?.text,

        datos.result?.content,

        datos.data?.response,

        datos.data?.respuesta,

        datos.data?.text,

        datos.data?.content

    ];


    for (
        const valor of posibles
    ) {

        if (
            typeof valor ===
            "string" &&
            valor.trim()
        ) {

            return valor.trim();

        }

    }


    /*
     Búsqueda recursiva
     */

    function buscar(
        objeto,
        profundidad = 0
    ) {

        if (
            profundidad > 5 ||
            !objeto ||
            typeof objeto !==
            "object"
        ) {

            return "";

        }


        for (
            const clave
            of Object.keys(objeto)
        ) {

            const valor =
            objeto[clave];


            if (
                typeof valor ===
                "string" &&
                valor.trim() &&
                (
                    clave
                    .toLowerCase()
                    .includes("text")
                    ||
                    clave
                    .toLowerCase()
                    .includes("response")
                    ||
                    clave
                    .toLowerCase()
                    .includes("respuesta")
                    ||
                    clave
                    .toLowerCase()
                    .includes("content")
                    ||
                    clave
                    .toLowerCase()
                    .includes("answer")
                )
            ) {

                return valor.trim();

            }


            if (
                valor &&
                typeof valor ===
                "object"
            ) {

                const encontrado =
                buscar(
                    valor,
                    profundidad + 1
                );


                if (encontrado) {
                    return encontrado;
                }

            }

        }


        return "";

    }


    return buscar(
        datos
    );

}


/* ============================================================
   ENVIAR A GE-PETO
   ============================================================ */

async function enviarMensaje() {

    const texto =
    entrada.value.trim();


    if (!texto) {
        return;
    }


    /*
     Mostramos mensaje de Rafa
     */

    añadirMensaje(
        texto,
        "rafa"
    );


    entrada.value = "";


    cambiarEstado(
        "🔵 GePeTo está pensando..."
    );


    enviar.disabled = true;


    try {

        /*
         IMPORTANTE:
         El primer toque del usuario
         también permite a Safari
         reproducir audio posteriormente.
        */


        const respuesta =
        await fetch(
            WORKER,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                    mensaje: texto,

                    texto: texto,

                    pregunta: texto

                })
            }
        );


        const datos =
        await respuesta.json();


        console.log(
            "Respuesta GePeTo:",
            datos
        );


        const respuestaTexto =
        extraerRespuesta(
            datos
        );


        if (
            respuestaTexto
        ) {

            añadirMensaje(
                respuestaTexto,
                "gepeto"
            );


            /*
             GePeTo responde
             con su voz masculina
             */

            await hablar(
                respuestaTexto
            );

        }

        else {

            añadirMensaje(
                "He recibido tu mensaje, pero no he podido obtener el texto de mi respuesta.",
                "gepeto"
            );


            cambiarEstado(
                "⚠️ GePeTo respondió sin texto"
            );

        }

    }

    catch (error) {

        console.error(
            "Error Worker:",
            error
        );


        añadirMensaje(
            "No puedo conectar ahora mismo con GePeTo. Revisa la conexión.",
            "gepeto"
        );


        cambiarEstado(
            "❌ Error de conexión"
        );

    }

    finally {

        enviar.disabled =
        false;

        entrada.focus();

    }

}


/* ============================================================
   BOTÓN ENVIAR
   ============================================================ */

enviar.addEventListener(
    "click",
    enviarMensaje
);


/* ============================================================
   ENTER
   ============================================================ */

entrada.addEventListener(
    "keydown",
    (evento) => {

        if (
            evento.key ===
            "Enter" &&
            !evento.shiftKey
        ) {

            evento.preventDefault();

            enviarMensaje();

        }

    }
);


/* ============================================================
   MICRÓFONO
   ============================================================ */

function prepararMicrofono() {

    const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        microfono.addEventListener(
            "click",
            () => {

                alert(
                    "El reconocimiento de voz no está disponible en este navegador."
                );

            }
        );

        return;

    }


    reconocimiento =
    new SpeechRecognition();


    reconocimiento.lang =
    "es-ES";


    reconocimiento.continuous =
    false;


    reconocimiento.interimResults =
    false;


    reconocimiento.onstart =
    () => {

        microfono.textContent =
        "🔴";

        cambiarEstado(
            "🎤 Escuchando..."
        );

    };


    reconocimiento.onresult =
    (evento) => {

        const resultado =
        evento
        .results[0][0]
        .transcript;


        entrada.value =
        resultado;


        enviarMensaje();

    };


    reconocimiento.onerror =
    (error) => {

        console.error(
            "Micrófono:",
            error
        );

        microfono.textContent =
        "🎤";

        cambiarEstado(
            "🟢 GE-PETO CONECTADO"
        );

    };


    reconocimiento.onend =
    () => {

        microfono.textContent =
        "🎤";

    };


    microfono.addEventListener(
        "click",
        () => {

            try {

                reconocimiento.start();

            }

            catch (error) {

                console.log(
                    error
                );

            }

        }
    );

}


prepararMicrofono();
