<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Videoconferencia · GePeTo</title><style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #020609;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  padding-bottom: 115px;
}

/* ============================================================
   CABECERA
   ============================================================ */

header {
  position: sticky;
  top: 0;
  z-index: 50;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 8px;

  padding: 10px;

  background: #05080b;
  border-bottom: 1px solid #12344b;
}

header a,
header button {
  background: #0b1116;
  color: white;

  border: 1px solid #24516e;
  border-radius: 10px;

  padding: 9px 11px;

  text-decoration: none;

  font-size: 13px;
}

header h1 {
  margin: 0;

  font-size: 17px;

  color: #66cfff;
}

/* ============================================================
   CONTENIDO
   ============================================================ */

main {
  width: 100%;
  max-width: 760px;

  margin: auto;

  padding: 12px;
}

/* ============================================================
   ZONA DE GE-PETO
   ============================================================ */

.video-panel {
  position: relative;

  background:
    radial-gradient(
      circle at center,
      #092237 0%,
      #04101a 42%,
      #020609 78%
    );

  border: 1px solid #14527a;

  border-radius: 18px;

  padding: 15px;

  margin-bottom: 12px;

  overflow: hidden;
}

.video-titulo {
  text-align: center;

  color: #66cfff;

  font-size: 16px;

  margin-bottom: 8px;
}

.video-subtitulo {
  text-align: center;

  font-size: 12px;

  opacity: .65;

  margin-bottom: 10px;
}

/* ============================================================
   AVATAR
   ============================================================ */

.avatar-zona {
  position: relative;

  width: min(100%, 420px);

  aspect-ratio: 1 / 1;

  margin: auto;

  display: flex;

  align-items: center;

  justify-content: center;
}

.avatar {
  width: 92%;
  height: 92%;

  object-fit: cover;

  border-radius: 50%;

  border: 3px solid #008cff;

  box-shadow:
    0 0 15px #008cff,
    0 0 35px rgba(0,140,255,.5);

  transition:
    transform .25s ease,
    box-shadow .25s ease;

  user-select: none;
}

/* Cuando GePeTo habla */

.avatar.hablando {
  animation:
    respiracion .9s ease-in-out infinite alternate;

  box-shadow:
    0 0 18px #008cff,
    0 0 42px rgba(0,140,255,.75),
    0 0 75px rgba(0,140,255,.35);
}

/*
 * Esta animación hace un pequeño movimiento
 * de la imagen mientras habla.
 */

@keyframes respiracion {
  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.018);
  }
}

/* ============================================================
   BOCA ANIMADA
   ============================================================ */

/*
 * La boca animada se coloca como una pequeña capa
 * sobre la cara.

 * Como la fotografía puede tener la boca en una posición
 * diferente, dejamos el ajuste mediante estas variables.
 */

.boca {
  position: absolute;

  left: 50%;
  top: 66%;

  transform:
    translate(-50%, -50%)
    scaleY(.15);

  width: 13%;
  height: 4%;

  min-width: 28px;

  border-radius: 50%;

  background: #020202;

  border: 2px solid rgba(255,255,255,.25);

  opacity: 0;

  transition:
    transform .08s ease,
    opacity .15s ease;
}

.avatar-zona.hablando .boca {
  opacity: .9;

  animation:
    moverBoca .16s infinite alternate;
}

@keyframes moverBoca {
  0% {
    transform:
      translate(-50%, -50%)
      scaleY(.15);
  }

  50% {
    transform:
      translate(-50%, -50%)
      scaleY(.75);
  }

  100% {
    transform:
      translate(-50%, -50%)
      scaleY(.35);
  }
}

/* ============================================================
   ESTADO
   ============================================================ */

.estado {
  text-align: center;

  margin-top: 7px;

  color: #00ff66;

  font-size: 13px;
}

/* ============================================================
   CONTROLES DE VOZ
   ============================================================ */

.controles {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 8px;

  margin-top: 12px;
}

.controles button {
  padding: 11px;

  border-radius: 11px;

  background: #0b1116;

  color: white;

  border: 1px solid #24516e;

  font-size: 14px;
}

.controles button:active {
  transform: scale(.97);
}

#pararVoz {
  border-color: #8c3030;
}

/* ============================================================
   CHAT
   ============================================================ */

#chat {
  height: 330px;

  overflow-y: auto;

  padding: 10px;

  background: #010304;

  border: 1px solid #17364a;

  border-radius: 15px;
}

.mensaje {
  margin: 9px 0;

  padding: 10px 12px;

  border-radius: 13px;

  line-height: 1.45;

  white-space: pre-wrap;

  word-wrap: break-word;
}

.usuario {
  background: #12351f;

  border: 1px solid #00ff66;

  margin-left: 10%;
}

.gepeto {
  background: #071d2c;

  border: 1px solid #008cff;

  margin-right: 10%;
}

.etiqueta {
  font-size: 11px;

  opacity: .65;

  margin-bottom: 4px;
}

/* ============================================================
   MÚSICA
   ============================================================ */

.reproductor {
  background: #070b0e;

  border: 1px solid #17364a;

  border-radius: 15px;

  padding: 12px;

  margin-top: 12px;
}

.reproductor-titulo {
  color: #66cfff;

  font-size: 16px;

  margin-bottom: 9px;
}

audio {
  width: 100%;
}

.subir-musica {
  display: block;

  width: 100%;

  margin-top: 10px;

  padding: 12px;

  text-align: center;

  background: #0c1217;

  color: white;

  border: 1px solid #00ff66;

  border-radius: 11px;
}

#listaCanciones {
  margin-top: 10px;
}

.cancion {
  display: flex;

  align-items: center;

  gap: 8px;

  padding: 8px;

  margin-top: 6px;

  background: #101010;

  border: 1px solid #222;

  border-radius: 9px;
}

.cancion button {
  background: #151515;

  color: white;

  border: 1px solid #333;

  border-radius: 7px;

  padding: 6px 8px;
}

.nombreCancion {
  flex: 1;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  font-size: 13px;
}

.vacio {
  text-align: center;

  opacity: .55;

  font-size: 12px;

  padding: 7px;
}

/* ============================================================
   CAJA DE CHAT FIJA ABAJO
   ============================================================ */

.chat-fijo {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 100;

  padding: 8px;

  background:
    rgba(3,7,10,.97);

  border-top: 1px solid #24516e;

  box-shadow:
    0 -5px 20px rgba(0,0,0,.55);
}

.chat-fijo-interior {
  width: 100%;

  max-width: 760px;

  margin: auto;

  display: flex;

  gap: 6px;

  align-items: flex-end;
}

#entrada {
  flex: 1;

  min-width: 0;

  min-height: 46px;

  max-height: 110px;

  resize: none;

  padding: 11px;

  border-radius: 11px;

  background: #101010;

  color: white;

  border: 1px solid #333;

  outline: none;

  font-size: 15px;
}

#entrada:focus {
  border-color: #008cff;
}

#microfono,
#enviar {
  height: 46px;

  border-radius: 11px;

  padding: 0 12px;

  color: white;

  border: 1px solid #333;

  background: #151515;

  font-size: 14px;
}

#microfono {
  border-color: #24516e;
}

#enviar {
  background: #063d25;

  border-color: #00ff66;

  font-weight: bold;
}

/* ============================================================
   MÓVIL
   ============================================================ */

@media (max-width: 500px) {

  main {
    padding: 8px;
  }

  .avatar-zona {
    max-width: 330px;
  }

  #chat {
    height: 300px;
  }

  .controles {
    grid-template-columns: 1fr 1fr;
  }

  #microfono {
    padding: 0 10px;
  }

  #enviar {
    padding: 0 10px;
  }
}

  </div></div><script>

/* ============================================================
   CONFIGURACIÓN
   ============================================================ */

const URL_CLOUDFLARE =
  "https://gepetto-rafa.rafadun18.workers.dev";


/* ============================================================
   ELEMENTOS
   ============================================================ */

const chat =
  document.getElementById("chat");

const entrada =
  document.getElementById("entrada");

const enviar =
  document.getElementById("enviar");

const microfono =
  document.getElementById("microfono");

const estado =
  document.getElementById("estado");

const avatar =
  document.getElementById("avatar");

const avatarZona =
  document.getElementById("avatarZona");

const vozBtn =
  document.getElementById("vozBtn");

const probarBtn =
  document.getElementById("probarBtn");

const pararVoz =
  document.getElementById("pararVoz");

const audioPrincipal =
  document.getElementById("audioPrincipal");

const selectorMusica =
  document.getElementById("selectorMusica");

const listaCanciones =
  document.getElementById("listaCanciones");


/* ============================================================
   VOZ
   ============================================================ */

let vozActivada = true;


/* ============================================================
   HABLAR GE-PETO
   ============================================================ */

function hablarGePeTo(texto) {

  if (!vozActivada) {
    return;
  }

  if (
    !("speechSynthesis" in window)
  ) {

    console.log(
      "Este navegador no admite síntesis de voz."
    );

    return;
  }


  window.speechSynthesis.cancel();


  const limpio =
    texto
      .replace(/[*#_`]/g, "")
      .trim();


  if (!limpio) {
    return;
  }


  const utterance =
    new SpeechSynthesisUtterance(
      limpio
    );


  utterance.lang =
    "es-ES";


  utterance.rate =
    0.95;


  utterance.pitch =
    1.0;


  utterance.volume =
    1.0;


  utterance.onstart =
    function() {

      empezarAnimacionHablar();

    };


  utterance.onend =
    function() {

      detenerAnimacionHablar();

    };


  utterance.onerror =
    function() {

      detenerAnimacionHablar();

    };


  window.speechSynthesis.speak(
    utterance
  );
}


/* ============================================================
   ANIMACIÓN FACIAL
   ============================================================ */

let animacionHablar = null;


function empezarAnimacionHablar() {

  avatarZona.classList.add(
    "hablando"
  );

  avatar.classList.add(
    "hablando"
  );


  if (animacionHablar) {
    clearInterval(
      animacionHablar
    );
  }


  animacionHablar =
    setInterval(
      function() {

        /*
         * Cambiamos ligeramente el estado
         * de la boca para que no parezca
         * un movimiento completamente mecánico.
         */

        const escala =
          0.25 +
          Math.random() * 0.75;

        const boca =
          document.getElementById(
            "boca"
          );

        boca.style.transform =
          "translate(-50%, -50%) scaleY(" +
          escala +
          ")";

      },
      120
    );
}


function detenerAnimacionHablar() {

  avatarZona.classList.remove(
    "hablando"
  );

  avatar.classList.remove(
    "hablando"
  );


  if (animacionHablar) {

    clearInterval(
      animacionHablar
    );

    animacionHablar =
      null;

  }


  const boca =
    document.getElementById(
      "boca"
    );

  boca.style.transform =
    "translate(-50%, -50%) scaleY(.15)";
}


/* ============================================================
   PARAR VOZ
   ============================================================ */

pararVoz.addEventListener(
  "click",
  function() {

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis.cancel();

    }

    detenerAnimacionHablar();

  }
);


/* ============================================================
   ACTIVAR / DESACTIVAR VOZ
   ============================================================ */

vozBtn.addEventListener(
  "click",
  function() {

    vozActivada =
      !vozActivada;


    if (!vozActivada) {

      window.speechSynthesis.cancel();

      detenerAnimacionHablar();

      vozBtn.textContent =
        "🔇 Voz desactivada";

    } else {

      vozBtn.textContent =
        "🔊 Voz activada";

    }

  }
);


/* ============================================================
   PRUEBA DE VOZ
   ============================================================ */

probarBtn.addEventListener(
  "click",
  function() {

    hablarGePeTo(
      "Hola Rafa. Soy GePeTo. Esta es mi sala de videoconferencia del Proyecto Rafa."
    );

  }
);


/* ============================================================
   MENSAJES
   ============================================================ */

function mostrarMensaje(
  tipo,
  texto
) {

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "mensaje " +
    (
      tipo === "usuario"
        ? "usuario"
        : "gepeto"
    );


  const etiqueta =
    document.createElement(
      "div"
    );

  etiqueta.className =
    "etiqueta";

  etiqueta.textContent =
    tipo === "usuario"
      ? "Rafa"
      : "GePeTo";


  const contenido =
    document.createElement(
      "div"
    );

  contenido.textContent =
    texto;


  div.appendChild(
    etiqueta
  );

  div.appendChild(
    contenido
  );


  chat.appendChild(
    div
  );


  chat.scrollTop =
    chat.scrollHeight;
}


/* ============================================================
   PREGUNTAR A GE-PETO
   ============================================================ */

async function preguntarGePeTo(
  pregunta
) {

  const respuesta =
    await fetch(
      URL_CLOUDFLARE +
      "/preguntar",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            pregunta:
              pregunta
          })
      }
    );


  let datos;


  try {

    datos =
      await respuesta.json();

  } catch (error) {

    throw new Error(
      "El Worker no devolvió JSON."
    );

  }


  if (
    !respuesta.ok ||
    datos.ok === false
  ) {

    throw new Error(
      datos.error ||
      datos.mensaje ||
      (
        "Error HTTP " +
        respuesta.status
      )
    );

  }


  const texto =
    datos.gepeto ||
    datos.respuesta ||
    datos.response;


  if (
    !texto
  ) {

    throw new Error(
      "GePeTo no devolvió texto."
    );

  }


  return texto;
}


/* ============================================================
   ENVIAR MENSAJE
   ============================================================ */

async function enviarMensaje() {

  const pregunta =
    entrada.value.trim();


  if (!pregunta) {
    return;
  }


  entrada.value = "";


  mostrarMensaje(
    "usuario",
    pregunta
  );


  const pensando =
    document.createElement(
      "div"
    );


  pensando.className =
    "mensaje gepeto";

  pensando.id =
    "pensando";


  pensando.innerHTML =
    '<div class="etiqueta">GePeTo</div>' +
    '<div>🧠 GePeTo está pensando...</div>';


  chat.appendChild(
    pensando
  );


  chat.scrollTop =
    chat.scrollHeight;


  enviar.disabled =
    true;


  enviar.textContent =
    "...";


  try {

    const respuesta =
      await preguntarGePeTo(
        pregunta
      );


    const elementoPensando =
      document.getElementById(
        "pensando"
      );


    if (
      elementoPensando
    ) {

      elementoPensando.remove();

    }


    mostrarMensaje(
      "gepeto",
      respuesta
    );


    hablarGePeTo(
      respuesta
    );


  } catch (error) {

    console.error(
      error
    );


    const elementoPensando =
      document.getElementById(
        "pensando"
      );


    if (
      elementoPensando
    ) {

      elementoPensando.remove();

    }


    mostrarMensaje(
      "gepeto",
      "⚠️ Error de GePeTo:\n" +
      error.message
    );

  }


  enviar.disabled =
    false;

  enviar.textContent =
    "ENVIAR";

}


/* ============================================================
   BOTÓN ENVIAR
   ============================================================ */

enviar.addEventListener(
  "click",
  enviarMensaje
);


/* ============================================================
   ENTER
   ============================================================ */

entrada.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      enviarMensaje();

    }

  }
);


/* ============================================================
   MICRÓFONO
   ============================================================ */

let reconocimiento = null;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (
  SpeechRecognition
) {

  reconocimiento =
    new SpeechRecognition();


  reconocimiento.lang =
    "es-ES";


  reconocimiento.continuous =
    false;


  reconocimiento.interimResults =
    false;


  reconocimiento.onstart =
    function() {

      microfono.textContent =
        "🔴";

    };


  reconocimiento.onend =
    function() {

      microfono.textContent =
        "🎤";

    };


  reconocimiento.onerror =
    function() {

      microfono.textContent =
        "🎤";

    };


  reconocimiento.onresult =
    function(event) {

      const texto =
        event.results[0][0]
          .transcript;


      entrada.value =
        texto;


      entrada.focus();

    };


  microfono.addEventListener(
    "click",
    function() {

      try {

        reconocimiento.start();

      } catch (error) {

        console.log(
          error
        );

      }

    }
  );


} else {

  microfono.disabled =
    true;

  microfono.title =
    "Este navegador no admite reconocimiento de voz.";

}


/* ============================================================
   MÚSICA
   ============================================================ */

let cancionesLocales = [];


selectorMusica.addEventListener(
  "change",
  function(event) {

    const archivos =
      Array.from(
        event.target.files
      );


    if (
      archivos.length === 0
    ) {

      return;

    }


    for (
      const archivo
      of archivos
    ) {

      if (
        !archivo.type.startsWith(
          "audio/"
        )
      ) {

        continue;

      }


      const url =
        URL.createObjectURL(
          archivo
        );


      cancionesLocales.push({

        nombre:
          archivo.name,

        url:
          url

      });

    }


    mostrarListaCanciones();


    selectorMusica.value =
      "";

  }
);


/* ============================================================
   LISTA DE CANCIONES
   ============================================================ */

function mostrarListaCanciones() {

  listaCanciones.innerHTML =
    "";


  if (
    cancionesLocales.length === 0
  ) {

    listaCanciones.innerHTML =
      '<div class="vacio">' +
      'Todavía no has seleccionado canciones.' +
      '</div>';

    return;

  }


  cancionesLocales.forEach(
    function(cancion, indice) {

      const fila =
        document.createElement(
          "div"
        );


      fila.className =
        "cancion";


      const boton =
        document.createElement(
          "button"
        );


      boton.type =
        "button";

      boton.textContent =
        "▶️";


      boton.addEventListener(
        "click",
        function() {

          audioPrincipal.src =
            cancion.url;

          audioPrincipal
            .play()
            .catch(
              function(error) {

                console.log(
                  error
                );

              }
            );

        }
      );


      const nombre =
        document.createElement(
          "div"
        );


      nombre.className =
        "nombreCancion";

      nombre.textContent =
        cancion.nombre;


      fila.appendChild(
        boton
      );

      fila.appendChild(
        nombre
      );


      listaCanciones.appendChild(
        fila
      );

    }
  );

}


/* ============================================================
   COMPROBAR WORKER
   ============================================================ */

async function comprobarEstado() {

  try {

    const respuesta =
      await fetch(
        URL_CLOUDFLARE +
        "/estado",
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (
      !respuesta.ok
    ) {

      throw new Error(
        "HTTP " +
        respuesta.status
      );

    }


    const datos =
      await respuesta.json();


    if (
      datos.ok === true &&
      datos.workers_ai === true
    ) {

      estado.textContent =
        "● GePeTo conectado · IA activa";

      estado.style.color =
        "#00ff66";

    } else {

      estado.textContent =
        "● Worker conectado · revisando IA";

      estado.style.color =
        "#ffff00";

    }

  } catch (error) {

    console.error(
      error
    );


    estado.textContent =
      "● Error conectando con GePeTo";

    estado.style.color =
      "#ff5555";

  }

}

   INICIO
   ============================================================ */

mostrarMensaje(
  "gepeto",
  "Hola Rafa. Soy GePeTo. Esta es mi sala de Videoconferencia."
);


comprobarEstado();
