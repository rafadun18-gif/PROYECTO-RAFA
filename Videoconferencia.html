<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Videoconferencia · GePeTo</title>

<style>

*{
box-sizing:border-box;
}

html,
body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#020303;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
}

/* ==============================
CABECERA
============================== */

header{
height:58px;
position:fixed;
top:0;
left:0;
right:0;

display:flex;
align-items:center;
justify-content:space-between;

padding:8px;

background:#050505;
border-bottom:1px solid #222;

z-index:100;
}

header button{
background:#111;
color:white;

border:1px solid #444;
border-radius:10px;

padding:9px 12px;
font-weight:bold;
}

.titulo{
font-size:18px;
font-weight:bold;
color:#4baaff;
}

/* ==============================
ZONA PRINCIPAL
============================== */

.principal{

position:absolute;

top:58px;
bottom:125px;
left:0;
right:0;

overflow-y:auto;

padding:8px;
}

/* ==============================
PANEL GEPETO
============================== */

.video-panel{

width:100%;
max-width:700px;

margin:auto;

background:#070808;

border:1px solid #222;
border-radius:18px;

padding:8px;

box-shadow:
0 0 30px rgba(0,130,255,.12);

}

/* ==============================
ZONA DE LA CARA
============================== */

.avatar-zona{

position:relative;

width:100%;

height:min(58vh,560px);

min-height:300px;

display:flex;

justify-content:center;
align-items:center;

overflow:hidden;

background:#010101;

border-radius:15px;

}

/* ==============================
IMAGEN FRONTAL
============================== */

#avatar{

position:absolute;

width:100%;
height:100%;

object-fit:contain;

z-index:2;

transform-origin:center center;

animation:
respiracion 4s ease-in-out infinite,
movimientoCabeza 8s ease-in-out infinite;

}

/* ==============================
RESPIRACIÓN
============================== */

@keyframes respiracion{

0%,
100%{
transform:scale(1);
}

50%{
transform:scale(1.012);
}

}

/* ==============================
MOVIMIENTO CABEZA
============================== */

@keyframes movimientoCabeza{

0%,
100%{
translate:0 0;
}

25%{
translate:-1px 0;
}

50%{
translate:1px 0;
}

75%{
translate:-1px 0;
}

}

/* ==============================
CAPA FACIAL
============================== */

.cara{

position:absolute;

inset:0;

z-index:10;

pointer-events:none;

}

/* ==============================
OJOS
============================== */

.ojo{

position:absolute;

width:12%;

height:5%;

border-radius:50%;

background:transparent;

transform-origin:center;

overflow:hidden;

}

/*
CAPA DEL PARPADEO
*/

.ojo::before{

content:"";

position:absolute;

left:-10%;

top:-100%;

width:120%;

height:200%;

background:rgba(5,5,5,.92);

border-radius:50%;

transform:translateY(-55%);

transition:transform .08s linear;

}

/*
PEQUEÑO PUNTO DE MIRADA
*/

.ojo::after{

content:"";

position:absolute;

width:22%;

height:65%;

left:39%;

top:18%;

background:rgba(20,20,20,.85);

border-radius:50%;

transform:translateX(0);

}

/*
POSICIÓN OJOS
*/

.ojo-izq{

left:28%;

top:35%;

}

.ojo-der{

right:28%;

top:35%;

}

/* ==============================
MOVIMIENTO DE MIRADA
============================== */

.hablando .ojo-izq::after{

animation:
miradaIzq
1.1s
ease-in-out
infinite alternate;

}

.hablando .ojo-der::after{

animation:
miradaDer
1.1s
ease-in-out
infinite alternate;

}

@keyframes miradaIzq{

0%{
transform:translateX(-25%);
}

50%{
transform:translateX(20%);
}

100%{
transform:translateX(-10%);
}

}

@keyframes miradaDer{

0%{
transform:translateX(20%);
}

50%{
transform:translateX(-20%);
}

100%{
transform:translateX(10%);
}

}

/* ==============================
PARPADEO
============================== */

.ojo.parpadeo::before{

animation:
parpadear
.22s
linear;

}

@keyframes parpadear{

0%{
transform:translateY(-55%);
}

40%{
transform:translateY(0%);
}

70%{
transform:translateY(0%);
}

100%{
transform:translateY(-55%);
}

}

/* ==============================
CEJAS
============================== */

.ceja{

position:absolute;

width:14%;

height:2.5%;

background:rgba(20,20,20,.70);

border-radius:50%;

transform-origin:center;

}

/* POSICIONES */

.ceja-izq{

left:27%;

top:30%;

transform:rotate(-4deg);

}

.ceja-der{

right:27%;

top:30%;

transform:rotate(4deg);

}

/* ==============================
CEJAS HABLANDO
============================== */

.hablando .ceja-izq{

animation:
movimientoCejaIzq
.65s
ease-in-out
infinite alternate;

}

.hablando .ceja-der{

animation:
movimientoCejaDer
.65s
ease-in-out
infinite alternate;

}

@keyframes movimientoCejaIzq{

0%{
transform:
translateY(0)
rotate(-4deg);
}

50%{
transform:
translateY(-4px)
rotate(-1deg);
}

100%{
transform:
translateY(1px)
rotate(-6deg);
}

}

@keyframes movimientoCejaDer{

0%{
transform:
translateY(0)
rotate(4deg);
}

50%{
transform:
translateY(-4px)
rotate(1deg);
}

100%{
transform:
translateY(1px)
rotate(6deg);
}

}

/* ==============================
BOCA
============================== */

.boca{

position:absolute;

left:50%;

top:61%;

width:14%;

height:4%;

transform:
translate(-50%,-50%)
scaleY(.25);

border-radius:50%;

background:
rgba(15,5,5,.82);

border:
1px solid
rgba(255,255,255,.20);

opacity:.20;

overflow:hidden;

}

/*
INTERIOR DE LA BOCA
*/

.boca::before{

content:"";

position:absolute;

left:18%;

right:18%;

top:20%;

bottom:20%;

background:
rgba(255,255,255,.12);

border-radius:50%;

transform:scaleY(.15);

}

/* ==============================
BOCA HABLANDO
============================== */

.hablando .boca{

opacity:.95;

animation:
hablarBoca
.16s
ease-in-out
infinite alternate;

}

.hablando .boca::before{

animation:
interiorBoca
.16s
ease-in-out
infinite alternate;

}

@keyframes hablarBoca{

0%{

transform:
translate(-50%,-50%)
scaleX(.75)
scaleY(.25);

}

20%{

transform:
translate(-50%,-50%)
scaleX(1)
scaleY(.65);

}

40%{

transform:
translate(-50%,-50%)
scaleX(1.18)
scaleY(.42);

}

60%{

transform:
translate(-50%,-50%)
scaleX(.90)
scaleY(.90);

}

80%{

transform:
translate(-50%,-50%)
scaleX(1.10)
scaleY(.55);

}

100%{

transform:
translate(-50%,-50%)
scaleX(.80)
scaleY(1);

}

}

@keyframes interiorBoca{

0%{
transform:scaleY(.1);
}

50%{
transform:scaleY(.7);
}

100%{
transform:scaleY(.2);
}

}

/* ==============================
PEQUEÑO MOVIMIENTO DE LA CAPA FACIAL
============================== */

.hablando .cara{

animation:
movimientoCara
1.8s
ease-in-out
infinite;

}

@keyframes movimientoCara{

0%{
transform:translateY(0);
}

25%{
transform:translateY(-1px);
}

50%{
transform:translateY(1px);
}

75%{
transform:translateY(-1px);
}

100%{
transform:translateY(0);
}

}

/* ==============================
ESTADO
============================== */

.estado{

text-align:center;

margin-top:7px;

font-size:14px;

color:#aaa;

}

#estado{

color:#4baaff;

font-weight:bold;

}

/* ==============================
CONTROLES
============================== */

.controles{

display:flex;

justify-content:center;

gap:8px;

margin-top:9px;

flex-wrap:wrap;

}

.controles button{

background:#111;

color:white;

border:1px solid #444;

border-radius:10px;

padding:8px 12px;

}

/* ==============================
CHAT
============================== */

.chat{

width:100%;

max-width:700px;

margin:10px auto;

background:#080909;

border:1px solid #222;

border-radius:15px;

padding:10px;

}

.mensaje{

padding:9px 11px;

margin:7px 0;

border-radius:12px;

line-height:1.35;

}

.usuario{

background:#10263c;

text-align:right;

}

.gepeto{

background:#151515;

border-left:
3px solid #168cff;

}

/* ==============================
MÚSICA
============================== */

.musica{

width:100%;

max-width:700px;

margin:10px auto;

background:#080909;

border:1px solid #222;

border-radius:15px;

padding:10px;

}

.musica audio{

width:100%;

margin-top:7px;

}

.musica input{

width:100%;

margin-top:8px;

}

/* ==============================
CHAT FIJO
============================== */

.chat-fijo{

position:fixed;

left:0;
right:0;
bottom:0;

min-height:125px;

background:#060606;

border-top:1px solid #333;

padding:8px;

z-index:200;

}

.fila-chat{

display:flex;

gap:6px;

align-items:stretch;

}

#entrada{

flex:1;

min-height:55px;

max-height:80px;

resize:none;

background:#111;

color:white;

border:1px solid #444;

border-radius:12px;

padding:10px;

font-size:16px;

}

#micro{

width:54px;

background:#151515;

color:white;

border:1px solid #555;

border-radius:12px;

font-size:21px;

}

#enviar{

min-width:82px;

background:#168cff;

color:white;

border:0;

border-radius:12px;

font-weight:bold;

}

.indicador{

text-align:center;

font-size:12px;

color:#777;

margin-top:6px;

}

.hablando .indicador{

color:#4baaff;

}

/* ==============================
MÓVIL
============================== */

@media(max-width:600px){

.titulo{
font-size:15px;
}

header button{
font-size:11px;
padding:8px;
}

.avatar-zona{

height:47vh;

min-height:270px;

}

}

/* ==============================
ANIMACIÓN GENERAL CUANDO HABLA
============================== */

.hablando #avatar{

animation:
respiracionHabla
1.8s
ease-in-out
infinite;

}

@keyframes respiracionHabla{

0%{
transform:scale(1);
}

50%{
transform:scale(1.018);
}

100%{
transform:scale(1);
}

}

</style>
</head>

<body>

<header>

<button onclick="volverBiblioteca()">
← BIBLIOTECA
</button>

<div class="titulo">
🎥 GePeTo
</div>

<button onclick="pararVoz()">
🔇 PARAR
</button>

</header>


<div class="principal">


<!-- ==============================
GEPETO
============================== -->

<section class="video-panel">

<div
class="avatar-zona"
id="avatarZona"
>

<img
id="avatar"
src="./GePeToFrontal.png"
alt="GePeTo"
>


<!-- CAPA DE ANIMACIÓN FACIAL -->

<div
class="cara"
id="cara"
>

<div
class="ojo ojo-izq"
></div>

<div
class="ojo ojo-der"
></div>

<div
class="ceja ceja-izq"
></div>

<div
class="ceja ceja-der"
></div>

<div
class="boca"
></div>

</div>

</div>


<div class="estado">

Estado:

<span id="estado">
EN ESPERA
</span>

</div>


<div class="controles">

<button onclick="probarVoz()">
🔊 PROBAR VOZ
</button>

<button onclick="parpadear()">
👁️ PARPADEAR
</button>

</div>


<div
class="indicador"
id="indicador"
>

GePeTo está preparado

</div>

</section>


<!-- ==============================
CHAT
============================== -->

<section
class="chat"
id="chat"
>

<div class="mensaje gepeto">

👋 Hola Rafa. Estoy preparado
para hablar contigo.

</div>

</section>


<!-- ==============================
MÚSICA
============================== -->

<section class="musica">

🎵 Música de la videoconferencia

<audio
id="audio"
controls>
</audio>

<input
type="file"
accept="audio/*"
onchange="cargarMusica(event)"
>

</section>


</div>


<!-- ==============================
BARRA INFERIOR
============================== -->

<div class="chat-fijo">

<div class="fila-chat">

<textarea
id="entrada"
placeholder="Escribe a GePeTo..."
></textarea>

<button
id="micro"
onclick="microfono()"
>
🎤
</button>

<button
id="enviar"
onclick="enviarMensaje()"
>
ENVIAR
</button>

</div>

<div
class="indicador"
>
Habla con GePeTo
</div>

</div>


<script>

/* =========================================
WORKER
========================================= */

const WORKER =
"https://gepetto-rafa.rafadun18.workers.dev/preguntar";


/* =========================================
ELEMENTOS
========================================= */

const avatarZona =
document.getElementById("avatarZona");

const estado =
document.getElementById("estado");

const indicador =
document.getElementById("indicador");

const chat =
document.getElementById("chat");

const entrada =
document.getElementById("entrada");

const ojos =
document.querySelectorAll(".ojo");


/* =========================================
BIBLIOTECA
========================================= */

function volverBiblioteca(){

window.location.href =
"./biblioteca.html";

}


/* =========================================
PARPADEAR
========================================= */

function parpadear(){

ojos.forEach(

ojo => {

ojo.classList.remove(
"parpadeo"
);

void ojo.offsetWidth;

ojo.classList.add(
"parpadeo"
);

}

);

}


/* =========================================
PARPADEO AUTOMÁTICO
========================================= */

function parpadeoAutomatico(){

parpadear();

const tiempo =
2500 +
Math.random()*4500;

setTimeout(
parpadeoAutomatico,
tiempo
);

}

setTimeout(
parpadeoAutomatico,
3000
);


/* =========================================
COMENZAR ANIMACIÓN
========================================= */

function comenzarAnimacion(){

avatarZona.classList.add(
"hablando"
);

estado.textContent =
"HABLANDO";

indicador.textContent =
"🔊 GePeTo está hablando...";

}


/* =========================================
PARAR ANIMACIÓN
========================================= */

function terminarAnimacion(){

avatarZona.classList.remove(
"hablando"
);

estado.textContent =
"EN ESPERA";

indicador.textContent =
"GePeTo está preparado";

}


/* =========================================
VOCES DISPONIBLES
========================================= */

let vocesDisponibles = [];


function cargarVoces(){

if(!("speechSynthesis" in window)){
return;
}

vocesDisponibles =
window.speechSynthesis.getVoices();

}


/*
Los navegadores pueden tardar en cargar
las voces.
*/

cargarVoces();

if("speechSynthesis" in window){

speechSynthesis.onvoiceschanged =
function(){

cargarVoces();

};

}


/* =========================================
BUSCAR VOZ MASCULINA ESPAÑOLA
========================================= */

function buscarVozMasculina(){

const voces =
vocesDisponibles;

if(!voces ||
!voces.length){

return null;

}


/*
Primero buscamos voces españolas.
*/

const vocesEspanol =
voces.filter(

voz =>

voz.lang &&
voz.lang.toLowerCase().startsWith("es")

);


/*
Nombres que suelen corresponder
a voces masculinas.
*/

const nombresMasculinos = [

"jorge",
"diego",
"pablo",
"carlos",
"miguel",
"juan",
"antonio",
"daniel",
"sergio",
"alvaro",
"álvaro",
"male",
"masculina",
"male voice"

];


/*
Primera búsqueda:
voz española + nombre masculino.
*/

for(
const voz of vocesEspanol
){

const nombre =
voz.name.toLowerCase();

for(
const masculino of
nombresMasculinos
){

if(
nombre.includes(masculino)
){

return voz;

}

}

}


/*
Segunda búsqueda:
algunas plataformas utilizan
"Spanish Male".
*/

for(
const voz of voces
){

const texto =
(
voz.name +
" " +
voz.lang
).toLowerCase();

if(
(
texto.includes("male") ||
texto.includes("mascul")
)
&&
texto.includes("es")
){

return voz;

}

}


/*
Si no existe una voz masculina
identificable, usamos una voz
española del sistema.
*/

if(vocesEspanol.length){

return vocesEspanol[0];

}


return null;

}


/* =========================================
HABLAR
========================================= */

function hablar(texto){

if(!texto){
return;
}


if(!("speechSynthesis" in window)){

indicador.textContent =
"Este navegador no permite voz.";

return;

}


/*
Detener cualquier frase anterior.
*/

speechSynthesis.cancel();


/*
Volvemos a cargar las voces por si
el sistema las ha añadido después.
*/

cargarVoces();


const voz =
new SpeechSynthesisUtterance(
texto
);


voz.lang =
"es-ES";


voz.rate =
0.92;


/*
Tono algo más grave para GePeTo.
*/

voz.pitch =
0.72;


voz.volume =
1;


/*
Seleccionar voz.
*/

const vozSeleccionada =
buscarVozMasculina();


if(vozSeleccionada){

voz.voice =
vozSeleccionada;

indicador.textContent =
"🔊 Voz GePeTo: "
+
vozSeleccionada.name;

}else{

indicador.textContent =
"🔊 Voz GePeTo";

}


/* =========================================
EVENTO COMIENZO
========================================= */

voz.onstart =
function(){

comenzarAnimacion();

};


/* =========================================
EVENTO FINAL
========================================= */

voz.onend =
function(){

terminarAnimacion();

};


/* =========================================
ERROR
========================================= */

voz.onerror =
function(){

terminarAnimacion();

};


/*
Hablar.
*/

speechSynthesis.speak(
voz
);

}


/* =========================================
PROBAR VOZ
========================================= */

function probarVoz(){

hablar(

"Hola Rafa. Soy GePeTo. "
+
"Ahora estoy preparado para hablar "
+
"contigo desde la videoconferencia."

);

}


/* =========================================
PARAR VOZ
========================================= */

function pararVoz(){

speechSynthesis.cancel();

terminarAnimacion();

}


/* =========================================
ENVIAR MENSAJE
========================================= */

async function enviarMensaje(){

const texto =
entrada.value.trim();

if(!texto){
return;
}


/*
Mostrar mensaje del usuario.
*/

agregarMensaje(
texto,
"usuario"
);


entrada.value = "";


/*
Estado.
*/

estado.textContent =
"PENSANDO";

indicador.textContent =
"🧠 GePeTo está pensando...";


try{

const respuesta =
await fetch(

WORKER,

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

pregunta:texto

})

}

);


/*
Leer respuesta.
*/

const datos =
await respuesta.json();


/*
Intentar diferentes formatos
de respuesta del Worker.
*/

let textoRespuesta =

datos.respuesta ||

datos.answer ||

datos.text ||

datos.output ||

datos.message;


/*
Si el Worker devuelve un objeto
resultante.
*/

if(
!textoRespuesta &&
datos.result &&
typeof datos.result === "object"
){

textoRespuesta =

datos.result.response ||

datos.result.text ||

datos.result.content ||

datos.result.output;

}


/*
Último recurso.
*/

if(!textoRespuesta){

textoRespuesta =
"GePeTo respondió, pero no pude leer el texto.";

}


/*
Convertir a texto.
*/

textoRespuesta =
String(textoRespuesta);


/*
Mostrar respuesta.
*/

agregarMensaje(
textoRespuesta,
"gepeto"
);


/*
GePeTo habla.
*/

hablar(
textoRespuesta
);


}
catch(error){

console.error(error);


const mensaje =
"No puedo conectar ahora con GePeTo.";


agregarMensaje(
mensaje,
"gepeto"
);


hablar(
mensaje
);

}

}


/* =========================================
AGREGAR MENSAJE
========================================= */

function agregarMensaje(
texto,
tipo
){

const div =
document.createElement("div");

div.className =
"mensaje " + tipo;

div.textContent =
texto;

chat.appendChild(
div
);

chat.scrollTop =
chat.scrollHeight;

}


/* =========================================
ENTER
========================================= */

entrada.addEventListener(

"keydown",

function(event){

if(

event.key === "Enter" &&
!event.shiftKey

){

event.preventDefault();

enviarMensaje();

}

}

);


/* =========================================
MICRÓFONO
========================================= */

let reconocimiento =
null;


function microfono(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

alert(
"Este navegador no permite reconocimiento de voz."
);

return;

}


reconocimiento =
new SpeechRecognition();


reconocimiento.lang =
"es-ES";

reconocimiento.interimResults =
false;

reconocimiento.continuous =
false;


reconocimiento.onstart =
function(){

indicador.textContent =
"🎤 Escuchando...";

};


reconocimiento.onresult =
function(event){

const texto =
event.results[0][0].transcript;

entrada.value =
texto;

indicador.textContent =
"Pulsa ENVIAR";

};


reconocimiento.onerror =
function(){

indicador.textContent =
"No se pudo utilizar el micrófono.";

};


reconocimiento.onend =
function(){

if(
indicador.textContent ===
"🎤 Escuchando..."
){

indicador.textContent =
"Habla con GePeTo";

}

};


reconocimiento.start();

}


/* =========================================
MÚSICA
========================================= */

function cargarMusica(event){

const archivo =
event.target.files[0];

if(!archivo){
return;
}


const url =
URL.createObjectURL(
archivo
);


const audio =
document.getElementById(
"audio"
);


audio.src =
url;


/*
No forzamos la reproducción si el
navegador la bloquea.
*/

audio.play().catch(
function(){
console.log(
"El navegador requiere pulsar Play."
);
}
);

}


/* =========================================
INICIO
========================================= */

console.log(
"GePeTo Videoconferencia iniciado."
);

</script>
