<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>GePeTo · Videoconferencia</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #030303;
    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    padding-bottom: 92px;
}


/* =========================================================
   CABECERA
========================================================= */

header {

    position: sticky;
    top: 0;

    z-index: 1000;

    min-height: 58px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 8px 10px;

    background: #070707;

    border-bottom:
        1px solid #222;
}

header button {

    border: 1px solid #292929;

    border-radius: 10px;

    padding: 10px 12px;

    background: #111;

    color: white;

    font-size: 12px;
    font-weight: bold;
}

.titulo {

    color: #2196ff;

    font-size: 16px;
    font-weight: bold;

    text-align: center;
}


/* =========================================================
   PRINCIPAL
========================================================= */

.principal {

    width: 100%;
    max-width: 900px;

    margin: auto;

    padding: 10px;
}


/* =========================================================
   VIDEO
========================================================= */

.video-panel {

    width: 100%;

    padding: 10px;

    background: #080808;

    border:
        1px solid #202020;

    border-radius: 18px;

    box-shadow:
        0 0 25px rgba(0,120,255,0.12);
}


.avatar-zona {

    position: relative;

    width: 100%;

    overflow: hidden;

    border-radius: 16px;

    background: #000;
}


#avatar {

    display: block;

    width: 100%;
    height: auto;

    object-fit: contain;

    transition:
        transform 0.25s ease,
        filter 0.25s ease;
}


/* =========================================================
   MOVIMIENTO DE GE-PETO CUANDO HABLA
========================================================= */

.avatar-zona.hablando #avatar {

    animation:
        movimientoGePeTo
        2.4s
        ease-in-out
        infinite;
}


@keyframes movimientoGePeTo {

    0% {
        transform:
            scale(1)
            translateY(0);
    }

    25% {
        transform:
            scale(1.006)
            translateY(-1px);
    }

    50% {
        transform:
            scale(1.012)
            translateY(0);
    }

    75% {
        transform:
            scale(1.006)
            translateY(1px);
    }

    100% {
        transform:
            scale(1)
            translateY(0);
    }
}


/* =========================================================
   ESTADO
========================================================= */

.estado {

    margin-top: 10px;

    padding: 10px;

    text-align: center;

    background: #101010;

    border:
        1px solid #242424;

    border-radius: 11px;

    color: #9dceff;

    font-size: 13px;
}

.estado strong {

    color: #2196ff;
}


/* =========================================================
   CONTROLES
========================================================= */

.controles {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 10px;
}

.controles button {

    border:
        1px solid #303030;

    border-radius: 10px;

    padding: 10px 12px;

    background: #151515;

    color: white;

    font-size: 12px;

    font-weight: bold;
}

.controles button:active {

    transform:
        scale(0.97);
}


/* =========================================================
   CHAT
========================================================= */

.chat {

    margin-top: 15px;

    padding: 11px;

    background: #080808;

    border:
        1px solid #202020;

    border-radius: 16px;
}

.chat h2 {

    margin:
        0 0 10px 0;

    color: #2196ff;

    font-size: 17px;
}


.mensajes {

    min-height: 120px;

    max-height: 360px;

    overflow-y: auto;

    padding: 3px;
}


.mensaje {

    margin: 8px 0;

    padding: 10px 11px;

    border-radius: 11px;

    font-size: 14px;

    line-height: 1.45;

    word-break: break-word;
}


.usuario {

    background: #14202b;

    border:
        1px solid #263746;
}


.gepeto {

    background: #071a2b;

    border:
        1px solid #0c4c78;
}


.nombre-mensaje {

    margin-bottom: 4px;

    font-weight: bold;
}


.usuario
.nombre-mensaje {

    color: #00ff66;
}


.gepeto
.nombre-mensaje {

    color: #2196ff;
}


/* =========================================================
   MÚSICA
========================================================= */

.musica {

    margin-top: 15px;

    padding: 11px;

    background: #080808;

    border:
        1px solid #202020;

    border-radius: 16px;
}

.musica h2 {

    margin:
        0 0 10px 0;

    color: #ff4fd8;

    font-size: 17px;
}


.musica input {

    width: 100%;

    margin-bottom: 9px;
}


audio {

    width: 100%;
}


/* =========================================================
   CHAT INFERIOR FIJO
========================================================= */

.chat-fijo {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 2000;

    padding: 7px;

    background:
        rgba(5,5,5,0.97);

    border-top:
        1px solid #292929;
}


.chat-fijo-inner {

    width: 100%;
    max-width: 900px;

    margin: auto;

    display: flex;

    align-items: flex-end;

    gap: 6px;
}


#entrada {

    flex: 1;

    min-height: 43px;
    max-height: 120px;

    resize: none;

    padding: 11px;

    background: #111;

    color: white;

    border:
        1px solid #333;

    border-radius: 10px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 14px;
}


.chat-fijo button {

    min-width: 44px;
    min-height: 43px;

    border: none;

    border-radius: 10px;

    background: #151515;

    color: white;

    font-size: 12px;

    font-weight: bold;
}


#micro {

    font-size: 19px;
}


#enviar {

    background: #075ca8;
}


/* =========================================================
   MÓVIL
========================================================= */

@media
(max-width: 600px) {

    header {

        padding:
            7px;
    }

    header button {

        padding:
            9px;

        font-size:
            10px;
    }

    .titulo {

        font-size:
            14px;
    }

    .principal {

        padding:
            7px;
    }

    .video-panel {

        padding:
            7px;
    }

    #entrada {

        font-size:
            14px;
    }

    .chat-fijo button {

        min-width:
            42px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     CABECERA
======================================================== -->

<header>

    <button onclick="irBiblioteca()">
        ← BIBLIOTECA
    </button>

    <div class="titulo">
        GE-PETO · VIDEOCONFERENCIA
    </div>

    <button onclick="pararTodo()">
        🔇 PARAR
    </button>

</header>


<!-- =======================================================
     PRINCIPAL
======================================================== -->

<div class="principal">


    <!-- ===================================================
         GE-PETO
    ==================================================== -->

    <section class="video-panel">


        <div
            class="avatar-zona"
            id="avatarZona"
        >

            <img
                id="avatar"
                src="./GePeToFrontal.png"
                alt="GePeTo"
            >

        </div>


        <div
            class="estado"
            id="estado"
        >

            <strong>GePeTo</strong>
            preparado.

        </div>


        <div class="controles">

            <button
                onclick="probarVoz()"
            >
                🔊 PROBAR VOZ
            </button>


            <button
                onclick="parpadear()"
            >
                👁 PARPADEAR
            </button>


            <button
                onclick="pararTodo()"
            >
                🔇 PARAR
            </button>

        </div>

    </section>



    <!-- ===================================================
         CHAT
    ==================================================== -->

    <section class="chat">

        <h2>
            💬 CONVERSACIÓN CON GE-PETO
        </h2>


        <div
            class="mensajes"
            id="mensajes"
        ></div>

    </section>



    <!-- ===================================================
         MÚSICA
    ==================================================== -->

    <section class="musica">

        <h2>
            🎵 MÚSICA
        </h2>


        <input
            type="file"
            id="archivoMusica"
            accept="audio/*"
        >


        <audio
            id="reproductor"
            controls
        ></audio>

    </section>

</div>



<!-- =======================================================
     CHAT INFERIOR
======================================================== -->

<div class="chat-fijo">

    <div class="chat-fijo-inner">


        <textarea
            id="entrada"
            placeholder="Escribe a GePeTo..."
        ></textarea>


        <button
            id="micro"
            onclick="usarMicrofono()"
            title="Micrófono"
        >
            🎤
        </button>


        <button
            id="enviar"
            onclick="enviarMensaje()"
        >
            ENVIAR
        </button>

    </div>

</div>



<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const WORKER_URL =
    "https://gepetto-rafa.rafadun18.workers.dev/preguntar";


/* =========================================================
   VARIABLES
========================================================= */

let vocesDisponibles = [];

let vozGePeTo = null;

let reconocimiento = null;


/* =========================================================
   BIBLIOTECA
========================================================= */

function irBiblioteca() {

    window.location.href =
        "./biblioteca.html";

}


/* =========================================================
   BUSCAR VOZ DE JORGE
========================================================= */

function buscarVozGePeTo() {

    if (
        !("speechSynthesis" in window)
    ) {

        return null;

    }


    const voces =
        window.speechSynthesis
            .getVoices();


    vocesDisponibles =
        voces || [];


    if (!vocesDisponibles.length) {

        return null;

    }


    /*
       PRIMERA PRIORIDAD:
       Jorge (mejorada)
    */

    let voz =
        vocesDisponibles.find(
            function(v) {

                const nombre =
                    (
                        v.name || ""
                    ).toLowerCase();

                return (
                    nombre.includes("jorge") &&
                    nombre.includes("mejor")
                );

            }
        );


    /*
       SEGUNDA PRIORIDAD:
       cualquier Jorge
    */

    if (!voz) {

        voz =
            vocesDisponibles.find(
                function(v) {

                    const nombre =
                        (
                            v.name || ""
                        ).toLowerCase();

                    return nombre
                        .includes("jorge");

                }
            );

    }


    /*
       TERCERA PRIORIDAD:
       voz española de España
    */

    if (!voz) {

        voz =
            vocesDisponibles.find(
                function(v) {

                    const idioma =
                        (
                            v.lang || ""
                        ).toLowerCase();

                    return (
                        idioma === "es-es"
                    );

                }
            );

    }


    /*
       CUARTA PRIORIDAD:
       cualquier español
    */

    if (!voz) {

        voz =
            vocesDisponibles.find(
                function(v) {

                    const idioma =
                        (
                            v.lang || ""
                        ).toLowerCase();

                    return idioma
                        .startsWith("es");

                }
            );

    }


    vozGePeTo =
        voz || null;


    if (vozGePeTo) {

        console.log(
            "VOZ DE GE-PETO:",
            vozGePeTo.name,
            vozGePeTo.lang
        );

    }


    return vozGePeTo;

}


/* =========================================================
   CARGAR VOCES AUTOMÁTICAMENTE
========================================================= */

function cargarVocesAutomaticamente() {

    buscarVozGePeTo();

}


/*
   Safari/iPhone puede cargar las voces
   después de abrir la página.
*/

if (
    "speechSynthesis" in window
) {

    window.speechSynthesis.onvoiceschanged =
        function() {

            buscarVozGePeTo();

        };

}


/* =========================================================
   VARIOS INTENTOS DE CARGA
========================================================= */

window.addEventListener(
    "load",
    function() {

        setTimeout(
            cargarVocesAutomaticamente,
            300
        );

        setTimeout(
            cargarVocesAutomaticamente,
            800
        );

        setTimeout(
            cargarVocesAutomaticamente,
            1500
        );

        setTimeout(
            cargarVocesAutomaticamente,
            2500
        );

    }
);


/* =========================================================
   HABLAR
========================================================= */

function hablar(texto) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    /*
       Intentamos obtener la voz
       justo antes de hablar.
    */

    if (!vozGePeTo) {

        buscarVozGePeTo();

    }


    window.speechSynthesis.cancel();


    const frase =
        new SpeechSynthesisUtterance(
            texto
        );


    /*
       FORZAMOS LA VOZ ENCONTRADA
    */

    if (vozGePeTo) {

        frase.voice =
            vozGePeTo;

        frase.lang =
            vozGePeTo.lang;

    } else {

        frase.lang =
            "es-ES";

    }


    /*
       Ajustes de GePeTo
    */

    frase.rate =
        0.90;

    frase.pitch =
        0.68;

    frase.volume =
        1;


    const zona =
        document.getElementById(
            "avatarZona"
        );


    frase.onstart =
        function() {

            zona.classList.add(
                "hablando"
            );


            document.getElementById(
                "estado"
            ).innerHTML =
                "<strong>GePeTo</strong> hablando";

        };


    frase.onend =
        function() {

            zona.classList.remove(
                "hablando"
            );


            document.getElementById(
                "estado"
            ).innerHTML =
                "<strong>GePeTo</strong> preparado.";

        };


    frase.onerror =
        function(error) {

            zona.classList.remove(
                "hablando"
            );


            console.log(
                "Error de voz:",
                error
            );


            document.getElementById(
                "estado"
            ).innerHTML =
                "<strong>GePeTo</strong> preparado.";

        };


    window.speechSynthesis.speak(
        frase
    );

}


/* =========================================================
   PROBAR VOZ
========================================================= */

function probarVoz() {

    buscarVozGePeTo();


    if (!vozGePeTo) {

        alert(
            "El iPhone todavía no ha entregado las voces a Safari. Inténtalo otra vez."
        );

        return;

    }


    hablar(
        "Hola Rafa. Soy GePeTo. Esta es mi voz."
    );

}


/* =========================================================
   PARPADEO VISUAL
========================================================= */

function parpadear() {

    const avatar =
        document.getElementById(
            "avatar"
        );


    avatar.style.filter =
        "brightness(0.45)";


    setTimeout(
        function() {

            avatar.style.filter =
                "brightness(1)";

        },
        180
    );

}


/* =========================================================
   PARAR
========================================================= */

function pararTodo() {

    if (
        "speechSynthesis" in window
    ) {

        window.speechSynthesis.cancel();

    }


    document.getElementById(
        "avatarZona"
    ).classList.remove(
        "hablando"
    );


    document.getElementById(
        "estado"
    ).innerHTML =
        "<strong>GePeTo</strong> preparado.";

}


/* =========================================================
   AÑADIR MENSAJE AL CHAT
========================================================= */

function añadirMensaje(
    quien,
    texto,
    tipo
) {

    const mensajes =
        document.getElementById(
            "mensajes"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "mensaje " +
        tipo;


    const nombre =
        document.createElement(
            "div"
        );


    nombre.className =
        "nombre-mensaje";


    nombre.textContent =
        quien;


    const contenido =
        document.createElement(
            "div"
        );


    contenido.textContent =
        texto;


    div.appendChild(
        nombre
    );


    div.appendChild(
        contenido
    );


    mensajes.appendChild(
        div
    );


    mensajes.scrollTop =
        mensajes.scrollHeight;

}


/* =========================================================
   ENVIAR A GE-PETO
========================================================= */

async function enviarMensaje() {

    const entrada =
        document.getElementById(
            "entrada"
        );


    const texto =
        entrada.value.trim();


    if (!texto) {

        return;

    }


    añadirMensaje(
        "Rafa",
        texto,
        "usuario"
    );


    entrada.value = "";


    document.getElementById(
        "estado"
    ).innerHTML =
        "<strong>GePeTo</strong> pensando...";


    try {

        const respuesta =
            await fetch(
                WORKER_URL,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            mensaje:
                                texto
                        })

                }
            );


        const datos =
            await respuesta.json();


        let textoRespuesta =
            "";


        if (
            typeof datos ===
            "string"
        ) {

            textoRespuesta =
                datos;

        } else {

            textoRespuesta =
                datos.respuesta ||
                datos.response ||
                datos.text ||
                datos.texto ||
                datos.output ||
                datos.result ||
                "";

        }


        if (!textoRespuesta) {

            textoRespuesta =
                "GePeTo ha respondido, pero no he podido leer el texto.";

        }


        añadirMensaje(
            "GePeTo",
            textoRespuesta,
            "gepeto"
        );


        /*
           GE-PETO HABLA
        */

        hablar(
            textoRespuesta
        );


    } catch(error) {

        console.error(
            "Error:",
            error
        );


        const errorTexto =
            "No puedo conectar ahora con GePeTo.";


        añadirMensaje(
            "GePeTo",
            errorTexto,
            "gepeto"
        );


        document.getElementById(
            "estado"
        ).innerHTML =
            "❌ Error de conexión.";

    }

}


/* =========================================================
   ENTER
========================================================= */

document.getElementById(
    "entrada"
).addEventListener(
    "keydown",
    function(evento) {

        if (
            evento.key === "Enter" &&
            !evento.shiftKey
        ) {

            evento.preventDefault();

            enviarMensaje();

        }

    }
);


/* =========================================================
   MICROFONO
========================================================= */

function usarMicrofono() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "El reconocimiento de voz no está disponible en este navegador."
        );

        return;

    }


    reconocimiento =
        new SpeechRecognition();


    reconocimiento.lang =
        "es-ES";


    reconocimiento.continuous =
        false;


    reconocimiento.interimResults =
        false;


    reconocimiento.onstart =
        function() {

            document.getElementById(
                "estado"
            ).innerHTML =
                "<strong>GePeTo</strong> escuchando...";

        };


    reconocimiento.onresult =
        function(evento) {

            const texto =
                evento.results[0][0]
                    .transcript;


            document.getElementById(
                "entrada"
            ).value =
                texto;


            enviarMensaje();

        };


    reconocimiento.onerror =
        function(evento) {

            console.log(
                "Micrófono:",
                evento.error
            );


            document.getElementById(
                "estado"
            ).innerHTML =
                "<strong>GePeTo</strong> preparado.";

        };


    reconocimiento.onend =
        function() {

            document.getElementById(
                "estado"
            ).innerHTML =
                "<strong>GePeTo</strong> preparado.";

        };


    reconocimiento.start();

}


/* =========================================================
   MÚSICA
========================================================= */

document.getElementById(
    "archivoMusica"
).addEventListener(
    "change",
    function(evento) {

        const archivo =
            evento.target.files[0];


        if (!archivo) {

            return;

        }


        const reproductor =
            document.getElementById(
                "reproductor"
            );


        const url =
            URL.createObjectURL(
                archivo
            );


        reproductor.src =
            url;


        reproductor.play()
            .catch(
                function() {}
            );

    }
);

</script>

</body>
</html>
