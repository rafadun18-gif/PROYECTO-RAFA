<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Videoconferencia · GePeTo</title>

<style>

/* ============================================================
   PROYECTO RAFA · VIDEOCONFERENCIA GE-PETO
   ============================================================ */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #020202;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    padding-bottom: 105px;
}

/* ============================================================
   CABECERA
   ============================================================ */

.cabecera {

    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    align-items: center;

    width: 100%;

    padding: 9px;

    background:
        linear-gradient(
            90deg,
            #001eff,
            #030303 50%,
            #001eff
        );

    border-bottom: 2px solid #006eff;

    box-shadow:
        0 0 15px rgba(0,110,255,.7);
}

.cabecera button {

    border: 1px solid white;

    border-radius: 11px;

    padding: 9px 10px;

    background: #070707;

    color: white;

    font-weight: bold;

    font-size: 12px;
}

.titulo {

    flex: 1;

    text-align: center;

    font-weight: bold;

    font-size: 15px;
}

.titulo span {
    color: #00a2ff;
}

/* ============================================================
   PRINCIPAL
   ============================================================ */

.principal {

    width: 100%;
    max-width: 900px;

    margin: auto;

    padding: 10px;
}

/* ============================================================
   VIDEO
   ============================================================ */

.video-panel {

    background:
        radial-gradient(
            circle at center,
            #12253a,
            #05080c 55%,
            #000
        );

    border: 2px solid #006eff;

    border-radius: 20px;

    padding: 8px;

    box-shadow:
        0 0 25px rgba(0,110,255,.5);
}

/* ============================================================
   ESTADO
   ============================================================ */

.estado {

    text-align: center;

    padding: 8px;

    margin-bottom: 8px;

    border-radius: 10px;

    background: #080808;

    border: 1px solid #164b80;

    color: #76b9ff;

    font-size: 13px;
}

.estado.hablando {

    color: #00ff66;

    border-color: #00ff66;

    box-shadow:
        0 0 12px rgba(0,255,102,.4);
}

/* ============================================================
   AVATAR
   ============================================================ */

.avatar-zona {

    position: relative;

    width: 100%;

    max-width: 700px;

    margin: auto;

    aspect-ratio: 16 / 11;

    overflow: hidden;

    border-radius: 17px;

    background: #000;

    display: flex;

    align-items: center;

    justify-content: center;
}

#avatar {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    transform-origin: center;

    animation:
        respirar 5s ease-in-out infinite;
}

@keyframes respirar {

    0% {
        transform:
            scale(1)
            translateY(0);
    }

    50% {
        transform:
            scale(1.008)
            translateY(-1px);
    }

    100% {
        transform:
            scale(1)
            translateY(0);
    }
}

/* ============================================================
   MOVIMIENTO AL HABLAR
   ============================================================ */

.avatar-zona.hablando #avatar {

    animation:
        hablando 1.7s ease-in-out infinite;
}

@keyframes hablando {

    0% {
        transform:
            scale(1)
            translateY(0)
            rotate(0deg);
    }

    25% {
        transform:
            scale(1.01)
            translateY(-1px)
            rotate(-.2deg);
    }

    50% {
        transform:
            scale(1.015)
            translateY(0)
            rotate(.2deg);
    }

    75% {
        transform:
            scale(1.01)
            translateY(1px)
            rotate(-.1deg);
    }

    100% {
        transform:
            scale(1)
            translateY(0)
            rotate(0deg);
    }
}

/* ============================================================
   BRILLO
   ============================================================ */

.avatar-zona::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    border-radius: 17px;

    box-shadow:
        inset 0 0 35px rgba(0,110,255,.22);
}

.avatar-zona.hablando::after {

    box-shadow:
        inset 0 0 45px rgba(0,255,102,.18);
}

/* ============================================================
   CARA
   ============================================================ */

.cara {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 5;
}

/* ============================================================
   OJOS
   ============================================================ */

.ojo {

    position: absolute;

    width: 6%;
    height: 4%;

    opacity: 0;

    transform-origin: center;
}

.ojo.izquierdo {
    left: 38%;
    top: 38%;
}

.ojo.derecho {
    left: 56%;
    top: 38%;
}

/* ============================================================
   PARPADEO
   ============================================================ */

.parpadeando .ojo {

    animation:
        parpadeo .18s ease-in-out;
}

@keyframes parpadeo {

    0% {
        transform: scaleY(1);
    }

    45% {
        transform: scaleY(.05);
    }

    100% {
        transform: scaleY(1);
    }
}

/* ============================================================
   CEJAS
   ============================================================ */

.ceja {

    position: absolute;

    width: 8%;
    height: 2%;

    opacity: 0;

    transform-origin: center;
}

.ceja.izquierda {

    left: 36.5%;
    top: 33%;
}

.ceja.derecha {

    left: 55%;
    top: 33%;
}

.avatar-zona.hablando .ceja {

    animation:
        cejas 1.2s ease-in-out infinite;
}

@keyframes cejas {

    0% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-2px);
    }

    100% {
        transform:
            translateY(0);
    }
}

/* ============================================================
   BOCA
   ============================================================ */

.boca {

    position: absolute;

    left: 42.5%;
    top: 56%;

    width: 15%;
    height: 6%;

    opacity: 0;
}

.avatar-zona.hablando .boca {

    opacity: 1;
}

.boca::after {

    content: "";

    position: absolute;

    left: 15%;
    top: 35%;

    width: 70%;
    height: 30%;

    border-radius: 50%;

    background: rgba(255,0,80,0);

    transform-origin: center;
}

.avatar-zona.hablando .boca::after {

    animation:
        boca .22s ease-in-out infinite alternate;
}

@keyframes boca {

    0% {
        transform:
            scaleX(.7)
            scaleY(.3);
    }

    50% {
        transform:
            scaleX(1)
            scaleY(.9);
    }

    100% {
        transform:
            scaleX(.8)
            scaleY(.45);
    }
}

/* ============================================================
   CONTROLES
   ============================================================ */

.controles {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 9px;
}

.controles button {

    border: 1px solid #0077ff;

    border-radius: 11px;

    background: #050505;

    color: white;

    padding: 10px 13px;

    font-weight: bold;
}

/* ============================================================
   INFORMACIÓN VOZ
   ============================================================ */

.info-voz {

    margin-top: 9px;

    padding: 9px;

    text-align: center;

    border-radius: 10px;

    background: #080808;

    border: 1px solid #273d52;

    color: #9eb8d0;

    font-size: 12px;
}

/* ============================================================
   CHAT
   ============================================================ */

.chat {

    margin-top: 10px;

    min-height: 190px;

    max-height: 400px;

    overflow-y: auto;

    padding: 10px;

    border: 2px solid #006eff;

    border-radius: 17px;

    background: #050505;
}

.mensaje {

    max-width: 88%;

    padding: 10px 12px;

    margin: 7px 0;

    border-radius: 14px;

    font-size: 15px;

    line-height: 1.4;

    word-wrap: break-word;
}

.mensaje.rafa {

    margin-left: auto;

    background: #123b1f;

    border: 1px solid #00ff66;
}

.mensaje.gepeto {

    margin-right: auto;

    background: #071a35;

    border: 1px solid #0077ff;
}

/* ============================================================
   MÚSICA
   ============================================================ */

.musica {

    margin-top: 10px;

    padding: 12px;

    text-align: center;

    border: 2px solid #006eff;

    border-radius: 17px;

    background: #050505;
}

.musica h3 {

    margin-top: 0;

    color: #00ff66;

    font-size: 16px;
}

#selectorMusica {

    width: 100%;

    color: white;

    margin-bottom: 8px;
}

#reproductorMusica {

    width: 100%;
}

/* ============================================================
   CHAT FIJO
   ============================================================ */

.chat-fijo {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 3000;

    padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));

    background:
        rgba(0,0,0,.97);

    border-top: 2px solid #006eff;
}

.chat-fila {

    display: flex;

    gap: 6px;

    width: 100%;

    max-width: 900px;

    margin: auto;

    align-items: flex-end;
}

#entrada {

    flex: 1;

    min-width: 0;

    min-height: 45px;

    max-height: 100px;

    resize: none;

    padding: 11px;

    border-radius: 12px;

    border: 1px solid #0077ff;

    background: #101010;

    color: white;

    font-size: 16px;
}

.chat-fila button {

    min-width: 45px;

    height: 45px;

    border: none;

    border-radius: 12px;

    font-weight: bold;
}

#microfono {

    background: #222;

    color: white;

    font-size: 18px;
}

#enviar {

    background: #00ff66;

    color: black;

    padding: 0 14px;
}

/* ============================================================
   PANTALLA DE PREPARACIÓN
   ============================================================ */

#pantallaCarga {

    position: fixed;

    inset: 0;

    z-index: 5000;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #020202;

    transition: opacity .5s;
}

.cajaCarga {

    width: 90%;

    max-width: 420px;

    padding: 25px;

    border: 2px solid #006eff;

    border-radius: 20px;

    background: #080808;

    text-align: center;

    box-shadow:
        0 0 30px rgba(0,110,255,.5);
}

.cajaCarga h2 {

    color: #00ff66;
}

#barra {

    width: 100%;

    height: 8px;

    margin-top: 15px;

    background: #222;

    border-radius: 20px;

    overflow: hidden;
}

#barraDentro {

    width: 0%;

    height: 100%;

    background: #00ff66;

    transition: width .2s;
}

/* ============================================================
   MÓVIL
   ============================================================ */

@media(max-width:600px) {

    .principal {
        padding: 7px;
    }

    .video-panel {
        padding: 6px;
    }

    .titulo {
        font-size: 13px;
    }

    .cabecera button {
        font-size: 10px;
        padding: 8px;
    }
}

</style>

</head>

<body>


<!-- ============================================================
     PANTALLA CARGA

<div id="pantallaCarga">

    <div class="cajaCarga">

        <h2>🤖 GE-PETO</h2>

<!-- ============================================================

<header class="cabecera">

<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->

<script type="module">

/*
============================================================
 PIPER TTS
============================================================
*/

import * as tts from
"https://cdn.jsdelivr.net/npm/@realtimex/piper-tts-web/+esm";


/*
============================================================
 CONFIGURACIÓN
============================================================
*/

const VOZ =
"es_ES-davefx-medium";

const WORKER =
"https://gepetto-rafa.rafadun18.workers.dev/preguntar";


/*
============================================================
 ELEMENTOS
============================================================
*/

const pantallaCarga =
document.getElementById(
    "pantallaCarga"
);

const textoCarga =
document.getElementById(
    "textoCarga"
);

const barraDentro =
document.getElementById(
    "barraDentro"
);

const estado =
document.getElementById(
    "estado"
);

const infoVoz =
document.getElementById(
    "infoVoz"
);

const avatarZona =
document.getElementById(
    "avatarZona"
);

const cara =
document.getElementById(
    "cara"
);

const chat =
document.getElementById(
    "chat"
);

const entrada =
document.getElementById(
    "entrada"
);

const enviar =
document.getElementById(
    "enviar"
);

const microfono =
document.getElementById(
    "microfono"
);

const parar =
document.getElementById(
    "parar"
);

const probarVoz =
document.getElementById(
    "probarVoz"
);

const parpadear =
document.getElementById(
    "parpadear"
);

const biblioteca =
document.getElementById(
    "biblioteca"
);

const selectorMusica =
document.getElementById(
    "selectorMusica"
);

const reproductorMusica =
document.getElementById(
    "reproductorMusica"
);


/*
============================================================
 VARIABLES
============================================================
*/

let vozPreparada = false;

let audioGePeTo = null;

let urlAudio = null;

let reconocimiento = null;


/*
============================================================
 ESTADO
============================================================
*/

function estadoGePeTo(
    texto,
    hablando = false
) {

    estado.textContent =
    texto;

    if (hablando) {

        estado.classList.add(
            "hablando"
        );

        avatarZona.classList.add(
            "hablando"
        );

    } else {

        estado.classList.remove(
            "hablando"
        );

        avatarZona.classList.remove(
            "hablando"
        );

    }

}


/*
============================================================
 BIBLIOTECA
============================================================
*/

biblioteca.onclick = () => {

    window.location.href =
    "./biblioteca.html";

};


/*
============================================================
 PREPARAR VOZ
============================================================
*/

async function prepararVoz() {

    try {

        textoCarga.textContent =
        "Preparando voz masculina española...";


        infoVoz.textContent =
        "⏳ Preparando GePeTo...";


        /*
        Piper permite descargar el modelo
        por adelantado y almacenarlo
        en el almacenamiento privado
        del navegador.
        */

        await tts.download(
            VOZ,
            (progreso) => {

                if (
                    progreso &&
                    progreso.loaded &&
                    progreso.total
                ) {

                    const porcentaje =
                    Math.round(
                        progreso.loaded /
                        progreso.total *
                        100
                    );

                    barraDentro.style.width =
                    porcentaje + "%";

                    textoCarga.textContent =
                    "Preparando voz masculina: " +
                    porcentaje +
                    "%";

                }

            }
        );


        vozPreparada = true;


        barraDentro.style.width =
        "100%";


        textoCarga.textContent =
        "✅ Voz preparada";


        infoVoz.innerHTML =
        "🟢 Voz masculina española preparada · " +
        "<b>es_ES-davefx-medium</b>";


        estadoGePeTo(
            "🟢 GE-PETO CONECTADO"
        );


        setTimeout(
            () => {

                pantallaCarga.style.opacity =
                "0";

                setTimeout(
                    () => {

                        pantallaCarga.style.display =
                        "none";

                    },
                    500
                );

            },
            600
        );

    }

    catch(error) {

        console.error(
            "Piper:",
            error
        );


        vozPreparada = false;


        textoCarga.textContent =
        "⚠️ La voz necesita activarse";


        infoVoz.textContent =
        "Pulsa PROBAR VOZ para iniciar el motor.";


        pantallaCarga.style.opacity =
        "0";


        setTimeout(
            () => {

                pantallaCarga.style.display =
                "none";

            },
            500
        );

    }

}


/*
============================================================
 PARPADEAR
============================================================
*/

function parpadearAhora() {

    cara.classList.remove(
        "parpadeando"
    );

    void cara.offsetWidth;

    cara.classList.add(
        "parpadeando"
    );

}


parpadear.onclick =
parpadearAhora;


/*
============================================================
 PARPADEO AUTOMÁTICO
============================================================
*/

function parpadeoAutomatico() {

    parpadearAhora();

    const tiempo =
    2500 +
    Math.random() * 4500;

    setTimeout(
        parpadeoAutomatico,
        tiempo
    );

}

setTimeout(
    parpadeoAutomatico,
    3000
);


/*
============================================================
 DETENER AUDIO
============================================================
*/

function detenerVoz() {

    if (audioGePeTo) {

        try {
            audioGePeTo.pause();
        }
        catch(e) {}

        audioGePeTo =
        null;
    }


    if (urlAudio) {

        try {
            URL.revokeObjectURL(
                urlAudio
            );
        }
        catch(e) {}

        urlAudio =
        null;
    }


    avatarZona.classList.remove(
        "hablando"
    );

    estado.classList.remove(
        "hablando"
    );

}


/*
============================================================
 HABLAR
============================================================
*/

async function hablar(
    texto
) {

    if (!texto) {
        return;
    }


    if (!vozPreparada) {

        /*
        Si Safari no dejó descargar
        automáticamente, intentamos
        descargar aquí.
        */

        try {

            infoVoz.textContent =
            "⏳ Activando voz...";


            await tts.download(
                VOZ
            );


            vozPreparada =
            true;

        }

        catch(error) {

            console.error(
                error
            );

            infoVoz.textContent =
            "❌ No se pudo preparar la voz.";

            return;

        }

    }


    try {

        detenerVoz();


        estadoGePeTo(
            "🟢 GE-PETO HABLANDO",
            true
        );


        /*
        GENERAR WAV
        */

        const wav =
        await tts.predict({

            text:
            texto,

            voiceId:
            VOZ

        });


        /*
        Crear URL del Blob
        */

        urlAudio =
        URL.createObjectURL(
            wav
        );


        /*
        EXACTAMENTE EL MÉTODO
        QUE USA LA PRUEBA DE PIPER
        */

        audioGePeTo =
        new Audio();


        audioGePeTo.src =
        urlAudio;

        audioGePeTo.preload =
        "auto";

        audioGePeTo.volume =
        1;


        /*
        Cuando empieza
        */

        audioGePeTo.onplay =
        () => {

            estadoGePeTo(
                "🟢 GE-PETO HABLANDO",
                true
            );

        };


        /*
        Cuando termina
        */

        audioGePeTo.onended =
        () => {

            detenerVoz();

            estadoGePeTo(
                "🟢 GE-PETO CONECTADO"
            );

        };


        /*
        Error real de reproducción
        */

        audioGePeTo.onerror =
        (evento) => {

            console.error(
                "Audio error:",
                evento,
                audioGePeTo.error
            );


            detenerVoz();


            estadoGePeTo(
                "⚠️ Error reproduciendo la voz"
            );

        };


        /*
        REPRODUCCIÓN
        */

        await audioGePeTo.play();

    }

    catch(error) {

        console.error(
            "Error completo Piper:",
            error
        );


        detenerVoz();


        estadoGePeTo(
            "⚠️ No se pudo reproducir la voz"
        );


        infoVoz.innerHTML =
        "❌ Error: " +
        (
            error.message ||
            "reproducción bloqueada"
        );

    }

}


/*
============================================================
 PROBAR VOZ
============================================================
*/

probarVoz.onclick =
async () => {

    await hablar(
        "Hola Rafa. Soy GePeTo. " +
        "Esta es mi voz masculina en español de España. " +
        "Ahora estamos conectados en nuestra videoconferencia."
    );

};


/*
============================================================
 PARAR
============================================================
*/

parar.onclick =
() => {

    detenerVoz();

    estadoGePeTo(
        "🔵 GePeTo en espera"
    );

};


/*
============================================================
 AÑADIR MENSAJE
============================================================
*/

function añadirMensaje(
    texto,
    tipo
) {

    const elemento =
    document.createElement(
        "div"
    );


    elemento.className =
    "mensaje " +
    tipo;


    elemento.textContent =
    texto;


    chat.appendChild(
        elemento
    );


    chat.scrollTop =
    chat.scrollHeight;

}


/*
============================================================
 EXTRAER RESPUESTA WORKER
============================================================
*/

function extraerRespuesta(
    datos
) {

    if (!datos) {
        return "";
    }


    if (
        typeof datos ===
        "string"
    ) {

        return datos;

    }


    const claves = [

        "respuesta",
        "response",
        "texto",
        "text",
        "answer",
        "content",
        "message"

    ];


    for (
        const clave
        of claves
    ) {

        if (
            typeof datos[clave] ===
            "string" &&
            datos[clave].trim()
        ) {

            return datos[clave].trim();

        }

    }


    /*
    Búsqueda recursiva
    */

    function buscar(
        objeto,
        nivel = 0
    ) {

        if (
            nivel > 6 ||
            !objeto ||
            typeof objeto !==
            "object"
        ) {

            return "";

        }


        for (
            const clave
            of Object.keys(objeto)
        ) {

            const valor =
            objeto[clave];


            if (
                typeof valor ===
                "string" &&
                valor.trim()
            ) {

                const nombre =
                clave.toLowerCase();


                if (
                    nombre.includes(
                        "text"
                    ) ||
                    nombre.includes(
                        "response"
                    ) ||
                    nombre.includes(
                        "respuesta"
                    ) ||
                    nombre.includes(
                        "content"
                    ) ||
                    nombre.includes(
                        "answer"
                    )
                ) {

                    return valor.trim();

                }

            }


            if (
                valor &&
                typeof valor ===
                "object"
            ) {

                const resultado =
                buscar(
                    valor,
                    nivel + 1
                );


                if (resultado) {
                    return resultado;
                }

            }

        }


        return "";

    }


    return buscar(
        datos
    );

}


/*
============================================================
 ENVIAR A WORKER
============================================================
*/

async function enviarMensaje() {

    const texto =
    entrada.value.trim();


    if (!texto) {
        return;
    }


    añadirMensaje(
        texto,
        "rafa"
    );


    entrada.value =
    "";


    estadoGePeTo(
        "🔵 GePeTo está pensando..."
    );


    enviar.disabled =
    true;


    try {

        const respuesta =
        await fetch(
            WORKER,
            {

                method:
                "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify({

                    mensaje:
                    texto,

                    texto:
                    texto,

                    pregunta:
                    texto

                })

            }
        );


        if (!respuesta.ok) {

            throw new Error(
                "HTTP " +
                respuesta.status
            );

        }


        const datos =
        await respuesta.json();


        console.log(
            "GePeTo:",
            datos
        );


        const respuestaTexto =
        extraerRespuesta(
            datos
        );


        if (
            respuestaTexto
        ) {

            añadirMensaje(
                respuestaTexto,
                "gepeto"
            );


            /*
            HABLAR AUTOMÁTICAMENTE
            */

            await hablar(
                respuestaTexto
            );

        }

        else {

            añadirMensaje(
                "GePeTo respondió, pero no recibí texto.",
                "gepeto"
            );


            estadoGePeTo(
                "⚠️ Respuesta sin texto"
            );

        }

    }

    catch(error) {

        console.error(
            error
        );


        añadirMensaje(
            "No puedo conectar ahora mismo con GePeTo.",
            "gepeto"
        );


        estadoGePeTo(
            "❌ Error de conexión"
        );

    }

    finally {

        enviar.disabled =
        false;

        entrada.focus();

    }

}


/*
============================================================
 BOTÓN ENVIAR
============================================================
*/

enviar.onclick =
enviarMensaje;


/*
============================================================
 ENTER
============================================================
*/

entrada.addEventListener(
    "keydown",
    (evento) => {

        if (
            evento.key ===
            "Enter" &&
            !evento.shiftKey
        ) {

            evento.preventDefault();

            enviarMensaje();

        }

    }
);


/*
============================================================
 MICRÓFONO
============================================================
*/

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (SpeechRecognition) {

    reconocimiento =
    new SpeechRecognition();


    reconocimiento.lang =
    "es-ES";


    reconocimiento.continuous =
    false;


    reconocimiento.interimResults =
    false;


    reconocimiento.onstart =
    () => {

        microfono.textContent =
        "🔴";

        estadoGePeTo(
            "🎤 Escuchando..."
        );

    };


    reconocimiento.onresult =
    (evento) => {

        const resultado =
        evento
        .results[0][0]
        .transcript;


        entrada.value =
        resultado;


        enviarMensaje();

    };


    reconocimiento.onerror =
    (error) => {

        console.log(
            "Micrófono:",
            error
        );

        microfono.textContent =
        "🎤";

    };


    reconocimiento.onend =
    () => {

        microfono.textContent =
        "🎤";

    };


    microfono.onclick =
    () => {

        try {

            reconocimiento.start();

        }

        catch(error) {

            console.log(
                error
            );

        }

    };

}

else {

    microfono.onclick =
    () => {

        alert(
            "El reconocimiento de voz no está disponible en este navegador."
        );

    };

}


/*
============================================================
 MÚSICA
============================================================
*/

selectorMusica.onchange =
() => {

    const archivo =
    selectorMusica.files[0];


    if (!archivo) {
        return;
    }


    const url =
    URL.createObjectURL(
        archivo
    );


    reproductorMusica.src =
    url;


    reproductorMusica.play()
    .catch(
        () => {}
    );

};

 PREPARAR VOZ AUTOMÁTICAMENTE

*/

prepararVoz();

 FIN
