<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Videoconferencia · GePeTo</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
background:#05070b;
color:#fff;
font-family:Arial,sans-serif;
}

body{
overflow-x:hidden;
}

button{
font-family:Arial,sans-serif;
cursor:pointer;
}

#app{
min-height:100vh;
padding-bottom:100px;
}

/* CABECERA */

header{
position:sticky;
top:0;
z-index:100;
display:flex;
align-items:center;
gap:8px;
padding:10px;
background:#050b12;
border-bottom:1px solid #174a78;
}

header button{
border:1px solid #286895;
border-radius:12px;
background:#081723;
color:#fff;
padding:10px 12px;
font-size:13px;
font-weight:bold;
}

#parar{
background:#260909;
border-color:#9b2d2d;
color:#ff7777;
}

.titulo{
flex:1;
text-align:center;
}

.titulo strong{
display:block;
font-size:18px;
color:#48a9ff;
}

.titulo span{
display:block;
font-size:10px;
color:#9eb8d0;
margin-top:2px;
}

/* AVATAR */

.avatarBox{
display:flex;
justify-content:center;
padding:18px 10px 8px;
}

.avatarStage{
position:relative;
width:min(270px,75vw);
aspect-ratio:1/1;
animation:respirar 5s ease-in-out infinite;
}

@keyframes respirar{
0%,100%{
transform:translate(0,0) rotate(0deg);
}
25%{
transform:translate(-1px,-1px) rotate(-.15deg);
}
50%{
transform:translate(1px,0) rotate(.15deg);
}
75%{
transform:translate(-1px,1px) rotate(-.1deg);
}
}

/* FOTO CORRECTA */

.avatar{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
border:3px solid #1685ff;
background:#07101c;
box-shadow:
0 0 20px rgba(0,130,255,.65),
0 0 55px rgba(0,80,255,.25);
}

/* CAPA DE RASGOS */

.cara{
position:absolute;
inset:0;
z-index:5;
pointer-events:none;
overflow:hidden;
border-radius:50%;

--miradaX:0px;
--miradaY:0px;
--cejaL:0px;
--cejaR:0px;
--bocaX:0px;
--bocaY:0px;
--bocaXscale:1;
--bocaYscale:.75;
--ojoScale:1;
}

/* OJOS */

.ojo{
position:absolute;
top:34%;
width:17%;
height:7%;
border-radius:50%;
background:
radial-gradient(
ellipse at center,
rgba(255,255,255,.7) 0%,
rgba(80,180,255,.35) 30%,
transparent 75%
);
opacity:.34;
filter:blur(.5px);

transform:
translate(
var(--miradaX),
var(--miradaY)
)
scaleY(var(--ojoScale));

transition:transform .08s linear;
}

.ojo.izq{
left:22%;
}

.ojo.der{
right:22%;
}

.ojo:after{
content:"";
position:absolute;
left:50%;
top:50%;
width:25%;
height:55%;
transform:
translate(-50%,-50%)
translate(
calc(var(--miradaX) * .5),
calc(var(--miradaY) * .3)
);
border-radius:50%;
background:
radial-gradient(
circle,
white 0 15%,
#69baff 28%,
#111 55%,
transparent 72%
);
opacity:.8;
}

/* CEJAS */

.ceja{
position:absolute;
top:29%;
width:19%;
height:3%;
border-radius:50%;
background:
linear-gradient(
90deg,
transparent,
rgba(100,190,255,.35),
transparent
);
opacity:.3;
filter:blur(.7px);
}

.ceja.izq{
left:21%;
transform:
translateY(var(--cejaL))
rotate(-2deg);
transition:transform .2s ease;
}

.ceja.der{
right:21%;
transform:
translateY(var(--cejaR))
rotate(2deg);
transition:transform .2s ease;
}

/* MEJILLAS */

.mejilla{
position:absolute;
top:55%;
width:21%;
height:12%;
border-radius:50%;
background:
radial-gradient(
circle,
rgba(40,160,255,.25),
transparent 72%
);
opacity:.12;
filter:blur(4px);
transition:.4s;
}

.mejilla.izq{
left:13%;
}

.mejilla.der{
right:13%;
}

/* BOCA */

.boca{
position:absolute;
left:34%;
top:59%;
width:32%;
height:9%;
border-radius:12% 12% 50% 50%;

background:
radial-gradient(
ellipse at center,
rgba(5,5,10,.85) 0 35%,
rgba(40,150,255,.25) 55%,
transparent 80%
);

border:1px solid rgba(100,190,255,.2);

opacity:.2;

transform:
translate(
var(--bocaX),
var(--bocaY)
)
scaleX(var(--bocaXscale))
scaleY(var(--bocaYscale));

transition:
transform .09s linear,
border-radius .2s ease,
opacity .2s ease;
}

/* SONRISA */

.cara.sonriendo .boca{
border-radius:5% 5% 70% 70%;
opacity:.35;
}

.cara.sonriendo .mejilla{
opacity:.34;
transform:scale(1.12);
}

.sonrisa{
position:absolute;
left:30%;
top:60%;
width:40%;
height:12%;
border-bottom:2px solid rgba(100,200,255,.3);
border-radius:0 0 50% 50%;
opacity:0;
transform:scaleX(.7);
transition:.3s;
}

.cara.sonriendo .sonrisa{
opacity:.5;
transform:scaleX(1);
}

/* PARPADEO */

.cara.parpadeando{
--ojoScale:.08;
}

.cara.parpadeando .ceja{
transform:translateY(1px);
}

/* HABLANDO */

.avatarStage.hablando{
animation:cabezaHabla 2.8s ease-in-out infinite;
}

@keyframes cabezaHabla{
0%,100%{
transform:translate(0,0) rotate(0);
}
20%{
transform:translate(-1px,0) rotate(-.18deg);
}
45%{
transform:translate(1px,1px) rotate(.18deg);
}
70%{
transform:translate(1px,0) rotate(.12deg);
}
85%{
transform:translate(-1px,0) rotate(-.12deg);
}
}

.avatarStage.hablando .avatar{
box-shadow:
0 0 24px rgba(0,145,255,.8),
0 0 60px rgba(0,100,255,.4);
}

/* ESTADO */

.estado{
text-align:center;
padding:5px 12px 15px;
color:#62b6ff;
font-size:13px;
font-weight:bold;
}

/* CONTROLES */

.controles{
display:flex;
justify-content:center;
gap:8px;
padding:0 12px 14px;
}

.controles button{
border:1px solid #286895;
border-radius:12px;
background:#081723;
color:white;
padding:10px 14px;
font-weight:bold;
}

/* VOZ */

.prueba,
.musica{
margin:0 12px 14px;
padding:13px;
border:1px solid #174a78;
border-radius:15px;
background:#07121c;
}

.pruebaTitulo{
font-size:13px;
font-weight:bold;
color:#72bdff;
margin-bottom:9px;
}

#probarVoz{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #2788d0;
background:#0a263c;
color:white;
font-weight:bold;
}

.musica h3{
margin:0 0 10px;
font-size:14px;
color:#8ccaff;
}

#selectorMusica{
width:100%;
margin-bottom:8px;
color:#ddd;
}

#reproductorMusica{
width:100%;
}

/* CHAT */

#chat{
display:flex;
flex-direction:column;
gap:10px;
padding:8px 12px 20px;
}

.sistema{
text-align:center;
color:#8fa6b8;
font-size:12px;
padding:5px;
}

.mensaje{
padding:12px 14px;
border-radius:15px;
font-size:15px;
line-height:1.45;
white-space:pre-wrap;
overflow-wrap:anywhere;
}

.usuario{
align-self:flex-end;
background:#10283c;
border:1px solid #245a82;
}

.gepeto{
align-self:flex-start;
background:#061d12;
border:1px solid #18a85c;
color:#b1ffd0;
width:100%;
}

.cabeceraRespuesta{
font-size:11px;
font-weight:bold;
color:#50aaff;
margin-bottom:6px;
}

.oir{
margin-top:8px;
padding:8px 11px;
border-radius:10px;
border:1px solid #1e9d5b;
background:#082b19;
color:#9affc1;
font-weight:bold;
}

.error{
color:#ff7272;
text-align:center;
font-size:13px;
padding:8px;
}

/* COMPOSITOR */

.compositor{
position:fixed;
left:0;
right:0;
bottom:0;
z-index:500;

display:flex;
gap:7px;
align-items:flex-end;

padding:8px 8px calc(8px + env(safe-area-inset-bottom));

background:rgba(3,8,14,.98);
border-top:1px solid #174a78;
}

#mensaje{
flex:1;
min-height:46px;
max-height:120px;
resize:none;

padding:12px;

border:1px solid #285274;
border-radius:13px;

background:#07121d;
color:white;

font-size:15px;
outline:none;
}

#microfono,
#enviar{
width:46px;
height:46px;
flex:none;
border-radius:13px;
border:1px solid #2a628e;
background:#0a1d2d;
color:white;
font-size:20px;
}

#enviar{
background:#083b23;
border-color:#1b9856;
}

#microfono.activo{
background:#661616;
border-color:#ff5555;
}

@media(max-width:420px){

.avatarStage{
width:min(230px,70vw);
}

.mensaje{
font-size:14px;
}

}

/* CARGANDO */

.cargando{
color:#70bfff;
text-align:center;
font-size:13px;
padding:8px;
}
</style>
</head>

<body>

<div id="app">

<header>

<button type="button"
onclick="location.href='biblioteca.html'">
← BIBLIOTECA
</button>

<div class="titulo">
<strong>GePeTo</strong>
<span>VIDEOCONFERENCIA</span>
</div>

<button id="parar"
type="button">
🛑 PARAR
</button>

</header>

<section class="avatarBox">

<div id="avatarStage"
class="avatarStage">

<img
id="avatar"
class="avatar"
src="GePeToFrontal.png"
alt="GePeTo">

<div
id="cara"
class="cara">

<div class="ojo izq"></div>
<div class="ojo der"></div>

<div class="ceja izq"></div>
<div class="ceja der"></div>

<div class="mejilla izq"></div>
<div class="mejilla der"></div>

<div id="boca"
class="boca"></div>

<div class="sonrisa"></div>

</div>

</div>

</section>

<div id="estado"
class="estado">
🟢 GePeTo preparado
</div>

<div class="controles">

<button
id="parpadearBtn"
type="button">
👁️ PARPADEAR
</button>

</div>

<section class="prueba">

<div class="pruebaTitulo">
🔊 PRUEBA DE VOZ
</div>

<button
id="probarVoz"
type="button">
🔊 PROBAR VOZ
</button>

</section>

<section class="musica">

<h3>
🎵 Música de fondo
</h3>

<input
id="selectorMusica"
type="file"
accept="audio/*">

<audio
id="reproductorMusica"
controls>
</audio>

</section>

<section id="chat">

<div class="sistema">
GePeTo está preparado para hablar contigo.
</div>

</section>

</div>

<div class="compositor">

<textarea
id="mensaje"
rows="1"
placeholder="Escribe a GePeTo..."></textarea>

<button
id="microfono"
type="button">
🎤
</button>

<button
id="enviar"
type="button">
➤
</button>

</div>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const WORKER =
"https://gepetto-rafa.rafadun18.workers.dev";

const PREGUNTAR =
WORKER + "/preguntar";

const VOZ =
WORKER + "/voz";


/* =========================================================
   ELEMENTOS
========================================================= */

const avatarStage =
document.getElementById("avatarStage");

const cara =
document.getElementById("cara");

const boca =
document.getElementById("boca");

const estado =
document.getElementById("estado");

const chat =
document.getElementById("chat");

const mensaje =
document.getElementById("mensaje");

const enviar =
document.getElementById("enviar");

const microfono =
document.getElementById("microfono");

const parar =
document.getElementById("parar");

const probarVoz =
document.getElementById("probarVoz");

const parpadearBtn =
document.getElementById("parpadearBtn");

const selectorMusica =
document.getElementById("selectorMusica");

const reproductorMusica =
document.getElementById("reproductorMusica");


/* =========================================================
   VARIABLES
========================================================= */

let hablando=false;
let reconocimiento=null;
let escuchando=false;
let audioActual=null;
let audioURL=null;
let ultimaRespuesta="";
let bocaTimer=null;
let parpadeoTimer=null;
let miradaTimer=null;
let musicaPausada=false;


/* =========================================================
   AÑADIR MENSAJE
========================================================= */

function mensajeUsuario(texto){

const div=document.createElement("div");

div.className="mensaje usuario";

div.textContent=texto;

chat.appendChild(div);

bajarChat();

}


function mensajeGePeTo(texto){

const div=document.createElement("div");

div.className="mensaje gepeto";

const cab=document.createElement("div");

cab.className="cabeceraRespuesta";

cab.textContent="GePeTo";

const cuerpo=document.createElement("div");

cuerpo.textContent=texto;

const boton=document.createElement("button");

boton.className="oir";

boton.type="button";

boton.textContent="🔊 OÍR";

boton.onclick=()=>{

hablar(texto);

};

div.appendChild(cab);

div.appendChild(cuerpo);

div.appendChild(boton);

chat.appendChild(div);

bajarChat();

}


function bajarChat(){

setTimeout(()=>{

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

},50);

}


/* =========================================================
   EXTRAER TEXTO
========================================================= */

function extraerTexto(data){

if(typeof data==="string"){
return data.trim();
}

if(!data){
return "";
}

const posibles=[

data.respuesta,
data.response,
data.texto,
data.text,
data.mensaje,
data.message,
data.answer,
data.reply,
data.content,
data.output,

data.result?.respuesta,
data.result?.response,
data.result?.texto,
data.result?.text,
data.result?.message,
data.result?.answer,
data.result?.reply,
data.result?.content

];

for(const x of posibles){

if(typeof x==="string" && x.trim()){
return x.trim();
}

}

return "";

}


/* =========================================================
   MOVIMIENTO DE MIRADA
========================================================= */

function nuevaMirada(){

const x=(Math.random()*5)-2.5;
const y=(Math.random()*2.5)-1.25;

cara.style.setProperty(
"--miradaX",
x+"px"
);

cara.style.setProperty(
"--miradaY",
y+"px"
);

cara.style.setProperty(
"--cejaL",
((Math.random()*2)-1)+"px"
);

cara.style.setProperty(
"--cejaR",
((Math.random()*2)-1)+"px"
);

miradaTimer=setTimeout(
nuevaMirada,
1800+Math.random()*4000
);

}


/* =========================================================
   PARPADEO
========================================================= */

function parpadear(){

cara.classList.add("parpadeando");

setTimeout(()=>{

cara.classList.remove("parpadeando");

},140);

}


function programarParpadeo(){

parpadeoTimer=setTimeout(()=>{

parpadear();

if(Math.random()<.15){

setTimeout(
parpadear,
200
);

}

programarParpadeo();

},2500+Math.random()*5000);

}


parpadearBtn.onclick=()=>{
parpadear();
};


/* =========================================================
   SONRISA
========================================================= */

function sonreir(){

cara.classList.add("sonriendo");

setTimeout(()=>{

cara.classList.remove("sonriendo");

},2200);

}


/* =========================================================
   BOCA HABLANDO
========================================================= */

function empezarBoca(){

clearInterval(bocaTimer);

bocaTimer=setInterval(()=>{

if(!hablando){
return;
}

cara.style.setProperty(
"--bocaXscale",
(.8+Math.random()*.45).toFixed(2)
);

cara.style.setProperty(
"--bocaYscale",
(.5+Math.random()*.85).toFixed(2)
);

cara.style.setProperty(
"--bocaX",
((Math.random()*1.8)-.9).toFixed(2)+"px"
);

cara.style.setProperty(
"--bocaY",
((Math.random()*1.4)-.7).toFixed(2)+"px"
);

},100);

}


function pararBoca(){

clearInterval(bocaTimer);

cara.style.setProperty(
"--bocaXscale",
"1"
);

cara.style.setProperty(
"--bocaYscale",
".75"
);

}


/* =========================================================
   ESTADO HABLANDO
========================================================= */

function empezarHabla(){

hablando=true;

avatarStage.classList.add(
"hablando"
);

estado.textContent=
"🔵 GePeTo está hablando...";

empezarBoca();

}


function terminarHabla(){

hablando=false;

avatarStage.classList.remove(
"hablando"
);

pararBoca();

estado.textContent=
"🟢 GePeTo preparado";

}


/* =========================================================
   PARAR
========================================================= */

function pararTodo(){

hablando=false;

if(audioActual){

try{
audioActual.pause();
}catch(e){}

audioActual=null;

}

if(audioURL){

try{
URL.revokeObjectURL(audioURL);
}catch(e){}

audioURL=null;

}

if(window.speechSynthesis){

try{
window.speechSynthesis.cancel();
}catch(e){}

}

terminarHabla();

estado.textContent=
"🟢 GePeTo preparado";

}


/* =========================================================
   VOZ PIPER
========================================================= */

async function hablar(texto){

if(!texto){
return;
}

pararTodo();

musicaPausada=false;

try{

if(
reproductorMusica &&
!reproductorMusica.paused
){

musicaPausada=true;

reproductorMusica.pause();

}

}catch(e){}


/* INTENTAR PIPER */

try{

const respuesta=
await fetch(
VOZ,
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
texto:texto,
text:texto,
mensaje:texto
})
}
);

const tipo=
respuesta.headers.get(
"content-type"
)||"";

if(
respuesta.ok &&
tipo.includes("audio")
){

const blob=
await respuesta.blob();

audioURL=
URL.createObjectURL(
blob
);

audioActual=
new Audio(
audioURL
);

audioActual.onplay=()=>{

empezarHabla();

};

audioActual.onended=()=>{

terminarHabla();

if(
musicaPausada
){

reproductorMusica
.play()
.catch(()=>{});

}

};

await audioActual.play();

return;

}

}catch(error){

console.log(
"Piper no disponible:",
error
);

}


/* RESPALDO NAVEGADOR */

if(
window.speechSynthesis
){

const voz=
new SpeechSynthesisUtterance(
texto
);

voz.lang="es-ES";
voz.rate=.96;
voz.pitch=.96;
voz.volume=1;

voz.onstart=()=>{
empezarHabla();
};

voz.onend=()=>{

terminarHabla();

if(
musicaPausada
){

reproductorMusica
.play()
.catch(()=>{});

}

};

window.speechSynthesis.speak(
voz
);

}

}


/* =========================================================
   PRUEBA VOZ
========================================================= */

probarVoz.onclick=()=>{

sonreir();

hablar(
"Hola Rafa. Soy GePeTo. Estoy preparado para hablar contigo."
);

};


/* =========================================================
   PARAR
========================================================= */

parar.onclick=()=>{

pararTodo();

};


/* =========================================================
   ENVIAR A GEPETO
========================================================= */

async function enviarMensaje(){

const texto=
mensaje.value.trim();

if(!texto){
return;
}

pararTodo();

mensajeUsuario(texto);

mensaje.value="";
mensaje.style.height="46px";

enviar.disabled=true;

estado.textContent=
"🔄 GePeTo está pensando...";

const cargando=
document.createElement("div");

cargando.className=
"cargando";

cargando.textContent=
"GePeTo está pensando...";

chat.appendChild(cargando);

bajarChat();

try{

/*
==========================================================
CORRECCIÓN PRINCIPAL:

ANTES:
WORKER /

AHORA:
WORKER /preguntar
==========================================================
*/

const respuesta=
await fetch(
PREGUNTAR,
{
method:"POST",

headers:{
"Content-Type":
"application/json",

"Accept":
"application/json,text/plain,*/*"
},

body:JSON.stringify({

mensaje:texto,

prompt:texto,

message:texto

})

}
);

const contenido=
await respuesta.text();

let data;

try{

data=
JSON.parse(contenido);

}catch(e){

data=
contenido;

}

if(
data &&
typeof data==="object" &&
data.ok===false
){

throw new Error(
data.error ||
data.message ||
"GePeTo rechazó la petición."
);

}

if(!respuesta.ok){

throw new Error(
"HTTP "+respuesta.status+
" "+contenido
);

}

const textoRespuesta=
extraerTexto(data);

if(!textoRespuesta){

throw new Error(
"El Worker no devolvió una respuesta de texto."
);

}

cargando.remove();

ultimaRespuesta=
textoRespuesta;

mensajeGePeTo(
textoRespuesta
);

estado.textContent=
"🟢 GePeTo preparado";

sonreir();

/*
   Habla automáticamente.
*/

hablar(
textoRespuesta
);

}catch(error){

console.error(
"ERROR GEPETO:",
error
);

cargando.remove();

const err=
document.createElement("div");

err.className="error";

err.textContent=
"❌ No se pudo obtener respuesta de GePeTo. "+
(error.message||"");

chat.appendChild(err);

estado.textContent=
"🔴 Error de conexión con GePeTo";

bajarChat();

}finally{

enviar.disabled=false;

mensaje.focus();

}

}


/* =========================================================
   BOTÓN ENVIAR
========================================================= */

enviar.onclick=()=>{

enviarMensaje();

};


/* =========================================================
   ENTER
========================================================= */

mensaje.addEventListener(
"keydown",
e=>{

if(
e.key==="Enter" &&
!e.shiftKey
){

e.preventDefault();

enviarMensaje();

}

}
);


/* =========================================================
   AUTOALTURA
========================================================= */

mensaje.addEventListener(
"input",
()=>{

mensaje.style.height="46px";

mensaje.style.height=
Math.min(
mensaje.scrollHeight,
120
)+"px";

}
);


/* =========================================================
   MICRÓFONO
========================================================= */

function iniciarMicrofono(){

const SR=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SR){

estado.textContent=
"⚠️ Este navegador no admite reconocimiento de voz.";

return;

}

if(escuchando){

try{
reconocimiento.stop();
}catch(e){}

return;

}

reconocimiento=
new SR();

reconocimiento.lang=
"es-ES";

reconocimiento.continuous=
false;

reconocimiento.interimResults=
true;

escuchando=true;

microfono.classList.add(
"activo"
);

microfono.textContent=
"⏹️";

estado.textContent=
"🎤 Escuchando...";

reconocimiento.onresult=
event=>{

let texto="";

for(
let i=event.resultIndex;
i<event.results.length;
i++
){

texto+=
event.results[i][0]
.transcript;

}

mensaje.value=
texto.trim();

mensaje.dispatchEvent(
new Event("input")
);

};

reconocimiento.onerror=
event=>{

console.log(
"MIC:",
event.error
);

};

reconocimiento.onend=
()=>{

escuchando=false;

microfono.classList.remove(
"activo"
);

microfono.textContent=
"🎤";

if(
mensaje.value.trim()
){

enviarMensaje();

}else{

estado.textContent=
"🟢 GePeTo preparado";

}

};

try{

reconocimiento.start();

}catch(e){

escuchando=false;

microfono.classList.remove(
"activo"
);

microfono.textContent=
"🎤";

}

}


microfono.onclick=()=>{

iniciarMicrofono();

};


/* =========================================================
   MÚSICA
========================================================= */

selectorMusica.onchange=()=>{

const archivo=
selectorMusica.files[0];

if(!archivo){
return;
}

const url=
URL.createObjectURL(
archivo
);

reproductorMusica.src=
url;

reproductorMusica.load();

reproductorMusica
.play()
.catch(()=>{});

};


/* =========================================================
   INICIO
========================================================= */

nuevaMirada();

programarParpadeo();

setTimeout(
sonreir,
1200
);


/* =========================================================
   LIMPIEZA
========================================================= */

window.addEventListener(
"beforeunload",
()=>{

clearTimeout(
parpadeoTimer
);

clearTimeout(
miradaTimer
);

clearInterval(
bocaTimer
);

if(audioURL){

try{
URL.revokeObjectURL(
audioURL
);
}catch(e){}

}

}
);

</script>
