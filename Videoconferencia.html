<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Videoconferencia · GePeTo</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#05070b;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:145px;
}

/* =========================================================
   CABECERA
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:50;

  background:rgba(5,7,11,.98);

  border-bottom:1px solid #164d88;

  padding:10px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:8px;
}

header button{
  border:1px solid #2488ff;

  background:#071321;

  color:white;

  border-radius:10px;

  padding:10px 12px;

  font-size:14px;

  font-weight:bold;
}

#parar{
  border-color:#ff3030;

  color:#ff6666;
}

/* =========================================================
   TITULO
========================================================= */

.titulo{
  text-align:center;

  padding:12px 10px 4px;
}

.titulo h1{
  margin:0;

  color:#38a8ff;

  font-size:25px;
}

.titulo p{
  margin:5px 0 0;

  color:#aaa;

  font-size:13px;
}

/* =========================================================
   AVATAR
========================================================= */

.avatar-box{
  width:100%;

  max-width:420px;

  margin:10px auto;

  position:relative;

  text-align:center;
}

.avatar{
  width:100%;

  max-width:360px;

  max-height:55vh;

  object-fit:contain;

  border-radius:18px;

  display:block;

  margin:auto;

  box-shadow:
    0 0 15px rgba(0,130,255,.35),
    0 0 35px rgba(0,130,255,.12);
}

.estado{
  margin:8px auto;

  padding:8px 14px;

  width:max-content;

  max-width:90%;

  border:1px solid #145b9d;

  border-radius:20px;

  color:#67baff;

  background:#07111c;

  font-size:13px;
}

/* =========================================================
   CONTROLES
========================================================= */

.controles{
  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:8px;

  padding:5px 10px 10px;
}

.controles button{
  border:1px solid #2187df;

  background:#081522;

  color:white;

  border-radius:12px;

  padding:10px 13px;

  font-size:14px;

  font-weight:bold;
}

.controles button:active{
  transform:scale(.97);
}

/* =========================================================
   MUSICA
========================================================= */

.musica{
  margin:10px auto;

  padding:14px;

  width:calc(100% - 20px);

  max-width:650px;

  border:1px solid #1b476d;

  border-radius:15px;

  background:#071019;
}

.musica h2{
  margin:0 0 10px;

  color:#4eb0ff;

  font-size:17px;
}

#selectorMusica{
  width:100%;

  color:white;

  font-size:13px;
}

#reproductorMusica{
  width:100%;

  margin-top:10px;
}

.pequeno{
  color:#888;

  font-size:12px;

  margin-top:7px;

  line-height:1.4;
}

/* =========================================================
   CHAT
========================================================= */

.chat{
  width:calc(100% - 20px);

  max-width:700px;

  margin:10px auto;

  border:1px solid #1b476d;

  border-radius:15px;

  background:#060c12;

  overflow:hidden;
}

.chat-titulo{
  padding:10px 13px;

  border-bottom:1px solid #173b5b;

  color:#4eb0ff;

  font-weight:bold;
}

#mensajes{
  height:330px;

  overflow-y:auto;

  padding:10px;
}

.mensaje{
  margin:8px 0;

  padding:10px 12px;

  border-radius:12px;

  line-height:1.4;

  white-space:pre-wrap;

  word-break:break-word;
}

.usuario{
  background:#0b263d;

  border:1px solid #155783;

  margin-left:12%;
}

.gepeto{
  background:#101822;

  border:1px solid #2673ad;

  margin-right:12%;
}

.error{
  background:#2a0c0c;

  border:1px solid #9b2424;

  color:#ff8d8d;
}

/* =========================================================
   BOTON OIR
========================================================= */

.boton-oir{
  display:block;

  margin-top:10px;

  border:1px solid #31a7ff;

  background:#071a2a;

  color:white;

  border-radius:10px;

  padding:8px 12px;

  font-size:13px;

  font-weight:bold;
}

.boton-oir:active{
  transform:scale(.97);
}

/* =========================================================
   CHAT INFERIOR
========================================================= */

.chat-inferior{
  position:fixed;

  left:0;

  right:0;

  bottom:0;

  z-index:100;

  background:rgba(4,7,11,.99);

  border-top:1px solid #1c527e;

  padding:8px;

  box-shadow:0 -5px 20px rgba(0,0,0,.45);
}

.chat-form{
  max-width:850px;

  margin:auto;

  display:flex;

  gap:7px;

  align-items:flex-end;
}

#entrada{
  flex:1;

  min-height:45px;

  max-height:120px;

  resize:none;

  border:1px solid #24618d;

  border-radius:12px;

  background:#08111a;

  color:white;

  padding:12px;

  font-size:16px;

  outline:none;
}

#entrada:focus{
  border-color:#3ba7ff;
}

#microfono,
#enviar{
  height:45px;

  min-width:45px;

  border-radius:12px;

  border:1px solid #2689df;

  background:#0a1826;

  color:white;

  font-size:18px;

  font-weight:bold;
}

#enviar{
  padding:0 15px;

  font-size:14px;
}

#microfono.activo{
  border-color:#ff3c3c;

  background:#300d0d;
}

.info-mic{
  text-align:center;

  font-size:11px;

  color:#777;

  margin-top:5px;
}

/* =========================================================
   PARPADEO
========================================================= */

@keyframes parpadeo{

  0%,44%,48%,100%{
    opacity:1;
  }

  45%,47%{
    opacity:.35;
  }

}

.parpadeando{
  animation:parpadeo .18s linear;
}

/* =========================================================
   MOVIL
========================================================= */

@media(max-width:600px){

  header button{
    font-size:12px;

    padding:9px 10px;
  }

  .titulo h1{
    font-size:22px;
  }

  .avatar{
    max-height:43vh;
  }

  #mensajes{
    height:290px;
  }

  .usuario{
    margin-left:5%;
  }

  .gepeto{
    margin-right:5%;
  }

  #enviar{
    padding:0 11px;
  }

}

<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script type="module">

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const WORKER =
  "https://gepetto-rafa.rafadun18.workers.dev/preguntar";

const VOZ =
  "es_ES-davefx-medium";

const PIPER_URL =
  "https://cdn.jsdelivr.net/npm/@realtimex/piper-tts-web@1.1.1/+esm";


/* =========================================================
   ELEMENTOS
========================================================= */

const biblioteca =
  document.getElementById("biblioteca");

const parar =
  document.getElementById("parar");

const probarVoz =
  document.getElementById("probarVoz");

const parpadear =
  document.getElementById("parpadear");

const avatar =
  document.getElementById("avatar");

const estado =
  document.getElementById("estado");

const mensajes =
  document.getElementById("mensajes");

const entrada =
  document.getElementById("entrada");

const microfono =
  document.getElementById("microfono");

const enviar =
  document.getElementById("enviar");

const selectorMusica =
  document.getElementById("selectorMusica");

const reproductorMusica =
  document.getElementById("reproductorMusica");


/* =========================================================
   VARIABLES
========================================================= */

let piperModulo = null;

let piperCargando = false;

let sesionPiper = null;

let audioActual = null;

let audioURLActual = null;

let audioContext = null;

let fuenteActual = null;

let reconociendo = false;

let reconocimiento = null;

let musicaURL = null;


/* =========================================================
   BIBLIOTECA
========================================================= */

biblioteca.onclick = () => {

  window.location.href =
    "./biblioteca.html";

};


/* =========================================================
   PARAR
========================================================= */

parar.onclick = () => {

  try{

    if(audioActual){

      audioActual.pause();

      audioActual.currentTime = 0;

    }

  }catch(error){}

  try{

    if(fuenteActual){

      fuenteActual.stop();

      fuenteActual = null;

    }

  }catch(error){}

  try{

    if(audioContext){

      /*
        No cerramos el AudioContext.
        Lo dejamos preparado para el siguiente
        mensaje.
      */

    }

  }catch(error){}

  estado.textContent =
    "⏹️ GePeTo detenido";

};


/* =========================================================
   PARPADEAR
========================================================= */

parpadear.onclick = () => {

  avatar.classList.remove(
    "parpadeando"
  );

  void avatar.offsetWidth;

  avatar.classList.add(
    "parpadeando"
  );

};


/* =========================================================
   AUDIO CONTEXT
========================================================= */

async function prepararAudio(){

  try{

    if(!audioContext){

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioContext){

        return false;

      }

      audioContext =
        new AudioContext();

    }

    if(
      audioContext.state ===
      "suspended"
    ){

      await audioContext.resume();

    }

    return true;

  }catch(error){

    console.error(
      "Error AudioContext:",
      error
    );

    return false;

  }

}


/* =========================================================
   CARGAR PIPER
========================================================= */

async function cargarPiper(){

  if(piperModulo){

    return piperModulo;

  }

  if(piperCargando){

    while(piperCargando){

      await new Promise(
        resolver =>
          setTimeout(
            resolver,
            100
          )
      );

    }

    return piperModulo;

  }

  piperCargando = true;

  try{

    piperModulo =
      await import(
        PIPER_URL
      );

    console.log(
      "Piper cargado:",
      piperModulo
    );

  }catch(error){

    console.error(
      "No se pudo cargar Piper:",
      error
    );

    piperModulo = null;

  }

  piperCargando = false;

  return piperModulo;

}


/* =========================================================
   CREAR SESIÓN PIPER
========================================================= */

async function crearSesionPiper(){

  const modulo =
    await cargarPiper();

  if(!modulo){

    throw new Error(
      "No se pudo cargar Piper TTS."
    );

  }

  const TtsSession =
    modulo.TtsSession;

  if(!TtsSession){

    throw new Error(
      "TtsSession no está disponible."
    );

  }

  /*
    IMPORTANTE:
    Creamos una sesión nueva cuando
    necesitamos recuperar de un error
    de sesión.
  */

  sesionPiper =
    new TtsSession({

      voiceId:VOZ,

      allowLocalModels:true,

      fallbackStrategy:"auto",

      progress:(progreso)=>{

        if(
          progreso &&
          progreso.loaded &&
          progreso.total
        ){

          const porcentaje =
            Math.round(
              progreso.loaded *
              100 /
              progreso.total
            );

          estado.textContent =
            "🔊 Cargando voz " +
            porcentaje +
            "%...";

        }

      },

      logger:(mensaje)=>{

        console.log(
          "Piper:",
          mensaje
        );

      }

    });

  return sesionPiper;

}


/* =========================================================
   GENERAR AUDIO PIPER
========================================================= */

async function generarVoz(texto){

  /*
    Si no tenemos sesión, creamos una.
  */

  if(!sesionPiper){

    await crearSesionPiper();

  }

  try{

    const wav =
      await sesionPiper.predict(
        texto
      );

    if(
      !wav ||
      !(wav instanceof Blob)
    ){

      throw new Error(
        "Piper no devolvió un WAV válido."
      );

    }

    return wav;

  }catch(error){

    console.error(
      "Error Piper:",
      error
    );

    /*
      Si aparece Session mismatch,
      destruimos la sesión.

      La siguiente llamada creará
      una sesión totalmente nueva.
    */

    sesionPiper = null;

    throw error;

  }

}


/* =========================================================
   REPRODUCIR WAV CON AUDIOCONTEXT
========================================================= */

async function reproducirWAV(wav){

  const preparado =
    await prepararAudio();

  if(!preparado){

    /*
      Último recurso: Audio normal.
    */

    if(audioURLActual){

      URL.revokeObjectURL(
        audioURLActual
      );

    }

    audioURLActual =
      URL.createObjectURL(
        wav
      );

    audioActual =
      new Audio(
        audioURLActual
      );

    audioActual.volume = 1;

    await audioActual.play();

    return;

  }

  /*
    Convertimos el WAV en buffer de audio.
  */

  const arrayBuffer =
    await wav.arrayBuffer();

  const audioBuffer =
    await audioContext.decodeAudioData(
      arrayBuffer
    );

  /*
    Detener audio anterior.
  */

  try{

    if(fuenteActual){

      fuenteActual.stop();

    }

  }catch(error){}

  /*
    Crear nueva fuente.
  */

  fuenteActual =
    audioContext.createBufferSource();

  fuenteActual.buffer =
    audioBuffer;

  fuenteActual.connect(
    audioContext.destination
  );

  fuenteActual.onended =
    () => {

      fuenteActual = null;

      estado.textContent =
        "🟢 GePeTo preparado";

    };

  fuenteActual.start(0);

}


/* =========================================================
   HABLAR CON PIPER
========================================================= */

async function hablarConPiper(texto){

  try{

    estado.textContent =
      "🔊 Preparando voz...";

    const wav =
      await generarVoz(
        texto
      );

    await reproducirWAV(
      wav
    );

    estado.textContent =
      "🔊 GePeTo está hablando";

    return true;

  }catch(error){

    console.error(
      "No se pudo reproducir Piper:",
      error
    );

    return false;

  }

}


/* =========================================================
   PROBAR VOZ
========================================================= */

probarVoz.onclick =
  async () => {

    /*
      ESTE TOQUE DEL USUARIO ES IMPORTANTE:
      activamos el AudioContext antes de que
      Piper haga cualquier operación asíncrona.
    */

    await prepararAudio();

    estado.textContent =
      "🔊 Probando voz...";

    const texto =
      "Hola Rafa. Soy GePeTo. Esta es la prueba de voz.";

    let resultado =
      await hablarConPiper(
        texto
      );

    /*
      Si aparece Session mismatch,
      repetimos una vez con una sesión
      completamente nueva.
    */

    if(!resultado){

      console.log(
        "Reintentando Piper con sesión nueva..."
      );

      sesionPiper = null;

      resultado =
        await hablarConPiper(
          texto
        );

    }

    if(!resultado){

      estado.textContent =
        "❌ No se pudo reproducir la prueba de voz";

    }

  };


/* =========================================================
   BOTÓN OÍR
========================================================= */

function añadirBotonOir(
  contenedor,
  texto
){

  const boton =
    document.createElement(
      "button"
    );

  boton.type =
    "button";

  boton.className =
    "boton-oir";

  boton.textContent =
    "🔊 OÍR";

  boton.onclick =
    async () => {

      /*
        El botón OÍR es una acción directa
        del usuario, por lo que preparamos
        el audio antes de generar/reproducir.
      */

      await prepararAudio();

      estado.textContent =
        "🔊 Preparando respuesta...";

      let resultado =
        await hablarConPiper(
          texto
        );

      if(!resultado){

        sesionPiper = null;

        resultado =
          await hablarConPiper(
            texto
          );

      }

      if(!resultado){

        estado.textContent =
          "❌ No se pudo reproducir la voz";

      }

    };

  contenedor.appendChild(
    boton
  );

}


/* =========================================================
   AÑADIR MENSAJE
========================================================= */

function añadirMensaje(
  texto,
  tipo,
  permitirVoz=false
){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "mensaje " +
    tipo;

  const titulo =
    document.createElement(
      "strong"
    );

  if(tipo === "usuario"){

    titulo.textContent =
      "Rafa:";

    div.appendChild(
      titulo
    );

    div.appendChild(
      document.createElement(
        "br"
      )
    );

  }else if(tipo === "gepeto"){

    titulo.textContent =
      "GePeTo:";

    div.appendChild(
      titulo
    );

    div.appendChild(
      document.createElement(
        "br"
      )
    );

  }

  div.appendChild(
    document.createTextNode(
      texto
    )
  );

  if(
    permitirVoz &&
    texto
  ){

    añadirBotonOir(
      div,
      texto
    );

  }

  mensajes.appendChild(
    div
  );

  mensajes.scrollTop =
    mensajes.scrollHeight;

  return div;

}


/* =========================================================
   EXTRAER RESPUESTA
========================================================= */

function extraerRespuesta(datos){

  if(!datos){

    return null;

  }

  const campos = [

    "respuesta",
    "response",
    "texto",
    "text",
    "answer",
    "content",
    "message"

  ];

  for(
    const campo of campos
  ){

    if(
      typeof datos[campo] ===
      "string" &&
      datos[campo].trim()
    ){

      return datos[campo].trim();

    }

  }

  /*
    Buscar respuestas anidadas.
  */

  for(
    const clave in datos
  ){

    const valor =
      datos[clave];

    if(
      valor &&
      typeof valor ===
      "object"
    ){

      const resultado =
        extraerRespuesta(
          valor
        );

      if(resultado){

        return resultado;

      }

    }

  }

  return null;

}


/* =========================================================
   ENVIAR MENSAJE A GePeTo
========================================================= */

async function enviarMensaje(){

  const texto =
    entrada.value.trim();

  if(!texto){

    return;

  }

  entrada.value = "";

  /*
    MUY IMPORTANTE:
    El usuario acaba de pulsar ENVIAR.
    Activamos el AudioContext AHORA,
    antes del fetch al Worker.
  */

  await prepararAudio();

  añadirMensaje(
    texto,
    "usuario"
  );

  estado.textContent =
    "🧠 GePeTo está pensando...";

  enviar.disabled =
    true;

  try{

    const respuesta =
      await fetch(
        WORKER,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            mensaje:texto,

            texto:texto,

            pregunta:texto

          })

        }
      );

    if(!respuesta.ok){

      throw new Error(
        "HTTP " +
        respuesta.status
      );

    }

    const datos =
      await respuesta.json();

    console.log(
      "Respuesta GePeTo:",
      datos
    );

    const respuestaTexto =
      extraerRespuesta(
        datos
      );

    if(!respuestaTexto){

      throw new Error(
        "GePeTo respondió pero no devolvió texto."
      );

    }

    /*
      Mostrar respuesta.
    */

    añadirMensaje(
      respuestaTexto,
      "gepeto",
      true
    );

    estado.textContent =
      "🟢 GePeTo ha respondido";

    /*
      Intentar hablar automáticamente.
    */

    let hablo =
      await hablarConPiper(
        respuestaTexto
      );

    /*
      Si hubo Session mismatch
      o cualquier otro fallo de sesión,
      crear una sesión completamente nueva
      y repetir una vez.
    */

    if(!hablo){

      console.log(
        "Segundo intento de voz..."
      );

      sesionPiper = null;

      hablo =
        await hablarConPiper(
          respuestaTexto
        );

    }

    if(!hablo){

      estado.textContent =
        "🟢 Respuesta lista · pulsa 🔊 OÍR";

    }

  }catch(error){

    console.error(
      "Error GePeTo:",
      error
    );

    const mensajeError =
      "GePeTo ha respondido pero ha ocurrido un error de comunicación: " +
      error.message;

    añadirMensaje(
      mensajeError,
      "error",
      true
    );

    estado.textContent =
      "❌ Error de comunicación";

  }finally{

    enviar.disabled =
      false;

    entrada.focus();

  }

}


/* =========================================================
   ENVIAR
========================================================= */

enviar.onclick =
  enviarMensaje;


/* =========================================================
   ENTER
========================================================= */

entrada.addEventListener(
  "keydown",
  (evento) => {

    if(
      evento.key === "Enter" &&
      !evento.shiftKey
    ){

      evento.preventDefault();

      enviarMensaje();

    }

  }
);


/* =========================================================
   MICRÓFONO
========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  reconocimiento =
    new SpeechRecognition();

  reconocimiento.lang =
    "es-ES";

  reconocimiento.continuous =
    false;

  reconocimiento.interimResults =
    false;

  reconocimiento.maxAlternatives =
    1;


  reconocimiento.onstart =
    () => {

      reconociendo =
        true;

      microfono.classList.add(
        "activo"
      );

      estado.textContent =
        "🎤 Escuchando a Rafa...";

    };


  reconocimiento.onresult =
    (evento) => {

      const texto =
        evento
          .results[0][0]
          .transcript;

      entrada.value =
        texto;

    };


  reconocimiento.onerror =
    (evento) => {

      console.error(
        "Error micrófono:",
        evento.error
      );

      reconociendo =
        false;

      microfono.classList.remove(
        "activo"
      );

      estado.textContent =
        "⚠️ Error del micrófono";

    };


  reconocimiento.onend =
    () => {

      reconociendo =
        false;

      microfono.classList.remove(
        "activo"
      );

      if(
        estado.textContent ===
        "🎤 Escuchando a Rafa..."
      ){

        estado.textContent =
          "🟢 GePeTo preparado";

      }

    };


  microfono.onclick =
    () => {

      if(reconociendo){

        reconocimiento.stop();

        return;

      }

      try{

        reconocimiento.start();

      }catch(error){

        console.error(
          error
        );

      }

    };

}else{

  microfono.disabled =
    true;

  microfono.title =
    "El navegador no admite reconocimiento de voz";

}


/* =========================================================
   REPRODUCTOR MP3
========================================================= */

selectorMusica.addEventListener(
  "change",
  () => {

    const archivo =
      selectorMusica.files[0];

    if(!archivo){

      return;

    }

    if(
      !archivo.type.startsWith("audio/") &&
      !archivo.name
        .toLowerCase()
        .endsWith(".mp3")
    ){

      alert(
        "Selecciona un archivo de audio o MP3."
      );

      selectorMusica.value =
        "";

      return;

    }

    if(musicaURL){

      URL.revokeObjectURL(
        musicaURL
      );

    }

    musicaURL =
      URL.createObjectURL(
        archivo
      );

    reproductorMusica.src =
      musicaURL;

    reproductorMusica.load();

    estado.textContent =
      "🎵 MP3 preparado";

  }
);


/* =========================================================
   LIMPIEZA
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    try{

      if(audioContext){

        audioContext.close();

      }

    }catch(error){}

    if(audioURLActual){

      URL.revokeObjectURL(
        audioURLActual
      );

    }

    if(musicaURL){

      URL.revokeObjectURL(
        musicaURL
      );

    }

  }
);


/* =========================================================
   INICIO
========================================================= */

estado.textContent =
  "🟢 GePeTo preparado";

console.log(
  "Videoconferencia GePeTo cargada."
);

</script>
