<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Videoconferencia · GePeTo</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#05070b;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
textarea,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#app{
    min-height:100vh;
    padding-bottom:110px;
}

/* ============================================================
   CABECERA
============================================================ */

header{
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:8px;
    padding:10px;

    background:rgba(3,8,15,.96);
    border-bottom:1px solid #173b64;

    backdrop-filter:blur(10px);
}

header button{
    border:1px solid #2769a8;
    border-radius:12px;

    background:#071522;
    color:#fff;

    padding:10px 12px;

    font-size:13px;
    font-weight:700;
}

header button:active{
    transform:scale(.97);
}

#parar{
    border-color:#8b2525;
    background:#230b0b;
    color:#ff7777;
}

.titulo{
    flex:1;
    text-align:center;
    min-width:0;
}

.titulo strong{
    display:block;
    color:#55aaff;
    font-size:17px;
}

.titulo span{
    display:block;
    color:#9db6d0;
    font-size:11px;
    margin-top:2px;
}

/* ============================================================
   AVATAR
============================================================ */

.avatarBox{
    display:flex;
    justify-content:center;
    padding:18px 12px 8px;

    perspective:1000px;
}

.avatarStage{
    position:relative;

    width:min(230px,65vw);
    aspect-ratio:1/1;

    transform-style:preserve-3d;

    will-change:transform;

    animation:
        respiracionGePeTo
        4.8s
        ease-in-out
        infinite;
}

/* ============================================================
   FOTO GEPETO
============================================================ */

.avatar{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #1685ff;

    background:#07101c;

    box-shadow:
        0 0 18px rgba(0,130,255,.55),
        0 0 55px rgba(0,80,255,.22);

    transform-origin:50% 45%;

    will-change:
        transform,
        filter,
        box-shadow;

    animation:
        movimientoCabeza
        9.5s
        ease-in-out
        infinite;
}

/* ============================================================
   MOVIMIENTO GENERAL NATURAL
============================================================ */

@keyframes movimientoCabeza{

    0%{
        transform:
            translate3d(0,0,0)
            rotate(0deg)
            scale(1);
        filter:
            brightness(1)
            saturate(1);
    }

    8%{
        transform:
            translate3d(-.7px,-.5px,0)
            rotate(-.18deg)
            scale(1.002);
    }

    17%{
        transform:
            translate3d(-1.5px,.2px,0)
            rotate(-.42deg)
            scale(1.005);
        filter:
            brightness(1.008)
            saturate(1.005);
    }

    25%{
        transform:
            translate3d(-.8px,.7px,0)
            rotate(-.18deg)
            scale(1.002);
    }

    35%{
        transform:
            translate3d(.6px,.2px,0)
            rotate(.18deg)
            scale(1.004);
    }

    44%{
        transform:
            translate3d(1.5px,-.4px,0)
            rotate(.43deg)
            scale(1.006);
        filter:
            brightness(1.012)
            saturate(1.008);
    }

    53%{
        transform:
            translate3d(1px,.5px,0)
            rotate(.20deg)
            scale(1.003);
    }

    63%{
        transform:
            translate3d(-.2px,.8px,0)
            rotate(-.08deg)
            scale(1.002);
    }

    73%{
        transform:
            translate3d(-1.3px,.1px,0)
            rotate(-.35deg)
            scale(1.005);
    }

    83%{
        transform:
            translate3d(-.8px,-.6px,0)
            rotate(-.15deg)
            scale(1.002);
    }

    92%{
        transform:
            translate3d(.2px,-.3px,0)
            rotate(.05deg)
            scale(1.001);
    }

    100%{
        transform:
            translate3d(0,0,0)
            rotate(0deg)
            scale(1);

        filter:
            brightness(1)
            saturate(1);
    }
}

/* ============================================================
   RESPIRACIÓN
============================================================ */

@keyframes respiracionGePeTo{

    0%,100%{
        transform:
            translateY(0)
            scale(1);
    }

    25%{
        transform:
            translateY(-.35px)
            scale(1.002);
    }

    50%{
        transform:
            translateY(-1px)
            scale(1.005);
    }

    75%{
        transform:
            translateY(-.35px)
            scale(1.002);
    }
}

/* ============================================================
   CAPA FACIAL
============================================================ */

.caraAnimada{
    position:absolute;
    inset:0;

    pointer-events:none;

    z-index:5;

    border-radius:50%;

    overflow:hidden;
}

/* ============================================================
   OJOS
============================================================ */

.ojo{
    position:absolute;

    width:15%;
    height:4.5%;

    top:35%;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.45) 0%,
            rgba(120,190,255,.12) 42%,
            rgba(0,0,0,0) 75%
        );

    opacity:.14;

    filter:blur(.7px);

    transform-origin:center;

    animation:
        miradaNatural
        7.4s
        ease-in-out
        infinite;
}

.ojo.izq{
    left:25%;
}

.ojo.der{
    right:25%;
}

@keyframes miradaNatural{

    0%,100%{
        transform:
            translate3d(0,0,0)
            scaleY(1);
    }

    15%{
        transform:
            translate3d(.7px,.2px,0)
            scaleY(.98);
    }

    29%{
        transform:
            translate3d(1.5px,.1px,0)
            scaleY(1);
    }

    42%{
        transform:
            translate3d(-.5px,0,0)
            scaleY(.99);
    }

    57%{
        transform:
            translate3d(-1.5px,.2px,0)
            scaleY(1);
    }

    72%{
        transform:
            translate3d(-.6px,-.1px,0)
            scaleY(.98);
    }

    87%{
        transform:
            translate3d(.5px,0,0)
            scaleY(1);
    }
}

/* ============================================================
   CEJAS
============================================================ */

.ceja{
    position:absolute;

    width:15%;
    height:2.2%;

    top:30.5%;

    border-radius:50%;

    background:
        rgba(120,190,255,.12);

    opacity:.11;

    filter:blur(1px);

    transform-origin:center;

    animation:
        cejasNaturales
        8.5s
        ease-in-out
        infinite;
}

.ceja.izq{
    left:25%;
}

.ceja.der{
    right:25%;
}

@keyframes cejasNaturales{

    0%,100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    18%{
        transform:
            translateY(-.6px)
            rotate(-.5deg);
    }

    36%{
        transform:
            translateY(.1px)
            rotate(.3deg);
    }

    53%{
        transform:
            translateY(.7px)
            rotate(.6deg);
    }

    70%{
        transform:
            translateY(-.3px)
            rotate(-.3deg);
    }

    86%{
        transform:
            translateY(.2px)
            rotate(.1deg);
    }
}

/* ============================================================
   BOCA
============================================================ */

.boca{
    position:absolute;

    left:38%;
    width:24%;

    top:61%;
    height:7%;

    border-radius:
        0 0 50% 50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(80,170,255,.24),
            rgba(0,0,0,0) 72%
        );

    opacity:.09;

    filter:blur(1.3px);

    transform-origin:center center;

    animation:
        bocaReposo
        5.8s
        ease-in-out
        infinite;
}

@keyframes bocaReposo{

    0%,100%{
        transform:
            scaleX(1)
            scaleY(1);
    }

    30%{
        transform:
            scaleX(1.008)
            scaleY(1.018);
    }

    55%{
        transform:
            scaleX(.995)
            scaleY(1.025);
    }

    78%{
        transform:
            scaleX(1.006)
            scaleY(1.01);
    }
}

/* ============================================================
   PARPADEO
============================================================ */

.parpadeo{
    animation:
        parpadear
        .20s
        linear !important;
}

@keyframes parpadear{

    0%{
        filter:
            brightness(1)
            saturate(1);
    }

    25%{
        filter:
            brightness(.86)
            saturate(.95);
    }

    48%{
        filter:
            brightness(.60)
            saturate(.88);
    }

    65%{
        filter:
            brightness(.84)
            saturate(.94);
    }

    100%{
        filter:
            brightness(1)
            saturate(1);
    }
}

.parpadeoSuave{
    animation:
        parpadeoNatural
        .17s
        ease-in-out !important;
}

@keyframes parpadeoNatural{

    0%{
        filter:
            brightness(1)
            contrast(1);
    }

    38%{
        filter:
            brightness(.57)
            contrast(.95);
    }

    100%{
        filter:
            brightness(1)
            contrast(1);
    }
}

/* ============================================================
   GEPETO HABLANDO
============================================================ */

.avatarStage.hablando{
    animation:
        cabezaHablando
        2.4s
        ease-in-out
        infinite;
}

.avatarStage.hablando .avatar{

    animation:
        avatarHablando
        1.45s
        ease-in-out
        infinite;

    box-shadow:
        0 0 20px rgba(0,140,255,.70),
        0 0 45px rgba(0,120,255,.42),
        0 0 75px rgba(0,80,255,.23);
}

.avatarStage.hablando .boca{

    opacity:.24;

    animation:
        bocaHablando
        .28s
        ease-in-out
        infinite;
}

.avatarStage.hablando .ojo{
    opacity:.19;
}

@keyframes cabezaHablando{

    0%,100%{
        transform:
            translate3d(0,0,0)
            rotate(0deg);
    }

    15%{
        transform:
            translate3d(-.8px,-.3px,0)
            rotate(-.18deg);
    }

    32%{
        transform:
            translate3d(.8px,.2px,0)
            rotate(.20deg);
    }

    49%{
        transform:
            translate3d(1px,-.2px,0)
            rotate(.12deg);
    }

    66%{
        transform:
            translate3d(-.7px,.4px,0)
            rotate(-.20deg);
    }

    83%{
        transform:
            translate3d(-.4px,-.2px,0)
            rotate(-.08deg);
    }
}

@keyframes avatarHablando{

    0%,100%{
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    16%{
        transform:
            translate3d(-.5px,-.2px,0)
            scale(1.003);
    }

    31%{
        transform:
            translate3d(.7px,.1px,0)
            scale(1.007);
    }

    48%{
        transform:
            translate3d(0,.4px,0)
            scale(1.003);
    }

    65%{
        transform:
            translate3d(-.6px,0,0)
            scale(1.006);
    }

    82%{
        transform:
            translate3d(.4px,-.3px,0)
            scale(1.004);
    }
}

@keyframes bocaHablando{

    0%,100%{
        transform:
            scaleX(1)
            scaleY(.78);
    }

    18%{
        transform:
            scaleX(1.06)
            scaleY(1.12);
    }

    37%{
        transform:
            scaleX(.91)
            scaleY(.68);
    }

    56%{
        transform:
            scaleX(1.12)
            scaleY(1.18);
    }

    74%{
        transform:
            scaleX(.95)
            scaleY(.76);
    }

    89%{
        transform:
            scaleX(1.07)
            scaleY(1.02);
    }
}

/* ============================================================
   ESTADO
============================================================ */

.estado{
    text-align:center;

    margin:
        2px
        15px
        15px;

    color:#62b6ff;

    font-size:13px;
    font-weight:600;
}

/* ============================================================
   CONTROLES
============================================================ */

.controles{
    display:flex;

    justify-content:center;
    flex-wrap:wrap;

    gap:8px;

    padding:
        0
        12px
        14px;
}

.controles button{
    border:1px solid #225b8e;
    border-radius:12px;

    background:#081521;
    color:#fff;

    padding:
        10px
        13px;

    font-size:13px;
}

.controles button:active{
    transform:scale(.97);
}

/* ============================================================
   PRUEBA DE VOZ
============================================================ */

.prueba{
    margin:
        0
        12px
        15px;

    padding:13px;

    border:1px solid #174c79;
    border-radius:15px;

    background:#07111b;
}

.pruebaTitulo{
    color:#72bdff;

    font-size:13px;
    font-weight:700;

    margin-bottom:8px;
}

#probarVoz{
    width:100%;

    border:1px solid #2583cf;
    border-radius:12px;

    padding:12px;

    background:#0a2439;
    color:#fff;

    font-size:15px;
    font-weight:700;
}

/* ============================================================
   MÚSICA
============================================================ */

.musica{
    margin:
        0
        12px
        15px;

    padding:13px;

    border:1px solid #21415e;
    border-radius:15px;

    background:#071018;
}

.musica h3{
    margin:
        0
        0
        10px;

    color:#8ccaff;

    font-size:14px;
}

#selectorMusica{
    width:100%;

    color:#d7e9fa;

    font-size:12px;

    margin-bottom:10px;
}

#reproductorMusica{
    width:100%;
    height:42px;
}

/* ============================================================
   CHAT
============================================================ */

#chat{
    display:flex;

    flex-direction:column;

    gap:10px;

    padding:
        8px
        12px
        20px;
}

.mensaje{
    width:100%;

    padding:
        12px
        14px;

    border-radius:15px;

    line-height:1.45;

    font-size:15px;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
}

.mensaje.usuario{
    align-self:flex-end;

    background:#10283c;

    border:1px solid #23547a;

    color:#fff;
}

.mensaje.gepeto{
    align-self:flex-start;

    background:#061d12;

    border:1px solid #18a85c;

    color:#7dffb2;
}

.mensajeSistema{
    color:#91a8ba;

    font-size:12px;

    text-align:center;

    padding:5px;
}

.mensajeCabecera{
    color:#50aaff;

    font-size:11px;
    font-weight:800;

    margin-bottom:5px;

    text-transform:uppercase;
}

.textoRespuesta{
    margin-bottom:9px;
}

.oir{
    display:inline-block;

    border:1px solid #1e9d5b;

    border-radius:10px;

    padding:
        8px
        11px;

    background:#082b19;

    color:#9affc1;

    font-size:12px;
    font-weight:700;
}

.oir:active{
    transform:scale(.96);
}

.oir.leyendo{
    background:#12552d;
}

/* ============================================================
   BARRA INFERIOR
============================================================ */

.compositor{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:2000;

    display:flex;

    align-items:flex-end;

    gap:7px;

    padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));

    background:rgba(3,8,14,.97);

    border-top:1px solid #173b64;

    backdrop-filter:blur(12px);
}

#mensaje{
    flex:1;

    min-height:46px;
    max-height:120px;

    resize:none;

    border:1px solid #285274;

    border-radius:13px;

    background:#07121d;

    color:#fff;

    padding:12px;

    outline:none;

    font-size:15px;
}

#mensaje:focus{
    border-color:#328ed0;
}

#microfono,
#enviar{
    width:46px;
    height:46px;

    flex:none;

    border-radius:13px;

    border:1px solid #2a628e;

    background:#0a1d2d;

    color:#fff;

    font-size:20px;
}

#enviar{
    background:#083b23;

    border-color:#1b9856;

    font-size:17px;
}

#microfono.activo{
    background:#631515;

    border-color:#ff5555;
}

/* ============================================================
   INDICADORES
============================================================ */

.cargando{
    color:#70bfff;

    font-size:13px;

    padding:7px 0;
}

.error{
    color:#ff7373;

    font-size:13px;

    padding:7px 0;
}

.ok{
    color:#70ff9f;

    font-size:13px;

    padding:7px 0;
}

/* ============================================================
   MÓVIL
============================================================ */

@media(max-width:420px){

    .avatarBox{
        padding-top:14px;
    }

    .avatarStage{
        width:min(210px,62vw);
    }

    .mensaje{
        font-size:14px;
    }

    #mensaje{
        font-size:15px;
    }
}

/* ============================================================
   REDUCCIÓN DE MOVIMIENTO
============================================================ */

@media(prefers-reduced-motion:reduce){

    .avatar,
    .avatarStage,
    .ojo,
    .ceja,
    .boca{
        animation:none !important;
    }
}

</style>
</head>

<body>

<div id="app">

<header>

    <button
        onclick="location.href='biblioteca.html'">
        ← BIBLIOTECA
    </button>

    <div class="titulo">
        <strong>GePeTo</strong>
        <span>VIDEOCONFERENCIA</span>
    </div>

    <button id="parar">
        🛑 PARAR
    </button>

</header>

<!-- ============================================================
     AVATAR
============================================================ -->

<section class="avatarBox">

    <div
        id="avatarStage"
        class="avatarStage">

        <img
            id="avatar"
            class="avatar"
            src="GePeTo.png"
            alt="GePeTo">

        <div class="caraAnimada">

            <div
                class="ojo izq">
            </div>

            <div
                class="ojo der">
            </div>

            <div
                class="ceja izq">
            </div>

            <div
                class="ceja der">
            </div>

            <div
                class="boca">
            </div>

        </div>

    </div>

</section>

<div
    id="estado"
    class="estado">
    🟢 GePeTo conectado
</div>

<div class="controles">

    <button id="parpadearBtn">
        👁️ PARPADEAR
    </button>

</div>

<!-- ============================================================
     PRUEBA DE VOZ
============================================================ -->

<section class="prueba">

    <div class="pruebaTitulo">
        🔊 PRUEBA DE VOZ
    </div>

    <button id="probarVoz">
        🔊 PROBAR VOZ
    </button>

</section>

<!-- ============================================================
     MÚSICA
============================================================ -->

<section class="musica">

    <h3>
        🎵 Música de fondo
    </h3>

    <input
        id="selectorMusica"
        type="file"
        accept="audio/*">

    <audio
        id="reproductorMusica"
        controls
        preload="metadata">
    </audio>

</section>

<!-- ============================================================
     CHAT
============================================================ -->

<section id="chat">

    <div class="mensajeSistema">
        GePeTo está preparado para hablar contigo.
    </div>

</section>

</div>

<!-- ============================================================
     COMPOSITOR
============================================================ -->

<div class="compositor">

    <textarea
        id="mensaje"
        placeholder="Escribe a GePeTo..."
        rows="1"></textarea>

    <button
        id="microfono"
        aria-label="Micrófono">
        🎤
    </button>

    <button
        id="enviar"
        aria-label="Enviar">
        ➤
    </button>

</div>

<script>

/* ============================================================
   CONFIGURACIÓN
============================================================ */

const WORKER =
    "https://gepetto-rafa.rafadun18.workers.dev";

/*
 * Voz Piper.
 *
 * Se intenta utilizar el endpoint local configurado
 * por el proyecto y, si no está disponible, se usa
 * la voz del propio navegador como respaldo.
 */
const PIPER_URL =
    "https://gepetto-rafa.rafadun18.workers.dev/voz";

/* ============================================================
   ELEMENTOS
============================================================ */

const avatarStage =
    document.getElementById(
        "avatarStage"
    );

const avatar =
    document.getElementById(
        "avatar"
    );

const estado =
    document.getElementById(
        "estado"
    );

const chat =
    document.getElementById(
        "chat"
    );

const mensaje =
    document.getElementById(
        "mensaje"
    );

const microfono =
    document.getElementById(
        "microfono"
    );

const enviar =
    document.getElementById(
        "enviar"
    );

const parar =
    document.getElementById(
        "parar"
    );

const probarVoz =
    document.getElementById(
        "probarVoz"
    );

const parpadearBtn =
    document.getElementById(
        "parpadearBtn"
    );

const selectorMusica =
    document.getElementById(
        "selectorMusica"
    );

const reproductorMusica =
    document.getElementById(
        "reproductorMusica"
    );

/* ============================================================
   VARIABLES
============================================================ */

let reconocimiento =
    null;

let reconociendo =
    false;

let ultimaRespuesta =
    "";

let temporizadorParpadeo =
    null;

let temporizadorMicroMovimiento =
    null;

let musicaURL =
    null;

let audioURLActual =
    null;

let audioActual =

/* ============================================================
   AUDIO
============================================================ */

let audioContext =
    null;

async function prepararAudio(){

    try{

        if(!audioContext){

            const AC =
                window.AudioContext ||
                window.webkitAudioContext;

            if(AC){

                audioContext =
                    new AC();
            }
        }

        if(
            audioContext &&
            audioContext.state === "suspended"
        ){

            await audioContext.resume();
        }

    }catch(error){

        console.warn(
            "No se pudo preparar AudioContext",
            error
        );
    }
}

/* ============================================================
   EXTRAER RESPUESTA DEL WORKER
============================================================ */

function extraerTextoRespuesta(
    data
){

    if(
        typeof data ===
        "string"
    ){

        return data.trim();
    }

    if(!data){

        return "";
    }

    const candidatos = [

        data.respuesta,
        data.response,
        data.texto,
        data.text,
        data.mensaje,
        data.message,
        data.content,
        data.output,

        data.result &&
        data.result.response,

        data.result &&
        data.result.text,

        data.result &&
        data.result.content,

        data.answer,

        data.reply

    ];

    for(
        const valor of candidatos
    ){

        if(
            typeof valor ===
            "string" &&
            valor.trim()
        ){

            return valor.trim();
        }
    }

    if(
        Array.isArray(
            data.output
        )
    ){

        const textos =
            data.output
                .map(
                    x =>
                        typeof x ===
                        "string"
                            ? x
                            : x?.text ||
                              x?.content ||
                              ""
                )
                .filter(Boolean);

        if(textos.length){

            return textos.join("\n").trim();
        }
    }

    try{

        return JSON.stringify(
            data
        );

    }catch(_){

        return "";
    }
}

    );

/* ============================================================
   PARPADEO AUTOMÁTICO
============================================================ */

function programarParpadeo(){

    if(
        temporizadorParpadeo
    ){

        clearTimeout(
            temporizadorParpadeo
        );
    }

    const siguiente =
        2800 +
        Math.random() *
        5200;

    temporizadorParpadeo =
        setTimeout(
            () => {

                /*
                 * Cuando habla no anulamos todos los
                 * movimientos: simplemente hacemos
                 * el parpadeo más discreto.
                 */
                parpadear();

                programarParpadeo();

            },
            siguiente
        );
}

/* ============================================================
   VIDA FACIAL
============================================================ */

function iniciarVidaFacial(){

    programarParpadeo();

    /*
     * Pequeños movimientos adicionales aleatorios.
     * Son muy pequeños para evitar el efecto robótico.
     */
    programarMicroMovimiento();
}

/* ============================================================
   MICRO MOVIMIENTOS
============================================================ */

function programarMicroMovimiento(){

    if(
        temporizadorMicroMovimiento
    ){

        clearTimeout(
            temporizadorMicroMovimiento
        );
    }

    temporizadorMicroMovimiento =
        setTimeout(
            () => {

                /*
                 * La animación CSS principal ya se encarga
                 * del movimiento. Aquí solamente provocamos
                 * una pequeña variación temporal de brillo.
                 */
                if(!hablando){

                    avatar.style.filter =
                        "brightness(1.008) saturate(1.004)";

                    setTimeout(
                        () => {

                            avatar.style.filter =
                                "";

                        },
                        350
                    );
                }

                programarMicroMovimiento();

            },
            4300 +
            Math.random() *
            4200
        );
}

/* ============================================================
   PARAR TODA LA VOZ
============================================================ */

function pararTodo(){

    cancelarHabla =
        true;

    hablando =
        false;

    avatarStage.classList.remove(
        "hablando"
    );

    if(audioActual){

        try{

            audioActual.pause();
            audioActual.currentTime =
                0;

        }catch(_){}
    }

    audioActual =
        null;

    if(audioURLActual){

        try{

            URL.revokeObjectURL(
                audioURLActual
            );

        }catch(_){}

        audioURLActual =
            null;
    }

    if(
        window.speechSynthesis
    ){

        try{

            window.speechSynthesis.cancel();

        }catch(_){}
    }

    document
        .querySelectorAll(
            ".oir.leyendo"
        )
        .forEach(
            boton =>
                boton.classList.remove(
                    "leyendo"
                )
        );

    estado.textContent =
        "🟢 GePeTo conectado";
}

/* ============================================================
   VOZ DEL NAVEGADOR
============================================================ */

function hablarConVozNavegador(
    texto
){

    return new Promise(
        resolve => {

            if(
                !window.speechSynthesis
            ){

                resolve(false);
                return;
            }

            try{

                window.speechSynthesis.cancel();

                const voz =
                    new SpeechSynthesisUtterance(
                        texto
                    );

                voz.lang =
                    "es-ES";

                voz.rate =
                    0.96;

                voz.pitch =
                    0.96;

                voz.volume =
                    1;

                voz.onstart =
                    () => {

                        hablando =
                            true;

                        cancelarHabla =
                            false;

                        avatarStage.classList.add(
                            "hablando"
                        );

                        estado.textContent =
                            "🔵 GePeTo está hablando...";
                    };

                voz.onend =
                    () => {

                        hablando =
                            false;

                        avatarStage.classList.remove(
                            "hablando"
                        );

                        estado.textContent =
                            "🟢 GePeTo conectado";

                        resolve(true);
                    };

                voz.onerror =
                    () => {

                        hablando =
                            false;

                        avatarStage.classList.remove(
                            "hablando"
                        );

                        resolve(false);
                    };

                window.speechSynthesis.speak(
                    voz
                );

            }catch(error){

                console.error(
                    error
                );

                resolve(false);
            }
        }
    );
}

/* ============================================================
   REPRODUCIR WAV
============================================================ */

async function reproducirWAV(
    blob
){

    return new Promise(
        resolve => {

            try{

                if(audioActual){

                    audioActual.pause();

                    audioActual =
                        null;
                }

                if(audioURLActual){

                    URL.revokeObjectURL(
                        audioURLActual
                    );

                    audioURLActual =
                        null;
                }

                audioURLActual =
                    URL.createObjectURL(
                        blob
                    );

                audioActual =
                    new Audio(
                        audioURLActual
                    );

                audioActual.preload =
                    "auto";

                audioActual.volume =
                    1;

                audioActual.onplay =
                    () => {

                        hablando =
                            true;

                        cancelarHabla =
                            false;

                        avatarStage.classList.add(
                            "hablando"
                        );

                        estado.textContent =
                            "🔵 GePeTo está hablando...";
                    };

                audioActual.onended =
                    () => {

                        hablando =
                            false;

                        avatarStage.classList.remove(
                            "hablando"
                        );

                        estado.textContent =
                            "🟢 GePeTo conectado";

                        if(audioURLActual){

                            try{

                                URL.revokeObjectURL(
                                    audioURLActual
                                );

                            }catch(_){}

                            audioURLActual =
                                null;
                        }

                        audioActual =
                            null;

                        resolve(true);
                    };

                audioActual.onerror =
                    () => {

                        hablando =
                            false;

                        avatarStage.classList.remove(
                            "hablando"
                        );

                        resolve(false);
                    };

                audioActual.play()
                    .catch(
                        () => {

                            hablando =
                                false;

                            avatarStage.classList.remove(
                                "hablando"
                            );

                            resolve(false);
                        }
                    );

            }catch(error){

                console.error(
                    error
                );

                resolve(false);
            }
        }
    );
}

/* ============================================================
   HABLAR AUTOMÁTICAMENTE
============================================================ */

async function hablarAutomaticamente(
    texto
){

    if(!texto){

        return;
    }

    cancelarHabla =
        false;

    await prepararAudio();

    /*
     * Primero intentamos Piper.
     */
    try{

        const respuesta =
            await fetch(
                PIPER_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        texto:texto,
                        text:texto,
                        mensaje:texto
                    })
                }
            );

        if(respuesta.ok){

            const tipo =
                respuesta.headers.get(
                    "content-type"
                ) || "";

            if(
                tipo.includes(
                    "audio"
                )
            ){

                const blob =
                    await respuesta.blob();

                const correcto =
                    await reproducirWAV(
                        blob
                    );

                if(correcto){

                    return;
                }
            }
        }

    }catch(error){

        console.warn(
            "Piper no disponible:",
            error
        );
    }

    /*
     * Respaldo: voz del navegador.
     */
    await hablarConVozNavegador(
        texto
    );
}

/* ============================================================
   ENVIAR MENSAJE A GEPETO
============================================================ */

async function enviarMensaje(){

    const texto =
        mensaje.value.trim();

    if(!texto){

        return;
    }

    await prepararAudio();

    añadirMensajeUsuario(
        texto
    );

    mensaje.value =
        "";

    mensaje.style.height =
        "46px";

    enviar.disabled =
        true;

    estado.textContent =
        "🔄 GePeTo está pensando...";

    const cargando =
        document.createElement(
            "div"
        );

    cargando.className =
        "mensajeSistema cargando";

    cargando.textContent =
        "GePeTo está escribiendo...";

    chat.appendChild(
        cargando
    );

    desplazarChat();

    try{

        const respuesta =
            await fetch(
                WORKER,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        mensaje:
                            texto,

                        prompt:
                            texto,

                        message:
                            texto

                    })
                }
            );

        const contenido =
            await respuesta.text();

        let data;

        try{

            data =
                JSON.parse(
                    contenido
                );

        }catch(_){

            data =
                contenido;
        }

        const respuestaTexto =
            extraerTextoRespuesta(
                data
            );

        if(!respuesta.ok){

            throw new Error(
                respuestaTexto ||
                "Error HTTP " +
                respuesta.status
            );
        }

        if(!respuestaTexto){

            throw new Error(
                "GePeTo no devolvió texto"
            );
        }

        cargando.remove();

        ultimaRespuesta =
            respuestaTexto;

        añadirMensajeGePeTo(
            respuestaTexto
        );

        estado.textContent =
            "🟢 GePeTo conectado";

        /*
         * RESPUESTA AUTOMÁTICA
         */
        hablarAutomaticamente(
            respuestaTexto
        );

    }catch(error){

        console.error(
            "Error GePeTo:",
            error
        );

        cargando.remove();

        const errorDiv =
            document.createElement(
                "div"
            );

        errorDiv.className =
            "mensajeSistema error";

        errorDiv.textContent =
            "❌ No se pudo obtener respuesta de GePeTo. " +
            (
                error.message ||
                ""
            );

        chat.appendChild(
            errorDiv
        );

        estado.textContent =
            "🔴 Error de conexión con GePeTo";

        desplazarChat();

    }finally{

        enviar.disabled =
            false;

        mensaje.focus();
    }
}

/* ============================================================
   RECONOCIMIENTO DE VOZ
============================================================ */

function iniciarReconocimiento(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        estado.textContent =
            "⚠️ El reconocimiento de voz no está disponible en este navegador.";

        return;
    }

    if(reconociendo){

        try{

            reconocimiento.stop();

        }catch(_){}

        return;
    }

    reconocimiento =
        new SpeechRecognition();

    reconocimiento.lang =
        "es-ES";

    reconocimiento.continuous =
        false;

    reconocimiento.interimResults =
        true;

    reconocimiento.maxAlternatives =
        1;

    reconociendo =
        true;

    microfono.classList.add(
        "activo"
    );

    microfono.textContent =
        "⏹️";

    estado.textContent =
        "🎤 Escuchando...";

    reconocimiento.onresult =
        event => {

            let resultado =
                "";

            for(
                let i =
                    event.resultIndex;
                i <
                    event.results.length;
                i++
            ){

                resultado +=
                    event.results[i][0].transcript;
            }

            mensaje.value =
                resultado.trim();

            mensaje.dispatchEvent(
                new Event(
                    "input"
                )
            );
        };

    reconocimiento.onerror =
        event => {

            console.error(
                "Reconocimiento:",
                event.error
            );

            estado.textContent =
                "⚠️ No se pudo reconocer la voz";
        };

    reconocimiento.onend =
        () => {

            reconociendo =
                false;

            microfono.classList.remove(
                "activo"
            );

            microfono.textContent =
                "🎤";

            estado.textContent =
                "🟢 GePeTo conectado";
        };

    try{

        reconocimiento.start();

    }catch(error){

        console.error(
            error
        );

        reconociendo =
            false;

        microfono.classList.remove(
            "activo"
        );

        microfono.textContent =
            "🎤";
    }
}

/* ============================================================
   PAUSA MÚSICA AL HABLAR
============================================================ */

let musicaEstabaSonando =
    false;

let posicionMusica =
    0;

reproductorMusica.addEventListener(
    "play",
    () => {

        musicaEstabaSonando =
            true;
    }
);

reproductorMusica.addEventListener(
    "pause",
    () => {

        musicaEstabaSonando =
            false;
    }
);

function pausarMusicaParaVoz(){

    if(
        !reproductorMusica.paused
    ){

        musicaEstabaSonando =
            true;

        posicionMusica =
            reproductorMusica.currentTime;

        reproductorMusica.pause();

    }else{

        musicaEstabaSonando =
            false;
    }
}

function reanudarMusicaDespuesDeVoz(){

    if(
        musicaEstabaSonando &&
        reproductorMusica.src
    ){

        try{

            reproductorMusica.currentTime =
                posicionMusica;

            reproductorMusica.play()
                .catch(
                    () => {}
                );

        }catch(_){}
    }
}

/* ============================================================
   PARAR MÚSICA CUANDO EMPIEZA LA VOZ
============================================================ */

const reproducirWAVOriginal =
    reproducirWAV;

/*
 * Envolvemos la reproducción para que la música
 * no compita con la voz.
 */
async function reproducirWAVConMusica(
    blob
){

    pausarMusicaParaVoz();

    const resultado =
        await reproducirWAVOriginal(
            blob
        );

    return resultado;
}
