body{

button:active{
    transform:scale(.97);
}

    margin-bottom:14px;
}

.btn-portada{
    border-color:#00ff66;
    color:#00ff66;
}

.btn-editar{
    border-color:#ff00cc;
    color:#ff55dd;
}

.btn-nueva{
    border-color:#00ffff;
    color:#00ffff;
}

.estado{
    text-align:center;
    min-height:20px;
    margin:8px 0 12px;
    color:#aaa;
    font-size:13px;
}
