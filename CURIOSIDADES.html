<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>CURIOSIDADES · Proyecto Rafa</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#02040b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

body{
    min-height:100vh;
    perspective:1400px;
}

/* =========================
   FONDO ESPACIAL
========================= */

#space{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 50% 45%,rgba(0,120,255,.10),transparent 35%),
        radial-gradient(circle at 20% 20%,rgba(0,255,255,.06),transparent 30%),
        #02040b;
}

.roomGlow{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
        radial-gradient(ellipse at center,transparent 20%,rgba(0,90,255,.06) 55%,rgba(0,0,0,.72) 100%);
}

/* =========================
   HABITACIÓN 3D
========================= */

.room{
    position:relative;
    width:100%;
    min-height:100vh;
    z-index:3;
    overflow:hidden;
    transform-style:preserve-3d;
}

.roomCore{
    position:absolute;
    left:50%;
    top:53%;
    width:92vw;
    height:78vh;
    transform:
        translate(-50%,-50%)
        rotateX(8deg)
        rotateY(0deg);
    transform-style:preserve-3d;
}

/* paredes */

.wallBack{
    position:absolute;
    inset:0;
    border:1px solid rgba(0,180,255,.18);
    background:
        linear-gradient(rgba(0,150,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,150,255,.025) 1px,transparent 1px),
        radial-gradient(circle at center,rgba(0,110,255,.10),transparent 60%);
    background-size:50px 50px,50px 50px,100% 100%;
    box-shadow:
        inset 0 0 100px rgba(0,100,255,.10),
        0 0 80px rgba(0,100,255,.08);
    transform:translateZ(-180px);
}

.wallLeft,
.wallRight{
    position:absolute;
    top:0;
    height:100%;
    width:180px;
    border:1px solid rgba(0,180,255,.12);
    background:linear-gradient(
        90deg,
        rgba(0,100,255,.02),
        rgba(0,100,255,.10)
    );
}

.wallLeft{
    left:-90px;
    transform-origin:right center;
    transform:rotateY(68deg);
}

.wallRight{
    right:-90px;
    transform-origin:left center;
    transform:rotateY(-68deg);
}

/* suelo */

.floor{
    position:absolute;
    left:-5%;
    bottom:-28%;
    width:110%;
    height:55%;
    background:
        linear-gradient(rgba(0,170,255,.12) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,170,255,.12) 1px,transparent 1px),
        radial-gradient(ellipse at center,rgba(0,100,255,.18),transparent 65%);
    background-size:60px 60px,60px 60px,100% 100%;
    border-top:1px solid rgba(0,190,255,.3);
    transform:
        rotateX(72deg)
        translateZ(-20px);
    transform-origin:center top;
    box-shadow:
        0 -20px 80px rgba(0,150,255,.12),
        inset 0 40px 80px rgba(0,150,255,.08);
}

/* =========================
   CABECERA
========================= */

.topbar{
    position:relative;
    z-index:20;
    width:100%;
    min-height:74px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:rgba(0,0,0,.55);
    border-bottom:1px solid rgba(0,180,255,.22);
    backdrop-filter:blur(12px);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.logoR{
    width:48px;
    height:48px;
    flex:0 0 48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #39ff14;
    border-radius:14px;
    color:#39ff14;
    font-size:28px;
    font-weight:900;
    background:rgba(57,255,20,.06);
    box-shadow:
        0 0 12px rgba(57,255,20,.6),
        inset 0 0 15px rgba(57,255,20,.08);
}

.titleBox{
    min-width:0;
}

.titleBox h1{
    margin:0;
    font-size:21px;
    letter-spacing:3px;
    color:#fff;
    text-shadow:0 0 14px #00aaff;
}

.titleBox small{
    color:#58d9ff;
    font-size:10px;
    letter-spacing:2px;
}

.backBtn{
    border:1px solid rgba(57,255,20,.65);
    background:rgba(57,255,20,.08);
    color:#39ff14;
    border-radius:12px;
    padding:11px 13px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 12px rgba(57,255,20,.15);
}

.backBtn:active{
    transform:scale(.96);
}

/* =========================
   PANEL DE MÚSICA
========================= */

.musicPanel{
    position:relative;
    z-index:15;
    margin:12px auto 0;
    width:calc(100% - 24px);
    max-width:700px;
    padding:10px;
    border:1px solid rgba(0,180,255,.3);
    border-radius:16px;
    background:rgba(0,10,25,.72);
    backdrop-filter:blur(12px);
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 0 30px rgba(0,100,255,.10);
}

.musicBtn{
    border:1px solid #00bfff;
    color:#7eeaff;
    background:rgba(0,180,255,.08);
    border-radius:10px;
    padding:9px 12px;
    font-weight:bold;
}

.musicInfo{
    font-size:12px;
    flex:1;
    color:#bcefff;
}

#musicState{
    color:#39ff14;
    font-size:11px;
}

/* =========================
   TÍTULO DE SALA
========================= */

.roomTitle{
    position:relative;
    z-index:12;
    text-align:center;
    margin:12px 10px 0;
    font-size:13px;
    letter-spacing:4px;
    color:#8be8ff;
    text-shadow:0 0 12px #008cff;
}

/* =========================
   CARPETAS HOLOGRÁFICAS
========================= */

.folderStage{
    position:absolute;
    width:150px;
    height:120px;
    transform-style:preserve-3d;
    transition:
        transform .5s ease,
        filter .4s ease;
}

.folderStage:hover{
    filter:brightness(1.35);
}

.holoFolder{
    position:absolute;
    inset:0;
    cursor:pointer;
    transform-style:preserve-3d;
    transform:
        rotateX(2deg)
        rotateY(-7deg);
    animation:
        folderFloat 4s ease-in-out infinite;
}

@keyframes folderFloat{
    0%,100%{
        transform:rotateX(2deg) rotateY(-7deg) translateZ(0);
    }
    50%{
        transform:rotateX(-2deg) rotateY(7deg) translateZ(18px);
    }
}

.folderBack{
    position:absolute;
    left:10px;
    top:20px;
    width:130px;
    height:86px;
    border:2px solid rgba(0,210,255,.8);
    border-radius:8px 8px 14px 14px;
    background:
        linear-gradient(
            135deg,
            rgba(0,150,255,.25),
            rgba(0,30,100,.08)
        );
    box-shadow:
        0 0 8px #00bfff,
        0 0 25px rgba(0,170,255,.7),
        inset 0 0 20px rgba(0,210,255,.15);
    transform:translateZ(-12px);
}

.folderTab{
    position:absolute;
    left:10px;
    top:10px;
    width:52px;
    height:25px;
    border:2px solid rgba(0,210,255,.8);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    background:rgba(0,130,255,.22);
    box-shadow:
        0 0 12px rgba(0,190,255,.7);
    transform:translateZ(-6px);
}

.folderBody{
    position:absolute;
    left:10px;
    top:27px;
    width:130px;
    height:80px;
    border:2px solid rgba(0,235,255,.95);
    border-radius:8px 8px 13px 13px;
    background:
        linear-gradient(
            135deg,
            rgba(0,180,255,.22),
            rgba(0,50,130,.12)
        );
    box-shadow:
        0 0 8px #00d9ff,
        0 0 35px rgba(0,180,255,.75),
        inset 0 0 30px rgba(0,220,255,.12);
    backdrop-filter:blur(3px);
    transform:translateZ(12px);
}

.folderBody:before,
.folderBody:after{
    content:"";
    position:absolute;
    pointer-events:none;
}

.folderBody:before{
    inset:5px;
    border:1px solid rgba(110,240,255,.35);
    border-radius:5px;
}

.folderBody:after{
    left:0;
    right:0;
    top:20px;
    height:1px;
    background:rgba(100,240,255,.5);
    box-shadow:
        0 15px 0 rgba(100,240,255,.25),
        0 30px 0 rgba(100,240,255,.18),
        0 45px 0 rgba(100,240,255,.12);
}

.folderEdge{
    position:absolute;
    left:10px;
    top:27px;
    width:130px;
    height:80px;
    border-right:7px solid rgba(0,210,255,.20);
    border-bottom:7px solid rgba(0,210,255,.14);
    border-radius:0 8px 13px 0;
    transform:
        translateZ(22px)
        translateX(7px)
        translateY(7px);
    filter:blur(.5px);
}

.scan{
    position:absolute;
    left:15px;
    right:15px;
    height:2px;
    top:35px;
    background:#8ff7ff;
    box-shadow:
        0 0 7px #00eaff,
        0 0 18px #00bfff;
    animation:scan 2.8s linear infinite;
    z-index:4;
}

@keyframes scan{
    0%{top:32px;opacity:.1}
    15%{opacity:1}
    50%{top:100px;opacity:.8}
    100%{top:32px;opacity:.1}
}

.folderLabel{
    position:absolute;
    left:0;
    right:0;
    top:112px;
    text-align:center;
    color:#a9f3ff;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1.4px;
    text-shadow:
        0 0 6px #00cfff,
        0 0 16px #007fff;
    white-space:nowrap;
}

/* posiciones */

.f1{left:8%;top:11%;transform:translateZ(50px) rotateY(-12deg)}
.f2{left:39%;top:7%;transform:translateZ(110px) rotateY(5deg)}
.f3{right:7%;top:13%;transform:translateZ(70px) rotateY(13deg)}
.f4{left:16%;top:43%;transform:translateZ(150px) rotateY(-9deg)}
.f5{left:43%;top:39%;transform:translateZ(190px)}
.f6{right:13%;top:45%;transform:translateZ(120px) rotateY(9deg)}
.f7{left:27%;top:67%;transform:translateZ(100px) rotateY(-5deg)}
.f8{right:28%;top:68%;transform:translateZ(140px) rotateY(7deg)}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:12px;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(9px);
}

.modal.show{
    display:flex;
}

.modalBox{
    width:100%;
    max-width:850px;
    max-height:94vh;
    overflow:auto;
    border:1px solid rgba(0,210,255,.65);
    border-radius:20px;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(0,150,255,.15),
            transparent 50%
        ),
        rgba(2,8,20,.96);
    box-shadow:
        0 0 25px rgba(0,170,255,.35),
        0 0 80px rgba(0,80,255,.15);
    padding:16px;
}

.modalHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    position:sticky;
    top:0;
    z-index:5;
    padding-bottom:12px;
    background:rgba(2,8,20,.94);
}

.modalTitle{
    color:#8eeeff;
    font-size:20px;
    font-weight:bold;
    text-shadow:0 0 10px #009dff;
}

.closeBtn{
    border:1px solid #ff4d8d;
    background:rgba(255,0,100,.08);
    color:#ff78aa;
    border-radius:10px;
    padding:8px 12px;
    font-size:18px;
}

.section{
    margin-top:14px;
    padding:12px;
    border:1px solid rgba(0,180,255,.22);
    border-radius:15px;
    background:rgba(0,60,100,.08);
}

.section h3{
    margin:0 0 8px;
    color:#55dfff;
    font-size:13px;
    letter-spacing:1px;
}

.topicText{
    width:100%;
    min-height:130px;
    resize:vertical;
    border:1px solid rgba(0,180,255,.35);
    border-radius:12px;
    padding:11px;
    background:rgba(0,0,0,.45);
    color:#e8fbff;
    outline:none;
    font-family:Arial,sans-serif;
    line-height:1.45;
}

.topicText:focus{
    border-color:#00cfff;
    box-shadow:0 0 15px rgba(0,180,255,.15);
}

.actionRow{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:9px;
}

.actionBtn{
    border:1px solid rgba(0,210,255,.55);
    background:rgba(0,130,255,.08);
    color:#9cefff;
    padding:9px 11px;
    border-radius:10px;
    font-weight:bold;
}

.actionBtn.green{
    border-color:#39ff14;
    color:#39ff14;
    background:rgba(57,255,20,.06);
}

.actionBtn.pink{
    border-color:#ff3caa;
    color:#ff78c7;
    background:rgba(255,0,130,.06);
}

.fileLabel{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:1px dashed rgba(0,210,255,.6);
    color:#8defff;
    padding:9px 11px;
    border-radius:10px;
    cursor:pointer;
}

.fileLabel input{
    display:none;
}

.mediaGrid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin-top:10px;
}

.mediaCard{
    border:1px solid rgba(0,180,255,.22);
    border-radius:12px;
    padding:9px;
    background:rgba(0,0,0,.28);
}

.mediaCard strong{
    display:block;
    color:#83eaff;
    font-size:11px;
    margin-bottom:7px;
}

audio,
video{
    width:100%;
    max-width:100%;
    border-radius:8px;
}

.imagePreview{
    width:100%;
    max-height:240px;
    object-fit:contain;
    border-radius:10px;
    border:1px solid rgba(0,190,255,.2);
}

.nasaSearch{
    display:flex;
    gap:8px;
}

.nasaSearch input{
    flex:1;
    min-width:0;
    border:1px solid rgba(0,180,255,.35);
    border-radius:10px;
    background:#020914;
    color:white;
    padding:10px;
    outline:none;
}

.nasaResults{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin-top:10px;
}

.nasaCard{
    border:1px solid rgba(0,190,255,.25);
    border-radius:12px;
    padding:8px;
    background:rgba(0,50,90,.10);
}

.nasaCard img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:8px;
}

.nasaCard b{
    display:block;
    font-size:11px;
    color:#b8f4ff;
    margin:7px 0;
}

.nasaCard button{
    width:100%;
}

.status{
    margin-top:8px;
    font-size:11px;
    color:#83eaff;
}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    z-index:200;
    padding:10px 15px;
    border:1px solid #39ff14;
    border-radius:12px;
    background:rgba(0,15,0,.92);
    color:#baffad;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    box-shadow:0 0 20px rgba(57,255,20,.25);
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   MÓVIL
========================= */

@media(max-width:700px){

    .topbar{
        min-height:66px;
    }

    .logoR{
        width:42px;
        height:42px;
        flex-basis:42px;
        font-size:24px;
    }

    .titleBox h1{
        font-size:16px;
        letter-spacing:2px;
    }

    .titleBox small{
        font-size:8px;
    }

    .backBtn{
        padding:9px 8px;
        font-size:11px;
    }

    .roomCore{
        width:100vw;
        height:82vh;
        top:53%;
        transform:translate(-50%,-50%) rotateX(5deg);
    }

    .folderStage{
        width:120px;
        height:105px;
    }

    .folderBack,
    .folderBody{
        width:105px;
    }

    .folderBack{
        height:72px;
    }

    .folderBody{
        height:66px;
    }

    .folderEdge{
        width:105px;
        height:66px;
    }

    .folderLabel{
        top:100px;
        font-size:9px;
    }

    .f1{left:1%;top:10%}
    .f2{left:35%;top:5%}
    .f3{right:1%;top:11%}
    .f4{left:4%;top:39%}
    .f5{left:36%;top:35%}
    .f6{right:3%;top:42%}
    .f7{left:14%;top:66%}
    .f8{right:10%;top:67%}

    .mediaGrid,
    .nasaResults{
        grid-template-columns:1fr;
    }

    .nasaSearch{
        flex-direction:column;
    }
}

@media(max-height:650px){
    .folderStage{
        transform:scale(.82);
    }

    .roomCore{
        height:90vh;
    }
}
</style>
</head>

<body>

<canvas id="space"></canvas>
<div class="roomGlow"></div>

<header class="topbar">

    <div class="brand">

        <div class="logoR">R</div>

        <div class="titleBox">
            <h1>CURIOSIDADES</h1>
            <small>PROYECTO RAFA · SALA 3D</small>
        </div>

    </div>

    <button class="backBtn" onclick="location.href='index.html'">
        ← PORTADA
    </button>

</header>

<div class="musicPanel">

    <button class="musicBtn" id="musicButton">
        ▶ MÚSICA
    </button>

    <div class="musicInfo">
        CURIOSIDADES · AMBIENTE
        <div id="musicState">DETENIDA</div>
    </div>

    <audio id="rootMusic" preload="none">
        <source src="curiosidades.mp3" type="audio/mpeg">
    </audio>

</div>

<div class="roomTitle">
    ARCHIVO HOLOGRÁFICO · EXPLORA LAS CARPETAS
</div>

<main class="room">

    <div class="roomCore">

        <div class="wallBack"></div>
        <div class="wallLeft"></div>
        <div class="wallRight"></div>
        <div class="floor"></div>

        <!-- UNIVERSO -->

        <div class="folderStage f1">
            <div class="holoFolder" data-folder="UNIVERSO">

                <div class="folderBack"></div>
                <div class="folderTab"></div>
                <div class="folderBody"></div>
                <div class="folderEdge"></div>
                <div class="scan"></div>

                <div class="folderLabel">
                    UNIVERSO
                </div>

            </div>
        </div>

        <!-- ANIMALES -->

        <div class="folderStage f2">
            <div class="holoFolder" data-folder="ANIMALES">

                <div class="folderBack"></div>
                <div class="folderTab"></div>
                <div class="folderBody"></div>
                <div class="folderEdge"></div>
                <div class="scan"></div>

                <div class="folderLabel">
                    ANIMALES
                </div>

            </div>
        </div>

        <!-- TIERRA -->

        <div class="folderStage f3">
            <div class="holoFolder" data-folder="TIERRA">

                <div class="folderBack"></div>
                <div class="folderTab"></div>
                <div class="folderBody"></div>
                <div class="folderEdge"></div>
                <div class="scan"></div>

                <div class="folderLabel">
                    TIERRA
                </div>

            </div>
        </div>

        <!-- CIENCIA -->

        <div class="folderStage f4">
            <div class="holoFolder" data-folder="CIENCIA">

                <div class="folderBack"></div>
                <div class="folderTab"></div>
                <div class="folderBody"></div>
                <div class="folderEdge"></div>
                <div class="scan"></div>

                <div class="folderLabel">
                    CIENCIA
                </div>

            </div>
        </div>

        <!-- HISTORIA -->

        <div class="folderStage f5">
            <div class="holoFolder" data-folder="HISTORIA">

                <div class="folderBack"></div>
                <div class="folderTab"></div>
                <div class="folderBody"></div>
                <div class="folderEdge"></div>
                <div class="scan"></div>

                <div class="folderLabel">
                    HISTORIA
                </div>

            </div>
        </div>

        <!-- MISTERIOS -->

        <div class="folderStage f6">
            <div class="holoFolder" data-folder="MISTERIOS">

                <div class="folderBack"></div>
                <div class="folderTab"></div>
                <div class="folderBody"></div>
                <div class="folderEdge"></div>
                <div class="scan"></div>

                <div class="folderLabel">
                    MISTERIOS
                </div>

            </div>
        </div>

        <!-- INVENTOS -->

        <div class="folderStage f7">
            <div class="holoFolder" data-folder="INVENTOS">

                <div class="folderBack"></div>
                <div class="folderTab"></div>
                <div class="folderBody"></div>
                <div class="folderEdge"></div>
                <div class="scan"></div>

                <div class="folderLabel">
                    INVENTOS
                </div>

            </div>
        </div>

        <!-- OTRAS -->

        <div class="folderStage f8">
            <div class="holoFolder" data-folder="OTRAS">

                <div class="folderBack"></div>
                <div class="folderTab"></div>
                <div class="folderBody"></div>
                <div class="folderEdge"></div>
                <div class="scan"></div>

                <div class="folderLabel">
                    OTRAS
                </div>

            </div>
        </div>

    </div>
</main>

<!-- =========================
     MODAL DE CARPETA
========================= -->

<div class="modal" id="folderModal">

    <div class="modalBox">

        <div class="modalHead">

/* =====================================================

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(()=>{
        toast.classList.remove("show");
    },2200);

}


/* =====================================================
   GUARDAR TEXTO
===================================================== */

function textKey(folder){

    return "rafa_curiosidades_text_" + folder;

}

function loadText(folder){

    const saved =
        localStorage.getItem(textKey(folder));

    return saved !== null
        ? saved
        : folderData[folder].text;

}

function saveText(folder){

    const area =
        document.getElementById("topicText");

    if(!area) return;

    localStorage.setItem(
        textKey(folder),
        area.value
    );

    showToast("Texto guardado en este dispositivo");

}


/* =====================================================
   ABRIR CARPETA
===================================================== */

document
.querySelectorAll(".holoFolder")
.forEach(folder=>{

    folder.addEventListener("click",()=>{

        openFolder(
            folder.dataset.folder
        );

    });

});


function openFolder(folder){

    const data =
        folderData[folder];

    if(!data) return;

    modalTitle.textContent =
        data.title;

    modalContent.innerHTML =
        buildFolderContent(folder,data);

    modal.classList.add("show");

    setupFolderControls(folder);

    if(data.nasa){

        searchNASA("universe");

    }

}

===================================================== */

/* =====================================================
   NASA
===================================================== */

async function searchNASA(query){

    const status =
        document.getElementById("nasaStatus");

    const results =
        document.getElementById("nasaResults");

    if(!status || !results) return;

    status.textContent =
        "Buscando material público de NASA...";

    results.innerHTML = "";

    try{

        const url =
            "https://images-api.nasa.gov/search?q="
            + encodeURIComponent(query)
            + "&media_type=image,video,audio";

        const response =
            await fetch(url);

        if(!response.ok){

            throw new Error(
                "NASA HTTP " + response.status
            );

        }

        const data =
            await response.json();

        const items =
            data?.collection?.items || [];

        if(!items.length){

            status.textContent =
                "No se encontraron resultados.";

            return;

        }

        status.textContent =
            "Resultados encontrados: "
            + items.length;

        items
        .slice(0,12)
        .forEach(item=>{

            const card =
                createNASAItem(item);

            results.appendChild(card);

        });

    }catch(error){

        status.textContent =
            "No se pudo conectar ahora con NASA.";

        console.error(error);

    }

}


/* =====================================================
   TARJETA NASA
===================================================== */

function createNASAItem(item){

    const data =
        item.data?.[0] || {};

    const links =
        item.links || [];

    const preview =
        links.find(
            link =>
                link.rel === "preview"
                &&
                link.href
        );

    const article =
        document.createElement("div");

    article.className =
        "nasaCard";

    const image =
        preview?.href || "";

    article.innerHTML = `

        ${
            image
            ?
            `<img
                src="${escapeHTML(image)}"
                alt=""
                loading="lazy"
            >`
            :
            `<div
                style="
                    height:120px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    border:1px solid rgba(0,190,255,.2);
                    border-radius:8px;
                    color:#7eeaff;
                "
            >
                NASA
            </div>`
        }

        <b>
            ${escapeHTML(
                data.title || "Material NASA"
            )}
        </b>

        <button
            class="actionBtn"
            type="button"
        >
            ABRIR MATERIAL
        </button>

    `;

    article
    .querySelector("button")
    .onclick = ()=>{

        openNASAMaterial(item);

    };

    return article;

}


/* =====================================================
   ABRIR MATERIAL NASA
===================================================== */

async function openNASAMaterial(item){

    const player =
        document.getElementById("nasaPlayer");

    if(!player) return;

    player.innerHTML = `

        <div class="mediaCard">

            <strong>
                CARGANDO MATERIAL NASA...
            </strong>

        </div>

    `;

    try{

        const manifestURL =
            item.href;

        if(!manifestURL){

            throw new Error(
                "No hay manifiesto"
            );

        }

        const response =
            await fetch(manifestURL);

        if(!response.ok){

            throw new Error(
                "No se pudo obtener el material"
            );

        }

        const assets =
            await response.json();

        let files = [];

        if(Array.isArray(assets)){

            files = assets;

        }else if(
            Array.isArray(
                assets?.collection?.items
            )
        ){

            files =
                assets.collection.items.map(
                    x=>x.href
                );

        }

        files =
            files
            .filter(Boolean);

        const video =
            files.find(
                url =>
                    /\.(mp4|webm|mov)(\?|$)/i.test(url)
            );

        const audio =
            files.find(
                url =>
                    /\.(mp3|wav|ogg|m4a)(\?|$)/i.test(url)
            );

        if(video){

            player.innerHTML = `

                <div class="mediaCard">

                    <strong>
                        🎬 VÍDEO NASA
                    </strong>

                    <video
                        controls
                        playsinline
                        src="${escapeHTML(video)}"
                    ></video>

                </div>

            `;

            return;

        }

        if(audio){

            player.innerHTML = `

                <div class="mediaCard">

                    <strong>
                        🎵 AUDIO NASA
                    </strong>

                    <audio
                        controls
                        src="${escapeHTML(audio)}"
                    ></audio>

                </div>

            `;

            return;

        }

        const preview =
            item.links?.find(
                x =>
                    x.rel === "preview"
            )?.href;

        if(preview){

            player.innerHTML = `

                <div class="mediaCard">

                    <strong>
                        🖼️ MATERIAL NASA
                    </strong>

                    <img
                        class="imagePreview"
                        src="${escapeHTML(preview)}"
                        alt=""
                    >

                </div>

            `;

        }else{

            player.innerHTML = `

                <div class="mediaCard">

                    <strong>
                        Material localizado,
                        pero sin reproductor compatible.
                    </strong>

                </div>

            `;

        }

    }catch(error){

        console.error(error);

        player.innerHTML = `

            <div class="mediaCard">

                <strong>
                    No se pudo cargar automáticamente
                    el reproductor de este material.
                </strong>

            </div>

        `;

    }

}


/* =====================================================
   LLUVIA DE ESTRELLAS 3D
===================================================== */

const canvas =
    document.getElementById("space");

const ctx =
    canvas.getContext("2d");

let stars = [];

let width =
    window.innerWidth;

let height =
    window.innerHeight;

function resizeCanvas(){

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        width * ratio;

    canvas.height =
        height * ratio;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

function makeStar(){

    return {

        x:(Math.random()-.5)*width*1.5,

        y:(Math.random()-.5)*height*1.5,

        z:Math.random()*width + 1,

        speed:
            1 +
            Math.random()*3,

        size:
            .5 +
            Math.random()*1.8

    };

}

for(
    let i=0;
    i<420;
    i++
){

    stars.push(
        makeStar()
    );

}

function drawStars(){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    const cx =
        width/2;

    const cy =
        height/2;

    stars.forEach(star=>{

        const oldZ =
            star.z;

        star.z -=
            star.speed;

        if(star.z <= 1){

            Object.assign(
                star,
                makeStar()
            );

            star.z =
                width;

            return;

        }

        const sx =
            cx +
            (star.x / star.z) * width;

        const sy =
            cy +
            (star.y / star.z) * width;

        const px =
            cx +
            (star.x / oldZ) * width;

        const py =
            cy +
            (star.y / oldZ) * width;

        const alpha =
            Math.min(
                1,
                (1 - star.z/width) * 1.6
            );

        ctx.beginPath();

        ctx.moveTo(
            px,
            py
        );

        ctx.lineTo(
            sx,
            sy
        );

        ctx.strokeStyle =
            "rgba(120,220,255," +
            alpha +
            ")";

        ctx.lineWidth =
            Math.max(
                .4,
                star.size *
                (1-star.z/width)*2
            );

        ctx.stroke();

    });

    requestAnimationFrame(
        drawStars
    );

}

drawStars();


/* =====================================================
   MOVIMIENTO 3D CON EL DEDO / RATÓN
===================================================== */

let targetX = 0;
let targetY = 0;
let currentX = 0;
let currentY = 0;

function updateRoom(){

    currentX +=
        (targetX-currentX)*.04;

    currentY +=
        (targetY-currentY)*.04;

    const core =
        document.querySelector(".roomCore");

    if(core){

        core.style.transform =
            "translate(-50%,-50%) " +
            "rotateX(" +
            (5-currentY) +
            "deg) " +
            "rotateY(" +
            currentX +
            "deg)";

    }

    requestAnimationFrame(
        updateRoom
    );

}

updateRoom();

window.addEventListener(
    "pointermove",
    event=>{

        targetX =
            (event.clientX /
            window.innerWidth -
            .5) * 8;

        targetY =
            (event.clientY /
            window.innerHeight -
            .5) * 5;

    },
    {passive:true}
);
