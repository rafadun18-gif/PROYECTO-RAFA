<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#010204;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 50% 35%,rgba(0,255,255,.12),transparent 28%),
        radial-gradient(circle at 15% 20%,rgba(0,255,100,.09),transparent 28%),
        radial-gradient(circle at 90% 65%,rgba(255,0,200,.10),transparent 30%),
        #010204;
}

/* =====================================================
   FONDO HOLOGRÁFICO
===================================================== */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:.35;
    background:
        linear-gradient(rgba(0,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,255,.035) 1px,transparent 1px);
    background-size:45px 45px;
    mask-image:linear-gradient(to bottom,black,transparent);
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    left:50%;
    top:38%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
    z-index:0;
    background:
        radial-gradient(circle,
            rgba(0,255,255,.10) 0%,
            rgba(0,255,100,.04) 35%,
            transparent 70%);
    filter:blur(8px);
}

/* =====================================================
   PARTICULAS
===================================================== */

.particulas{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.particulas span{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#00ffff;
    box-shadow:0 0 8px #00ffff;
    opacity:.7;
    animation:particula 8s linear infinite;
}

.particulas span:nth-child(1){
    left:8%;
    top:80%;
    animation-delay:0s;
}

.particulas span:nth-child(2){
    left:18%;
    top:35%;
    animation-delay:2s;
}

.particulas span:nth-child(3){
    left:30%;
    top:70%;
    animation-delay:4s;
}

.particulas span:nth-child(4){
    left:45%;
    top:20%;
    animation-delay:1s;
}

.particulas span:nth-child(5){
    left:62%;
    top:75%;
    animation-delay:3s;
}

.particulas span:nth-child(6){
    left:76%;
    top:30%;
    animation-delay:5s;
}

.particulas span:nth-child(7){
    left:90%;
    top:60%;
    animation-delay:2s;
}

.particulas span:nth-child(8){
    left:54%;
    top:50%;
    animation-delay:6s;
}

.particulas span:nth-child(9){
    left:25%;
    top:15%;
    animation-delay:4s;
}

.particulas span:nth-child(10){
    left:84%;
    top:15%;
    animation-delay:1s;
}

@keyframes particula{
    0%{
        transform:translateY(40px);
        opacity:0;
    }

    20%{
        opacity:.8;
    }

    80%{
        opacity:.8;
    }

    100%{
        transform:translateY(-180px);
        opacity:0;
    }
}
