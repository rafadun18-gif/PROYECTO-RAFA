<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACUARIO · Proyecto Rafa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}
</style>
</head>

<body>

<img src="Acuario-1333.png" alt="Sala Acuario">

<audio id="musica" autoplay loop playsinline>
    <source src="acuario.mp3" type="audio/mpeg">
</audio>

<script>
const musica = document.getElementById("musica");

window.addEventListener("load", () => {
    musica.play().catch(() => {});
});

document.addEventListener("touchstart", () => {
    musica.play().catch(() => {});
}, {once:true});
</script>

</body>
</html>
