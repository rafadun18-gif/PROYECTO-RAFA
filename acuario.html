<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala Acuario</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:black;
  overflow:hidden;
}
img{
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>
</head>

<body>

<img src="Acuario-1333.png" alt="Sala Acuario">

<audio id="musica" autoplay loop playsinline>
  <source src="acuario.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("musica");
audio.volume = 0.6;

audio.play().catch(() => {
  document.body.addEventListener("click", () => audio.play(), { once:true });
});
</script>

</body>
</html>
