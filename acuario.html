<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ACUARIO · Proyecto Rafa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

.acuario{
    position:relative;
    width:100vw;
    height:100vh;
}

.acuario img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* BOTÓN VOLVER */
#volver{
    position:fixed;
    top:20px;
    left:20px;
    z-index:9999;

    display:block;
    padding:14px 20px;

    background:#000;
    color:#39ff14;

    border:2px solid #39ff14;
    border-radius:12px;

    text-decoration:none;
    font-family:Arial,sans-serif;
    font-size:15px;
    font-weight:bold;

    box-shadow:0 0 15px #39ff14;
}
</style>
</head>

<body>

<div class="acuario">

    <img src="Acuario-1333.png" alt="Sala Acuario">

</div>

<!-- BOTÓN SIEMPRE POR ENCIMA DE LA FOTO -->
<a id="volver" href="index.html">
    ← PORTADA
</a>

<audio id="musica" loop preload="auto">
    <source src="acuario.mp3" type="audio/mpeg">
</audio>

<script>

const musica = document.getElementById("musica");

function ponerMusica(){
    musica.play().catch(function(){});
}

/* INTENTO AUTOMÁTICO */
window.addEventListener("load", function(){
    ponerMusica();
});

/* CUALQUIER TOQUE ARRANCA LA MÚSICA */
document.addEventListener("touchstart", ponerMusica, {
    once:true,
    passive:true
});

document.addEventListener("click", ponerMusica, {
    once:true
});

</script>

</body>
</html>
