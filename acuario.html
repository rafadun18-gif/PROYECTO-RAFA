<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala Acuario · Proyecto Rafa</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

.fondo{
  width:100vw;
  height:100vh;
  object-fit:cover;
  display:block;
}

#activar{
  position:fixed;
  inset:0;
  background:transparent;
  border:none;
}
</style>
</head>

<body>

<!-- FOTO DEL L333 -->
<img src="../Acuario-1333.png" class="fondo" alt="Sala Acuario">

<!-- MÚSICA -->
<audio id="musica" autoplay loop playsinline>
  <source src="../acuario.mp3" type="audio/mpeg">
</audio>

<button id="activar"></button>

<script>
const musica = document.getElementById("musica");
const activar = document.getElementById("activar");

musica.volume = 0.6;

musica.play().then(()=>{
  activar.style.display="none";
}).catch(()=>{
  activar.style.display="block";
});

activar.addEventListener("click",()=>{
  musica.play();
  activar.style.display="none";
});
</script>

</body>
</html>
