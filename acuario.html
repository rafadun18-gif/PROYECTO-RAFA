<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ACUARIO · Proyecto Rafa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.acuario{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.acuario img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* BOTÓN PORTADA */
.portada{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;

    padding:12px 22px;
    border:2px solid #39ff14;
    border-radius:15px;

    background:rgba(0,0,0,0.75);
    color:#39ff14;

    text-decoration:none;
    font-size:14px;
    font-weight:bold;

    box-shadow:0 0 12px #39ff14;
}

.portada:active{
    transform:translateX(-50%) scale(0.95);
}
</style>
</head>

<body>

<div class="acuario">

    <img src="Acuario-1333.png" alt="Sala Acuario">

    <a class="portada" href="index.html">
        ← VOLVER A PORTADA
    </a>

</div>

<audio id="musica" autoplay loop playsinline preload="auto">
    <source src="acuario.mp3" type="audio/mpeg">
</audio>

<script>

const musica = document.getElementById("musica");

/* INTENTO AUTOMÁTICO */
window.addEventListener("load", function(){
    musica.play().catch(function(){});
});

/* SI EL NAVEGADOR BLOQUEA EL AUTOMÁTICO,
   EL PRIMER TOQUE ARRANCA LA MÚSICA */
function arrancarMusica(){
    musica.play().catch(function(){});
}

document.addEventListener("touchstart", arrancarMusica, {
    once:true,
    passive:true
});

document.addEventListener("click", arrancarMusica, {
    once:true
});

</script>

</body>
</html>
