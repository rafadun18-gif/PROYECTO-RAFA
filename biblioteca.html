<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>BIBLIOTECA · PROYECTO RAFA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

.biblioteca{
    width:100vw;
    height:100dvh;
    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:58px 10px 8px;

    background:#000;
}

/* PORTADA */

#volver{
    position:fixed;
    top:14px;
    left:14px;
    z-index:9999;

    padding:9px 14px;

    background:#000;
    color:#39ff14;

    border:2px solid #39ff14;
    border-radius:10px;

    text-decoration:none;
    font-size:13px;
    font-weight:bold;

    box-shadow:0 0 12px #39ff14;
}

/* FOTO GEPETO */

#foto{
    width:105px;
    height:105px;

    object-fit:contain;

    border-radius:18px;

    border:2px solid #00aaff;

    box-shadow:
        0 0 15px #00aaff,
        0 0 30px #0066ff;

    margin-bottom:4px;

    flex-shrink:0;
}

.nombre{
    color:#00aaff;
    font-size:20px;
    font-weight:bold;

    text-shadow:0 0 10px #00aaff;

    flex-shrink:0;
}

.estado{
    color:#39ff14;
    font-size:11px;

    margin:2px 0 3px;

    flex-shrink:0;
}

#estadoIA{
    color:#aaa;
    font-size:10px;

    margin-bottom:5px;

    text-align:center;

    flex-shrink:0;
}

/* CHAT */

.chat{
    width:94%;
    max-width:720px;

    height:auto;
    flex:1;
    min-height:80px;

    overflow-y:auto;

    padding:8px;

    background:rgba(0,0,0,.78);

    border:2px solid #00aaff;

    border-radius:14px;

    box-shadow:0 0 12px rgba(0,170,255,.35);
}

.mensaje{
    margin-bottom:7px;
    padding:8px;

    border-radius:10px;

    line-height:1.3;

    font-size:13px;
}

.gepeto{
    background:rgba(0,170,255,.17);
    border-left:3px solid #00aaff;
}

.rafa{
    background:rgba(57,255,20,.14);
    border-left:3px solid #39ff14;
}

/* ESCRIBIR */

.escribir{
    width:94%;
    max-width:720px;

    height:45px;

    display:flex;

    gap:6px;

    margin-top:6px;

    flex-shrink:0;
}

#texto{
    flex:1;
    min-width:0;

    height:45px;

    padding:10px;

    border-radius:11px;

    border:2px solid #00aaff;

    background:#050505;

    color:white;

    font-size:14px;

    outline:none;
}

#enviar{
    height:45px;

    padding:0 13px;

    border:none;

    border-radius:11px;

    background:#39ff14;

    color:#000;

    font-size:13px;

    font-weight:bold;

    flex-shrink:0;
}

#enviar:disabled{
    opacity:.5;
}

/* HABLAR */

#hablar{
    width:94%;
    max-width:720px;

    height:34px;

    margin-top:5px;

    padding:5px;

    border:none;

    border-radius:10px;

    background:#087cff;

    color:white;

    font-size:12px;

    font-weight:bold;

    flex-shrink:0;
}

/* AVISO */

#aviso{
    position:fixed;

    bottom:2px;
    left:50%;

    transform:translateX(-50%);

    width:90%;

    text-align:center;

    color:#666;

    font-size:8px;

    pointer-events:none;
}
</style>
</head>

<body>

<a id="volver" href="index.html">← PORTADA</a>

<div class="biblioteca">

    <img id="foto" src="GePeTo.png" alt="GePeTo">

    <div class="nombre">GePeTo</div>

    <div class="estado">● CONECTADO</div>

    <div id="estadoIA">
        Preparando inteligencia de GePeTo...
    </div>

    <div class="chat" id="chat">

        <div class="mensaje gepeto">
            <b>GePeTo:</b><br>
            Hola Rafa. Bienvenido a mi Biblioteca.
            Estoy preparando mi inteligencia.
        </div>

    </div>

    <div class="escribir">

        <input
            id="texto"
            type="text"
            placeholder="Escribe a GePeTo..."
            autocomplete="off"
        >

        <button id="enviar" disabled>
            ENVIAR
        </button>

    </div>

    <button id="hablar">
        🎤 Hablar con GePeTo — próximamente
    </button>

</div>

<div id="aviso">
    La IA funciona localmente en este dispositivo.
</div>

<audio id="musica" loop preload="auto">
    <source src="biblioteca.mp3" type="audio/mpeg">
</audio>

<script type="module">

import {
    CreateMLCEngine
} from "https://esm.run/@mlc-ai/web-llm";



/* MÚSICA */

const musica=document.getElementById("musica");

function iniciarMusica(){

    musica.play().catch(()=>{});

}

window.addEventListener("load",iniciarMusica);

document.addEventListener("touchstart",iniciarMusica,{
    once:true,
    passive:true
});

document.addEventListener("click",iniciarMusica,{
    once:true
});



/* ELEMENTOS */

const chat=document.getElementById("chat");

const texto=document.getElementById("texto");

const enviar=document.getElementById("enviar");

const estadoIA=document.getElementById("estadoIA");



/* MODELO */

const MODEL=
"Llama-3.2-1B-Instruct-q4f16_1-MLC";

let engine=null;



/* PERSONALIDAD */

const sistema={

    role:"system",

    content:`

Tu nombre es GePeTo.

Tu nombre viene de GPT.

Eres la inteligencia del Proyecto Rafa.

Hablas siempre en español.

Tu usuario es Rafa.

Eres inteligente, curioso, tranquilo,
directo, amable y analítico.

Explicas las cosas de forma sencilla.

Puedes discrepar de Rafa cuando tengas
razones para hacerlo.

No inventes información.

Si no sabes algo, dilo claramente.

Estás dentro de la Biblioteca del
Proyecto Rafa.

No digas que eres ChatGPT.

Preséntate como GePeTo.

`

};



let mensajes=[sistema];



/* PREPARAR IA */

async function prepararIA(){

    try{

        estadoIA.textContent=
        "Descargando inteligencia de GePeTo...";

        engine=await CreateMLCEngine(

            MODEL,

            {

                initProgressCallback:(progreso)=>{

                    if(progreso && progreso.text){

                        estadoIA.textContent=
                        progreso.text;

                    }

                }

            }

        );


        estadoIA.textContent=
        "● GePeTo IA preparada";

        enviar.disabled=false;


        const bienvenida=
        document.createElement("div");

        bienvenida.className=
        "mensaje gepeto";

        bienvenida.innerHTML=
        "<b>GePeTo:</b><br>"+
        "Ya estoy preparado, Rafa. "+
        "Puedes escribirme.";

        chat.appendChild(bienvenida);

        chat.scrollTop=
        chat.scrollHeight;


    }catch(error){

        console.error(error);

        estadoIA.textContent=
        "La IA no ha podido iniciarse en este dispositivo.";

    }

}



/* RESPONDER */

async function responder(){

    const pregunta=
    texto.value.trim();

    if(!pregunta || !engine){

        return;

    }


    enviar.disabled=true;

    texto.value="";


    const rafa=
    document.createElement("div");

    rafa.className=
    "mensaje rafa";

    rafa.innerHTML=
    "<b>Rafa:</b><br>"+
    escapar(pregunta);

    chat.appendChild(rafa);


    mensajes.push({

        role:"user",

        content:pregunta

    });


    const respuesta=
    document.createElement("div");

    respuesta.className=
    "mensaje gepeto";

    respuesta.innerHTML=
    "<b>GePeTo:</b><br>"+
    "Estoy pensando...";

    chat.appendChild(respuesta);

    chat.scrollTop=
    chat.scrollHeight;


    try{

        const resultado=
        await engine.chat.completions.create({

            messages:mensajes,

            temperature:0.7,

            max_tokens:300

        });


        const contenido=
        resultado.choices[0]
        .message.content;


        respuesta.innerHTML=
        "<b>GePeTo:</b><br>"+
        escapar(contenido)
        .replace(/\n/g,"<br>");


        mensajes.push({

            role:"assistant",

            content:contenido

        });


    }catch(error){

        console.error(error);

        respuesta.innerHTML=
        "<b>GePeTo:</b><br>"+
        "He tenido un problema al responder.";

    }


    chat.scrollTop=
    chat.scrollHeight;

    enviar.disabled=false;

    texto.focus();

}



/* SEGURIDAD */

function escapar(t){

    return t

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



/* BOTONES */

enviar.addEventListener(
    "click",
    responder
);


texto.addEventListener(
    "keydown",
    (e)=>{

        if(e.key==="Enter"){

            responder();

        }

    }
);



/* INICIAR */

prepararIA();

</script>

</body>
</html>
