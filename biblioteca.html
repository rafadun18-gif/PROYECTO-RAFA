<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BIBLIOTECA · PROYECTO RAFA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    color:white;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* FONDO */

.biblioteca{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:70px;
    padding-bottom:18px;
    background:#000;
}

/* BOTÓN PORTADA */

#volver{
    position:fixed;
    top:18px;
    left:18px;
    z-index:9999;

    padding:12px 18px;

    background:#000;
    color:#39FF14;

    border:2px solid #39FF14;
    border-radius:12px;

    text-decoration:none;
    font-size:15px;
    font-weight:bold;

    box-shadow:0 0 15px #39FF14;
}

/* FOTO DE GEPETO */

#foto{
    width:170px;
    height:170px;
    object-fit:contain;
    border-radius:25px;
    border:3px solid #00AEEF;
    box-shadow:
      0 0 20px #00AEEF,
      0 0 40px #0066FF;
    margin-bottom:12px;
}

.nombre{
    color:#00AEEF;
    font-size:26px;
    font-weight:bold;
    text-shadow:0 0 12px #00AEEF;
    margin-bottom:4px;
}

.estado{
    color:#39FF14;
    font-size:13px;
    margin-bottom:12px;
}

/* CHAT */

.chat{
    width:92%;
    max-width:720px;
    flex:1;
    overflow-y:auto;

    background:rgba(0,0,0,.65);

    border:2px solid #00AEEF;
    border-radius:18px;

    padding:12px;

    box-shadow:0 0 15px rgba(0,174,239,.35);
}

.mensaje{
    margin-bottom:10px;
    padding:10px;
    border-radius:12px;
    line-height:1.4;
    font-size:15px;
}

.gepeto{
    background:rgba(0,174,239,.18);
    border-left:4px solid #00AEEF;
}

.rafa{
    background:rgba(57,255,20,.18);
    border-left:4px solid #39FF14;
}

/* ESCRIBIR */

.escribir{
    width:92%;
    max-width:720px;
    margin-top:10px;
    display:flex;
    gap:8px;
}

#texto{
    flex:1;
    padding:12px;
    border-radius:14px;
    border:2px solid #00AEEF;
    background:#050505;
    color:white;
    font-size:16px;
    outline:none;
}

#enviar{
    padding:12px 16px;
    border:none;
    border-radius:14px;
    background:#39FF14;
    color:#000;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

/* BOTÓN HABLAR (MÁS PEQUEÑO PARA QUE NO SE CORTE) */

#hablar{
    width:92%;
    max-width:720px;
    margin-top:8px;

    padding:10px;

    background:#0088FF;
    color:white;

    border:none;
    border-radius:14px;

    font-size:15px;
    font-weight:bold;

    box-shadow:0 0 12px #0088FF;
}
</style>
</head>

<body>

<a id="volver" href="index.html">← PORTADA</a>

<div class="biblioteca">

<img id="foto" src="GePeTo.png" alt="GePeTo">

<div class="nombre">GePeTo</div>

<div class="estado">● CONECTADO</div>

<div class="chat" id="chat">

<div class="mensaje gepeto">
<b>GePeTo:</b><br><br>

Hola Rafa.

Bienvenido a mi Biblioteca.

Aquí hablaremos de historia, misterios, ciencia,
acuariofilia y del Proyecto Rafa.

Estoy listo para aprender contigo.
</div>

</div>

<div class="escribir">

<input
id="texto"
type="text"
placeholder="Escribe a GePeTo...">

<button id="enviar">Enviar</button>

</div>

<button id="hablar">🎤 Hablar con GePeTo</button>

</div>

<!-- MÚSICA DE LA BIBLIOTECA -->

<audio id="musica" loop preload="auto">
<source src="biblioteca.mp3" type="audio/mpeg">
</audio>

<script>

const musica=document.getElementById("musica");

function iniciarMusica(){
    musica.play().catch(()=>{});
}

window.addEventListener("load",()=>{
    iniciarMusica();
});

document.addEventListener("touchstart",iniciarMusica,{
    once:true,
    passive:true
});

document.addEventListener("click",iniciarMusica,{
    once:true
});

/* CHAT */

const chat=document.getElementById("chat");
const texto=document.getElementById("texto");
const enviar=document.getElementById("enviar");

function responder(){

const t=texto.value.trim();

if(t==="") return;

chat.innerHTML+=`
<div class="mensaje rafa">
<b>Rafa:</b><br>${t}
</div>`;

texto.value="";

setTimeout(()=>{

chat.innerHTML+=`
<div class="mensaje gepeto">
<b>GePeTo:</b><br>
He recibido tu mensaje, Rafa.
La Biblioteca será mi sala personal dentro del Proyecto Rafa.
Muy pronto podremos conversar de verdad.
</div>`;

chat.scrollTop=chat.scrollHeight;

},500);

}

enviar.onclick=responder;

texto.addEventListener("keydown",(e)=>{
if(e.key==="Enter") responder();
});

/* BOTÓN HABLAR */

document.getElementById("hablar").onclick=()=>{
alert("Próximamente hablarás con GePeTo usando tu voz.");
};

</script>

</body>
</html>
