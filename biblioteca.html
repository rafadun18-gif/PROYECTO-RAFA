<script type="module">

import * as webllm from
"https://esm.run/@mlc-ai/web-llm";


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const CLAVE_MEMORIA = "memoriaGePeTo";
const CLAVE_HISTORIAL = "historialGePeTo";
const CLAVE_TAREAS = "tareasGePeTo";

const MODELO =
"Llama-3.2-1B-Instruct-q4f16_1-MLC";


/* =========================================================
   CLOUDFLARE D1
========================================================= */

const URL_CLOUDFLARE =
"https://gepetto-rafa.rafadun18.workers.dev";

let cloudflareDisponible = false;


/* =========================================================
   ESTADO
========================================================= */

let engine = null;
let preparando = false;

let memoria =
    cargarArray(CLAVE_MEMORIA);

let historial =
    cargarArray(CLAVE_HISTORIAL);

let tareas =
    cargarArray(CLAVE_TAREAS);


/* =========================================================
   ELEMENTOS
========================================================= */

const chat =
document.getElementById("chat");

const entrada =
document.getElementById("entrada");

const formulario =
document.getElementById("formulario");

const numeroRecuerdos =
document.getElementById("numeroRecuerdos");

const numeroTareas =
document.getElementById("numeroTareas");

const estadoIA =
document.getElementById("estadoIA");

const botonEnviar =
document.getElementById("enviar");

const botonVoz =
document.getElementById("voz");

const musica =
document.getElementById("musica");

const botonMusica =
document.getElementById("botonMusica");

const botonVolver =
document.getElementById("volver");


/* =========================================================
   VOLVER
========================================================= */

botonVolver.addEventListener(
    "click",
    () => {

        window.location.href =
            "index.html";

    }
);


/* =========================================================
   MÚSICA
========================================================= */

let musicaActiva = true;


/*
   Intentar reproducir automáticamente.
   Algunos navegadores, especialmente iPhone,
   pueden bloquear el autoplay.
*/

async function iniciarMusica() {

    try {

        await musica.play();

        musicaActiva = true;

        botonMusica.textContent = "🎵";

    } catch(error) {

        /*
           iPhone puede bloquear la reproducción automática.
           Esperamos al primer toque del usuario.
        */

        musicaActiva = false;

        botonMusica.textContent = "🔇";
    }
}


async function activarMusicaPorToque() {

    try {

        if (
            musica.paused
        ) {

            await musica.play();

            musicaActiva = true;

            botonMusica.textContent =
                "🎵";
        }

    } catch(error) {

        console.log(
            "No se pudo iniciar la música:",
            error
        );
    }
}


botonMusica.addEventListener(
    "click",
    async () => {

        if (
            musica.paused
        ) {

            try {

                await musica.play();

                musicaActiva = true;

                botonMusica.textContent =
                    "🎵";

            } catch(error) {

                console.log(error);
            }

        } else {

            musica.pause();

            musicaActiva = false;

            botonMusica.textContent =
                "🔇";
        }

    }
);


/*
   Primer toque/clic en la página.
*/

document.addEventListener(
    "touchstart",
    activarMusicaPorToque,
    {
        once:true,
        passive:true
    }
);

document.addEventListener(
    "click",
    activarMusicaPorToque,
    {
        once:true
    }
);


/* =========================================================
   ALMACENAMIENTO LOCAL
========================================================= */

function cargarArray(clave) {

    try {

        const guardado =
            localStorage.getItem(clave);

        if (!guardado) {
            return [];
        }

        const datos =
            JSON.parse(guardado);

        return Array.isArray(datos)
            ? datos
            : [];

    } catch(error) {

        console.log(
            "Error cargando",
            clave,
            error
        );

        return [];
    }
}


function guardarArray(clave, datos) {

    try {

        localStorage.setItem(
            clave,
            JSON.stringify(datos)
        );

        return true;

    } catch(error) {

        console.log(
            "Error guardando",
            clave,
            error
        );

        return false;
    }
}


/* =========================================================
   NORMALIZAR
========================================================= */

function normalizar(texto) {

    return String(texto)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[¿?¡!.,;:()[\]{}"']/g," ")
        .replace(/\s+/g," ")
        .trim();
}


/* =========================================================
   CONTADORES
========================================================= */

function actualizarContadores() {

    numeroRecuerdos.textContent =
        memoria.length;

    numeroTareas.textContent =
        tareas.filter(
            tarea => tarea.activa !== false
        ).length;
}


/* =========================================================
   CHAT
========================================================= */

function añadirMensaje(
    texto,
    tipo = "gepeto",
    guardar = true
) {

    const mensaje =
        document.createElement("div");

    mensaje.className =
        "mensaje " + tipo;

    mensaje.textContent =
        texto;

    chat.appendChild(mensaje);

    chat.scrollTop =
        chat.scrollHeight;


    if (guardar) {

        historial.push({

            tipo: tipo,

            texto: texto,

            fecha: Date.now()

        });


        if (historial.length > 100) {

            historial =
                historial.slice(-100);

        }


        guardarArray(
            CLAVE_HISTORIAL,
            historial
        );
    }


    return mensaje;
}


/* =========================================================
   HISTORIAL
========================================================= */

function cargarHistorial() {

    chat.innerHTML = "";


    if (historial.length === 0) {

        añadirMensaje(

            "Hola Rafa. Soy GePeTo 🧠\n\n" +

            "Puedo conversar contigo, guardar recuerdos, " +
            "utilizar esos recuerdos para contestarte y " +
            "guardar tareas.\n\n" +

            "Puedes preguntarme:\n" +

            "• ¿Qué puedes hacer?\n" +
            "• ¿Qué recuerdas?\n" +
            "• ¿Qué tareas tengo?\n\n" +

            "También puedes decirme:\n" +

            "«Recuerda que mi color preferido es el verde fosforito»",

            "gepeto",

            false
        );

        return;
    }


    historial.forEach(item => {

        if (
            item &&
            typeof item.texto === "string" &&
            (
                item.tipo === "usuario" ||
                item.tipo === "gepeto"
            )
        ) {

            añadirMensaje(
                item.texto,
                item.tipo,
                false
            );
        }

    });
}


/* =========================================================
   CARGAR MEMORIA DESDE D1
========================================================= */

async function cargarMemoriaCloudflare() {

    try {

        const respuesta =
            await fetch(
                URL_CLOUDFLARE + "/memoria",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!respuesta.ok) {
            throw new Error(
                "Error HTTP " + respuesta.status
            );
        }


        const datos =
            await respuesta.json();


        if (
            datos.ok &&
            Array.isArray(datos.recuerdos)
        ) {

            memoria =
                datos.recuerdos
                    .map(
                        recuerdo =>
                            recuerdo.texto
                    )
                    .filter(
                        texto =>
                            typeof texto === "string" &&
                            texto.trim() !== ""
                    );


            guardarArray(
                CLAVE_MEMORIA,
                memoria
            );


            cloudflareDisponible = true;

            actualizarContadores();

            return true;
        }


        throw new Error(
            "Respuesta de memoria no válida"
        );

    } catch(error) {

        console.log(
            "Cloudflare memoria no disponible:",
            error
        );

        cloudflareDisponible = false;

        memoria =
            cargarArray(
                CLAVE_MEMORIA
            );

        actualizarContadores();

        return false;
    }
}


/* =========================================================
   GUARDAR MEMORIA EN D1
========================================================= */

async function guardarMemoriaCloudflare(
    texto
) {

    const recuerdo =
        String(texto).trim();


    if (!recuerdo) {

        return {
            guardado:false,
            repetido:false
        };
    }


    try {

        const respuesta =
            await fetch(
                URL_CLOUDFLARE + "/memoria",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            texto: recuerdo
                        })
                }
            );


        if (!respuesta.ok) {
            throw new Error(
                "Error HTTP " + respuesta.status
            );
        }


        const datos =
            await respuesta.json();


        if (!datos.ok) {
            throw new Error(
                datos.error ||
                "No se pudo guardar"
            );
        }


        cloudflareDisponible = true;


        if (datos.repetido) {

            return {
                guardado:false,
                repetido:true
            };
        }


        if (datos.guardado) {

            if (
                !memoria.some(
                    item =>
                        normalizar(item) ===
                        normalizar(recuerdo)
                )
            ) {

                memoria.push(recuerdo);
            }


            guardarArray(
                CLAVE_MEMORIA,
                memoria
            );


            actualizarContadores();


            return {
                guardado:true,
                repetido:false
            };
        }


        return {
            guardado:false,
            repetido:false
        };

    } catch(error) {

        console.log(
            "Error guardando memoria en D1:",
            error
        );


        const resultado =
            guardarMemoriaLocal(
                recuerdo
            );


        cloudflareDisponible = false;

        return resultado;
    }
}


/* =========================================================
   MEMORIA LOCAL
========================================================= */

function guardarMemoriaLocal(texto) {

    const recuerdo =
        String(texto).trim();


    if (!recuerdo) {

        return {
            guardado:false,
            repetido:false
        };
    }


    const existe =
        memoria.some(
            item =>
                normalizar(item) ===
                normalizar(recuerdo)
        );


    if (existe) {

        return {
            guardado:false,
            repetido:true
        };
    }


    memoria.push(recuerdo);


    const correcto =
        guardarArray(
            CLAVE_MEMORIA,
            memoria
        );


    actualizarContadores();


    return {

        guardado: correcto,

        repetido:false

    };
}


/* =========================================================
   BORRAR MEMORIA D1
========================================================= */

async function borrarMemoriaCloudflare() {

    try {

        const respuesta =
            await fetch(
                URL_CLOUDFLARE + "/memoria",
                {
                    method: "DELETE"
                }
            );


        if (!respuesta.ok) {
            throw new Error(
                "Error HTTP " + respuesta.status
            );
        }


        const datos =
            await respuesta.json();


        if (!datos.ok) {
            throw new Error(
                datos.error ||
                "No se pudo borrar"
            );
        }


        memoria = [];


        guardarArray(
            CLAVE_MEMORIA,
            memoria
        );


        cloudflareDisponible = true;

        actualizarContadores();

        return true;

    } catch(error) {

        console.log(
            "Error borrando memoria D1:",
            error
        );


        memoria = [];


        guardarArray(
            CLAVE_MEMORIA,
            memoria
        );


        cloudflareDisponible = false;

        actualizarContadores();

        return false;
    }
}


/* =========================================================
   DETECTAR RECUERDO
========================================================= */

function extraerRecuerdo(texto) {

    const mensaje =
        String(texto).trim();


    const patrones = [

        /^\s*recuerda(?:me)?\s*(?:que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*acu[eé]rdate\s*(?:de|que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*guarda\s*(?:que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*memoriza\s*(?:que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*apunta\s*(?:que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*anota\s*(?:que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*no olvides\s*(?:que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*quiero que recuerdes\s+(.+)$/i

    ];


    for (
        const patron of patrones
    ) {

        const resultado =
            mensaje.match(patron);


        if (
            resultado &&
            resultado[1]
        ) {

            const recuerdo =
                resultado[1]
                    .trim()
                    .replace(/[.!?]+$/,"");


            if (
                recuerdo.length > 1
            ) {

                return recuerdo;
            }
        }
    }


    return null;
}


/* =========================================================
   PALABRAS IMPORTANTES
========================================================= */

function palabrasImportantes(texto) {

    const ignoradas =
        new Set([

            "el","la","los","las",

            "un","una","unos","unas",

            "mi","mis","me","yo",

            "tu","tus","te",

            "es","son","que",

            "cual","cuales",

            "como","donde","cuando",

            "por","para","con",

            "de","del",

            "y","o","a",

            "tengo","tiene",

            "favorito","favorita",

            "dime","sabes",

            "recuerdas","recuerdo"

        ]);


    return normalizar(texto)

        .split(" ")

        .filter(
            palabra =>
                palabra.length > 2
        )

        .filter(
            palabra =>
                !ignoradas.has(palabra)
        );
}


/* =========================================================
   BUSCAR RECUERDOS
========================================================= */

function buscarRecuerdosRelacionados(
    pregunta
) {

    const palabras =
        palabrasImportantes(
            pregunta
        );


    if (
        palabras.length === 0
    ) {

        return [];
    }


    const resultados =
        memoria.map(
            recuerdo => {

                const palabrasRecuerdo =
                    palabrasImportantes(
                        recuerdo
                    );


                let puntos = 0;


                palabras.forEach(
                    palabra => {

                        if (
                            palabrasRecuerdo
                                .includes(palabra)
                        ) {

                            puntos++;
                        }

                    }
                );


                return {

                    texto: recuerdo,

                    puntos: puntos

                };

            }
        );


    return resultados

        .filter(
            item =>
                item.puntos > 0
        )

        .sort(
            (a,b) =>
                b.puntos - a.puntos
        )

        .slice(0,5)

        .map(
            item =>
                item.texto
        );
}


/* =========================================================
   PETICIÓN DE RECUERDOS
========================================================= */

function esPeticionDeRecuerdos(
    texto
) {

    const mensaje =
        normalizar(texto);


    return (

        mensaje.includes(
            "que recuerdas"
        ) ||

        mensaje.includes(
            "mis recuerdos"
        ) ||

        mensaje.includes(
            "que sabes de mi"
        ) ||

        mensaje.includes(
            "ensename mis recuerdos"
        ) ||

        mensaje.includes(
            "dime mis recuerdos"
        ) ||

        mensaje.includes(
            "ver recuerdos"
        )

    );
}


function responderSobreMemoria(
    pregunta
) {

    if (
        esPeticionDeRecuerdos(
            pregunta
        )
    ) {

        if (
            memoria.length === 0
        ) {

            return "Todavía no tengo recuerdos guardados, Rafa.";
        }


        return (

            "🧠 Estos son mis recuerdos:\n\n" +

            memoria
                .map(
                    (recuerdo,indice) =>
                        (indice + 1) +
                        ". " +
                        recuerdo
                )
                .join("\n")

        );
    }


    const relacionados =
        buscarRecuerdosRelacionados(
            pregunta
        );


    if (
        relacionados.length === 0
    ) {

        return null;
    }


    if (
        relacionados.length === 1
    ) {

        return (

            "🧠 Sí, lo recuerdo:\n\n" +

            relacionados[0]

        );
    }


    return (

        "🧠 He encontrado estos recuerdos relacionados:\n\n" +

        relacionados
            .map(
                recuerdo =>
                    "• " + recuerdo
            )
            .join("\n")

    );
}


/* =========================================================
   QUÉ PUEDE HACER
========================================================= */

/* =========================================================
   CARGAR TAREAS D1
========================================================= */

async function cargarTareasCloudflare() {

    try {

        const respuesta =
            await fetch(
                URL_CLOUDFLARE + "/tareas",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!respuesta.ok) {
            throw new Error(
                "Error HTTP " + respuesta.status
            );
        }


        const datos =
            await respuesta.json();


        if (
            datos.ok &&
            Array.isArray(datos.tareas)
        ) {

            tareas =
                datos.tareas.map(
                    tarea => ({

                        id:
                            tarea.id,

                        texto:
                            tarea.texto,

                        creada:
                            tarea.creada
                                ? new Date(
                                    tarea.creada
                                ).getTime()
                                : Date.now(),

                        fecha:
                            tarea.fecha || null,

                        activa:
                            Number(
                                tarea.completada
                            ) === 0

                    })
                );


            guardarArray(
                CLAVE_TAREAS,
                tareas
            );


            cloudflareDisponible = true;

            actualizarContadores();

            return true;
        }


        throw new Error(
            "Respuesta de tareas no válida"
        );

    } catch(error) {

        console.log(
            "Cloudflare tareas no disponible:",
            error
        );


        tareas =
            cargarArray(
                CLAVE_TAREAS
            );


        actualizarContadores();

        return false;
    }
}


/* =========================================================
   CREAR TAREA
========================================================= */

async function crearTarea(texto) {

    const textoLimpio =
        texto.trim();


    if (!textoLimpio) {
        return null;
    }


    try {

        const respuesta =
            await fetch(
                URL_CLOUDFLARE + "/tarea",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            texto:
                                textoLimpio
                        })
                }
            );


        if (!respuesta.ok) {
            throw new Error(
                "Error HTTP " + respuesta.status
            );
        }


        const datos =
            await respuesta.json();


        if (
            datos.ok &&
            datos.tarea
        ) {

            const tarea = {

                id:
                    datos.tarea.id,

                texto:
                    datos.tarea.texto,

                fecha:
                    datos.tarea.fecha || null,

                creada:
                    Date.now(),

                activa:
                    true

            };


            tareas.unshift(tarea);


            guardarArray(
                CLAVE_TAREAS,
                tareas
            );


            cloudflareDisponible = true;

            actualizarContadores();

            return tarea;
        }


        throw new Error(
            datos.error ||
            "No se pudo guardar la tarea"
        );

    } catch(error) {

        console.log(
            "Error guardando tarea en D1:",
            error
        );


        const tarea = {

            id:
                Date.now().toString() +
                Math.random()
                    .toString(36)
                    .substring(2,8),

            texto:
                textoLimpio,

            creada:
                Date.now(),

            activa:
                true

        };


        tareas.push(tarea);


        guardarArray(
            CLAVE_TAREAS,
            tareas
        );


        cloudflareDisponible = false;

        actualizarContadores();

        return tarea;
    }
}


/* =========================================================
   DETECTAR TAREAS
========================================================= */

function extraerTarea(texto) {

    const mensaje =
        texto.trim();


    const patrones = [

        /^\s*recu[eé]rdame\s+que\s+(.+)$/i,

        /^\s*recu[eé]rdame\s+(.+)$/i,

        /^\s*crea una tarea para\s+(.+)$/i,

        /^\s*crea una tarea\s+(.+)$/i,

        /^\s*anota una tarea\s+(.+)$/i,

        /^\s*guarda una tarea\s+(.+)$/i,

        /^\s*apunta una tarea\s+(.+)$/i

    ];


    for (
        const patron of patrones
    ) {

        const resultado =
            mensaje.match(patron);


        if (
            resultado &&
            resultado[1]
        ) {

            return resultado[1]
                .trim();
        }
    }


    return null;
}


/* =========================================================
   PREGUNTAS SOBRE TAREAS
========================================================= */

function esPeticionDeTareas(
    texto
) {

    const mensaje =
        normalizar(texto);


    return (

        mensaje.includes(
            "que tareas tengo"
        ) ||

        mensaje.includes(
            "mis tareas"
        ) ||

        mensaje.includes(
            "ver tareas"
        ) ||

        mensaje.includes(
            "mis pendientes"
        )

    );
}


function responderSobreTareas() {

    const activas =
        tareas.filter(
            tarea =>
                tarea.activa !== false
        );


    if (
        activas.length === 0
    ) {

        return "📋 No tienes tareas pendientes, Rafa.";
    }


    return (

        "📋 Estas son tus tareas:\n\n" +

        activas
            .map(
                (tarea,indice) =>
                    (indice + 1) +
                    ". " +
                    tarea.texto
            )
            .join("\n")

    );
}


/* =========================================================
   BORRAR TAREA
========================================================= */

async function borrarTareaPorTexto(
    texto
) {

    const palabras =
        palabrasImportantes(
            texto
        );


    let encontrada = -1;


    for (
        let i = 0;
        i < tareas.length;
        i++
    ) {

        if (
            tareas[i].activa === false
        ) {

            continue;
        }


        const palabrasTarea =
            palabrasImportantes(
                tareas[i].texto
            );


        const coincidencias =
            palabras.filter(
                palabra =>
                    palabrasTarea
                        .includes(palabra)
            ).length;


        if (
            coincidencias > 0
        ) {

            encontrada = i;

            break;
        }
    }


    if (
        encontrada === -1
    ) {

        return false;
    }


    const tarea =
        tareas[encontrada];


    try {

        const respuesta =
            await fetch(
                URL_CLOUDFLARE +
                "/tarea/" +
                encodeURIComponent(
                    tarea.id
                ),
                {
                    method: "DELETE"
                }
            );


        if (!respuesta.ok) {
            throw new Error(
                "Error HTTP " + respuesta.status
            );
        }


        const datos =
            await respuesta.json();


        if (!datos.ok) {
            throw new Error(
                datos.error ||
                "No se pudo eliminar"
            );
        }


        tareas.splice(
            encontrada,
            1
        );


        guardarArray(
            CLAVE_TAREAS,
            tareas
        );


        actualizarContadores();

        return true;

    } catch(error) {

        console.log(
            "Error borrando tarea de D1:",
            error
        );


        tareas[encontrada].activa =
            false;


        guardarArray(
            CLAVE_TAREAS,
            tareas
        );


        cloudflareDisponible = false;

        actualizarContadores();

        return true;
    }
}


/* =========================================================
   DETECTAR BORRADO
========================================================= */

function extraerBorradoTarea(
    texto
) {

    const mensaje =
        texto.trim();


    const patrones = [

        /^\s*borra la tarea\s+(.+)$/i,

        /^\s*elimina la tarea\s+(.+)$/i,

        /^\s*quita la tarea\s+(.+)$/i,

        /^\s*cancela la tarea\s+(.+)$/i

    ];


    for (
        const patron of patrones
    ) {

        const resultado =
            mensaje.match(patron);


        if (
            resultado &&
            resultado[1]
        ) {

            return resultado[1]
                .trim();
        }
    }


    return null;
}


/* =========================================================
   CONTEXTO MEMORIA
========================================================= */

function crearContextoMemoria() {

    if (
        memoria.length === 0
    ) {

        return "No hay recuerdos guardados.";
    }


    return memoria
        .map(
            (recuerdo,indice) =>
                (indice + 1) +
                ". " +
                recuerdo
        )
        .join("\n");
}


/* =========================================================
   CONTEXTO TAREAS
========================================================= */

function crearContextoTareas() {

    const activas =
        tareas.filter(
            tarea =>
                tarea.activa !== false
        );


    if (
        activas.length === 0
    ) {

        return "No hay tareas pendientes.";
    }


    return activas
        .map(
            (tarea,indice) =>
                (indice + 1) +
                ". " +
                tarea.texto
        )
        .join("\n");
}


/* =========================================================
   CONTEXTO HISTORIAL
========================================================= */

function crearContextoHistorial() {

    return historial
        .slice(-12)
        .map(
            item => {

                const quien =
                    item.tipo === "usuario"
                        ? "Rafa"
                        : "GePeTo";


                return (
                    quien +
                    ": " +
                    item.texto
                );
            }
        )
        .join("\n");
}


/* =========================================================
   CARGAR IA
========================================================= */

async function prepararIA() {

    if (
        engine ||
        preparando
    ) {

        return;
    }


    preparando = true;


    estadoIA.textContent =
        "Cargando inteligencia artificial...";


    botonEnviar.disabled =
        true;


    try {

        engine =
            await webllm.CreateMLCEngine(

                MODELO,

                {

                    initProgressCallback:
                        progreso => {

                            if (
                                progreso &&
                                progreso.text
                            ) {

                                estadoIA.textContent =
                                    progreso.text;
                            }

                        }

                }

            );


        estadoIA.textContent =
            "GePeTo está preparado.";

    } catch(error) {

        console.error(error);


        estadoIA.textContent =
            "La IA no se pudo cargar. La memoria y las tareas siguen funcionando.";

    } finally {

        preparando = false;

        botonEnviar.disabled =
            false;
    }
}


/* =========================================================
   RESPONDER CON IA
========================================================= */

async function contestarConIA(
    pregunta
) {

    if (!engine) {

        return (
            "La inteligencia artificial todavía está cargando. " +
            "La memoria y las tareas sí están disponibles."
        );
    }


    const sistema = `

Eres GePeTo, el asistente personal de Rafa.

Responde siempre en español.

Sé natural, amable y claro.

Utiliza los recuerdos de Rafa cuando sean relevantes.

Nunca inventes un recuerdo.

Si la respuesta está en los recuerdos, úsala.

También puedes tener en cuenta las tareas pendientes.

RECUERDOS DE RAFA:

${crearContextoMemoria()}


TAREAS PENDIENTES:

${crearContextoTareas()}


CONVERSACIÓN RECIENTE:

${crearContextoHistorial()}

`;


    const respuesta =
        await engine.chat.completions.create({

            messages: [

                {
                    role:"system",
                    content:sistema
                },

                {
                    role:"user",
                    content:pregunta
                }

            ],

            temperature:0.7,

            max_tokens:350

        });


    return (
        respuesta
            .choices?.[0]
            ?.message
            ?.content
    ) ||

    "No he conseguido preparar una respuesta.";
}


/* =========================================================
   PROCESAR MENSAJE
========================================================= */

async function procesarMensaje(
    texto
) {

    const pregunta =
        texto.trim();


    if (!pregunta) {
        return;
    }


    añadirMensaje(
        pregunta,
        "usuario"
    );


    entrada.value = "";


    const normal =
        normalizar(pregunta);


    /* ---------- QUÉ PUEDE HACER ---------- */

    if (
        normal.includes(
            "que puedes hacer"
        ) ||

        normal.includes(
            "que puedes hacer por mi"
        ) ||

        normal.includes(
            "que sabes hacer"
        ) ||

        normal ===
        "funciones"

    ) {

        añadirMensaje(
            responderQuePuedeHacer(),
            "gepeto"
        );

        return;
    }


    /* ---------- GUARDAR MEMORIA ---------- */

    const recuerdo =
        extraerRecuerdo(
            pregunta
        );


    if (recuerdo) {

        const resultado =
            await guardarMemoriaCloudflare(
                recuerdo
            );


        if (
            resultado.repetido
        ) {

            añadirMensaje(

                "🧠 Ese recuerdo ya lo tenía guardado:\n\n" +
                recuerdo,

                "gepeto"
            );

        } else if (
            resultado.guardado
        ) {

            añadirMensaje(

                "🧠 Recuerdo guardado correctamente.\n\n" +

                "Ahora tengo " +
                memoria.length +
                " recuerdo(s).\n\n" +

                "Lo utilizaré cuando me preguntes sobre él:\n\n" +

                "• " +
                recuerdo,

                "gepeto"
            );

        } else {

            añadirMensaje(

                "No he podido guardar ese recuerdo.",

                "gepeto"
            );
        }


        return;
    }


    /* ---------- TAREA ---------- */

    const tareaTexto =
        extraerTarea(
            pregunta
        );


    if (tareaTexto) {

        const tarea =
            await crearTarea(
                tareaTexto
            );


        if (!tarea) {

            añadirMensaje(
                "No he podido guardar la tarea.",
                "gepeto"
            );

            return;
        }


        añadirMensaje(

            "📋 Tarea guardada correctamente.\n\n" +

            "📝 " +
            tarea.texto +
            "\n\n" +

            "Ahora tengo " +
            tareas.filter(
                t => t.activa !== false
            ).length +
            " tarea(s) pendiente(s).\n\n" +

            "La tarea permanece guardada aunque salgas de la web.",

            "gepeto"
        );


        return;
    }


    /* ---------- BORRAR TAREA ---------- */

    const borrarTexto =
        extraerBorradoTarea(
            pregunta
        );


    if (borrarTexto) {

        const borrada =
            await borrarTareaPorTexto(
                borrarTexto
            );


        añadirMensaje(

            borrada
                ? "🗑️ He eliminado esa tarea."
                : "No he encontrado una tarea que coincida.",

            "gepeto"
        );


        return;
    }


    /* ---------- MOSTRAR TAREAS ---------- */

    if (
        esPeticionDeTareas(
            pregunta
        )
    ) {

        añadirMensaje(
            responderSobreTareas(),
            "gepeto"
        );

        return;
    }


    /* ---------- MEMORIA DIRECTA ---------- */

    const respuestaMemoria =
        responderSobreMemoria(
            pregunta
        );


    if (
        respuestaMemoria
    ) {

        añadirMensaje(
            respuestaMemoria,
            "gepeto"
        );

        return;
    }


    /* ---------- IA ---------- */

    const pensando =
        añadirMensaje(
            "Estoy pensando...",
            "gepeto",
            false
        );


    try {

        const respuesta =
            await contestarConIA(
                pregunta
            );


        pensando.remove();


        añadirMensaje(
            respuesta,
            "gepeto"
        );

    } catch(error) {

        console.error(error);


        pensando.remove();


        añadirMensaje(

            "Ha ocurrido un error al responder. Inténtalo otra vez.",

            "gepeto"
        );
    }
}

========================================================= */

botonVoz.addEventListener(
    "click",
    () => {

        const Reconocimiento =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!Reconocimiento) {

            añadirMensaje(

                "El reconocimiento de voz no está disponible en este navegador.",

                "gepeto"
            );

            return;
        }


        const reconocimiento =
            new Reconocimiento();


        reconocimiento.lang =
            "es-ES";


        reconocimiento.interimResults =
            false;


        reconocimiento.continuous =
            false;


        reconocimiento.onstart =
            () => {

                estadoIA.textContent =
                    "Escuchando...";

            };


        reconocimiento.onresult =
            event => {

                const texto =
                    event
                        .results[0][0]
                        .transcript;


                entrada.value =
                    texto;


                estadoIA.textContent =
                    "GePeTo está preparado.";
            };


        reconocimiento.onerror =
            () => {

                estadoIA.textContent =
                    "No he podido escuchar la voz.";
            };


        reconocimiento.onend =
            () => {

                if (!preparando) {

                    estadoIA.textContent =
                        "GePeTo está preparado.";
                }
            };


        reconocimiento.start();

    }
);
