<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca · GePeTo</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    overflow: hidden;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.contenedor {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 1000px;
    margin: auto;
    background: #080808;
}

.cabecera {
    flex-shrink: 0;
    padding: 10px;
    border-bottom: 1px solid #222;
    background: #0c0c0c;
}

.fila-superior {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.boton-portada,
.boton-musica {
    border: 1px solid #00ff66;
    background: #071b0d;
    color: #00ff66;
    border-radius: 8px;
    padding: 8px 10px;
    text-decoration: none;
    font-size: 13px;
}

.boton-musica {
    border-color: #ff2bd6;
    background: #21051c;
    color: #ff65e3;
}

.titulo {
    margin: 0;
    color: #00ff66;
    text-align: center;
    font-size: 22px;
    text-shadow: 0 0 10px #00ff66;
}

.subtitulo {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin: 5px 0 0;
}

.estado {
    text-align: center;
    color: #00ff66;
    font-size: 12px;
    margin-top: 5px;
}

.zona-chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px;
    scroll-behavior: smooth;
}

.bienvenida {
    text-align: center;
    color: #aaa;
    padding: 15px 5px;
}

.avatar {
    width: 90px;
    height: 90px;
    object-fit: contain;
    display: block;
    margin: 0 auto 10px;
    border-radius: 50%;
    border: 2px solid #00ff66;
    box-shadow: 0 0 18px #00ff6644;
}

.avatar-fallback {
    display: none;
    font-size: 70px;
    text-align: center;
}

.mensaje {
    max-width: 92%;
    margin: 10px 0;
    padding: 11px 13px;
    border-radius: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.45;
    font-size: 15px;
}

.mensaje.usuario {
    margin-left: auto;
    background: #12351f;
    border: 1px solid #00aa44;
    color: #eaffef;
}

.mensaje.gepeto {
    margin-right: auto;
    background: #171717;
    border: 1px solid #333;
    color: #eeeeee;
}

.nombre-mensaje {
    font-size: 11px;
    color: #00ff66;
    margin-bottom: 5px;
    font-weight: bold;
}

.usuario .nombre-mensaje {
    color: #80ffb0;
}

.panel-controles {
    flex-shrink: 0;
    border-top: 1px solid #222;

}

.botones-acciones {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;

}

.boton-accion {

    background: #151515;

    font-size: 12px;
}

.boton-accion:hover {
    border-color: #00ff66;
    color: #00ff66;
}

.contadores {
    text-align: center;
    color: #777;
    font-size: 11px;
    margin-bottom: 7px;
}

.barra-escritura {
    display: flex;
    align-items: center;
    gap: 6px;
}

#entrada {
    flex: 1;
    min-width: 0;
    border: 1px solid #444;
    border-radius: 9px;
    background: #050505;
    color: white;
    padding: 12px;
    outline: none;
}

#entrada:focus {
    border-color: #00ff66;
    box-shadow: 0 0 8px #00ff6633;
}

.boton-enviar,
.boton-micro {
    flex-shrink: 0;
    border: 1px solid #00ff66;
    background: #092512;
    color: #00ff66;
    border-radius: 9px;
    padding: 11px 12px;
    font-weight: bold;
}

.boton-micro {
    border-color: #00aaff;
    background: #061b2b;
    color: #44bbff;
}

.boton-enviar:disabled,
.boton-micro:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.cargando {
    color: #ffcc00;
    text-align: center;
    font-size: 12px;
    padding: 5px;
}

@media (max-width: 500px) {
    .titulo {
        font-size: 18px;
    }

    .boton-portada,
    .boton-musica {
        font-size: 11px;
        padding: 7px;
    }

    .mensaje {
        max-width: 96%;
        font-size: 14px;
    }

    .boton-enviar,
    .boton-micro {
        padding: 11px 9px;
    }
}
</style>
</head>

<body>

</div>

<audio id="audioMusica" loop preload="none">
    <source src="./Portada.mp3" type="audio/mpeg">
</audio>

<script type="module">

import * as webllm from "https://esm.run/@mlc-ai/web-llm";

/* =========================
   CONFIGURACIÓN
========================= */

const URL_CLOUDFLARE =
    "https://gepetto-rafa.rafadun18.workers.dev";

const MODELO =
    "Llama-3.2-1B-Instruct-q4f16_1-MLC";

const CLAVE_MEMORIA =
    "memoriaGePeTo";

const CLAVE_HISTORIAL =
    "historialGePeTo";

const CLAVE_TAREAS =
    "tareasGePeTo";

const CLAVE_INVESTIGACIONES =
    "investigacionesGePeTo";

/* =========================
   VARIABLES
========================= */

let recuerdos =
    JSON.parse(localStorage.getItem(CLAVE_MEMORIA) || "[]");

let historial =
    JSON.parse(localStorage.getItem(CLAVE_HISTORIAL) || "[]");

let tareas =
    JSON.parse(localStorage.getItem(CLAVE_TAREAS) || "[]");

let investigaciones =
    JSON.parse(
        localStorage.getItem(CLAVE_INVESTIGACIONES) || "[]"
    );

let engine = null;
let preparandoIA = null;
let procesando = false;

/* =========================
   ELEMENTOS
========================= */

const zonaChat =
    document.getElementById("zonaChat");

const entrada =
    document.getElementById("entrada");

const formulario =
    document.getElementById("formulario");

const botonEnviar =
    document.getElementById("botonEnviar");

const botonMicro =
    document.getElementById("botonMicro");

const estado =
    document.getElementById("estado");

const mensajeCarga =
    document.getElementById("mensajeCarga");

const numeroRecuerdos =
    document.getElementById("numeroRecuerdos");

const numeroTareas =
    document.getElementById("numeroTareas");

const numeroInvestigaciones =
    document.getElementById("numeroInvestigaciones");

const audioMusica =
    document.getElementById("audioMusica");

const botonMusica =
    document.getElementById("botonMusica");

/* =========================
   UTILIDADES
========================= */

function normalizar(texto) {
    return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[¿?¡!.,;:()[\]{}"']/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function guardarLocal() {
    localStorage.setItem(
        CLAVE_MEMORIA,
        JSON.stringify(recuerdos)
    );

    localStorage.setItem(
        CLAVE_HISTORIAL,
        JSON.stringify(historial.slice(-100))
    );

    localStorage.setItem(
        CLAVE_TAREAS,
        JSON.stringify(tareas)
    );

    localStorage.setItem(
        CLAVE_INVESTIGACIONES,
        JSON.stringify(investigaciones)
    );
}

function actualizarContadores() {
    numeroRecuerdos.textContent =
        recuerdos.length;

    numeroTareas.textContent =
        tareas.filter(tarea => !tarea.completada).length;

    numeroInvestigaciones.textContent =
        investigaciones.length;
}

function bajarChat() {
    setTimeout(() => {
        zonaChat.scrollTop =
            zonaChat.scrollHeight;
    }, 50);
}

function añadirMensaje(texto, tipo = "gepeto", guardar = true) {

    const mensaje = document.createElement("div");
    mensaje.className = "mensaje " + tipo;

    const nombre = document.createElement("div");
    nombre.className = "nombre-mensaje";
    nombre.textContent =
        tipo === "usuario" ? "TÚ" : "GePeTo";

    const contenido = document.createElement("div");
    contenido.textContent = texto;

    mensaje.appendChild(nombre);
    mensaje.appendChild(contenido);

    zonaChat.appendChild(mensaje);

    if (guardar) {
        historial.push({
            tipo,
            texto,
            fecha: new Date().toISOString()
        });

        historial =
            historial.slice(-100);

        guardarLocal();
    }

    bajarChat();

    return mensaje;
}

function quitarMensaje(elemento) {
    if (elemento && elemento.parentNode) {
        elemento.parentNode.removeChild(elemento);
    }
}

/* =========================
   FOTO DE GEPETO
========================= */

document
    .getElementById("avatarGePeTo")
    .addEventListener("error", () => {
        document
            .getElementById("avatarGePeTo")
            .style.display = "none";

        document
            .getElementById("avatarFallback")
            .style.display = "block";
    });

/* =========================
   MÚSICA
========================= */

botonMusica.addEventListener("click", async () => {

    if (audioMusica.paused) {

        try {
            await audioMusica.play();
            botonMusica.textContent = "🔇 Parar música";
        } catch (error) {
            añadirMensaje(
                "No se ha podido reproducir la música. Comprueba que el archivo Portada.mp3 está subido junto a biblioteca.html.",
                "gepeto"
            );
        }

    } else {

        audioMusica.pause();
        botonMusica.textContent = "🎵 Música";
    }
});

/* =========================
   CLOUDFLARE - MEMORIA
========================= */

async function cargarMemoriaCloudflare() {

    try {

        const respuesta = await fetch(
            URL_CLOUDFLARE + "/memoria",
            { cache: "no-store" }
        );

        if (!respuesta.ok) {
            throw new Error("Error memoria");
        }

        const datos = await respuesta.json();

        if (Array.isArray(datos.recuerdos)) {
            recuerdos = datos.recuerdos.map(item => {
                return typeof item === "string"
                    ? item
                    : item.texto || item.recuerdo || "";
            }).filter(Boolean);

            guardarLocal();
        }

    } catch (error) {
        console.log("Memoria local utilizada");
    }

    actualizarContadores();
}

async function guardarRecuerdoCloudflare(texto) {

    try {

        const respuesta = await fetch(
            URL_CLOUDFLARE + "/memoria",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    texto
                })
            }
        );

        if (!respuesta.ok) {
            throw new Error("No guardado");
        }

        return true;

    } catch (error) {
        return false;
    }
}

async function borrarMemoriaCloudflare() {

    try {

        await fetch(
            URL_CLOUDFLARE + "/memoria",
            {
                method: "DELETE"
            }
        );

        return true;

    } catch (error) {
        return false;
    }
}

/* =========================
   RECUERDOS
========================= */

function extraerRecuerdo(texto) {

    const patrones = [
        /^\s*recuerda que\s+(.+)$/i,
        /^\s*recuerda:\s*(.+)$/i,
        /^\s*recuerda\s+que\s+(.+)$/i,
        /^\s*mi nombre es\s+(.+)$/i,
        /^\s*me gusta\s+(.+)$/i,
        /^\s*recuerda\s+mi\s+(.+)$/i
    ];

    for (const patron of patrones) {

        const coincidencia =
            texto.match(patron);

        if (coincidencia) {
            return coincidencia[1].trim();
        }
    }

    return null;
}

function buscarRecuerdoRelacionado(texto) {

    const palabras =
        normalizar(texto)
            .split(" ")
            .filter(palabra => palabra.length > 3);

    const encontrados =
        recuerdos.filter(recuerdo => {

            const textoRecuerdo =
                normalizar(recuerdo);

            return palabras.some(palabra =>
                textoRecuerdo.includes(palabra)
            );
        });

    return encontrados;
}

/* =========================
   TAREAS
========================= */

function extraerTarea(texto) {

    const patrones = [

        /^\s*recu[eé]rdame\s+que\s+(.+)$/i,

        /^\s*recu[eé]rdame\s+(.+)$/i,

        /^\s*crea\s+una\s+tarea\s+para\s+(.+)$/i,

        /^\s*crea\s+una\s+tarea\s+(.+)$/i,

        /^\s*anota\s+una\s+tarea\s+para\s+(.+)$/i,

        /^\s*anota\s+una\s+tarea\s+(.+)$/i,

        /^\s*guarda\s+una\s+tarea\s+para\s+(.+)$/i,

        /^\s*guarda\s+una\s+tarea\s+(.+)$/i,

        /^\s*apunta\s+una\s+tarea\s+para\s+(.+)$/i,

        /^\s*apunta\s+una\s+tarea\s+(.+)$/i
    ];

    for (const patron of patrones) {

        const coincidencia =
            texto.match(patron);

        if (coincidencia) {
            return coincidencia[1].trim();
        }
    }

    return null;
}

async function guardarTareaCloudflare(texto) {

    try {

        const respuesta = await fetch(
            URL_CLOUDFLARE + "/tarea",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    texto
                })
            }
        );

        if (!respuesta.ok) {
            throw new Error("No guardada");
        }

        return true;

    } catch (error) {
        return false;
    }
}

async function cargarTareasCloudflare() {

    try {

        const respuesta = await fetch(
            URL_CLOUDFLARE + "/tareas",
            { cache: "no-store" }
        );

        if (!respuesta.ok) {
            throw new Error("Error tareas");
        }

        const datos = await respuesta.json();

        if (Array.isArray(datos.tareas)) {

            tareas = datos.tareas.map(tarea => ({
                id: tarea.id,
                texto: tarea.texto || tarea.tarea || "",
                completada: Boolean(
                    tarea.completada ||
                    tarea.completed
                )
            }));

            guardarLocal();
        }

    } catch (error) {
        console.log("Tareas locales utilizadas");
    }

    actualizarContadores();
}

function esPeticionDeTareas(texto) {

    const frase =
        normalizar(texto);

    return (
        frase.includes("que tareas tengo") ||
        frase.includes("mis tareas") ||
        frase.includes("ver tareas") ||
        frase.includes("mis pendientes") ||
        frase.includes("que pendientes tengo") ||
        frase === "tareas"
    );
}

function responderSobreTareas() {

    const pendientes =
        tareas.filter(tarea => !tarea.completada);

    if (!pendientes.length) {
        return "No tienes tareas pendientes.";
    }

    return (
        "Estas son tus tareas pendientes:\n\n" +
        pendientes
            .map((tarea, indice) =>
                `${indice + 1}. ${tarea.texto}`
            )
            .join("\n")
    );
}

/* =========================
   INVESTIGACIONES
========================= */

function extraerInvestigacion(texto) {

    const patrones = [

        /^\s*investiga\s+sobre\s+(.+)$/i,

        /^\s*investiga\s+acerca\s+de\s+(.+)$/i,

        /^\s*investiga\s+(.+)$/i,

        /^\s*investigar\s+sobre\s+(.+)$/i,

        /^\s*investigar\s+acerca\s+de\s+(.+)$/i,

        /^\s*investigar\s+(.+)$/i,

        /^\s*haz\s+una\s+investigaci[oó]n\s+sobre\s+(.+)$/i,

        /^\s*haz\s+una\s+investigaci[oó]n\s+de\s+(.+)$/i,

        /^\s*haz\s+un\s+trabajo\s+sobre\s+(.+)$/i,

        /^\s*prepara\s+un\s+informe\s+sobre\s+(.+)$/i,

        /^\s*busca\s+informaci[oó]n\s+sobre\s+(.+)$/i
    ];

    for (const patron of patrones) {

        const coincidencia =
            texto.match(patron);

        if (coincidencia) {
            return coincidencia[1].trim();
        }
    }

    return null;
}

function extraerPeticionResultados(texto) {

    const patrones = [

        /^\s*dame\s+los\s+resultados\s+de\s+la\s+investigaci[oó]n\s+de\s+(.+)$/i,

        /^\s*dame\s+los\s+resultados\s+de\s+la\s+investigaci[oó]n\s+sobre\s+(.+)$/i,

        /^\s*dame\s+los\s+resultados\s+de\s+la\s+tarea\s+de\s+(.+)$/i,

        /^\s*dame\s+los\s+resultados\s+de\s+la\s+tarea\s+sobre\s+(.+)$/i,

        /^\s*dame\s+los\s+resultados\s+de\s+(.+)$/i,

        /^\s*mu[eé]strame\s+la\s+investigaci[oó]n\s+de\s+(.+)$/i,

        /^\s*mu[eé]strame\s+la\s+investigaci[oó]n\s+sobre\s+(.+)$/i,

        /^\s*ens[eé]ñame\s+la\s+investigaci[oó]n\s+de\s+(.+)$/i,

        /^\s*qu[eé]\s+has\s+encontrado\s+sobre\s+(.+)$/i
    ];

    for (const patron of patrones) {

        const coincidencia =
            texto.match(patron);

        if (coincidencia) {
            return coincidencia[1].trim();
        }
    }

    return null;
}

async function cargarInvestigacionesCloudflare() {

    try {

        const respuesta = await fetch(
            URL_CLOUDFLARE + "/investigacion",
            { cache: "no-store" }
        );

        if (!respuesta.ok) {
            throw new Error("Error investigaciones");
        }

        const datos = await respuesta.json();

        if (Array.isArray(datos.investigaciones)) {

            investigaciones =
                datos.investigaciones.map(item => ({
                    id: item.id,
                    tema: item.tema || "",
                    resultado: item.resultado || "",
                    creada: item.creada || ""
                }));

            guardarLocal();
        }

    } catch (error) {
        console.log("Investigaciones locales utilizadas");
    }

    actualizarContadores();
}

async function guardarInvestigacionCloudflare(
    tema,
    resultado
) {

    const investigacion = {
        tema,
        resultado,
        creada: new Date().toISOString()
    };

    try {

        const respuesta = await fetch(
            URL_CLOUDFLARE + "/investigacion",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    tema,
                    resultado
                })
            }
        );

        if (!respuesta.ok) {
            throw new Error("No guardada");
        }

        const datos =
            await respuesta.json();

        if (datos.investigacion) {
            investigacion.id =
                datos.investigacion.id;
        }

        investigaciones.unshift(
            investigacion
        );

        guardarLocal();
        actualizarContadores();

        return true;

    } catch (error) {

        investigaciones.unshift(
            investigacion
        );

        guardarLocal();
        actualizarContadores();

        return false;
    }
}

async function buscarInvestigacionCloudflare(tema) {

    try {

        const respuesta = await fetch(
            URL_CLOUDFLARE +
            "/investigacion?tema=" +
            encodeURIComponent(tema),
            { cache: "no-store" }
        );

        if (!respuesta.ok) {
            throw new Error("No encontrada");
        }

        const datos =
            await respuesta.json();

        if (Array.isArray(datos.investigaciones)) {
            return datos.investigaciones;
        }

    } catch (error) {
        console.log("Buscando investigación local");
    }

    const buscado =
        normalizar(tema);

    return investigaciones.filter(item =>
        normalizar(item.tema).includes(buscado) ||
        buscado.includes(normalizar(item.tema))
    );
}

function responderSobreInvestigaciones() {

    if (!investigaciones.length) {
        return "Todavía no tienes investigaciones guardadas.";
    }

    return (
        "Estas son tus investigaciones guardadas:\n\n" +
        investigaciones
            .map((item, indice) =>
                `${indice + 1}. ${item.tema}`
            )
            .join("\n") +
        "\n\nPuedes pedirme los resultados de cualquiera de ellas."
    );
}

/* =========================
   BÚSQUEDA GRATUITA
   EN WIKIPEDIA
========================= */

async function buscarEnWikipedia(tema) {

    const urlBusqueda =
        "https://es.wikipedia.org/w/api.php" +
        "?action=query" +
        "&list=search" +
        "&srsearch=" +
        encodeURIComponent(tema) +
        "&srlimit=3" +
        "&format=json" +
        "&origin=*";

    const respuestaBusqueda =
        await fetch(urlBusqueda);

    if (!respuestaBusqueda.ok) {
        throw new Error("Wikipedia no disponible");
    }

    const datosBusqueda =
        await respuestaBusqueda.json();

    const resultados =
        datosBusqueda.query &&
        datosBusqueda.query.search
            ? datosBusqueda.query.search
            : [];

    const titulos =
        resultados
            .map(item => item.title)
            .slice(0, 3);

    if (!titulos.length) {
        return "";
    }

    const urlArticulos =
        "https://es.wikipedia.org/w/api.php" +
        "?action=query" +
        "&prop=extracts" +
        "&exintro=1" +
        "&explaintext=1" +
        "&redirects=1" +
        "&titles=" +
        encodeURIComponent(titulos.join("|")) +
        "&format=json" +
        "&origin=*";

    const respuestaArticulos =
        await fetch(urlArticulos);

    if (!respuestaArticulos.ok) {
        return "";
    }

    const datosArticulos =
        await respuestaArticulos.json();

    const paginas =
        datosArticulos.query &&
        datosArticulos.query.pages
            ? Object.values(datosArticulos.query.pages)
            : [];

    return paginas
        .map(pagina => {
            return (
                "Fuente: " +
                pagina.title +
                "\n" +
                (pagina.extract || "")
            );
        })
        .filter(texto => texto.length > 20)
        .join("\n\n")
        .slice(0, 7000);
}

/* =========================
   INTELIGENCIA ARTIFICIAL
========================= */

async function prepararIA() {

    if (engine) {
        return true;
    }

    if (preparandoIA) {
        return preparandoIA;
    }

    preparandoIA = (async () => {

        try {

            estado.textContent =
                "● Preparando GePeTo...";

            mensajeCarga.textContent =
                "Cargando inteligencia artificial local. Puede tardar la primera vez...";

            engine =
                await webllm.CreateMLCEngine(
                    MODELO,
                    {
                        initProgressCallback: progreso => {

                            if (
                                progreso &&
                                progreso.text
                            ) {
                                mensajeCarga.textContent =
                                    progreso.text;
                            }
                        }
                    }
                );

            estado.textContent =
                "● GePeTo preparado";

            mensajeCarga.textContent =
                "";

            return true;

        } catch (error) {

            console.error(error);

            estado.textContent =
                "● GePeTo sin IA local";

            mensajeCarga.textContent =
                "No se pudo cargar la IA local.";

            return false;
        }

    })();

    const resultado =
        await preparandoIA;

    preparandoIA = null;

    return resultado;
}

function crearContexto() {

    let contexto = "";

    if (recuerdos.length) {
        contexto +=
            "\nRecuerdos del usuario:\n" +
            recuerdos.join("\n");
    }

    const pendientes =
        tareas.filter(tarea => !tarea.completada);

    if (pendientes.length) {
        contexto +=
            "\nTareas pendientes:\n" +
            pendientes
                .map(tarea => tarea.texto)
                .join("\n");
    }

    return contexto;
}

async function contestarConIA(
    pregunta,
    maxTokens = 400
) {

    if (!engine) {
        await prepararIA();
    }

    if (!engine) {
        return "";
    }

    const mensajes = [

        {
            role: "system",
            content:
                "Eres GePeTo, el asistente de Proyecto Rafa. " +
                "Responde siempre en español claro y sencillo. " +
                "Usa los recuerdos del usuario cuando sean útiles. " +
                "No inventes datos personales. " +
                "Si no sabes algo, dilo claramente." +
                crearContexto()
        },

        ...historial
            .slice(-8)
            .map(item => ({
                role:
                    item.tipo === "usuario"
                        ? "user"
                        : "assistant",
                content: item.texto
            })),

        {
            role: "user",
            content: pregunta
        }
    ];

    const respuesta =
        await engine.chat.completions.create({
            messages: mensajes,
            temperature: 0.5,
            max_tokens: maxTokens
        });

    return (
        respuesta.choices &&
        respuesta.choices[0] &&
        respuesta.choices[0].message
            ? respuesta.choices[0].message.content
            : ""
    );
}

/* =========================
   REALIZAR INVESTIGACIÓN
========================= */

async function realizarInvestigacion(tema) {

    let fuentes = "";

    try {
        fuentes =
            await buscarEnWikipedia(tema);
    } catch (error) {
        console.log("No se pudo consultar Wikipedia");
    }

    let resultado = "";

    if (fuentes) {

        const prompt =
            "Prepara una investigación breve y clara en español " +
            "sobre el tema: " +
            tema +
            ". Usa solamente la información de las fuentes " +
            "que aparecen abajo. Organiza la respuesta con " +
            "título, resumen, puntos importantes y conclusión. " +
            "No inventes datos ni fuentes.\n\n" +
            fuentes;

        resultado =
            await contestarConIA(
                prompt,
                750
            );

    } else {

        resultado =
            await contestarConIA(
                "Prepara una investigación breve y clara en español " +
                "sobre " +
                tema +
                ". Indica que se trata de un resumen preparado " +
                "con el conocimiento disponible y no inventes " +
                "fuentes ni datos.",
                750
            );
    }

    if (!resultado) {

        if (fuentes) {
            resultado =
                "Información encontrada:\n\n" +
                fuentes;
        } else {
            resultado =
                "No he podido preparar la investigación. " +
                "La IA local no está disponible y no se ha podido " +
                "consultar Wikipedia.";
        }
    }

    await guardarInvestigacionCloudflare(
        tema,
        resultado
    );

    return resultado;
}

/* =========================
   BORRAR TAREAS
========================= */

function esPeticionBorrarTarea(texto) {

    const frase =
        normalizar(texto);

    return (
        frase.includes("borra la tarea") ||
        frase.includes("elimina la tarea") ||
        frase.includes("quita la tarea") ||
        frase.includes("borrar tarea")
    );
}

function extraerTextoBorrarTarea(texto) {

    const patrones = [
        /borra\s+la\s+tarea\s+(.+)/i,
        /elimina\s+la\s+tarea\s+(.+)/i,
        /quita\s+la\s+tarea\s+(.+)/i,
        /borrar\s+tarea\s+(.+)/i
    ];

    for (const patron of patrones) {

        const coincidencia =
            texto.match(patron);

        if (coincidencia) {
            return coincidencia[1].trim();
        }
    }

    return "";
}

async function borrarTareaPorTexto(texto) {

    const buscado =
        normalizar(texto);

    const tarea =
        tareas.find(item =>
            normalizar(item.texto).includes(buscado)
        );

    if (!tarea) {
        return false;
    }

    try {

        if (tarea.id) {

            await fetch(
                URL_CLOUDFLARE +
                "/tarea/" +
                encodeURIComponent(tarea.id),
                {
                    method: "DELETE"
                }
            );
        }

    } catch (error) {
        console.log("Borrado local");
    }

    tareas =
        tareas.filter(item =>
            item.id !== tarea.id
        );

    guardarLocal();
    actualizarContadores();

    return true;
}

/* =========================
   PROCESAR MENSAJE
========================= */

async function procesarMensaje(pregunta) {

    if (procesando) {
        return;
    }

    const texto =
        pregunta.trim();

    if (!texto) {
        return;
    }

    procesando = true;
    botonEnviar.disabled = true;
    entrada.disabled = true;

    añadirMensaje(
        texto,
        "usuario"
    );

    try {

        const frase =
            normalizar(texto);

        if (
            frase.includes("que puedes hacer") ||
            frase.includes("que sabes hacer") ||
            frase === "ayuda"
        ) {

            añadirMensaje(
                responderQuePuedeHacer()
            );

            return;
        }

        const peticionResultados =
            extraerPeticionResultados(texto);

        if (peticionResultados) {

            const mensajeEspera =
                añadirMensaje(
                    "Estoy buscando los resultados guardados de: " +
                    peticionResultados +
                    "...",
                    "gepeto",
                    false
                );

            const resultados =
                await buscarInvestigacionCloudflare(
                    peticionResultados
                );

            quitarMensaje(mensajeEspera);

            if (!resultados.length) {

                añadirMensaje(
                    "No encuentro una investigación guardada sobre " +
                    peticionResultados +
                    ".\n\n" +
                    "Puedes pedirme primero:\n" +
                    "Investiga " +
                    peticionResultados
                );

            } else {

                const investigacion =
                    resultados[0];

                añadirMensaje(
                    "📚 RESULTADOS DE LA INVESTIGACIÓN\n\n" +
                    "Tema: " +
                    investigacion.tema +
                    "\n\n" +
                    investigacion.resultado
                );
            }

            return;
        }

        const temaInvestigacion =
            extraerInvestigacion(texto);

        if (temaInvestigacion) {

            const mensajeEspera =
                añadirMensaje(
                    "📚 Estoy preparando la investigación sobre " +
                    temaInvestigacion +
                    ". Espera un momento...",
                    "gepeto",
                    false
                );

            const resultado =
                await realizarInvestigacion(
                    temaInvestigacion
                );

            quitarMensaje(mensajeEspera);

            añadirMensaje(
                "✅ He preparado y guardado la investigación sobre:\n\n" +
                temaInvestigacion +
                "\n\n" +
                "Cuando quieras los resultados, escribe:\n" +
                "Dame los resultados de " +
                temaInvestigacion
            );

            return;
        }

        const recuerdo =
            extraerRecuerdo(texto);

        if (recuerdo) {

            if (
                !recuerdos.some(item =>
                    normalizar(item) === normalizar(recuerdo)
                )
            ) {
                recuerdos.push(recuerdo);
            }

            guardarLocal();
            actualizarContadores();

            const guardado =
                await guardarRecuerdoCloudflare(
                    recuerdo
                );

            añadirMensaje(
                "🧠 Lo recordaré:\n\n" +
                recuerdo +
                (
                    guardado
                        ? "\n\nGuardado también en la memoria de Cloudflare."
                        : "\n\nGuardado en la memoria local."
                )
            );

            return;
        }

        if (
            frase.includes("que recuerdas de mi") ||
            frase.includes("mis recuerdos") ||
            frase.includes("que recuerdas")
        ) {

            if (!recuerdos.length) {

                añadirMensaje(
                    "Todavía no tengo recuerdos guardados."
                );

            } else {

                añadirMensaje(
                    "Estos son mis recuerdos:\n\n" +
                    recuerdos
                        .map((item, indice) =>
                            `${indice + 1}. ${item}`
                        )
                        .join("\n")
                );
            }

            return;
        }

        const tareaTexto =
            extraerTarea(texto);

        if (tareaTexto) {

            const nuevaTarea = {
                id: "local-" + Date.now(),
                texto: tareaTexto,
                completada: false
            };

            tareas.push(nuevaTarea);

            guardarLocal();
            actualizarContadores();

            const guardada =
                await guardarTareaCloudflare(
                    tareaTexto
                );

            añadirMensaje(
                "📋 Tarea guardada:\n\n" +
                tareaTexto +
                (
                    guardada
                        ? "\n\nGuardada también en Cloudflare."
                        : "\n\nGuardada localmente."
                )
            );

            return;
        }

        if (esPeticionDeTareas(texto)) {

            añadirMensaje(
                responderSobreTareas()
            );

            return;
        }

        if (esPeticionBorrarTarea(texto)) {

            const textoBorrar =
                extraerTextoBorrarTarea(texto);

            const borrada =
                await borrarTareaPorTexto(
                    textoBorrar
                );

            añadirMensaje(
                borrada
                    ? "✅ Tarea borrada."
                    : "No he encontrado esa tarea."
            );

            return;
        }

        const recuerdosRelacionados =
            buscarRecuerdoRelacionado(texto);

        if (recuerdosRelacionados.length) {

            añadirMensaje(
                "He encontrado estos recuerdos relacionados:\n\n" +
                recuerdosRelacionados.join("\n")
            );

            return;
        }

        const respuesta =
            await contestarConIA(
                texto
            );

        añadirMensaje(
            respuesta ||
            "No he podido preparar una respuesta. Inténtalo de nuevo."
        );

    } catch (error) {

        console.error(error);

        añadirMensaje(
            "Ha ocurrido un error. Comprueba la conexión y vuelve a intentarlo."
        );

    } finally {

        procesando = false;
        botonEnviar.disabled = false;
        entrada.disabled = false;
        entrada.focus();
    }
}

);

entrada.addEventListener(

);

/* =========================
   MICRÓFONO
========================= */

const Reconocimiento =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (Reconocimiento) {

    const reconocimiento =
        new Reconocimiento();

    reconocimiento.lang = "es-ES";
    reconocimiento.interimResults = false;
    reconocimiento.continuous = false;

    botonMicro.addEventListener(
        "click",
        () => {

            if (procesando) {
                return;
            }

            try {

                reconocimiento.start();
                botonMicro.textContent =
                    "⏺️ Escuchando...";

            } catch (error) {
                console.log(error);
            }
        }
    );

    reconocimiento.addEventListener(
        "result",
        event => {

            const texto =
                event.results[0][0].transcript;

            entrada.value =
                texto;

            botonMicro.textContent =
                "🎤";
        }
    );

    reconocimiento.addEventListener(
        "end",
        () => {
            botonMicro.textContent =
                "🎤";
        }
    );

    reconocimiento.addEventListener(
        "error",
        () => {
            botonMicro.textContent =
                "🎤";
        }
    );

} else {

    botonMicro.disabled = true;
    botonMicro.title =
        "El navegador no permite reconocimiento de voz";
}

/* =========================
   CARGAR HISTORIAL
========================= */

function cargarHistorialPantalla() {

    for (const item of historial) {

        if (
            item &&
            item.texto &&
            (
                item.tipo === "usuario" ||
                item.tipo === "gepeto"
            )
        ) {

            añadirMensaje(
                item.texto,
                item.tipo,
                false
            );
        }
    }
}

/* =========================
   INICIO
========================= */

async function iniciar() {

    cargarHistorialPantalla();

    actualizarContadores();

    estado.textContent =
        "● Conectando con Cloudflare...";

    await Promise.all([
        cargarMemoriaCloudflare(),
        cargarTareasCloudflare(),
        cargarInvestigacionesCloudflare()
    ]);

    estado.textContent =
        "● GePeTo conectado";

    prepararIA();
}

iniciar();

window.addEventListener(
    "pageshow",
    () => {
        actualizarContadores();
    }
);
