<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biblioteca · GePeTo</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  padding-bottom: 35px;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 12px;

  background: #090909;
  border-bottom: 1px solid #252525;
}

header a,
header button {
  background: #111;
  color: white;

  border: 1px solid #333;
  border-radius: 10px;

  padding: 10px 12px;

  text-decoration: none;
  font-size: 14px;
}

header h1 {
  margin: 0;
  font-size: 19px;
}

main {
  width: 100%;
  max-width: 720px;
  margin: auto;
  padding: 15px;
}

/* GE-PETO */

.avatar {
  display: block;

  width: 150px;
  height: 150px;

  object-fit: cover;

  margin: 12px auto;

  border-radius: 50%;

  border: 3px solid #008cff;

  box-shadow:
    0 0 12px #008cff,
    0 0 30px rgba(0,140,255,.35);
}

.estado {
  text-align: center;

  margin: 10px 0 18px;

  font-size: 14px;

  color: #00ff66;
}

/* PANELES */

.panel {
  background: #0b0b0b;

  border: 1px solid #222;

  border-radius: 15px;

  padding: 13px;

  margin-bottom: 15px;
}

.panel-titulo {
  font-size: 16px;

  margin-bottom: 10px;

  color: #00ff66;
}

/* BOTONES */

.botones {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;
}

.botones button {
  background: #151515;

  color: white;

  border: 1px solid #333;

  border-radius: 10px;

  padding: 11px 5px;

  font-size: 13px;
}

.botones button:active {
  transform: scale(.97);
}

/* CHAT */

#chat {
  height: 430px;

  overflow-y: auto;

  padding: 10px;

  background: #030303;

  border: 1px solid #222;

  border-radius: 15px;
}

.mensaje {
  margin: 10px 0;

  padding: 11px 13px;

  border-radius: 14px;

  line-height: 1.45;

  white-space: pre-wrap;

  word-wrap: break-word;
}

.usuario {
  background: #12351f;

  border: 1px solid #00ff66;

  margin-left: 12%;
}

.gepeto {
  background: #071d2c;

  border: 1px solid #008cff;

  margin-right: 12%;
}

.etiqueta {
  font-size: 11px;

  opacity: .7;

  margin-bottom: 5px;
}

/* ESCRIBIR */

form {
  margin-top: 12px;
}

textarea {
  width: 100%;

  min-height: 80px;

  resize: vertical;

  background: #101010;

  color: white;

  border: 1px solid #333;

  border-radius: 12px;

  padding: 12px;

  font-size: 16px;

  outline: none;
}

textarea:focus {
  border-color: #008cff;
}

.form-botones {
  display: flex;

  gap: 8px;

  margin-top: 8px;
}

.form-botones button {
  flex: 1;

  padding: 13px 8px;

  border-radius: 12px;

  border: 1px solid #333;

  background: #151515;

  color: white;

  font-size: 15px;
}

#enviar {
  background: #063d25;

  border-color: #00ff66;
}

/* INFORMACIÓN */

#resultadoPanel {
  margin-top: 12px;

  white-space: pre-wrap;

  line-height: 1.5;

  font-size: 14px;
}

.oculto {
  display: none;
}

/* ============================================================
   REPRODUCTOR
   ============================================================ */

.reproductor {
  background: #070707;

  border: 1px solid #222;

  border-radius: 15px;

  padding: 13px;

  margin-top: 15px;
}

.reproductor-titulo {
  color: #00ff66;

  font-size: 17px;

  margin-bottom: 10px;
}

.reproductor audio {
  width: 100%;

  margin: 5px 0 12px;
}

.subir-musica {
  width: 100%;

  display: block;

  background: #111;

  color: white;

  border: 1px solid #00ff66;

  border-radius: 11px;

  padding: 12px;

  text-align: center;

  font-size: 15px;

  cursor: pointer;
}

.subir-musica:active {
  transform: scale(.98);
}

#listaCanciones {
  margin-top: 12px;
}

.cancion {
  display: flex;

  align-items: center;

  gap: 8px;

  padding: 9px;

  margin-bottom: 6px;

  background: #111;

  border: 1px solid #252525;

  border-radius: 10px;
}

.cancion button {
  background: #151515;

  color: white;

  border: 1px solid #333;

  border-radius: 8px;

  padding: 7px 9px;
}

.nombreCancion {
  flex: 1;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  font-size: 13px;
}

.vacio {
  opacity: .6;

  font-size: 13px;

  text-align: center;

  padding: 8px;
}

/* PIE */

.pequeno {
  text-align: center;

  margin-top: 18px;

  font-size: 12px;

  opacity: .6;
}

/* MÓVIL */

@media (max-width: 500px) {

  .botones {
    grid-template-columns:
      1fr 1fr;
  }

  #chat {
    height: 400px;
  }

  .avatar {
    width: 125px;
    height: 125px;
  }
}
</style>
</head>

<body>

<header>

  <a href="./index.html">
    ← PORTADA
  </a>

  <h1>🧠 GePeTo</h1>

  <button
    id="musicaBtn"
    type="button">
    🎵 Música
  </button>

</header>

<main>

<!-- ============================================================
     GE-PETO
     ============================================================ -->

<img
  class="avatar"
  src="./GePeTo.png"
  alt="GePeTo"
  onerror="this.style.display='none'"
>

<div
  id="estado"
  class="estado">
  ● Conectando con GePeTo...
</div>

<!-- ============================================================
     MEMORIA / TAREAS / INVESTIGACIONES / VIDEOLLAMADA
     ============================================================ -->

<div class="panel">

  <div class="panel-titulo">
    🧠 Sistema GePeTo
  </div>

  <div class="botones">

    <button
      id="recuerdosBtn"
      type="button">
      🧠 Recuerdos
    </button>

    <button
      id="tareasBtn"
      type="button">
      📋 Tareas
    </button>

    <button
      id="investigacionesBtn"
      type="button">
      🔎 Investigaciones
    </button>

    <!-- ========================================================
         NUEVO ACCESO A VIDEOLLAMADA
         ======================================================== -->

    <button
      id="videollamadaBtn"
      type="button"
      onclick="window.location.href='./Videollamada.html'">
      🎥 Videollamada
    </button>

  </div>

  <div
    id="resultadoPanel"
    class="oculto">
  </div>

</div>

<!-- ============================================================
     CHAT
     ============================================================ -->

<div id="chat"></div>

<form id="formulario">

  <textarea
    id="entrada"
    placeholder="Habla con GePeTo..."
    autocomplete="off"></textarea>

  <div class="form-botones">

    <button
      id="microfono"
      type="button">
      🎤
    </button>

    <button
      id="enviar"
      type="submit">
      ENVIAR
    </button>

  </div>

</form>

<!-- ============================================================
     REPRODUCTOR DE MÚSICA
     ============================================================ -->

<div class="reproductor">

  <div class="reproductor-titulo">
    🎵 Música de la Biblioteca
  </div>

  <!-- Música que esté subida en GitHub -->
  <audio
    id="audioPrincipal"
    controls
    preload="none">

    <source
      src="./biblioteca.mp3"
      type="audio/mpeg">

    Tu navegador no puede reproducir este audio.

  </audio>

  <!-- Selector del dispositivo -->

  <label
    class="subir-musica"
    for="selectorMusica">

    📱 SUBIR CANCIONES DESDE ESTE DISPOSITIVO

  </label>

  <input
    id="selectorMusica"
    type="file"
    accept="audio/*"
    multiple
    style="display:none"
  >

  <!-- Lista -->

  <div id="listaCanciones">

    <div class="vacio">
      Todavía no has seleccionado canciones.
    </div>

  </div>

</div>

<div class="pequeno">
  Proyecto Rafa · GePeTo · Memoria activa
</div>

</main>

<script>

/* ============================================================
   WORKER DE GE-PETO
   ============================================================ */

const URL_CLOUDFLARE =
  "https://gepetto-rafa.rafadun18.workers.dev";

/* ============================================================
   ELEMENTOS
   ============================================================ */

const chat =
  document.getElementById("chat");

const entrada =
  document.getElementById("entrada");

const formulario =
  document.getElementById("formulario");

const estado =
  document.getElementById("estado");

const resultadoPanel =
  document.getElementById(
    "resultadoPanel"
  );

const recuerdosBtn =
  document.getElementById(
    "recuerdosBtn"
  );

const tareasBtn =
  document.getElementById(
    "tareasBtn"
  );

const investigacionesBtn =
  document.getElementById(
    "investigacionesBtn"
  );

const microfonoBtn =
  document.getElementById(
    "microfono"
  );

const musicaBtn =
  document.getElementById(
    "musicaBtn"
  );

const audioPrincipal =
  document.getElementById(
    "audioPrincipal"
  );

const selectorMusica =
  document.getElementById(
    "selectorMusica"
  );

const listaCanciones =
  document.getElementById(
    "listaCanciones"
  );

/* ============================================================
   HISTORIAL
   ============================================================ */

const CLAVE_HISTORIAL =
  "historialGePeTo";

let historial = [];

try {

  historial =
    JSON.parse(
      localStorage.getItem(
        CLAVE_HISTORIAL
      )
    ) || [];

} catch (error) {

  historial = [];

}

/* ============================================================
   MOSTRAR MENSAJES
   ============================================================ */

function mostrarMensaje(
  tipo,
  texto
) {

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "mensaje " +
    (
      tipo === "usuario"
        ? "usuario"
        : "gepeto"
    );

  const etiqueta =
    document.createElement(
      "div"
    );

  etiqueta.className =
    "etiqueta";

  etiqueta.textContent =
    tipo === "usuario"
      ? "Rafa"
      : "GePeTo";

  const contenido =
    document.createElement(
      "div"
    );

  contenido.textContent =
    texto;

  div.appendChild(
    etiqueta
  );

  div.appendChild(
    contenido
  );

  chat.appendChild(
    div
  );

  chat.scrollTop =
    chat.scrollHeight;
}

/* ============================================================
   GUARDAR HISTORIAL
   ============================================================ */

function guardarHistorial() {

  try {

    localStorage.setItem(
      CLAVE_HISTORIAL,
      JSON.stringify(
        historial
      )
    );

  } catch (error) {

    console.log(
      "No se pudo guardar historial."
    );

  }
}

/* ============================================================
   CARGAR HISTORIAL
   ============================================================ */

function cargarHistorial() {

  chat.innerHTML = "";

  if (
    !historial.length
  ) {

    mostrarMensaje(
      "gepeto",
      "Hola Rafa. Soy GePeTo. Estoy conectado al Proyecto Rafa."
    );

    return;
  }

  for (
    const mensaje
    of historial
  ) {

    mostrarMensaje(
      mensaje.tipo,
      mensaje.texto
    );

  }

}

/* ============================================================
   COMPROBAR CONEXIÓN
   ============================================================ */

async function comprobarEstado() {

  try {

    const respuesta =
      await fetch(
        URL_CLOUDFLARE +
        "/estado",
        {
          method: "GET",
          cache: "no-store"
        }
      );

    if (
      !respuesta.ok
    ) {

      throw new Error(
        "HTTP " +
        respuesta.status
      );

    }

    const datos =
      await respuesta.json();

    if (
      datos.ok === true &&
      datos.workers_ai === true
    ) {

      estado.textContent =
        "● GePeTo conectado · IA activa · Memoria activa";

      estado.style.color =
        "#00ff66";

    } else {

      estado.textContent =
        "● Worker conectado · revisando IA";

      estado.style.color =
        "#ffff00";
    }

  } catch (error) {

    console.error(
      error
    );

    estado.textContent =
      "● Error conectando con GePeTo";

    estado.style.color =
      "#ff5555";
  }

}

/* ============================================================
   PREGUNTAR A GE-PETO
   ============================================================ */

async function preguntarGePeTo(
  pregunta
) {

  const respuesta =
    await fetch(
      URL_CLOUDFLARE +
      "/preguntar",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            pregunta:
              pregunta
          })
      }
    );

  let datos;

  try {

    datos =
      await respuesta.json();

  } catch (error) {

    throw new Error(
      "El Worker no devolvió JSON."
    );

  }

  if (
    !respuesta.ok ||
    datos.ok === false
  ) {

    throw new Error(
      datos.error ||
      datos.mensaje ||
      (
        "Error HTTP " +
        respuesta.status
      )
    );

  }

  const texto =
    datos.gepeto ||
    datos.respuesta ||
    datos.response;

  if (!texto) {

    throw new Error(
      "GePeTo no devolvió ninguna respuesta."
    );

  }

  return texto;
}

/* ============================================================
   PROCESAR MENSAJE
   ============================================================ */

async function procesarMensaje() {

  const pregunta =
    entrada.value.trim();

  if (!pregunta) {
    return;
  }

  entrada.value = "";

  historial.push({
    tipo: "usuario",
    texto: pregunta
  });

  mostrarMensaje(
    "usuario",
    pregunta
  );

  guardarHistorial();

  const pensando =
    document.createElement(
      "div"
    );

  pensando.className =
    "mensaje gepeto";

  pensando.id =
    "pensando";

  pensando.innerHTML =
    '<div class="etiqueta">GePeTo</div>' +
    '<div>🧠 GePeTo está pensando...</div>';

  chat.appendChild(
    pensando
  );

  chat.scrollTop =
    chat.scrollHeight;

  try {

    const respuesta =
      await preguntarGePeTo(
        pregunta
      );

    const elementoPensando =
      document.getElementById(
        "pensando"
      );

    if (
      elementoPensando
    ) {

      elementoPensando.remove();

    }

    mostrarMensaje(
      "gepeto",
      respuesta
    );

    historial.push({
      tipo: "gepeto",
      texto: respuesta
    });

    guardarHistorial();

  } catch (error) {

    console.error(
      error
    );

    const elementoPensando =
      document.getElementById(
        "pensando"
      );

    if (
      elementoPensando
    ) {

      elementoPensando.remove();

    }

    const mensajeError =
      "⚠️ Error de GePeTo:\n" +
      error.message;

    mostrarMensaje(
      "gepeto",
      mensajeError
    );

    historial.push({
      tipo: "gepeto",
      texto: mensajeError
    });

    guardarHistorial();

  }

}

/* ============================================================
   FORMULARIO
   ============================================================ */

formulario.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    procesarMensaje();

  }
);

/* ============================================================
   ENTER
   ============================================================ */

entrada.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      procesarMensaje();

    }

  }
);

/* ============================================================
   MEMORIA
   ============================================================ */

async function cargarMemoria() {

  try {

    const respuesta =
      await fetch(
        URL_CLOUDFLARE +
        "/memoria",
        {
          cache: "no-store"
        }
      );

    const datos =
      await respuesta.json();

    resultadoPanel.classList.remove(
      "oculto"
    );

    if (
      datos.memoria &&
      Array.isArray(
        datos.memoria
      )
    ) {

      if (
        datos.memoria.length === 0
      ) {

        resultadoPanel.textContent =
          "🧠 La memoria está vacía.";

        return;
      }

      resultadoPanel.textContent =
        "🧠 RECUERDOS DE GE-PETO\n\n" +

        datos.memoria
          .map(
            item =>
              item.contenido ||
              JSON.stringify(
                item
              )
          )
          .join("\n\n");

    } else {

      resultadoPanel.textContent =
        JSON.stringify(
          datos,
          null,
          2
        );

    }

  } catch (error) {

    resultadoPanel.classList.remove(
      "oculto"
    );

    resultadoPanel.textContent =
      "Error cargando memoria: " +
      error.message;

  }

}

/* ============================================================
   TAREAS
   ============================================================ */

async function cargarTareas() {

  try {

    const respuesta =
      await fetch(
        URL_CLOUDFLARE +
        "/tareas",
        {
          cache: "no-store"
        }
      );

    const datos =
      await respuesta.json();

    resultadoPanel.classList.remove(
      "oculto"
    );

    if (
      datos.tareas &&
      Array.isArray(
        datos.tareas
      )
    ) {

      if (
        datos.tareas.length === 0
      ) {

        resultadoPanel.textContent =
          "📋 No hay tareas guardadas.";

        return;
      }

      resultadoPanel.textContent =
        "📋 TAREAS\n\n" +

        datos.tareas
          .map(
            item =>
              item.contenido ||
              JSON.stringify(
                item
              )
          )
          .join("\n\n");

    } else {

      resultadoPanel.textContent =
        JSON.stringify(
          datos,
          null,
          2
        );

    }

  } catch (error) {

    resultadoPanel.classList.remove(
      "oculto"
    );

    resultadoPanel.textContent =
      "Error cargando tareas: " +
      error.message;

  }

}

/* ============================================================
   INVESTIGACIONES
   ============================================================ */

async function cargarInvestigaciones() {

  try {

    const respuesta =
      await fetch(
        URL_CLOUDFLARE +
        "/investigaciones",
        {
          cache: "no-store"
        }
      );

    const datos =
      await respuesta.json();

    resultadoPanel.classList.remove(
      "oculto"
    );

    if (
      datos.investigaciones &&
      Array.isArray(
        datos.investigaciones
      )
    ) {

      if (
        datos.investigaciones.length === 0
      ) {

        resultadoPanel.textContent =
          "🔎 No hay investigaciones.";

        return;
      }

      resultadoPanel.textContent =
        "🔎 INVESTIGACIONES\n\n" +

        datos.investigaciones
          .map(
            item =>
              item.contenido ||
              JSON.stringify(
                item
              )
          )
          .join("\n\n");

    } else {

      resultadoPanel.textContent =
        JSON.stringify(
          datos,
          null,
          2
        );

    }

  } catch (error) {

    resultadoPanel.classList.remove(
      "oculto"
    );

    resultadoPanel.textContent =
      "Error cargando investigaciones: " +
      error.message;

  }

}

/* ============================================================
   BOTONES
   ============================================================ */

recuerdosBtn.addEventListener(
  "click",
  cargarMemoria
);

tareasBtn.addEventListener(
  "click",
  cargarTareas
);

investigacionesBtn.addEventListener(
  "click",
  cargarInvestigaciones
);

/* ============================================================
   REPRODUCTOR
   ============================================================ */

musicaBtn.addEventListener(
  "click",
  function() {

    if (
      audioPrincipal.paused
    ) {

      audioPrincipal
        .play()
        .catch(
          function() {}
        );

      musicaBtn.textContent =
        "⏸️ Música";

    } else {

      audioPrincipal.pause();

      musicaBtn.textContent =
        "🎵 Música";

    }

  }
);

audioPrincipal.addEventListener(
  "play",
  function() {

    musicaBtn.textContent =
      "⏸️ Música";

  }
);

audioPrincipal.addEventListener(
  "pause",
  function() {

    musicaBtn.textContent =
      "🎵 Música";

  }
);

/* ============================================================
   SUBIR CANCIONES DESDE EL DISPOSITIVO
   ============================================================ */

let cancionesLocales = [];

selectorMusica.addEventListener(
  "change",
  function(event) {

    const archivos =
      Array.from(
        event.target.files
      );

    if (
      archivos.length === 0
    ) {
      return;
    }

    for (
      const archivo
      of archivos
    ) {

      if (
        !archivo.type.startsWith(
          "audio/"
        )
      ) {
        continue;
      }

      const url =
        URL.createObjectURL(
          archivo
        );

      cancionesLocales.push({
        nombre:
          archivo.name,

        url:
          url
      });

    }

    mostrarListaCanciones();

    /*
     * Permitimos volver a seleccionar
     * el mismo archivo posteriormente.
     */

    selectorMusica.value = "";

  }
);

/* ============================================================
   MOSTRAR LISTA DE CANCIONES
   ============================================================ */

function mostrarListaCanciones() {

  listaCanciones.innerHTML = "";

  if (
    cancionesLocales.length === 0
  ) {

    listaCanciones.innerHTML =
      '<div class="vacio">' +
      'Todavía no has seleccionado canciones.' +
      '</div>';

    return;
  }

  cancionesLocales.forEach(
    function(cancion, indice) {

      const fila =
        document.createElement(
          "div"
        );

      fila.className =
        "cancion";

      const boton =
        document.createElement(
          "button"
        );

      boton.textContent =
        "▶️";

      boton.type =
        "button";

      boton.addEventListener(
        "click",
        function() {

          reproducirCancion(
            indice
          );

        }
      );

      const nombre =
        document.createElement(
          "div"
        );

      nombre.className =
        "nombreCancion";

      nombre.textContent =
        cancion.nombre;

      fila.appendChild(
        boton
      );

      fila.appendChild(
        nombre
      );

      listaCanciones.appendChild(
        fila
      );

    }
  );

}

/* ============================================================
   REPRODUCIR CANCIÓN LOCAL
   ============================================================ */

function reproducirCancion(
  indice
) {

  const cancion =
    cancionesLocales[indice];

  if (!cancion) {
    return;
  }

  audioPrincipal.src =
    cancion.url;

  audioPrincipal
    .play()
    .catch(
      function(error) {

        console.log(
          "No se pudo reproducir:",
          error
        );

      }
    );

}

/* ============================================================
   MICRÓFONO
   ============================================================ */

let reconocimiento = null;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (
  SpeechRecognition
) {

  reconocimiento =
    new SpeechRecognition();

  reconocimiento.lang =
    "es-ES";

  reconocimiento.continuous =
    false;

  reconocimiento.interimResults =
    false;

  reconocimiento.onstart =
    function() {

      microfonoBtn.textContent =
        "🔴";

    };

  reconocimiento.onend =
    function() {

      microfonoBtn.textContent =
        "🎤";

    };

  reconocimiento.onerror =
    function() {

      microfonoBtn.textContent =
        "🎤";

    };

  reconocimiento.onresult =
    function(event) {

      const texto =
        event.results[0][0]
          .transcript;

      entrada.value =
        texto;

      entrada.focus();

    };

  microfonoBtn.addEventListener(
    "click",
    function() {

      try {

        reconocimiento.start();

      } catch (error) {

        console.log(
          error
        );

      }

    }
  );

} else {

  microfonoBtn.disabled =
    true;

  microfonoBtn.title =
    "Este navegador no admite reconocimiento de voz.";

}

/* ============================================================
   INICIO
   ============================================================ */

cargarHistorial();

comprobarEstado();

</script>
