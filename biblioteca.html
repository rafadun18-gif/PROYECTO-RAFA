<script type="module">

import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const URL_CLOUDFLARE =
  "https://gepetto-rafa.rafadun18.workers.dev";

const MODELO =
  "Llama-3.2-1B-Instruct-q4f16_1-MLC";

const CLAVE_MEMORIA = "memoriaGePeTo";
const CLAVE_HISTORIAL = "historialGePeTo";
const CLAVE_TAREAS = "tareasGePeTo";
const CLAVE_INVESTIGACIONES = "investigacionesGePeTo";

const chat = document.getElementById("chat");
const formulario = document.getElementById("formulario");
const entrada = document.getElementById("entrada");
const enviar = document.getElementById("enviar");
const botonMusica = document.getElementById("botonMusica");
const audioMusica = document.getElementById("audioMusica");
const contadores = document.getElementById("contadores");

let recuerdos = JSON.parse(
  localStorage.getItem(CLAVE_MEMORIA) || "[]"
);

let historial = JSON.parse(
  localStorage.getItem(CLAVE_HISTORIAL) || "[]"
);

let tareas = JSON.parse(
  localStorage.getItem(CLAVE_TAREAS) || "[]"
);

let investigaciones = JSON.parse(
  localStorage.getItem(CLAVE_INVESTIGACIONES) || "[]"
);

let motorIA = null;
let cargandoIA = false;

function normalizar(texto) {
  return String(texto || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

function guardarLocal() {
  localStorage.setItem(
    CLAVE_MEMORIA,
    JSON.stringify(recuerdos)
  );

  localStorage.setItem(
    CLAVE_HISTORIAL,
    JSON.stringify(historial.slice(-100))
  );

  localStorage.setItem(
    CLAVE_TAREAS,
    JSON.stringify(tareas)
  );

  localStorage.setItem(
    CLAVE_INVESTIGACIONES,
    JSON.stringify(investigaciones)
  );
}

function actualizarContadores() {
  contadores.textContent =
    "Recuerdos: " + recuerdos.length +
    " · Tareas: " + tareas.length +
    " · Investigaciones: " + investigaciones.length;
}

function bajarChat() {
  setTimeout(() => {
    chat.scrollTop = chat.scrollHeight;
  }, 50);
}

function añadirMensaje(texto, tipo = "gepeto") {
  const mensaje = document.createElement("div");

  mensaje.className = "mensaje " + tipo;
  mensaje.textContent = texto;

  chat.appendChild(mensaje);
  bajarChat();

  return mensaje;
}

function guardarHistorial(texto, tipo) {
  historial.push({
    texto,
    tipo,
    fecha: new Date().toISOString()
  });

  historial = historial.slice(-100);
  guardarLocal();
}

function mensajeCompleto(texto, tipo) {
  añadirMensaje(texto, tipo);
  guardarHistorial(texto, tipo);
}

function mostrarBienvenida() {
  if (chat.children.length > 0) {
    return;
  }

  mensajeCompleto(
    "Hola. Soy GePeTo. Puedo guardar recuerdos, crear tareas y preparar investigaciones. ¿Qué hacemos?",
    "gepeto"
  );
}

async function cargarMemoriaCloudflare() {
  try {
    const respuesta = await fetch(
      URL_CLOUDFLARE + "/recuerdos"
    );

    if (!respuesta.ok) return;

    const datos = await respuesta.json();

    if (Array.isArray(datos.recuerdos)) {
      recuerdos = datos.recuerdos;
      guardarLocal();
      actualizarContadores();
    }
  } catch (error) {
    console.log("No se pudo cargar la memoria Cloudflare");
  }
}

async function guardarRecuerdoCloudflare(texto) {
  try {
    await fetch(URL_CLOUDFLARE + "/recuerdos", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        texto
      })
    });
  } catch (error) {
    console.log("No se pudo guardar el recuerdo online");
  }
}

async function borrarMemoriaCloudflare() {
  try {
    await fetch(URL_CLOUDFLARE + "/recuerdos", {
      method: "DELETE"
    });
  } catch (error) {
    console.log("No se pudo borrar la memoria online");
  }
}

function extraerRecuerdo(texto) {
  const patrones = [
    /^\s*recuerda que\s+(.+)$/i,
    /^\s*recuerda:\s*(.+)$/i,
    /^\s*mi nombre es\s+(.+)$/i,
    /^\s*me gusta\s+(.+)$/i,
    /^\s*recuerda\s+que\s+(.+)$/i
  ];

  for (const patron of patrones) {
    const resultado = texto.match(patron);

    if (resultado && resultado[1]) {
      return resultado[1].trim();
    }
  }

  return null;
}

function extraerTarea(texto) {
  const patrones = [
    /^\s*recu[eé]rdame\s+que\s+(.+)$/i,
    /^\s*recu[eé]rdame\s+(.+)$/i,
    /^\s*crea\s+una\s+tarea\s+para\s+(.+)$/i,
    /^\s*crea\s+una\s+tarea\s+(.+)$/i,
    /^\s*crear\s+una\s+tarea\s+para\s+(.+)$/i,
    /^\s*apunta\s+que\s+(.+)$/i,
    /^\s*anota\s+que\s+(.+)$/i
  ];

  for (const patron of patrones) {
    const resultado = texto.match(patron);

    if (resultado && resultado[1]) {
      return resultado[1].trim();
    }
  }

  return null;
}

async function guardarTareaCloudflare(texto) {
  try {
    await fetch(URL_CLOUDFLARE + "/tareas", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        texto
      })
    });
  } catch (error) {
    console.log("No se pudo guardar la tarea online");
  }
}

async function cargarTareasCloudflare() {
  try {
    const respuesta = await fetch(
      URL_CLOUDFLARE + "/tareas"
    );

    if (!respuesta.ok) return;

    const datos = await respuesta.json();

    if (Array.isArray(datos.tareas)) {
      tareas = datos.tareas;
      guardarLocal();
      actualizarContadores();
    }
  } catch (error) {
    console.log("No se pudieron cargar las tareas");
  }
}

function esPeticionDeTareas(texto) {
  const frase = normalizar(texto);

  return (
    frase.includes("mis tareas") ||
    frase.includes("que tareas tengo") ||
    frase.includes("lista de tareas") ||
    frase.includes("dime las tareas")
  );
}

function responderSobreTareas() {
  if (tareas.length === 0) {
    return "No tienes tareas guardadas.";
  }

  return "Estas son tus tareas:\n\n" +
    tareas.map((tarea, indice) => {
      const texto =
        tarea.texto ||
        tarea.descripcion ||
        JSON.stringify(tarea);

      return (indice + 1) + ". " + texto;
    }).join("\n");
}

function extraerInvestigacion(texto) {
  const patrones = [
    /^\s*investiga\s+(.+)$/i,
    /^\s*haz\s+una\s+investigaci[oó]n\s+de\s+(.+)$/i,
    /^\s*prepara\s+una\s+investigaci[oó]n\s+de\s+(.+)$/i,
    /^\s*investigaci[oó]n\s+sobre\s+(.+)$/i
  ];

  for (const patron of patrones) {
    const resultado = texto.match(patron);

    if (resultado && resultado[1]) {
      return resultado[1].trim();
    }
  }

  return null;
}

function extraerPeticionResultados(texto) {
  const patrones = [
    /^\s*dame\s+los\s+resultados\s+de\s+la\s+investigaci[oó]n\s+de\s+(.+)$/i,
    /^\s*mu[eé]strame\s+la\s+investigaci[oó]n\s+de\s+(.+)$/i,
    /^\s*dame\s+los\s+resultados\s+de\s+(.+)$/i,
    /^\s*resultados\s+de\s+(.+)$/i
  ];

  for (const patron of patrones) {
    const resultado = texto.match(patron);

    if (resultado && resultado[1]) {
      return resultado[1].trim();
    }
  }

  return null;
}

async function cargarInvestigacionesCloudflare() {
  try {
    const respuesta = await fetch(
      URL_CLOUDFLARE + "/investigaciones"
    );

    if (!respuesta.ok) return;

    const datos = await respuesta.json();

    if (Array.isArray(datos.investigaciones)) {
      investigaciones = datos.investigaciones;
      guardarLocal();
      actualizarContadores();
    }
  } catch (error) {
    console.log("No se pudieron cargar investigaciones");
  }
}

async function guardarInvestigacionCloudflare(
  tema,
  contenido
) {
  try {
    await fetch(URL_CLOUDFLARE + "/investigaciones", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        tema,
        contenido
      })
    });
  } catch (error) {
    console.log("No se pudo guardar la investigación online");
  }
}

async function buscarInvestigacionCloudflare(tema) {
  try {
    const respuesta = await fetch(
      URL_CLOUDFLARE +
      "/investigaciones?tema=" +
      encodeURIComponent(tema)
    );

    if (!respuesta.ok) return null;

    const datos = await respuesta.json();

    if (datos.investigacion) {
      return datos.investigacion;
    }

    return null;
  } catch (error) {
    return null;
  }
}

/* =========================================================
   ÚNICA CORRECCIÓN:
   Ahora Wikipedia busca artículos relacionados con el tema
   en lugar de exigir una página con el nombre exacto.
   ========================================================= */

async function buscarEnWikipedia(tema) {
  try {

    const urlBusqueda =
      "https://es.wikipedia.org/w/api.php" +
      "?action=query" +
      "&list=search" +
      "&srsearch=" +
      encodeURIComponent(tema) +
      "&format=json" +
      "&origin=*" +
      "&srlimit=5";

    const respuestaBusqueda =
      await fetch(urlBusqueda);

    if (!respuestaBusqueda.ok) {
      return null;
    }

    const datosBusqueda =
      await respuestaBusqueda.json();

    const resultados =
      datosBusqueda?.query?.search || [];

    if (resultados.length === 0) {
      return null;
    }

    let investigacion = "";

    for (const resultado of resultados.slice(0, 5)) {

      const titulo = resultado.title;

      const urlPagina =
        "https://es.wikipedia.org/api/rest_v1/page/summary/" +
        encodeURIComponent(
          titulo.replace(/\s+/g, "_")
        );

      try {

        const respuestaPagina =
          await fetch(urlPagina);

        if (!respuestaPagina.ok) {
          continue;
        }

        const pagina =
          await respuestaPagina.json();

        if (pagina.extract) {

          investigacion +=
            "\n\n### " +
            titulo +
            "\n\n" +
            pagina.extract;
        }

      } catch (error) {

        console.log(
          "No se pudo cargar: " + titulo
        );
      }
    }

    if (!investigacion.trim()) {
      return null;
    }

    return investigacion.trim();

  } catch (error) {

    console.log(
      "Error buscando en Wikipedia:",
      error
    );

    return null;
  }
}

function responderSobreInvestigaciones() {
  if (investigaciones.length === 0) {
    return "Todavía no tienes investigaciones guardadas.";
  }

  return "Estas son tus investigaciones:\n\n" +
    investigaciones.map((investigacion, indice) => {
      const tema =
        investigacion.tema ||
        investigacion.titulo ||
        "Sin título";

      return (indice + 1) + ". " + tema;
    }).join("\n");
}

async function realizarInvestigacion(tema) {

  const temaLimpio = tema.trim();

  mensajeCompleto(
    "Voy a investigar sobre: " +
    temaLimpio +
    ". Un momento...",
    "sistema"
  );

  const resultadoWikipedia =
    await buscarEnWikipedia(temaLimpio);

  let contenido = "";

  if (resultadoWikipedia) {

    contenido =
      "Investigación sobre " +
      temaLimpio +
      "\n\n" +
      resultadoWikipedia;

  } else {

    contenido =
      "No he encontrado información suficiente sobre " +
      temaLimpio +
      " en Wikipedia.";
  }

  investigaciones.push({
    tema: temaLimpio,
    contenido,
    fecha: new Date().toISOString()
  });

  guardarLocal();

  await guardarInvestigacionCloudflare(
    temaLimpio,
    contenido
  );

  actualizarContadores();

  return contenido;
}

function responderQuePuedeHacer() {

  return [
    "Puedo hacer varias cosas:",
    "",
    "• Guardar recuerdos: «Recuerda que me gusta el cine».",
    "• Crear tareas: «Recuérdame llamar al médico».",
    "• Mostrar tareas: «Dime mis tareas».",
    "• Investigar: «Investiga la mitología vikinga».",
    "• Mostrar investigaciones: «Dame los resultados de los vikingos».",
    "• Mantener una conversación contigo.",
    "",
    "Las investigaciones se guardan en la memoria del proyecto."
  ].join("\n");
}

async function prepararIA() {

  if (motorIA || cargandoIA) {
    return;
  }

  cargandoIA = true;

  try {

    motorIA =
      await webllm.CreateMLCEngine(
        MODELO,
        {
          initProgressCallback: (progreso) => {
            console.log(progreso);
          }
        }
      );

  } catch (error) {

    console.log(
      "La IA local no se pudo cargar"
    );
  }

  cargandoIA = false;
}

function crearContexto() {

  let contexto = "";

  if (recuerdos.length > 0) {

    contexto +=
      "\nRecuerdos del usuario:\n";

    recuerdos.forEach((recuerdo) => {

      contexto +=
        "- " +
        (recuerdo.texto || recuerdo) +
        "\n";
    });
  }

  if (tareas.length > 0) {

    contexto +=
      "\nTareas guardadas:\n";

    tareas.forEach((tarea) => {

      contexto +=
        "- " +
        (tarea.texto ||
         tarea.descripcion ||
         tarea) +
        "\n";
    });
  }

  return contexto;
}

async function contestarConIA(texto) {

  await prepararIA();

  if (!motorIA) {

    return "Ahora mismo no puedo cargar la IA local. Puedes seguir usando recuerdos, tareas e investigaciones.";
  }

  try {

    const respuesta =
      await motorIA.chat.completions.create({

        messages: [

          {
            role: "system",
            content:
              "Eres GePeTo, el asistente del Proyecto Rafa. " +
              "Responde en español de forma clara, amable y útil. " +
              "Usa los recuerdos y datos guardados cuando sean relevantes. " +
              crearContexto()
          },

          {
            role: "user",
            content: texto
          }
        ],

        temperature: 0.7,
        max_tokens: 500
      });

    return respuesta.choices[0].message.content;

  } catch (error) {

    return "Ha ocurrido un problema al responder. Inténtalo de nuevo.";
  }
}

async function procesarMensaje(texto) {

  const mensaje = texto.trim();

  if (!mensaje) {
    return;
  }

  mensajeCompleto(
    mensaje,
    "usuario"
  );

  entrada.value = "";
  entrada.style.height = "auto";

  const frase =
    normalizar(mensaje);

  if (
    frase === "que puedes hacer" ||
    frase === "ayuda" ||
    frase === "funciones"
  ) {

    mensajeCompleto(
      responderQuePuedeHacer(),
      "gepeto"
    );

    return;
  }

  const recuerdo =
    extraerRecuerdo(mensaje);

  if (recuerdo) {

    recuerdos.push({
      texto: recuerdo,
      fecha: new Date().toISOString()
    });

    guardarLocal();

    await guardarRecuerdoCloudflare(
      recuerdo
    );

    actualizarContadores();

    mensajeCompleto(
      "He guardado este recuerdo: " +
      recuerdo,
      "gepeto"
    );

    return;
  }

  const tarea =
    extraerTarea(mensaje);

  if (tarea) {

    tareas.push({
      texto: tarea,
      fecha: new Date().toISOString()
    });

    guardarLocal();

    await guardarTareaCloudflare(
      tarea
    );

    actualizarContadores();

    mensajeCompleto(
      "He guardado la tarea: " +
      tarea,
      "gepeto"
    );

    return;
  }

  if (esPeticionDeTareas(mensaje)) {

    mensajeCompleto(
      responderSobreTareas(),
      "gepeto"
    );

    return;
  }

  const nuevaInvestigacion =
    extraerInvestigacion(mensaje);

  if (nuevaInvestigacion) {

    const resultado =
      await realizarInvestigacion(
        nuevaInvestigacion
      );

    mensajeCompleto(
      resultado,
      "gepeto"
    );

    return;
  }

  const peticionResultados =
    extraerPeticionResultados(
      mensaje
    );

  if (peticionResultados) {

    let investigacion =
      await buscarInvestigacionCloudflare(
        peticionResultados
      );

    if (!investigacion) {

      investigacion =
        investigaciones.find((item) =>
          normalizar(item.tema).includes(
            normalizar(peticionResultados)
          )
        );
    }

    if (investigacion) {

      mensajeCompleto(
        investigacion.contenido ||
        JSON.stringify(investigacion),
        "gepeto"
      );

    } else {

      mensajeCompleto(
        "No encuentro una investigación guardada sobre " +
        peticionResultados +
        ". Escribe «Investiga " +
        peticionResultados +
        "» para prepararla.",
        "gepeto"
      );
    }

    return;
  }

  if (
    frase === "mis investigaciones" ||
    frase === "lista de investigaciones" ||
    frase === "que investigaciones tengo"
  ) {

    mensajeCompleto(
      responderSobreInvestigaciones(),
      "gepeto"
    );

    return;
  }

  const respuesta =
    await contestarConIA(mensaje);

  mensajeCompleto(
    respuesta,
    "gepeto"
  );
}

formulario.addEventListener(
  "submit",
  async (evento) => {

    evento.preventDefault();

    if (enviar.disabled) {
      return;
    }

    enviar.disabled = true;
    enviar.textContent = "…";

    try {

      await procesarMensaje(
        entrada.value
      );

    } finally {

      enviar.disabled = false;
      enviar.textContent = "ENVIAR";
      entrada.focus();
    }
  }
);

entrada.addEventListener(
  "input",
  () => {

    entrada.style.height = "auto";

    entrada.style.height =
      Math.min(
        entrada.scrollHeight,
        130
      ) + "px";
  }
);

entrada.addEventListener(
  "keydown",
  (evento) => {

    if (
      evento.key === "Enter" &&
      !evento.shiftKey
    ) {

      evento.preventDefault();

      formulario.requestSubmit();
    }
  }
);
