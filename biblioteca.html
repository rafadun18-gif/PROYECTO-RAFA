<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {

}

html, body {
    margin: 0;
    padding: 0;

body {

}

header {

header h1 {

}

}

.contenedor {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

.zona-cerebro {
    flex: 0 0 auto;
    text-align: center;
    padding: 7px 5px;
    background: #050505;
    border-bottom: 1px solid #222;
}

.cerebro {
    font-size: 40px;
    line-height: 40px;

}

}

.contador {
    color: #39ff14;
    font-size: 13px;
    font-weight: bold;
    margin-top: 3px;
}

.estado {
    min-height: 17px;
    color: #aaa;
    font-size: 12px;
    margin-top: 3px;
}

.chat {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    -webkit-overflow-scrolling: touch;
}

.mensaje {
    max-width: 92%;
    padding: 10px 12px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.4;
    font-size: 15px;
}

.usuario {
    align-self: flex-end;
    background: #073d20;
    border: 1px solid #39ff14;
}

.gepeto {
    align-self: flex-start;

}

.escribir {
    flex: 0 0 auto;
    display: flex;

}

.accion {

}

.accion.rojo {
    color: #ff5555;

}

@media (max-width:480px) {

    }

</style>
</head>

</header>

            id="entrada"

            placeholder="Escribe a GePeTo..."

            🎙️
        </button>

        <button id="enviar" type="submit">
            Enviar
        </button>

    </form>

</div>

<script type="module">

import * as webllm from
"https://esm.run/@mlc-ai/web-llm";


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const CLAVE_MEMORIA = "memoriaGePeTo";
const CLAVE_HISTORIAL = "historialGePeTo";
const CLAVE_TAREAS = "tareasGePeTo";

const MODELO =
"Llama-3.2-1B-Instruct-q4f16_1-MLC";


let engine = null;
let preparando = false;

let memoria = cargarArray(CLAVE_MEMORIA);
let historial = cargarArray(CLAVE_HISTORIAL);
let tareas = cargarArray(CLAVE_TAREAS);


/* =========================================================
   ELEMENTOS
========================================================= */

const chat =
document.getElementById("chat");

const entrada =
document.getElementById("entrada");

const formulario =
document.getElementById("formulario");

const numeroRecuerdos =
document.getElementById("numeroRecuerdos");

const numeroTareas =
document.getElementById("numeroTareas");

const estadoIA =
document.getElementById("estadoIA");

const botonEnviar =
document.getElementById("enviar");

const botonVoz =
document.getElementById("voz");


/* =========================================================
   ALMACENAMIENTO
========================================================= */

function cargarArray(clave) {

    try {

        const guardado =
        localStorage.getItem(clave);

        if (!guardado) {
            return [];
        }

        const datos =
        JSON.parse(guardado);

        return Array.isArray(datos)
            ? datos
            : [];

    } catch(error) {

        console.log(
            "Error cargando",
            clave,
            error
        );

        return [];
    }
}


function guardarArray(clave, datos) {

    try {

        localStorage.setItem(
            clave,
            JSON.stringify(datos)
        );

        return true;

    } catch(error) {

        console.log(
            "Error guardando",
            clave,
            error
        );

        return false;
    }
}


/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalizar(texto) {

    return String(texto)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[¿?¡!.,;:()[\]{}"']/g," ")
        .replace(/\s+/g," ")
        .trim();
}


/* =========================================================
   CONTADORES
========================================================= */

function actualizarContadores() {

    numeroRecuerdos.textContent =
        memoria.length;

    numeroTareas.textContent =
        tareas.filter(
            tarea => tarea.activa !== false
        ).length;
}


/* =========================================================
   CHAT
========================================================= */

function añadirMensaje(
    texto,
    tipo = "gepeto",
    guardar = true
) {

    const mensaje =
    document.createElement("div");

    mensaje.className =
        "mensaje " + tipo;

    mensaje.textContent =
        texto;

    chat.appendChild(mensaje);

    chat.scrollTop =
        chat.scrollHeight;


    if (guardar) {

        historial.push({

            tipo: tipo,

            texto: texto,

            fecha: Date.now()

        });


        if (historial.length > 100) {

            historial =
                historial.slice(-100);

        }


        guardarArray(
            CLAVE_HISTORIAL,
            historial
        );
    }


    return mensaje;
}


/* =========================================================
   CARGAR HISTORIAL
========================================================= */

function cargarHistorial() {

    chat.innerHTML = "";


    if (historial.length === 0) {

        añadirMensaje(

            "Hola Rafa. Soy GePeTo 🧠\n\n" +

            "Puedo conversar contigo, guardar recuerdos, " +
            "utilizar esos recuerdos para contestarte y " +
            "guardar tareas.\n\n" +

            "Puedes preguntarme:\n" +

            "• ¿Qué puedes hacer?\n" +

            "• ¿Qué recuerdas?\n" +

            "• ¿Qué tareas tengo?\n\n" +

            "También puedes decirme:\n" +

            "«Recuerda que mi color preferido es el verde fosforito»",

            "gepeto",

            false
        );

        return;
    }


    historial.forEach(item => {

        if (
            item &&
            typeof item.texto === "string" &&
            (
                item.tipo === "usuario" ||
                item.tipo === "gepeto"
            )
        ) {

            añadirMensaje(
                item.texto,
                item.tipo,
                false
            );
        }

    });
}


/* =========================================================
   MEMORIA
========================================================= */

function guardarMemoria(texto) {

    const recuerdo =
        String(texto)
        .trim();


    if (!recuerdo) {

        return {
            guardado:false,
            repetido:false
        };
    }


    const normalizado =
        normalizar(recuerdo);


    const existe =
        memoria.some(
            item =>
                normalizar(item) ===
                normalizado
        );


    if (existe) {

        return {
            guardado:false,
            repetido:true
        };
    }


    memoria.push(recuerdo);


    const correcto =
        guardarArray(
            CLAVE_MEMORIA,
            memoria
        );


    actualizarContadores();


    return {

        guardado:correcto,

        repetido:false

    };
}


/* =========================================================
   DETECTAR "RECUERDA..."
========================================================= */

function extraerRecuerdo(texto) {

    const mensaje =
        String(texto).trim();


    const patrones = [

        /^\s*recuerda(?:me)?\s*(?:que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*acu[eé]rdate\s*(?:de|que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*guarda\s*(?:que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*memoriza\s*(?:que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*apunta\s*(?:que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*anota\s*(?:que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*no olvides\s*(?:que)?\s*[:,-]?\s*(.+)$/i,

        /^\s*quiero que recuerdes\s+(.+)$/i

    ];


    for (
        const patron of patrones
    ) {

        const resultado =
            mensaje.match(patron);


        if (
            resultado &&
            resultado[1]
        ) {

            const recuerdo =
                resultado[1]
                .trim()
                .replace(/[.!?]+$/,"");


            if (
                recuerdo.length > 1
            ) {

                return recuerdo;
            }
        }
    }


    return null;
}


/* =========================================================
   PREGUNTAS SOBRE RECUERDOS
========================================================= */

function palabrasImportantes(texto) {

    const ignoradas =
    new Set([

        "el","la","los","las",

        "un","una","unos","unas",

        "mi","mis","me","yo",

        "tu","tus","te",

        "es","son","que",

        "cual","cuales",

        "como","donde","cuando",

        "por","para","con",

        "de","del",

        "y","o","a",

        "tengo","tiene",

        "favorito","favorita",

        "dime","sabes",

        "recuerdas","recuerdo"

    ]);


    return normalizar(texto)

        .split(" ")

        .filter(
            palabra =>
                palabra.length > 2
        )

        .filter(
            palabra =>
                !ignoradas.has(palabra)
        );
}


function buscarRecuerdosRelacionados(
    pregunta
) {

    const palabras =
        palabrasImportantes(
            pregunta
        );


    if (
        palabras.length === 0
    ) {

        return [];
    }


    const resultados =
        memoria.map(
            recuerdo => {

                const palabrasRecuerdo =
                    palabrasImportantes(
                        recuerdo
                    );


                let puntos = 0;


                palabras.forEach(
                    palabra => {

                        if (
                            palabrasRecuerdo
                            .includes(palabra)
                        ) {

                            puntos++;
                        }

                    }
                );


                return {

                    texto:recuerdo,

                    puntos:puntos
                };

            }
        );


    return resultados

        .filter(
            item =>
                item.puntos > 0
        )

        .sort(
            (a,b) =>
                b.puntos -
                a.puntos
        )

        .slice(0,5)

        .map(
            item =>
                item.texto
        );
}


/* =========================================================
   MOSTRAR RECUERDOS
========================================================= */

function esPeticionDeRecuerdos(
    texto
) {

    const mensaje =
        normalizar(texto);


    return (

        mensaje.includes(
            "que recuerdas"
        ) ||

        mensaje.includes(
            "mis recuerdos"
        ) ||

        mensaje.includes(
            "que sabes de mi"
        ) ||

        mensaje.includes(
            "ensename mis recuerdos"
        ) ||

        mensaje.includes(
            "dime mis recuerdos"
        ) ||

        mensaje.includes(
            "ver recuerdos"
        )

    );
}


function responderSobreMemoria(
    pregunta
) {

    if (
        esPeticionDeRecuerdos(
            pregunta
        )
    ) {

        if (
            memoria.length === 0
        ) {

            return "Todavía no tengo recuerdos guardados, Rafa.";
        }


        return (

            "🧠 Estos son mis recuerdos:\n\n" +

            memoria
                .map(
                    (recuerdo,indice) =>
                        (indice + 1) +
                        ". " +
                        recuerdo
                )
                .join("\n")

        );
    }


    const relacionados =
        buscarRecuerdosRelacionados(
            pregunta
        );


    if (
        relacionados.length === 0
    ) {

        return null;
    }


    if (
        relacionados.length === 1
    ) {

        return (

            "🧠 Sí, lo recuerdo:\n\n" +

            relacionados[0]

        );
    }


    return (

        "🧠 He encontrado estos recuerdos relacionados:\n\n" +

        relacionados
            .map(
                recuerdo =>
                    "• " + recuerdo
            )
            .join("\n")

    );
}


/* =========================================================
   FUNCIONES DE GEPeTo
========================================================= */

function responderQuePuedeHacer() {

    return (

        "🧠 Puedo hacer varias cosas, Rafa:\n\n" +

        "💬 CONVERSAR\n" +
        "Puedes hablar conmigo y preguntarme cosas.\n\n" +

        "🧠 MEMORIA\n" +
        "Puedo guardar información que me mandes recordar.\n\n" +

        "Ejemplo:\n" +
        "«Recuerda que mi color preferido es el verde fosforito».\n\n" +

        "Después puedes preguntarme:\n" +
        "«¿Cuál es mi color preferido?»\n\n" +

        "📚 RECUERDOS\n" +
        "Puedes preguntarme «¿Qué recuerdas?» y te enseñaré lo que tengo guardado.\n\n" +

        "📋 TAREAS\n" +
        "Puedo guardar tareas que quieras hacer más adelante.\n\n" +

        "Ejemplo:\n" +
        "«Recuérdame mañana comprar comida para los peces».\n\n" +

        "⏰ PROGRAMACIÓN\n" +
        "Puedo guardar la fecha y hora de una tarea cuando me la indiques.\n\n" +

        "📋 CONSULTAR TAREAS\n" +
        "Pregunta «¿Qué tareas tengo?».\n\n" +

        "🗑️ BORRAR\n" +
        "Puedes pedirme que elimine una tarea o utilizar los botones de la Biblioteca.\n\n" +

        "🎙️ VOZ\n" +
        "Puedes hablarme usando el botón del micrófono.\n\n" +

        "🔔 EJECUCIÓN EN SEGUNDO PLANO\n" +
        "Las tareas quedan guardadas aunque salgas de la Biblioteca. " +
        "La ejecución automática con la web cerrada necesita conectarse al sistema de automatizaciones."

    );
}


/* =========================================================
   TAREAS
========================================================= */

function crearTarea(texto) {

    const tarea = {

        id:
            Date.now().toString() +
            Math.random()
            .toString(36)
            .substring(2,8),

        texto:
            texto.trim(),

        creada:
            Date.now(),

        activa:
            true

    };


    tareas.push(tarea);


    guardarArray(
        CLAVE_TAREAS,
        tareas
    );


    actualizarContadores();


    return tarea;
}


/* =========================================================
   DETECTAR TAREAS
========================================================= */

function extraerTarea(texto) {

    const mensaje =
        texto.trim();


    const patrones = [

        /^\s*recu[eé]rdame\s+(.+)$/i,

        /^\s*recu[eé]rdame\s+que\s+(.+)$/i,

        /^\s*crea una tarea\s+(.+)$/i,

        /^\s*crea una tarea para\s+(.+)$/i,

        /^\s*anota una tarea\s+(.+)$/i,

        /^\s*guarda una tarea\s+(.+)$/i,

        /^\s*apunta una tarea\s+(.+)$/i

    ];


    for (
        const patron of patrones
    ) {

        const resultado =
            mensaje.match(patron);


        if (
            resultado &&
            resultado[1]
        ) {

            return resultado[1]
                .trim();
        }
    }


    return null;
}


/* =========================================================
   PREGUNTAS SOBRE TAREAS
========================================================= */

function esPeticionDeTareas(
    texto
) {

    const mensaje =
        normalizar(texto);


    return (

        mensaje.includes(
            "que tareas tengo"
        ) ||

        mensaje.includes(
            "mis tareas"
        ) ||

        mensaje.includes(
            "ver tareas"
        ) ||

        mensaje.includes(
            "mis pendientes"
        )

    );
}


function responderSobreTareas() {

    const activas =
        tareas.filter(
            tarea =>
                tarea.activa !== false
        );


    if (
        activas.length === 0
    ) {

        return "📋 No tienes tareas pendientes, Rafa.";
    }


    return (

        "📋 Estas son tus tareas:\n\n" +

        activas
            .map(
                (tarea,indice) =>
                    (indice + 1) +
                    ". " +
                    tarea.texto
            )
            .join("\n")

    );
}


/* =========================================================
   BORRAR TAREA
========================================================= */

function borrarTareaPorTexto(
    texto
) {

    const palabras =
        palabrasImportantes(
            texto
        );


    let encontrada = -1;


    for (
        let i = 0;
        i < tareas.length;
        i++
    ) {

        if (
            tareas[i].activa === false
        ) {

            continue;
        }


        const palabrasTarea =
            palabrasImportantes(
                tareas[i].texto
            );


        const coincidencias =
            palabras.filter(
                palabra =>
                    palabrasTarea
                    .includes(palabra)
            ).length;


        if (
            coincidencias > 0
        ) {

            encontrada = i;
            break;
        }
    }


    if (
        encontrada === -1
    ) {

        return false;
    }


    tareas[encontrada].activa =
        false;


    guardarArray(
        CLAVE_TAREAS,
        tareas
    );


    actualizarContadores();


    return true;
}


/* =========================================================
   DETECTAR BORRADO
========================================================= */

function extraerBorradoTarea(
    texto
) {

    const mensaje =
        texto.trim();


    const patrones = [

        /^\s*borra la tarea\s+(.+)$/i,

        /^\s*elimina la tarea\s+(.+)$/i,

        /^\s*quita la tarea\s+(.+)$/i,

        /^\s*cancela la tarea\s+(.+)$/i

    ];


    for (
        const patron of patrones
    ) {

        const resultado =
            mensaje.match(patron);


        if (
            resultado &&
            resultado[1]
        ) {

            return resultado[1]
                .trim();
        }
    }


    return null;
}


/* =========================================================
   CONTEXTO PARA LA IA
========================================================= */

function crearContextoMemoria() {

    if (
        memoria.length === 0
    ) {

        return "No hay recuerdos guardados.";
    }


    return memoria
        .map(
            (recuerdo,indice) =>
                (indice + 1) +
                ". " +
                recuerdo
        )
        .join("\n");
}


function crearContextoTareas() {

    const activas =
        tareas.filter(
            tarea =>
                tarea.activa !== false
        );


    if (
        activas.length === 0
    ) {

        return "No hay tareas pendientes.";
    }


    return activas
        .map(
            (tarea,indice) =>
                (indice + 1) +
                ". " +
                tarea.texto
        )
        .join("\n");
}


function crearContextoHistorial() {

    return historial
        .slice(-12)
        .map(
            item => {

                const quien =
                    item.tipo === "usuario"
                    ? "Rafa"
                    : "GePeTo";


                return (
                    quien +
                    ": " +
                    item.texto
                );
            }
        )
        .join("\n");
}


/* =========================================================
   CARGAR IA
========================================================= */

async function prepararIA() {

    if (
        engine ||
        preparando
    ) {

        return;
    }


    preparando = true;

    estadoIA.textContent =
        "Cargando inteligencia artificial...";

    botonEnviar.disabled =
        true;


    try {

        engine =
            await webllm.CreateMLCEngine(

                MODELO,

                {

                    initProgressCallback:
                        progreso => {

                            if (
                                progreso &&
                                progreso.text
                            ) {

                                estadoIA.textContent =
                                    progreso.text;
                            }

                        }

                }

            );


        estadoIA.textContent =
            "GePeTo está preparado.";

    } catch(error) {

        console.error(error);

        estadoIA.textContent =
            "La IA no se pudo cargar. La memoria y las tareas siguen funcionando.";

    } finally {

        preparando = false;

        botonEnviar.disabled =
            false;
    }
}


/* =========================================================
   RESPONDER CON IA
========================================================= */

async function contestarConIA(
    pregunta
) {

    if (!engine) {

        return (
            "La inteligencia artificial todavía está cargando. " +
            "La memoria y las tareas sí están disponibles."
        );
    }


    const sistema = `

Eres GePeTo, el asistente personal de Rafa.

Responde siempre en español.

Sé natural, amable y claro.

Utiliza los recuerdos de Rafa cuando sean relevantes.

Nunca inventes un recuerdo.

Si la respuesta está en los recuerdos, úsala.

También puedes tener en cuenta las tareas pendientes.

RECUERDOS DE RAFA:

${crearContextoMemoria()}


TAREAS PENDIENTES:

${crearContextoTareas()}


CONVERSACIÓN RECIENTE:

${crearContextoHistorial()}

`;


    const respuesta =
        await engine.chat.completions.create({

            messages: [

                {
                    role:"system",
                    content:sistema
                },

                {
                    role:"user",
                    content:pregunta
                }

            ],

            temperature:0.7,

            max_tokens:350

        });


    return (
        respuesta
        .choices?.[0]
        ?.message
        ?.content
    ) ||

    "No he conseguido preparar una respuesta.";
}


/* =========================================================
   PROCESAR MENSAJE
========================================================= */

async function procesarMensaje(
    texto
) {

    const pregunta =
        texto.trim();


    if (!pregunta) {
        return;
    }


    añadirMensaje(
        pregunta,
        "usuario"
    );


    entrada.value = "";


    /* ---------- QUÉ PUEDE HACER ---------- */

    const normal =
        normalizar(pregunta);


    if (
        normal.includes(
            "que puedes hacer"
        ) ||

        normal.includes(
            "que puedes hacer por mi"
        ) ||

        normal.includes(
            "que sabes hacer"
        ) ||

        normal ===
        "funciones"

    ) {

        añadirMensaje(
            responderQuePuedeHacer(),
            "gepeto"
        );

        return;
    }


    /* ---------- GUARDAR MEMORIA ---------- */

    const recuerdo =
        extraerRecuerdo(
            pregunta
        );


    if (recuerdo) {

        const resultado =
            guardarMemoria(
                recuerdo
            );


        if (
            resultado.repetido
        ) {

            añadirMensaje(

                "🧠 Ese recuerdo ya lo tenía guardado:\n\n" +
                recuerdo,

                "gepeto"
            );

        } else if (
            resultado.guardado
        ) {

            añadirMensaje(

                "🧠 Recuerdo guardado correctamente.\n\n" +

                "Ahora tengo " +
                memoria.length +
                " recuerdo(s).\n\n" +

                "Lo utilizaré cuando me preguntes sobre él:\n\n" +

                "• " +
                recuerdo,

                "gepeto"
            );

        } else {

            añadirMensaje(

                "No he podido guardar ese recuerdo.",

                "gepeto"
            );
        }


        return;
    }


    /* ---------- TAREA ---------- */

    const tareaTexto =
        extraerTarea(
            pregunta
        );


    if (tareaTexto) {

        const tarea =
            crearTarea(
                tareaTexto
            );


        añadirMensaje(

            "📋 Tarea guardada correctamente.\n\n" +

            "📝 " +
            tarea.texto +
            "\n\n" +

            "Ahora tengo " +
            tareas.filter(
                t => t.activa !== false
            ).length +
            " tarea(s) pendiente(s).\n\n" +

            "La tarea permanece guardada aunque salgas de la web.",

            "gepeto"
        );


        return;
    }


    /* ---------- BORRAR TAREA ---------- */

    const borrarTexto =
        extraerBorradoTarea(
            pregunta
        );


    if (borrarTexto) {

        const borrada =
            borrarTareaPorTexto(
                borrarTexto
            );


        añadirMensaje(

            borrada
                ? "🗑️ He eliminado esa tarea."
                : "No he encontrado una tarea que coincida.",

            "gepeto"
        );


        return;
    }


    /* ---------- MOSTRAR TAREAS ---------- */

    if (
        esPeticionDeTareas(
            pregunta
        )
    ) {

        añadirMensaje(
            responderSobreTareas(),
            "gepeto"
        );

        return;
    }


    /* ---------- MEMORIA DIRECTA ---------- */

    const respuestaMemoria =
        responderSobreMemoria(
            pregunta
        );


    if (
        respuestaMemoria
    ) {

        añadirMensaje(
            respuestaMemoria,
            "gepeto"
        );

        return;
    }


    /* ---------- IA ---------- */

    const pensando =
        añadirMensaje(
            "Estoy pensando...",
            "gepeto",
            false
        );


    try {

        const respuesta =
            await contestarConIA(
                pregunta
            );


        pensando.remove();


        añadirMensaje(
            respuesta,
            "gepeto"
        );

    } catch(error) {

        console.error(error);

        pensando.remove();


        añadirMensaje(

            "Ha ocurrido un error al responder. Inténtalo otra vez.",

            "gepeto"
        );
    }
}


/* =========================================================
   ENVIAR
========================================================= */

formulario.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const texto =
            entrada.value.trim();


        if (texto) {

            procesarMensaje(
                texto
            );
        }

    }
);


/* =========================================================
   BOTÓN RECUERDOS
========================================================= */

document
.getElementById("verRecuerdos")
.addEventListener(
    "click",
    () => {

        if (
            memoria.length === 0
        ) {

            añadirMensaje(
                "Todavía no tengo ningún recuerdo guardado.",
                "gepeto"
            );

            return;
        }


        añadirMensaje(

            "🧠 Mis recuerdos:\n\n" +

            memoria
                .map(
                    (recuerdo,indice) =>
                        (indice + 1) +
                        ". " +
                        recuerdo
                )
                .join("\n"),

            "gepeto"
        );
    }
);


/* =========================================================
   BOTÓN TAREAS
========================================================= */

document
.getElementById("verTareas")
.addEventListener(
    "click",
    () => {

        añadirMensaje(

            responderSobreTareas(),

            "gepeto"
        );
    }
);


/* =========================================================
   BORRAR RECUERDOS
========================================================= */

document
.getElementById("borrarRecuerdos")
.addEventListener(
    "click",
    () => {

        const confirmar =
            confirm(
                "¿Seguro que quieres borrar todos los recuerdos de GePeTo?"
            );


        if (!confirmar) {
            return;
        }


        memoria = [];


        guardarArray(
            CLAVE_MEMORIA,
            memoria
        );


        actualizarContadores();


        añadirMensaje(

            "🗑️ He borrado todos mis recuerdos.",

            "gepeto"
        );
    }
);


/* =========================================================
   VOZ
========================================================= */

botonVoz.addEventListener(
    "click",
    () => {

        const Reconocimiento =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!Reconocimiento) {

            añadirMensaje(

                "El reconocimiento de voz no está disponible en este navegador.",

                "gepeto"
            );

            return;
        }


        const reconocimiento =
            new Reconocimiento();


        reconocimiento.lang =
            "es-ES";


        reconocimiento.interimResults =
            false;


        reconocimiento.continuous =
            false;


        reconocimiento.onstart =
            () => {

                estadoIA.textContent =
                    "Escuchando...";

            };


        reconocimiento.onresult =
            event => {

                const texto =
                    event
                    .results[0][0]
                    .transcript;


                entrada.value =
                    texto;


                estadoIA.textContent =
                    "GePeTo está preparado.";
            };


        reconocimiento.onerror =
            () => {

                estadoIA.textContent =
                    "No he podido escuchar la voz.";
            };


        reconocimiento.onend =
            () => {

                if (!preparando) {

                    estadoIA.textContent =
                        "GePeTo está preparado.";
                }
            };


        reconocimiento.start();

    }
);


/* =========================================================
   INICIO
========================================================= */

actualizarContadores();

cargarHistorial();

prepararIA();


/* =========================================================
   RECUPERACIÓN AL VOLVER A LA PÁGINA
========================================================= */

window.addEventListener(
    "pageshow",
    () => {

        memoria =
            cargarArray(
                CLAVE_MEMORIA
            );

        tareas =
            cargarArray(
                CLAVE_TAREAS
            );

        actualizarContadores();


        if (
            !engine &&
            !preparando
        ) {

            prepararIA();
        }

    }
);

</script>
