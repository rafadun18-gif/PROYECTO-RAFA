<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Biblioteca · GePeTo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#050505;
  color:white;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.contenedor{
  width:100%;
  max-width:700px;
  height:100dvh;
  min-height:100vh;
  padding:55px 14px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:
    radial-gradient(circle at 50% 15%,rgba(0,255,120,.12),transparent 35%),
    linear-gradient(180deg,#101510,#030303);
}

.portada{
  position:fixed;
  top:10px;
  left:10px;
  z-index:20;
  border:1px solid #39ff88;
  background:#071009;
  color:#39ff88;
  padding:9px 13px;
  border-radius:10px;
  font-weight:bold;
  font-size:13px;
  text-decoration:none;
}

#foto{
  width:105px;
  height:105px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid #39ff88;
  box-shadow:0 0 20px rgba(57,255,136,.45);
  flex-shrink:0;
}

.nombre{
  margin-top:6px;
  font-size:22px;
  font-weight:bold;
}

.estado{
  font-size:13px;
  color:#39ff88;
  margin-top:3px;
}

#estadoIA{
  margin-top:5px;
  font-size:13px;
  color:#aaa;
  min-height:18px;
  text-align:center;
}

.chat{
  width:100%;
  max-width:620px;
  margin-top:8px;
  flex:1;
  min-height:80px;
  overflow-y:auto;
  padding:10px;
  border:1px solid rgba(57,255,136,.22);
  border-radius:14px;
  background:rgba(0,0,0,.55);
}

.mensaje{
  margin-bottom:10px;
  padding:9px 11px;
  border-radius:12px;
  line-height:1.35;
  font-size:15px;
  word-wrap:break-word;
}

.gepeto{
  background:#101d14;
  border-left:3px solid #39ff88;
}

.rafa{
  background:#10202c;
  border-left:3px solid #4da6ff;
}

.escribir{
  width:100%;
  max-width:620px;
  height:45px;
  display:flex;
  gap:6px;
  margin-top:7px;
  flex-shrink:0;
}

#texto{
  flex:1;
  min-width:0;
  border:1px solid #555;
  border-radius:10px;
  background:#111;
  color:white;
  padding:0 11px;
  font-size:15px;
  outline:none;
}

#texto:focus{
  border-color:#39ff88;
}

#enviar{
  width:82px;
  border:2px solid #39ff88;
  border-radius:10px;
  background:#12351e;
  color:#39ff88;
  font-weight:bold;
  cursor:pointer;
  opacity:1;
}

#enviar:active{
  transform:scale(.97);
}

#hablar{
  width:100%;
  max-width:620px;
  height:34px;
  margin-top:6px;
  flex-shrink:0;
  border:1px solid #555;
  border-radius:9px;
  background:#111;
  color:#aaa;
}

audio{
  display:none;
}
</style>
</head>

<body>

<div class="contenedor">

<a class="portada" href="index.html">← PORTADA</a>

<img id="foto" src="GePeTo.png" alt="GePeTo">

<div class="nombre">GePeTo</div>

<div class="estado">● Conectado</div>

<div id="estadoIA">🟡 Preparando la inteligencia de GePeTo…</div>

<div id="chat" class="chat">
  <div class="mensaje gepeto">
    Hola Rafa. Estoy preparando mi inteligencia. En cuanto termine podremos conversar.
  </div>
</div>

<div class="escribir">
  <input
    id="texto"
    type="text"
    placeholder="Escribe a GePeTo..."
    autocomplete="off"
  >
  <button id="enviar">ENVIAR</button>
</div>

<button id="hablar">🎤 Hablar con GePeTo — próximamente</button>

<audio id="musica" loop preload="auto">
  <source src="biblioteca.mp3" type="audio/mpeg">
</audio>

</div>

<script type="module">

const chat = document.getElementById("chat");
const texto = document.getElementById("texto");
const enviar = document.getElementById("enviar");
const estadoIA = document.getElementById("estadoIA");
const musica = document.getElementById("musica");

let engine = null;
let cargando = true;

/* =========================
   MÚSICA
========================= */

musica.volume = 0.35;

function iniciarMusica(){
  musica.play().catch(()=>{});
}

window.addEventListener("touchstart", iniciarMusica, {once:true});
window.addEventListener("click", iniciarMusica, {once:true});

/* =========================
   CHAT
========================= */

function añadirMensaje(textoMensaje, tipo){

  const div = document.createElement("div");

  div.className = "mensaje " + tipo;

  div.textContent = textoMensaje;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}

/* =========================
   CARGA DE LA IA
========================= */

async function prepararIA(){

  try{

    estadoIA.textContent =
      "🟡 Cargando inteligencia de GePeTo…";

    const modulo =
      await import(
        "https://esm.run/@mlc-ai/web-llm"
      );

    const model =
      "Llama-3.2-1B-Instruct-q4f16_1-MLC";

    engine =
      await modulo.CreateMLCEngine(
        model,
        {
          initProgressCallback:
            (progreso)=>{

              if(progreso && progreso.text){

                estadoIA.textContent =
                  "🟡 " + progreso.text;
              }

            }
        }
      );

    cargando = false;

    estadoIA.textContent =
      "🟢 GePeTo listo para conversar";

    añadirMensaje(
      "Ya estoy preparado, Rafa. Ahora podemos conversar.",
      "gepeto"
    );

  }catch(error){

    console.error(error);

    cargando = false;
    engine = null;

    estadoIA.textContent =
      "🔴 La inteligencia no ha podido cargarse en este dispositivo.";

    añadirMensaje(
      "Rafa, la Biblioteca funciona correctamente, pero este dispositivo o navegador no ha podido cargar todavía mi inteligencia local.",
      "gepeto"
    );
  }
}

/* =========================
   RESPONDER
========================= */

async function responder(){

  const mensaje = texto.value.trim();

  if(!mensaje) return;

  añadirMensaje(mensaje,"rafa");

  texto.value = "";

  if(!engine){

    if(cargando){

      añadirMensaje(
        "Todavía estoy cargando mi inteligencia. Espera a que aparezca «GePeTo listo para conversar».",
        "gepeto"
      );

    }else{

      añadirMensaje(
        "Mi inteligencia local no ha podido cargarse en este dispositivo.",
        "gepeto"
      );

    }

    return;
  }

  try{

    añadirMensaje(
      "Estoy pensando…",
      "gepeto"
    );

    const mensajes = [

      {
        role:"system",
        content:
        `Eres GePeTo, la inteligencia del Proyecto Rafa.

Tu nombre GePeTo viene de GPT.

Hablas siempre en español.

Tu usuario es Rafa.

Eres inteligente, curioso, tranquilo, directo, amable y analítico.

Explicas las cosas de forma sencilla.

Puedes discrepar de Rafa cuando tengas razones.

No inventes información.

Si no sabes algo, dilo claramente.

Estás dentro de la Biblioteca del Proyecto Rafa.

Preséntate como GePeTo y no digas que eres ChatGPT.`
      },

      {
        role:"user",
        content:mensaje
      }

    ];

    const respuesta =
      await engine.chat.completions.create({
        messages:mensajes,
        temperature:0.7,
        max_tokens:300
      });

    const textoRespuesta =
      respuesta.choices[0].message.content;

    const mensajesChat =
      chat.querySelectorAll(".mensaje.gepeto");

    const ultimo =
      mensajesChat[mensajesChat.length-1];

    if(
      ultimo &&
      ultimo.textContent === "Estoy pensando…"
    ){
      ultimo.textContent = textoRespuesta;
    }else{
      añadirMensaje(textoRespuesta,"gepeto");
    }

  }catch(error){

    console.error(error);

    añadirMensaje(
      "He tenido un problema al procesar el mensaje.",
      "gepeto"
    );
  }
}

/* =========================
   BOTÓN ENVIAR
========================= */

enviar.addEventListener(
  "click",
  responder
);

/* =========================
   ENTER
========================= */

texto.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      responder();
    }

  }
);

/* =========================
   VOZ
========================= */

document
  .getElementById("hablar")
  .addEventListener(
    "click",
    function(){

      alert(
        "La función de voz de GePeTo la añadiremos más adelante."
      );

    }
  );

/* =========================
   ARRANCAR IA
========================= */

prepararIA();

</script>

</body>
</html>
