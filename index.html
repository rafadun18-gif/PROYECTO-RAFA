<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual IA · Proyecto Rafa</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:relative;
    color:white;
}

/* PORTADA */
.portada{
    position:absolute;
    inset:0;
    background-image:url("Screenshot_20260908-212015.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Capa muy ligera para mejorar la lectura */
.portada::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.12);
    pointer-events:none;
}

/* TÍTULO */
.titulo{
    position:absolute;
    top:5%;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    text-align:center;
    width:100%;
    pointer-events:none;
}

.titulo h1{
    font-size:clamp(28px,7vw,60px);
    letter-spacing:4px;
    color:white;
    text-shadow:
        0 0 8px #00aaff,
        0 0 18px #00aaff,
        0 0 30px #ff00ff;
}

.titulo p{
    margin-top:5px;
    font-size:clamp(13px,3vw,22px);
    letter-spacing:3px;
    color:white;
    text-shadow:0 0 10px #00ff66;
}

/* REPRODUCTOR */
.musica{
    position:absolute;
    top:18%;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    width:min(85%,420px);
}

.musica audio{
    width:100%;
    height:38px;
}

/* ZONA DE SALAS */
.salas{
    position:absolute;
    z-index:10;
    left:50%;
    bottom:5%;
    transform:translateX(-50%);
    width:94%;
    max-width:700px;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}
