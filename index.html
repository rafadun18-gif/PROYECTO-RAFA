<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proyecto Rafa</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#000;
}

/* PORTADA */
.portada{
    width:100%;
    height:100vh;
    height:100dvh;

    background-image:url("Screenshot_20260908-212015.png");
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    position:relative;
}

/* CAPA MUY SUAVE PARA QUE LAS MINIATURAS SE VEAN */
.portada::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.08);
    pointer-events:none;
}

/* ZONA DE SALAS */
.salas{
    position:absolute;
    z-index:5;

    left:50%;
    bottom:5%;

    transform:translateX(-50%);

    width:94%;
    max-width:700px;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:10px;
}

/* MINIATURAS */
.sala{
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;

    min-height:105px;

    border-radius:15px;

    text-decoration:none;
    color:white;

    overflow:hidden;

    position:relative;

    background:rgba(0,0,0,.45);

    border:2px solid rgba(255,255,255,.7);

    box-shadow:
        0 4px 15px rgba(0,0,0,.7),
        inset 0 0 15px rgba(255,255,255,.15);

    transition:.2s;
}

/* IMAGEN DE CADA SALA */
.sala img{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:0;
}

/* OSCURECER UN POCO LA MINIATURA */
.sala::after{
    content:"";
    position:absolute;
    inset:0;

    background:linear-gradient(
        transparent 25%,
        rgba(0,0,0,.75) 100%
    );

    z-index:1;
}

/* NOMBRE */
.sala span{
    position:relative;
    z-index:2;

    font-size:14px;
    font-weight:bold;

    text-shadow:
        0 2px 5px #000,
        0 0 8px #000;

    padding:7px;
}

/* EFECTO AL TOCAR */
.sala:active{
    transform:scale(.95);
}

/* MÓVIL */
@media(max-width:500px){

    .salas{
        bottom:3%;
        width:96%;
        gap:7px;
    }

    .sala{
        min-height:82px;
        border-radius:12px;
    }

    .sala span{
        font-size:11px;
        padding:5px;
    }
}

/* TABLET */
@media(min-width:501px){

    .sala{
        min-height:125px;
    }

    .sala span{
        font-size:16px;
    }
}
</style>
</head>

<body>

<!-- MÚSICA DE PORTADA -->
<audio id="musicaPortada" autoplay loop>
    <source src="port.mp3" type="audio/mpeg">
</audio>


<!-- PORTADA -->
<main class="portada">

    <section class="salas">

        <a href="Relax.html" class="sala">
            <img src="Relax.png" alt="Relax">
            <span>🌊 RELAX</span>
        </a>

        <a href="Infinita.html" class="sala">
            <img src="Infinita.png" alt="Infinita">
            <span>♾️ INFINITA</span>
        </a>

        <a href="Espacial.html" class="sala">
            <img src="Espacial.png" alt="Espacial">
            <span>🚀 ESPACIAL</span>
        </a>

        <a href="Acuario.html" class="sala">
            <img src="Acuario.png" alt="Acuario">
            <span>🐠 ACUARIO</span>
        </a>

        <a href="Biblioteca.html" class="sala">
            <img src="Biblioteca.png" alt="Biblioteca">
            <span>📚 BIBLIOTECA</span>
        </a>

        <a href="Laboratorio.html" class="sala">
            <img src="Laboratorio.png" alt="Laboratorio">
            <span>🧪 LABORATORIO</span>
        </a>

    </section>

</main>


<script>

/* INTENTAR REPRODUCIR LA MÚSICA AUTOMÁTICAMENTE */
const musica = document.getElementById("musicaPortada");

musica.volume = 0.7;

window.addEventListener("load", function(){

    musica.play().catch(function(){

        /* Algunos móviles bloquean autoplay.
           Al tocar la pantalla se inicia. */

        document.addEventListener("click", function iniciarMusica(){

            musica.play();

            document.removeEventListener(
                "click",
                iniciarMusica
            );

        }, {once:true});

    });

});

</script>

</body>
</html>
