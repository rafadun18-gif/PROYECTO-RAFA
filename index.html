<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto Rafa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;font-family:Arial,sans-serif;overflow:hidden}

.portada{
  width:100vw;
  height:100vh;
  background:url("Screenshot_20260908-212015.png") no-repeat center top;
  background-size:100% auto;
  background-color:#000;
  position:relative;
}

.salas{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:95%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.sala{
  height:90px;
  border-radius:12px;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.8);
  text-decoration:none;
  position:relative;
}

.sala img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.sala span{
  position:absolute;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,.65);
  color:#fff;
  text-align:center;
  font-size:12px;
  padding:4px;
  font-weight:bold;
}
</style>
</head>
<body>

<audio id="musicaPortada" autoplay loop playsinline>
  <source src="port.mp3" type="audio/mpeg">
</audio>

<div class="portada">

  <div class="salas">

    <a class="sala" href="Relax.html">
      <img src="Relax.png">
      <span>RELAX</span>
    </a>

    <a class="sala" href="Infinita.html">
      <img src="Infinita.png">
      <span>INFINITA</span>
    </a>

    <a class="sala" href="Espacial.html">
      <img src="Espacial.png">
      <span>ESPACIAL</span>
    </a>

    <a class="sala" href="Acuario.html">
      <img src="Acuario.png">
      <span>ACUARIO</span>
    </a>

    <a class="sala" href="Biblioteca.html">
      <img src="Biblioteca.png">
      <span>BIBLIOTECA</span>
    </a>

    <a class="sala" href="Laboratorio.html">
      <img src="Laboratorio.png">
      <span>LABORATORIO</span>
    </a>

  </div>
</div>

<script>
const musica=document.getElementById("musicaPortada");
function sonar(){musica.play().catch(()=>{});}
window.onload=sonar;
document.body.addEventListener("touchstart",sonar,{once:true});
document.body.addEventListener("click",sonar,{once:true});
</script>

</body>
</html>
